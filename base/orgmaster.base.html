, "no": 2, "kind": "ox", "area": "최강락", "q": "(OX) 적십자사의 해산에 관한 사항 승인은 중앙위원회에서 처리한다.", "a": "X", "ex": "정관 제5조5호, 제50조② — <b>전국대의원총회<\/b>가 승인."}, {"id": "st1-최강락-3", "grp": "st1", "no": 3, "kind": "ox", "area": "최강락", "q": "(OX) 운영규정의 제정 또는 개정은 운영위원회에서 심의, 의결한다.", "a": "O", "ex": "정관 제11조3호"}, {"id": "st1-최강락-4", "grp": "st1", "no": 4, "kind": "ox", "area": "최강락", "q": "(OX) 회장은 적십자사 운영에 필요한 시행규칙을 정관 및 운영규정의 위임에 따라 제정 시행한다.", "a": "O", "ex": "정관 제20조②"}, {"id": "st1-최강락-5", "grp": "st1", "no": 5, "kind": "ox", "area": "최강락", "q": "(OX) 적십자사의 정관을 변경하고자 할 때에는 중앙위원 과반수의 출석과 출석위원 과반수의 찬성으로 중앙위원회의 의결을 거쳐야 한다.", "a": "X", "ex": "정관 제48조 — 출석위원 <b>3분의 2 이상<\/b> 찬성."}, {"id": "st1-최강락-6", "grp": "st1", "no": 6, "kind": "mc", "area": "최강락", "q": "대한적십자사 정관 중 '해산'에 대한 설명으로 틀린 것은?\n① 적십자사는 「대한적십자사 조직법」이 폐지되었을 때 해산한다.\n② 적십자사의 해산은 중앙위원회 의결과 전국대의원총회의 승인을 거쳐야 한다.\n③ 적십자사를 해산하는 경우 채무를 변제하고도 잔여재산이 있을 때에 그 재산은 중앙위원회의 의결을 거쳐 대통령의 인가를 받아 국가 또는 지방자치단체에 귀속하거나, 유사한 설립목적을 가진 공익법인에 기부할 수 있다.\n④ 해산 및 잔여재산의 처분에 관한 의결 또는 승인은 재적위원 또는 재적대의원 3분의 2 이상의 출석으로 개의하고, 출석위원 또는 출석대의원 4분의 3 이상의 찬성으로 의결 또는 승인하여야 한다.", "a": "③", "ex": "정관 제50조③ — 대통령이 아니라 <b>보건복지부장관<\/b>의 인가."}, {"id": "st1-최강락-7", "grp": "st1", "no": 7, "kind": "mc", "area": "최강락", "q": "대한적십자사 조직법 중 '회원'에 관한 설명으로 틀린 것은?\n① 대한민국 국적을 보유한 사람은 성별, 종교 또는 정치적 신념과 관계 없이 적십자사의 회원이 될 수 있다.\n② 대한민국의 법률에 따라 설립된 법인 또는 단체는 적십자사의 회원이 될 수 있다.\n③ 적십자사의 회원은 회비를 납부하는 자로 한다.\n④ 적십자사는 개인, 사업자, 법인 또는 단체 등을 대상으로 회원모집 및 회비모금 활동을 할 수 있다.", "a": "①", "ex": "조직법 제6조① — <b>대한민국에 거주하는 사람<\/b>은 성별, <b>국적<\/b>, 종교 또는 정치적 신념과 관계없이 회원이 될 수 있다."}, {"id": "st1-구현지-1", "grp": "st1", "no": 1, "kind": "ox", "area": "구현지", "q": "(OX) 운영위원회 위원 3분의 1 이상이 회의의 소집을 요구할 때는 회장은 회의를 소집하여야 한다.", "a": "X", "ex": "조직법 제12조④ — 운영위원회는 필요한 때 회장이 소집. (원문 대조 답)"}, {"id": "st1-구현지-2", "grp": "st1", "no": 2, "kind": "ox", "area": "구현지", "q": "(OX) 지사 운영에 관한 기타 사항은 회장이 운영규정으로 정한다.", "a": "X", "ex": "정관 제32조② — <b>본사 운영위원회<\/b>가 운영규정으로 정함. (원문 대조 답)"}, {"id": "st1-구현지-3", "grp": "st1", "no": 3, "kind": "ox", "area": "구현지", "q": "(OX) 적십자사 사업을 목적으로 가액이 6억인 400평 토지를 기본재산으로 취득하려고 할 때는 보건복지부장관의 인가를 받아야 한다.", "a": "O", "ex": "정관 제43조 — 면제는 400평 <b>미만<\/b> 토지로서 7억 미만. 400평은 미만이 아니므로 인가 필요."}, {"id": "st1-구현지-4", "grp": "st1", "no": 4, "kind": "ox", "area": "구현지", "q": "(OX) 사무총장은 중앙위원회에서 선출하되, 회장의 승인을 얻어야 한다.", "a": "X", "ex": "조직법 제19조③ — 회장이 임명 + 중앙위원회 승인."}, {"id": "st1-구현지-5", "grp": "st1", "no": 5, "kind": "ox", "area": "구현지", "q": "(OX) 법률고문은 중앙위원회에 출석하여 의견을 진술할 수 있다.", "a": "O", "ex": "조직법 제17조⑤, 정관 제23조"}, {"id": "st1-구현지-6", "grp": "st1", "no": 6, "kind": "mc", "area": "구현지", "q": "조직법 및 정관에 관한 사항이다. 다음 보기 중 옳은 것은 몇 개 인가?\n가. 비상근 임원 및 고문의 보수에 관한 사항은 중앙위원회에서 정한다.\n나. 적십자사는 국가나 지방자치단체로부터 사업비를 보조받은 사업에 대해서는 해당 사업실적에 관하여 사업을 관장하는 주무부장관 또는 지방자치단체 장에 보고하여야 한다.\n다. 국가나 지방자치단체는 적십자사에 국유·공유 재산을 무상으로 대부할 수 있다.\n라. 운영위원회는 관장 사항 중 긴급히 처리해야 할 사항이나 경미한 사항에 대하여 서면의결을 시행할 수 있다.\n① 0개  ② 1개  ③ 2개  ④ 3개", "a": "③", "ex": "다(조직법 제23조), 라(정관 제14조의2)만 옳음. 가: 비상근은 보수 불지급(정관 제17조⑥) / 나: <b>사업계획<\/b>에 관한 <b>승인<\/b>(조직법 제21조②)."}, {"id": "st1-구현지-7", "grp": "st1", "no": 7, "kind": "mc", "area": "구현지", "q": "다음 중 □ 안 숫자의 합은?\n가. 적십자사는 매 회계연도의 사업계획 및 예산안을 작성하여 ... 해당 회계연도가 시작되기 □개월 전에 보건복지부장관에게 제출하여야 한다. (1)\n나. 적십자사는 매 회계연도 경과 후 □개월 이내에 세입·세출결산서에 ... 제출하여야 한다. (3)\n다. 법령과 정관 및 중앙위원회 의결에 따른 적십자사의 공고는 인터넷 홈페이지에 □일 이상 게시하여야 한다. (14)\n라. 적십자사는 연간 기부금 모금액 및 활용실적을 매년 사업연도 종료일로부터 □개월 이내에 인터넷 홈페이지에 공개하여야 한다. (4)\n① 23  ② 22  ③ 21  ④ 20", "a": "②", "ex": "1+3+14+4 = 22 (조직법 제21조①③, 정관 제47조①②). (원문 대조 답)"}, {"id": "st1-전권능-1", "grp": "st1", "no": 1, "kind": "ox", "area": "전권능", "q": "(OX) 정관에 구체적으로 명문화 된 적십자사가 할 수 있는 수익사업은 적십자병원의 운영사업, 적십자 교육·홍보 및 출판사업, 자산의 임대사업이다.", "a": "X", "ex": "정관 제41조②에는 병원 운영사업이 없음(조직법 제24조1호에는 있음)."}, {"id": "st1-전권능-2", "grp": "st1", "no": 2, "kind": "ox", "area": "전권능", "q": "(OX) 정관으로 정하는 기본재산을 취득·매매·증여·교환 또는 임대하거나 담보로 제공하려면 보건복지부장관의 승인을 받아야 한다.", "a": "X", "ex": "조직법 제22조의2 — 승인이 아니라 <b>인가<\/b>."}, {"id": "st1-전권능-3", "grp": "st1", "no": 3, "kind": "ox", "area": "전권능", "q": "(OX) 회장은 전국대의원총회, 중앙위원회 및 운영위원회의 관장 사항 중 긴급히 처리해야 할 사항이나 경미한 사항에 대해 서면의결 시행할 수 있으며, 서면의결 결과는 차기 회의에 보고하여야 한다.", "a": "O", "ex": "정관 제14조의2"}, {"id": "st1-전권능-4", "grp": "st1", "no": 4, "kind": "ox", "area": "전권능", "q": "(OX) 지사를 설치하고자 할 때 회장은 관할 시·도지사를 조직위원장으로 위촉하여 지사조직위원회를 구성하게 하며, 상임위원의 선거가 끝나면 조직위원장은 소정의 회의록을 첨부하여 중앙위원회 인준을 받아야 한다.", "a": "X", "ex": "정관 제26조② — 인준 주체는 <b>회장<\/b>."}, {"id": "st1-전권능-5", "grp": "st1", "no": 5, "kind": "ox", "area": "전권능", "q": "(OX) 적십자사로부터 자료제공을 요청받은 국가와 지방자치단체는 특별한 사유가 없으면 그 자료를 제공하여야 한다.", "a": "O", "ex": "조직법 제8조③"}, {"id": "st1-전권능-6", "grp": "st1", "no": 6, "kind": "mc", "area": "전권능", "q": "다음 중 옳지 않은 것은?\n① 적십자사의 운영 및 사업에 사용되는 경비는 회비, 국가 또는 지방자치단체의 보조금, 수익사업으로 인한 수익금, 그 밖에 수입금으로 충당한다.\n② 국가와 지방자치단체는 적십자사가 「공공보건의료에 관한 법률」에 따른 보건의료를 수행하는 경우 시설장비 확충 등 이에 사용되는 경비의 일체를 보조하여야 한다.\n③ 국가나 지방자치단체는 적십자사의 사업 목적을 달성하기 위하여 필요할 때에는 국유·공유 재산을 적십자사에 무상으로 대부할 수 있다.\n④ 적십자 회계연도는 정부의 회계연도에 따른다.", "a": "②", "ex": "조직법 제22조② — <b>일부를 보조할 수 있다<\/b>."}, {"id": "st1-전권능-7", "grp": "st1", "no": 7, "kind": "mc", "area": "전권능", "q": "조직법과 정관 중 전국대의원총회에 관한 사항이다. □에 들어갈 숫자의 곱은?\n가. 국회가 위촉하는 대의원 □명\n나. 대통령이 위촉하는 대의원 □명\n다. 시·도지사가 위촉하는 대의원은 각 □명\n라. 전국대의원총회 대의원의 임기는 □년\n① 576  ② 480  ③ 384  ④ 1440", "a": "①", "ex": "12 × 8 × 2 × 3 = 576 (조직법 제10조②③, 정관 제4조)."}, {"id": "st1-박준규-1", "grp": "st1", "no": 1, "kind": "ox", "area": "박준규", "q": "(OX) 적십자사는 정관을 변경하려면 보건복지부장관의 허가를 받아야 한다.", "a": "X", "ex": "조직법 제5조② — 허가가 아닌 <b>인가<\/b>."}, {"id": "st1-박준규-2", "grp": "st1", "no": 2, "kind": "ox", "area": "박준규", "q": "(OX) 전국대의원총회를 구성하는 대의원의 총 재적수는 142명이다.", "a": "X", "ex": "회장 1 + 대통령 8 + 국회 12 + 시·도지사 위촉 (시·도 수×2) + 지사 선출 (지사 수×6). 시·도·지사 수는 행정구역 개편에 따라 달라질 수 있어 정관 개정본 확인 필요. 142는 아님."}, {"id": "st1-박준규-3", "grp": "st1", "no": 3, "kind": "ox", "area": "박준규", "q": "(OX) 중앙위원회 위원의 임기는 3년이다.", "a": "X", "ex": "조직법 제11조③ — <b>전국대의원총회에서 선출한 위원<\/b>만 3년. 장관 8명은 당연직."}, {"id": "st1-박준규-4", "grp": "st1", "no": 4, "kind": "ox", "area": "박준규", "q": "(OX) 적십자사는 매 회계연도 경과 후 3개월 이내에 세입세출결산서에 회계감사 보고서를 첨부하여 운영위원회 심의와 중앙위원회 의결을 거쳐 국회 및 보건복지부장관에게 제출한다.", "a": "O", "ex": "조직법 제21조③"}, {"id": "st1-박준규-5", "grp": "st1", "no": 5, "kind": "ox", "area": "박준규", "q": "(OX) 적십자사로부터 사용승인을 받지 않은 자가 적십자, 제네바적십자 또는 이와 유사한 명칭을 사용한 경우에는 500만원 이하의 벌금에 처한다.", "a": "X", "ex": "조직법 제26조·제29조 — 유사명칭 사용은 500만원 이하의 <b>과태료<\/b>."}, {"id": "st1-박준규-6", "grp": "st1", "no": 6, "kind": "mc", "area": "박준규", "q": "대한적십자사 정관에 관한 내용 중 옳은 것의 개수는 몇 개인가?\n가. 대한적십자사의 정식 영문표기는 THE REPUBLIC OF KOREAN NATIONAL RED CROSS 이다.\n나. 중앙위원회를 소집하고자 하는 때에는 회의 개최 7일전에 각 위원에게 문서로 통지하여야 한다.\n다. 임원이 특수업무를 담당하게 하기 위하여 회장은 임원 중에서 중앙위원회의 승인을 얻어 상근하게 할 수 있다.\n라. 외국에 거주하고 있는 박준규(대한민국 국적)는 회비를 납부하더라도 적십자사의 회원이 될 수 없다.\n① 0개  ② 1개  ③ 2개  ④ 3개", "a": "③", "ex": "나(정관 제9조②), 라(제35조① 거주자)가 옳음. 가: KOREA(KOREAN X) / 다: <b>운영위원회<\/b> 승인(제17조④)."}, {"id": "st1-박준규-7", "grp": "st1", "no": 7, "kind": "mc", "area": "박준규", "q": "대한적십자사 정관 제45조에서 규정하고 있는 업무로 잘못 기술된 것은?\n① 전쟁 또는 돌발사태로 인한 외국난민의 수용보호사업\n② 국민헌혈운동추진, 혈액원운영 등 혈액사업\n③ 종합봉사회관, 민·군병원봉사실 등 각종 복지시설 운영\n④ 보건지식, 가정보건, 재활치료, 무료진료 등 지역보건사업", "a": "④", "ex": "정관 제45조7호 — 재활치료가 아니라 <b>언어치료<\/b>."}, {"id": "st1-신승현-1", "grp": "st1", "no": 1, "kind": "ox", "area": "신승현", "q": "(OX) 운영위원회는 매년 1회 이상 회장이 소집한다.", "a": "X", "ex": "조직법 제12조④, 정관 제12조 — 운영위원회는 필요한 때에 회장이 소집."}, {"id": "st1-신승현-2", "grp": "st1", "no": 2, "kind": "ox", "area": "신승현", "q": "(OX) 지사운영위원회는 지사회장을 포함하여 7명으로 구성하되 위원은 상임위원회가 그 위원 중에서 호선하는 사람 6명으로 한다.", "a": "O", "ex": "정관 제29조②"}, {"id": "st1-신승현-3", "grp": "st1", "no": 3, "kind": "ox", "area": "신승현", "q": "(OX) 상근 임원 및 고문의 보수에 관한 사항은 중앙위원회에서 정한다. 단, 비상근 임원 및 고문은 보수를 지급하지 아니하며, 예산의 범위 내에서 업무수행에 필요한 수당 및 경비를 지급할 수 있다.", "a": "X", "ex": "정관 제17조⑥ — 수당 및 <b>여비<\/b>(경비 X)."}, {"id": "st1-신승현-4", "grp": "st1", "no": 4, "kind": "ox", "area": "신승현", "q": "(OX) 적십자사의 해산은 중앙위원회 의결과 전국대의원총회의 승인을 거쳐야한다.", "a": "O", "ex": "정관 제50조②"}, {"id": "st1-신승현-5", "grp": "st1", "no": 5, "kind": "ox", "area": "신승현", "q": "(OX) 사무총장은 회장이 임명하되, 중앙위원회의 승인을 받아야한다.", "a": "O", "ex": "조직법 제19조③, 정관 제24조③"}, {"id": "st1-신승현-6", "grp": "st1", "no": 6, "kind": "mc", "area": "신승현", "q": "전국대의원총회에서 위촉되거나 선출된 대의원의 구성 내용 중 틀린 것은?\n① 국회에서 위촉하는 사람 12명\n② 시·도지사가 위촉하는 사람 각 2명\n③ 적십자사 지사에서 위촉하는 사람 각 6명\n④ 대통령이 위촉하는 사람 8명", "a": "③", "ex": "정관 제4조①4호 — 지사에서 <b>선출<\/b>하는 사람 각 6명 (위촉 X). (원문 보기 가나다라 → ①②③④)"}, {"id": "st1-신승현-7", "grp": "st1", "no": 7, "kind": "mc", "area": "신승현", "q": "다음 중 중앙위원회의 심의의결사항이 아닌 것은?\n① 사업계획 및 예산의 관한 사항의 승인\n② 본사의 기구에 관한 사항\n③ 전국대의원총회가 건의한 정책에 관한 사항\n④ 임원 및 법률고문 선출에 관한 사항\n⑤ 회원의 모집 및 회비수납에 관한 사항", "a": "①", "ex": "정관 제5조2호, 제8조 — 사업계획 및 예산의 <b>승인<\/b>은 전국대의원총회. 중앙위는 심의·의결. (원문 보기 가~마 → ①~⑤)"}, {"id": "st1-하영진-1", "grp": "st1", "no": 1, "kind": "ox", "area": "하영진", "q": "(OX) 전국대의원총회는 매년 1회 이상 회장이 소집하며, 대의원 3분의 1 이상이 회의 소집을 요구할 때에는 회장이 지체 없이 회의를 소집하여야 한다.", "a": "O", "ex": "정관 제6조, 조직법 제10조④"}, {"id": "st1-하영진-2", "grp": "st1", "no": 2, "kind": "ox", "area": "하영진", "q": "(OX) 대한적십자사 회장의 임기는 2년으로 하고, 부회장·재정감독·법률고문의 임기는 3년으로 하며, 각각 한 차례만 중임할 수 있다.", "a": "X", "ex": "정관 제18조, 조직법 제16조 — <b>회장 3년<\/b>, 나머지 <b>2년<\/b>."}, {"id": "st1-하영진-3", "grp": "st1", "no": 3, "kind": "ox", "area": "하영진", "q": "(OX) 전국대의원총회·중앙위원회·운영위원회의 회의는 재적 대의원 또는 재적위원 3분의 2 이상의 출석으로 개의하고, 출석자의 4분의 3 이상의 찬성으로 의결한다.", "a": "X", "ex": "정관 제14조 — 일반 의결은 <b>과반수 출석·과반수 찬성<\/b>. 3분의 2·4분의 3은 해산(제50조④)."}, {"id": "st1-하영진-4", "grp": "st1", "no": 4, "kind": "ox", "area": "하영진", "q": "(OX) 대한적십자사는 정관을 변경하려는 경우 보건복지부장관의 인가를 받아야 한다.", "a": "O", "ex": "조직법 제5조②"}, {"id": "st1-하영진-5", "grp": "st1", "no": 5, "kind": "ox", "area": "하영진", "q": "(OX) 대한적십자사는 매 회계연도의 사업계획 및 예산안을 작성하여 운영위원회의 심의와 중앙위원회의 의결을 거친 후 전국대의원총회의 승인을 받아야 하며, 해당 회계연도가 시작되기 1개월 전에 보건복지부장관에게 제출하여야 한다.", "a": "O", "ex": "조직법 제21조①"}, {"id": "st1-하영진-6", "grp": "st1", "no": 6, "kind": "mc", "area": "하영진", "q": "대한적십자사 정관상 지사 대의원총회에 관한 설명으로 옳은 것은?\n① 지사 대의원총회 대의원은 지사 상임위원회에서 선출하는 12명으로 구성한다.\n② 지사 대의원총회 대의원은 지사 상임위원회에서 선출하는 10명, 명예지사회장과 지사회장이 공동으로 선출하는 10명 및 시·군·구청장이 선출하는 사람으로 구성한다. 다만, 시·군·구 지역이 6개 이하인 경우에는 각 2명으로 한다.\n③ 지사 대의원의 임기는 2년으로 하며, 지사 상임위원회에서 선출한다.\n④ 지사 대의원총회는 지사 사업계획과 예산을 최종 승인하는 기관이다.", "a": "②", "ex": "정관 제27조. ①은 10명 / ③ 임기 3년 / ④ 주요 기능은 상임위원 선출·보선과 지사 사업 보고 수령(제27조②)."}, {"id": "st1-하영진-7", "grp": "st1", "no": 7, "kind": "mc", "area": "하영진", "q": "대한적십자사 조직법상 금지행위와 벌칙에 관한 설명으로 옳은 것은?\n① 적십자 표장을 무단으로 사용한 경우 500만원 이하의 과태료를 부과한다.\n② 적십자사와 유사한 명칭을 무단으로 사용한 경우 1천만원 이하의 벌금에 처한다.\n③ 적십자 표장을 무단으로 사용한 경우 1천만원 이하의 벌금에 처하고, 유사명칭을 무단으로 사용한 경우 500만원 이하의 과태료를 부과한다.\n④ 적십자 표장과 유사명칭을 무단으로 사용한 경우 모두 1천만원 이하의 벌금에 처한다.", "a": "③", "ex": "조직법 제25조·제26조·제28조·제29조"}, {"id": "st2-이재길-1", "grp": "st2", "no": 1, "kind": "mc", "area": "이재길", "q": "직원 운영규정에 관한 사항이다. 다음 중 회장이 승인하거나 정하는 사항은 몇 개인가?\n[보기]\n가. 각 기관에 대하여 인사에 관한 기록의 보고\n나. 인사위원회 운영에 대한 사항\n다. 전직 이용에 대한 세부절차\n라. 채용 연령의 제한 사항\n① 1개 ② 2개 ③ 3개 ④ 4개", "a": "③", "ex": "회장이 정하는 사항은 나·다·라 3개. 가(인사기록 보고·사무감사)는 사무총장 사항이다. 나=제7조(인사위원회 운영, 회장 시행규칙), 다=제10조의2 ②(전직 세부절차, 회장), 라=제10조의3(채용연령 제한, 회장), 가=제6조(사무총장).", "my": "③"}, {"id": "st2-이재길-2", "grp": "st2", "no": 2, "kind": "mc", "area": "이재길", "q": "직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 혈액관리본부는 혈액관리본부장 직위와 팀장 1직위를 개방형 직위로 할 수 있다.\n② 5급 직원으로서 해당 계급에서 15년 이상 근무하고 근무성적이 우수한 자는 근속 승진을 할 수 있다.\n③ 일반직 2~4급 팀장급 직원의 기관 내 전보는 사무총장이 행사한다.\n④ 별정직원은 회장 취임 후 3개월 이내에 재신임을 득하지 못하면 퇴임하여야 한다.", "a": "②", "ex": "② 제11조 ②(5급 15년 이상 + 근무성적 우수 → 4급 근속승진). ① 혈액관리본부는 본부장 직위와 '부서장' 1직위(팀장 아님, 제10조의5). ③ 기관 내 전보권은 해당 기관장(본사는 사무총장), 제18조의2 ①1호. ④ 별정직원 재신임은 '1개월' 이내(제18조의3).", "my": "②"}, {"id": "st2-이재길-3", "grp": "st2", "no": 3, "kind": "mc", "area": "이재길", "q": "직원 운영규정에 관한 사항이다. 각 빈칸의 합계는 무엇인가?\n[보기]\n가. 일반직 2급에서 1급이 되기위한 기간 : □년\n나. 기술2급 직원의 기술1급이 되기 위한 기간 : □년\n다. 금고 이상 실형을 선고받고 그 집행이 끝나거나 집행이 면제된 날로부터 □년이 지나지 아니한 자는 임용될 수 없다.\n라. 합격자 결정 사항 중 매과목 □% 미만의 득점자는 합격할 수 없다.\n① 49 ② 53 ③ 54 ④ 74", "a": "③", "ex": "합계 54. 가 3년(2급 승진소요 최저연수 3년, 제11조의2 ①1호. 별표3 임용소요경력연수 2급18-1급21=3년으로 봐도 같음) + 나 6년(기술2급 승진소요 최저연수, 제11조의2 ①6호) + 다 5년(제20조 3호) + 라 40%(제16조) = 54. 내 답 ②(53)는 나를 5년으로 잡은 것으로 보임.", "my": "②"}, {"id": "st2-이재길-4", "grp": "st2", "no": 4, "kind": "mc", "area": "이재길", "q": "직원 운영규정에 관한 사항이다. 다음 중 사무총장이 정하는 사항으로 옳은 것은?\n① 교육훈련에 관한 종합적인 기획 및 조정\n② 근무성적평정에 관하여 필요한 사항\n③ 기관장이 업무와 관련하여 직원의 창의적인 제안이 모든 기관에 통용되어 예산절감이 인정되어 본사에 시행을 건의하고 이에 대한 표창을 수여하는 경우\n④ 적십자와 관련된 업무로 국외파견근무를 명하는 경우", "a": "①", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>'사무총장이 정하는 사항' 중 맞는 것은 ① 교육훈련 종합 기획·조정(제26조 ②, 본사 사무총장이 행함). ② 근무성적평정 필요사항=회장(제27조 ②). ③ 기관장이 건의한 제안의 표창·포상=회장(제28의2 ②). ④ 국외파견 근무 명령=회장(제39의3 ①). 문구가 '정한다'가 아니라 '행한다'여서 출제자 확인 필요하나 나머지 셋이 전부 회장이라 ①이 답.", "my": "②"}, {"id": "st2-이재길-5", "grp": "st2", "no": 5, "kind": "mc", "area": "이재길", "q": "직원 운영규정에 관한 사항이다. 다음 중 수습기간 없이 임용될 수 있는 사람이 아닌 자는?\n① 의무직으로 채용된 제조관리부장 A씨\n② 채용형 인턴직원으로 채용된 B씨\n③ 무기계약직원으로 채용된 C씨\n④ 정규직 전환 후 퇴사하여 재입사한 D씨", "a": "④", "ex": "수습기간 없이 임용되는 경우는 의무직, 채용형 인턴, 계약직원, 무기계약직원(제23조 ②). '재입사한 정규직'은 해당 없음. (신규임용자과정 재수료 면제는 제23조의2 ①로 별개 규정.)", "my": "④"}, {"id": "st2-이재길-6", "grp": "st2", "no": 6, "kind": "ox", "area": "이재길", "q": "(OX) 정년퇴직 예정직원에게 9개월 범위 내에서 공로연수를 실시 할 수 있다.", "a": "O", "ex": "정년퇴직 예정 직원에게 9개월 범위 내 공로연수 실시 가능(제26조의3 ①, 2026.1.1. 개정).", "my": "X"}, {"id": "st2-이재길-7", "grp": "st2", "no": 7, "kind": "ox", "area": "이재길", "q": "(OX) 연차 유급휴가는 개인의 신청에 의해 최대 10일까지 시간단위로, 잔여일수는 반일(4시간) 단위로 사용할 수 있다.", "a": "O", "ex": "연차유급휴가는 개인 신청으로 최대 10일까지 시간 단위, 잔여일수는 반일(4시간) 단위 사용 가능(제45조 2호 사목, 2026.1.1. 신설).", "my": "X"}, {"id": "st2-이재길-8", "grp": "st2", "no": 8, "kind": "ox", "area": "이재길", "q": "(OX) 한국방송통신대학에 재학하는 직원에게 연 12일 이내로 공가를 부여할 수 있다.", "a": "O", "ex": "한국방송통신대학 재학 시 연 12일 이내 공가(제45조 5호 마목).", "my": "O"}, {"id": "st2-이재길-9", "grp": "st2", "no": 9, "kind": "ox", "area": "이재길", "q": "(OX) 쌍둥이를 출산한 직원 B씨는 100일의 출산전후 휴가를 받을 수 있다.", "a": "X", "ex": "쌍둥이(한 번에 둘 이상 자녀)는 120일(유급 75일). 100일은 미숙아 출산(제45조 7호 가목).", "my": "X"}, {"id": "st2-이재길-10", "grp": "st2", "no": 10, "kind": "ox", "area": "이재길", "q": "(OX) 가족돌봄휴가는 최대 10일을 받을 수 있으며, 무급 휴가이다.", "a": "O", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>가족돌봄휴가는 무급, 연간 최장 10일(제45조 13호 나목). 단, 연장되는 경우 20일(한부모 25일)이 있어서 '최대 10일'이 걸릴 수 있음. 출제의도는 O로 보임.", "my": "O"}, {"id": "st2-황해민-1", "grp": "st2", "no": 1, "kind": "mc", "area": "황해민", "q": "직원 운영규정 제9조(결원보충)에 관한 문제이다. 다음 괄호 안에 들어갈 말로 알맞은 것을 모두 고르시오.\n임용권자 및 임용제청권자는 해당 기관의 결원을 (  ), (  ), (  ), (  )의 방법에 의하여 보충 실시한다.\n① 승진 ② 전직 ③ 강임 ④ 신규채용 ⑤ 복직", "a": "①③④", "ex": "결원보충 방법은 신규채용, 승진, 강임, 전보(제9조, 2025.1.1. 개정). 전직·복직은 해당 없음. 내 답은 ②전직, ⑤복직을 넣고 ③강임을 빠뜨렸다.", "my": "①②④⑤"}, {"id": "st2-황해민-2", "grp": "st2", "no": 2, "kind": "mc", "area": "황해민", "q": "직원 운영규정에 관한 사항이다. 다음에 들어갈 숫자를 모두 더한 값을 고르시오.\n제20조(결격사유)\n가. 금고이상의 실형을 선고받고 그 집행이 면제된 날로부터 (  )년이 지나지 아니한 자\n나. 징계에 의하여 해임 처분을 받은 때로부터 (  )년을 경과하지 아니한 자\n다. 스토킹범죄를 범한 사람으로서 (  )만원 이상의 벌금형을 선고받고 그 형이 확정된 후 (  )년이 지나지 아니한 자\n라. 공공기관에서 채용비위로 면직된 때부터 (  )년이 지나지 아니한 자\n① 116 ② 118 ③ 315 ④ 317 ⑤ 114", "a": "①", "ex": "116 = 5(제20조 3호) + 3(제20조 8호) + 100(만원)과 3(년)(제20조 11호 다목) + 5(제20조 10호) = 5+3+100+3+5.", "my": "①"}, {"id": "st2-황해민-3", "grp": "st2", "no": 3, "kind": "mc", "area": "황해민", "q": "직원 운영규정에 관한 사항이다. 다음 중 같은 것 끼리 묶인 것은?\n가. 운영규정의 공정한 운영을 위하여 ( ㉠ )은 관하 각 기관에 대하여 인사에 관한 기록의 보고를 받고 사무감사를 행할 수 있다.\n나. 일반·특정·전문직 팀(과)장급 이상 직원을 계약직으로 채용할 때에는 ( ㉡ )의 승인을 받아야 한다.\n다. 일반직 2급 이상 직원 및 부장급 이상 특정·전문 직원의 전형, 고시 위원은 ( ㉢ )이 위촉 또는 임명한다.\n라. ( ㉣ )은 교육훈련에 관한 종합적인 기획 및 조정을 행한다.\n마. 1급직원 및 사무처장을 포함한 기관장급 상당 직원은 국외여행을 하는 경우에 사전에 ( ㉤ )에게 보고하여야 한다.\n① ㉠㉡㉢ ② ㉠㉢㉣ ③ ㉡㉢㉣ ④ ㉣㉤", "a": "②", "ex": "같은 것은 ㉠㉢㉣ = 사무총장(제6조, 제15조 1호, 제26조 ②). ㉡=회장 승인(제10조의4 ③), ㉤=회장 보고(제39조의2).", "my": "②"}, {"id": "st2-황해민-4", "grp": "st2", "no": 4, "kind": "mc", "area": "황해민", "q": "직원 운영규정에 관한 사항이다. 다음에 공통적으로 해당되는 휴직을 모두 고르시오.\n가. 승진소요 최저연수에 포함되는 휴직\n나. 승진제한 휴직에서 제외되는 휴직\n다. 신규임용자과정 의무수료기간에 포함되지 않는 휴직\n① 업무상 질병 또는 부상으로 인한 휴직\n② 육아휴직\n③ 가족돌봄휴직\n④ 제53조제2항제1호(직무와 관련된 국제기구 임시고용)", "a": "②③", "ex": "공통 휴직은 육아휴직·가족돌봄휴직. 승진소요 최저연수 포함(제11조의2 ②), 승진제한 제외(제12조 ①), 신규임용자과정 의무수료기간 불포함(제23조의3 ②). ①업무상 질병은 승진제한 제외 대상이 아니고, ④제53조 ②1호는 신규임용자과정 불포함 목록에 없음. '모두 고르시오'라 ②만 고르면 오답.", "my": "②"}, {"id": "st2-황해민-5", "grp": "st2", "no": 5, "kind": "mc", "area": "황해민", "q": "직원 운영규정에 관한 사항이다. 다음 중 옳은 것의 개수는?\n가. 재직 중 간호사 면허증을 취득한 일반직원을 간호직에 전직임용 시 전직시험 일부 또는 전부를 면제할 수 있다.\n나. 약무직원은 회장의 사전승인 하에 5급 직원으로 채용할 수 있다.\n다. 박사학위 소지자를 3급 직원으로 채용할 수 있다.\n라. 국외파견 근무직원은 귀국 후 그 3배되는 기한까지 본사에 근무할 의무가 있다.\n① 4개 ② 3개 ③ 2개 ④ 1개 ⑤ 없음", "a": "③", "ex": "옳은 것은 나(약무직원은 회장 사전승인으로 5급 채용, 별표3 비고)와 다(박사학위 소지자 3급 채용, 제10조의8) 2개. 가: 전직시험 면제는 '기술·기능직원·고용원'이 대상이라 일반직원은 아님(제10조의2 ①1호). 라: 귀국 후 3배 기간은 '사무총장이 지정하는 기관'에서 근무(제39조의3 ②), '본사'가 아님.", "my": "④"}, {"id": "st2-황해민-6", "grp": "st2", "no": 6, "kind": "ox", "area": "황해민", "q": "(OX) 의료기사는 임상심리사, 방사선사, 물리치료사, 치과위생사 등을 말한다.", "a": "X", "ex": "의료기사 = 임상병리사, 방사선사, 치과기공사, 치과위생사, 물리치료사, 작업치료사, 보건의료정보관리사(별표1 비고1). 임상심리사는 별도 직종(전문직원 보건직).", "my": "O"}, {"id": "st2-황해민-7", "grp": "st2", "no": 7, "kind": "ox", "area": "황해민", "q": "(OX) 혈액관리본부 및 혈액관리본부 소속기관, 의료원 및 의료원 소속기관 4급 특정·전문직원의 책임보직으로의 임용은 소속기관장의 추천으로 혈액관리본부장과 의료원장이 임용권을 행사한다.", "a": "X", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>제18조의2 ①5호: 혈액관리본부·의료원 및 소속기관 4급 '전문직원' 책임보직 임용을 본부장·의료원장이 행사. 문제는 '특정·전문직원'으로 특정직원이 섞여 있어 X로 판단. 출제의도 확인 필요.", "my": "X"}, {"id": "st2-황해민-8", "grp": "st2", "no": 8, "kind": "ox", "area": "황해민", "q": "(OX) 5급직원 중 15년이상 근무하고 근무성적이 우수한 자는 승진고시를 거치지 않고 4급으로 근속승진할 수 있다.", "a": "O", "ex": "제11조 ② 근속승진.", "my": "O"}, {"id": "st2-황해민-9", "grp": "st2", "no": 9, "kind": "ox", "area": "황해민", "q": "(OX) 각 기관의 장은 사회에 공헌한 공적이 현저한 직원에게 표창 및 포상 또는 포상금을 지급할 수 있으며 이 때 포상금 지급액은 회당 300만원을 초과하지 못한다.", "a": "O", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>포상금 1회 300만원 초과 금지(제28의2 ①). 다만 문제는 제28조(사회공헌 포상)와 제28의2(창의적 제안) 문구가 섞여 있다. 출제의도는 300만원 확인으로 O로 보임.", "my": "O"}, {"id": "st2-황해민-10", "grp": "st2", "no": 10, "kind": "ox", "area": "황해민", "q": "(OX) 임신(태아) 검진휴가는 10일 이내, 자녀돌봄휴가는 연간 2일의 범위(한부모 근로자는 3일), 가족돌봄휴가는 연간 최장 10일(연장되는 경우 20일, 한부모 근로자는 25일 이내) 사용할 수 있다.", "a": "O", "ex": "임신검진휴가 10일, 자녀돌봄휴가 2일(한부모 3일), 가족돌봄휴가 10일(연장 20일, 한부모 25일)(제45조 7호 바목, 12호, 13호).", "my": "O"}, {"id": "st2-전영민-1", "grp": "st2", "no": 1, "kind": "mc", "area": "전영민", "q": "직원 운영규정에 관한 사항이다. □에 들어갈 숫자의 합은?\n가. 한 번에 둘 이상의 자녀를 임신한 경우 출산전후휴가 중 유급일수 : □일\n나. 업무로 인한 상해 질병으로 요양할 때에 병가 일수 : □개월\n다. 시간 단위 연가로 사용 가능한 시간 : □시간\n라. 해면 직원에 대하여 사무인계 또는 잔무처리상 필요한 경우에는 소속기관장은 □일을 한도로 계속 근무하게 할 수 있다.\n마. 직장 내 괴롭힘으로 인해 감봉 처분을 받은 경우 승진·승급 제한 기간 : □개월\n① 177 ② 183 ③ 192 ④ 198", "a": "③", "ex": "75(둘 이상 자녀 출산전후휴가 유급, 제45조 7호 가목) + 10개월(업무상 병가, 4호) + 80시간(시간단위 최대 10일×8시간, 2호 사목) + 15일(해면직원 근무, 제40조) + 12개월(감봉 승진·승급 제한, 제12조 ②) = 192. 직장 내 괴롭힘은 6개월 가산 사유에 없어서 12개월 그대로.", "my": "③"}, {"id": "st2-전영민-2", "grp": "st2", "no": 2, "kind": "mc", "area": "전영민", "q": "직원 운영규정에 관한 사항이다. 다음 중 제20조(결격사유)에 해당하지 않는 것은?\n① 횡령 죄로 300만원 이상의 벌금형을 선고받고 그 형이 확정된 후 2년이 지나지 아니한 자\n② 징계에 의하여 해임의 처분을 받은 때로부터 3년을 경과하지 아니한 자\n③ 스토킹범죄를 범한 사람으로서 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 자\n④ 금고 이상의 실형을 선고받고 그 집행이 면제된지 2년이 지나지 아니한 자", "a": "④", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>'해당하지 않는 것'. ②해임 3년(제20조 8호), ③스토킹 100만원·3년(11호 다목)은 맞는 내용. ④는 집행면제 후 5년인데 2년으로 바꾼 숫자 함정으로 보임. 다만 ①은 '직무와 관련하여'가 빠져 있어 엄밀히는 ①도 해당하지 않을 수 있음(제20조 13호). 출제의도는 ④.", "my": "④"}, {"id": "st2-전영민-3", "grp": "st2", "no": 3, "kind": "mc", "area": "전영민", "q": "직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 사무보조원으로 재직 중 임상병리사 면허를 취득한 경우 전직 시험을 면제하여야 한다.\n② 일반·전문직원의 3급까지의 임용소요경력연수 기간은 12년이다.\n③ 2016년에 입사한 간호조무사는 기술직이다.\n④ 산업안전보건법에 따른 특수검진은 공가의 대상이다.", "a": "④", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>④ 산안법 건강검진은 공가(제45조 5호 사목)로 확실. ① 전직시험 면제는 '할 수 있다'(하여야 아님), ② 3급 임용소요경력연수는 12년이 아니라 13년(별표3). ③ 2016.12.31 현재 재직 중인 기술직 간호조무사는 기술직 유지(별표1 비고5)라 2016년 입사자도 기술직일 수 있어 복수정답 가능성이 있다.", "my": "④"}, {"id": "st2-전영민-4", "grp": "st2", "no": 4, "kind": "mc", "area": "전영민", "q": "직원 운영규정에 관한 사항이다. 다음 [보기]를 읽고 옳은 것은 몇 개인지 고르시오.\n[보기]\n· 직원 인사기본사항\n  성명 전병원 / 입사일 26. 7. 1.\n  직종 약무직 / 소속 서울병원\n  계급 5급 / 면허 취득일 24. 3. 1.\n· 입사 전 경력\n  - 군경력 : 18. 3. 1. ~ 19. 6. 30.\n  - A병원 : 20. 1. 1. ~ 20. 12. 31.\n  - B병원 : 25. 1. 1. ~ 25. 12. 31.\n· 현재 배우자(처)가 26.10.1. 출산 예정으로 26.10.1.부터 배우자 출산휴가 사용 예정\n· 상기 명시된 내용 외 고려하지 않음\n가. 전병원이 2026년도에 발생하는 연차유급휴가의 개수는 6개이다.\n나. 전병원의 입사 전 경력은 군경력 100%, A병원 50%, B병원 100% 인정된다.\n다. 전병원의 정기승급 발령권자는 서울병원 관리부원장이다.\n라. 전병원의 배우자 출산휴가 기간은 26.10.1.~26.10.20. 이다.\n마. 전병원은 27.3.31.까지 신규임용자과정을 수료해야한다.\n① 0개 ② 1개 ③ 3개 ④ 4개", "a": "③", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>가 O(2026.7.1 입사 → 매월 개근 1일씩 7~12월 6개), 마 O(수습 중 미수료 시 임용 후 9개월 → 27.3.31), 나 X(전문직원은 자격증 취득 이후 경력만, 유사업무 100%·기타업무 '-'라 A병원 50%는 불가, 별표6), 다 X(소속기관 직원 승급은 소속기관장=병원장이 발령, 제18조의2 ①6호 라목). 라(출산휴가 10.1~10.20)를 O로 봐야 3개가 되는데, 제47조(휴가 중 휴일 불산입)를 적용하면 X라 1개가 될 수도 있다. 보기에 2개가 없어서 3개로 판단.", "my": "③"}, {"id": "st2-전영민-5", "grp": "st2", "no": 5, "kind": "mc", "area": "전영민", "q": "직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 의무직은 기본연수 중 관리자 기초과정을 반드시 수료하여야 한다.\n② 학력 또는 경력에 관하여 거짓 기타 부정한 방법에 의하여 임명된 자는 그 사실이 발견된 즉시 해임한다.\n③ 동일직종으로 재입사하거나 정규직으로 전환된 직원 중 신규임용자과정을 수료한 경우에는 재수료하지 않는다.\n④ 직원이 임신 28주 이내 유·사산한 경우 유·사산휴가는 유급이다.", "a": "③", "ex": "③ 제23조의2 ① 단서(동일직종 재입사·정규직 전환자 중 수료자는 재수료 안 함). ① 의무직은 관리자 '심화과정(II)' 수료(제23조의2 ②). ② 거짓 기재는 즉시 '파면'(제21조). ④ 유·사산휴가는 휴가 중 최초 60일까지 유급이고 28주 이상은 90일이라 전 기간 유급이 아님(제45조 7호 다목).", "my": "④"}, {"id": "st2-전영민-6", "grp": "st2", "no": 6, "kind": "ox", "area": "전영민", "q": "(OX) 임신 중인 직원은 임신(태아)검진을 위해 연간 10일 이내의 임신(태아)검진휴가를 반일 또는 1일 단위로 사용할 수 있다.", "a": "O", "ex": "제45조 7호 바목.", "my": "O"}, {"id": "st2-전영민-7", "grp": "st2", "no": 7, "kind": "ox", "area": "전영민", "q": "(OX) 배우자 출산휴가의 사용은 마지막 날이 120일 이내에 있어야 한다.", "a": "O", "ex": "출산휴가의 사용은 배우자가 출산한 날부터 120일 이내, 3회 분할 가능(제45조 8호 단서).", "my": "O"}, {"id": "st2-전영민-8", "grp": "st2", "no": 8, "kind": "ox", "area": "전영민", "q": "(OX) 가족돌봄휴가는 10일까지는 유급이고, 연장 20일은 무급이다.", "a": "X", "ex": "가족돌봄휴가는 연장분만이 아니라 전체가 무급(제45조 13호 나목).", "my": "X"}, {"id": "st2-전영민-9", "grp": "st2", "no": 9, "kind": "ox", "area": "전영민", "q": "(OX) 상주병원 관리부원장의 정기승급에 대한 발령은 의료원장이 시행한다.", "a": "X", "ex": "⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>정기승급 발령은 소속기관 직원은 소속기관장이 한다(의료원 소속기관장, 제18조의2 ①6호 라목). 의료원장은 '소속기관장 <script>

function dlg({title, text, area, okText, onOk, cancelText}){
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><b>${esc(title)}</b>
    ${text ? `<p class="small" style="margin:8px 0">${text}</p>` : ''}
    ${area !== undefined ? `<textarea id="dlg-ta" spellcheck="false">${esc(area)}</textarea>` : ''}
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      ${cancelText === false ? '' : `<button class="b-line" id="dlg-no">${cancelText || '닫기'}</button>`}
      ${okText ? `<button class="b-red" id="dlg-ok">${esc(okText)}</button>` : ''}</div></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();

/* ③ 조사·접속어·'한다'류 어미만 남기고 나머지 낱말을 모두 가린다 (눌러서 확인) */
const CK3 = new Set(['및','또는','그','이','각','다만','이를','이에','그리고','하여야','한다','된다','이다','있다','없다','아니한다','않는다','같다']);
const PA2 = /(으로서|으로써|으로부터|에게서|이라고|라고|에서는|에서도|으로는|으로도|까지는|부터는|에게는|에서|에게|으로|로서|로써|로부터|까지|부터|보다|마다|조차|이나|이고|이라|에는|에도|에의|와의|과의|에만|이란)$/;
const PA1 = /[은는이가을를의에로도만과와며고나]$/;
const EN3 = /(한다|된다|이다|있다|없다)$/;
function split3(t){
  if (CK3.has(t)) return null;
  let m;
  if ((m = t.match(PA2)) && t.length > m[1].length) return [t.slice(0, -m[1].length), m[1]];
  if ((m = t.match(EN3)) && t.length > m[1].length) return [t.slice(0, -m[1].length), m[1]];
  if (t.length >= 3 && PA1.test(t)) return [t.slice(0, -1), t.slice(-1)];
  return [t, ''];
}
function cloze3(){
  $$('#r-body .ln, #r-body td').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()){ const n = w.currentNode; if (!n.parentElement.closest('.b, .xr, .amend')) nodes.push(n); }
    nodes.forEach(n => {
      const t = n.nodeValue, re = /[가-힣A-Za-z0-9]+/g; let m, last = 0, out = document.createDocumentFragment(), hit = false;
      while ((m = re.exec(t))){
        if (/^\d+$/.test(m[0]) && /^[.)]/.test(t.slice(re.lastIndex, re.lastIndex + 1))) continue;
        const sp = split3(m[0]); if (!sp) continue;
        out.appendChild(document.createTextNode(t.slice(last, m.index)));
        const b = document.createElement('span'); b.className = 'b b3'; b.textContent = sp[0]; out.appendChild(b);
        if (sp[1]) out.appendChild(document.createTextNode(sp[1]));
        last = re.lastIndex; hit = true;
      }
      if (hit){ out.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(out, n); }
    });
  });
}



/* ───────── 🔤 자음퀴즈: 조문 속 핵심어(빈칸 후보)를 초성만 보고 직접 써서 맞힌다 ───────── */
const CZ = {law:'조직법', topic:'0', mode:'order', pool:[], q:[], i:0, sess:false, done:false, shown:false, ok:null, hint:0, res:[]};
const czRec = k => (S.cz && S.cz[k]) || null;
const czCho = s => [...s].map(c => { const o = c.charCodeAt(0) - 0xAC00; return o >= 0 && o < 11172 ? 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor(o / 588)] : (/[0-9]/.test(c) ? '◯' : c); }).join('');
const czNorm = s => s.replace(/[\s·ㆍ,.\-()「」'"]/g, '');
const CZC = {};
function czItems(){
  const out = [];
  D.articles.filter(a => a.law === CZ.law && a.type === 'a' && inTopic(a, CZ.topic)).forEach(a => {
    const key = artId(a);
    if (!CZC[key]){ const d = document.createElement('div'); d.innerHTML = a.html; CZC[key] = d; }
    $$('.ln', CZC[key]).forEach((ln, li) => $$('.b', ln).forEach((b, bi) => {

      out.push({k: key + '#' + li + '.' + bi, a, li, bi, ans});
    }));
  });
  return out;
}
function czQueue(){
  let p = czItems();
  if (CZ.mode === 'wrong') p = p.filter(x => { const r = czRec(x.k); return r && !r.last; });
  else if (CZ.mode === 'new') p = p.filter(x => !czRec(x.k));
  if (CZ.mode === 'rand') for (let i = p.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}
function czCtx(x){
  const ln = $$('.ln', CZC[artId(x.a)])[x.li].cloneNode(true), bs = $$('.b', ln);
  bs.forEach((b, i) => { if (i === x.bi){ const s = document.createElement('span'); s.className = 'chq'; s.dataset.cq = 1; s.textContent = czCho(x.ans); b.replaceWith(s); } else b.replaceWith(document.createTextNode(b.textContent)); });

}

const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* ───────── 복습 카드 ───────── */
const INT_H = [0, 4, 20, 44, 90]; // 상자별 다음 복습 간격(시간)
const Q = {group:null, study:true, retry:'none', studyView:false, hist:[], scope:false, topics:new Set(), mode:'due', limit:20, tag:'읽고 바로 풀기', queue:[], i:0, sess:null, shown:false, typed:null};
const TAGS = ['읽고 바로 풀기','빈칸 회독 후','백지 복원 후','두문자·스토리 후','Claude 질문 후','하루 지난 뒤(다시 풀기)'];
const CARD = Object.fromEntries(D.cards.map(c => [c.id, c]));
/* 로그를 처음부터 다시 계산해 카드 상태를 복원 (기록 수정용) */
function replay(id){
  const es = S.log.filter(l => l.id === id);
  if (!es.length){ delete S.cards[id]; return; }
  const st = {box:0, right:0, wrong:0, due:0}, was = S.cards[id];
  es.forEach((l,k) => {
    if (k === 0) st.first = l.ok;
    st.last = l.ok;
    if (l.ok){ st.right++; st.box = Math.min(4, st.box + 1); } else { st.wrong++; st.box = 0; }
    st.due = l.t + INT_H[st.box] * 36e5;
  });
  if (was && was.cleared && st.last) st.cleared = true;
  S.cards[id] = st;
}
/* 오답노트: 한 번이라도 틀렸고, '완전히 알겠다'로 뺀 적이 없는 카드 */
const inNote = c => { const s = S.cards[c.id]; return !!(s && s.wrong > 0 && !s.cleared); };
function norm(s){ return String(s).toLowerCase().replace(/[\s·ㆍ,.\-~()「」\[\]'"“”]/g, ''); }
renderers.quiz = function(){
  const p = $('#p-quiz');
  if (!Q.sess){ drawQuizHome(); } else { drawCard(); }
};
/* 카드 출처(src)에서 조문을 뽑아, 회독한 조문의 카드만 '공부한 범위'로 본다 */
function cardArts(c){
  if (c._arts) return c._arts;
  const out = []; let law = null;
  c.src.split(/\s*·\s*/).forEach(seg => {
    const m = seg.match(/^(조직법|정관|운영규정)/); if (m) law = m[1];
    for (const x of seg.matchAll(/제(\d+)조(?:의(\d+))?/g)) if (law) out.push(law + ':' + x[1] + (x[2] ? '의' + x[2] : ''));
  });
  return c._arts = out;
}
const inScope = c => { const a = cardArts(c); return !a.length || a.some(k => S.reads[k] > 0); };
/* 정답을 낱말로 쪼개 조사를 떼고(명예회장은→명예회장), 입력에 그 낱말이 들어 있는지 본다 */
const PARTICLE = /(에서|으로|은|는|이|가|을|를|의|에|로|과|와|도|한다|된다|이다)$/;
function segs(a){
  const out = [];
  a.split(/[\s,，·/→+=:()「」]+/).forEach(w => {
    let t = w.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]/, '');
    const st = t.replace(PARTICLE, '');
    if (norm(st).length >= 2) t = st;
    if (norm(t).length >= 2 && !out.includes(t)) out.push(t);
  });
  return out;
}
function dueNow(c){ const st = S.cards[c.id]; return !st || st.due <= Date.now(); }
function curGroup(){
  if (Q.group === null){
    const t = dayTarget().topics[0], g = GROUPS.find(g => !g.sub && g.topics.includes(t));
    Q.group = g ? g.id : 'all';
  }
  return Q.group === 'all' ? null : GR(Q.group);
}
function inGroup(c, g){ g = g === undefined ? curGroup() : g; return !g || (g.topics.includes(c.t) && (!g.law || c.src.includes(g.law))); }
function syncQ(){ const g = id => document.getElementById(id); if (!g('q-mode')) return;
  Q.study = g('q-study').checked; Q.retry = g('q-retry').value; Q.mode = g('q-mode').value; Q.limit = +g('q-limit').value; Q.tag = g('q-tag').value; }
function buildQueue(){
  let cs = D.cards.filter(c => inGroup(c) && (Q.topics.size === 0 || Q.topics.has(c.t)) && (!Q.scope || inScope(c)));
  if (Q.mode === 'due') cs = cs.filter(dueNow);
  else if (Q.mode === 'new') cs = cs.filter(c => !S.cards[c.id]);
  else if (Q.mode === 'note') cs = cs.filter(inNote);
  else if (Q.mode === 'weak') cs = cs.filter(c => { const s = S.cards[c.id]; return s && (s.box < 3 || !s.last); });
  for (let i = cs.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [cs[i], cs[j]] = [cs[j], cs[i]]; }
  // 신규 카드보다 상자가 낮은(약한) 카드를 먼저
  cs.sort((a,b) => (S.cards[a.id]?.box ?? 0) - (S.cards[b.id]?.box ?? 0));
  return Q.limit ? cs.slice(0, Q.limit) : cs;
}

function grade(ok, clear){
  if (!Q.shown) return;
  const c = Q.queue[Q.i], now = Date.now();
  Q.hist.push({i:Q.i, id:c.id, retry:!!c.retry, prev:S.cards[c.id] ? JSON.stringify(S.cards[c.id]) : null,
    sess:JSON.stringify(Q.sess), qLen:Q.queue.length, logged:false});
  Q.sess.n++; Q.sess.ms += now - Q.t0;
  if (c.retry){
    Q.sess.retry++; if (ok) Q.sess.retryOk++;
  } else {
    if (ok) Q.sess.ok++;
    const st = S.cards[c.id] || (S.cards[c.id] = {box:0, right:0, wrong:0, due:0});
    if (st.first === undefined) st.first = ok;
    st.last = ok;
    if (!ok) delete st.cleared; else if (clear) st.cleared = true;
    if (ok){ st.right++; st.box = Math.min(4, st.box + 1); }
    else { st.wrong++; st.box = 0; }
    st.due = now + INT_H[st.box] * 36e5;
    S.log.push({t:now, id:c.id, ok, tag:Q.sess.tag}); Q.hist[Q.hist.length-1].logged = true;
    if (S.log.length > 1000) S.log.splice(0, S.log.length - 1000);
    if (!ok && Q.retry === 'end'){ Q.queue.push(Object.assign({}, c, {retry:true})); }
  }
  save(); Q.i++; drawCard();
}
function studyNext(){
  const c = Q.queue[Q.i];
  Q.hist.push({i:Q.i, id:c.id, retry:false, prev:null, sess:JSON.stringify(Q.sess), qLen:Q.queue.length, logged:false});
  Q.sess.study++;
  S.cards[c.id] = {box:0, right:0, wrong:0, due:Date.now() + INT_H[1] * 36e5};
  save(); Q.i++; drawCard();
}
function undoGrade(){
  const h = Q.hist.pop(); if (!h || !Q.sess) return;
  if (h.logged) S.log.pop();
  if (h.prev === null) delete S.cards[h.id]; else S.cards[h.id] = JSON.parse(h.prev);
  if (Q.queue.length > h.qLen) Q.queue.pop();
  Q.sess = JSON.parse(h.sess); Q.i = h.i; save(); drawCard();
}
function endSession(){
  const s = Q.sess; Q.sess = null;

  const first = s ? s.n - s.retry : 0;

    <div class="kpi"><b>${pct(s?s.ok:0, first)}%</b>첫 시도 정답률</div>
    <div class="kpi"><b>${s?s.retry:0}</b>다시 도전</div>
    <div class="kpi"><b>${s&&s.n?Math.round(s.ms/s.n/1000):0}초</b>카드당 시간</div></div>
  ${nextMsg}

}
document.addEventListener('keydown', e => {
  if (!$('#p-quiz').classList.contains('on') || !Q.sess) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.key !== 'Enter') return;

      <li><b>책 덮고 카드 풀이</b> 10분 — 입력창에 직접 써 보기</li>
      <li><b>백지 복원</b> 5분 — 대조·숫자 탭의 백지에 숫자 표 재현</li>
      <li>다음 날 아침 틀린 카드만 다시 (자동으로 '복습할 차례' 목록에 올라옴)</li>
    </ol></div>
  <div class="card"><b>학습법별 정답률 비교</b>
    <p class="small mute" style="margin:4px 0">카드 세션을 시작할 때 고른 '학습법 태그'별 <b>첫 시도 정답률</b>입니다. 표본이 적을 때(카드 30장 미만)는 참고만 하세요.</p>
    ${rows.length ? `<div class="tw"><table><tr><th>학습법 태그</th><th>세션</th><th>푼 카드</th><th>정답률</th><th>카드당 초</th></tr>
      ${rows.map(([t,o]) => `<tr><td>${esc(t)}</td><td>${o.sess}</td><td>${o.n}</td>
        <td><b>${pct(o.ok,o.n)}%</b> <div class="bar" style="width:90px;display:inline-block;vertical-align:middle"><i style="width:${pct(o.ok,o.n)}%"></i></div></td>
        <td>${o.all?Math.round(o.ms/o.all/1000):0}</td></tr>`).join('')}</table></div>`
      : '<p class="mute">아직 세션 기록이 없습니다. 🧠 복습 카드에서 한 세션을 마치면 나타납니다.</p>'}
  </div>
  <div class="card"><b>✏️ 최근 푼 카드 기록 수정</b>
    <p class="small mute" style="margin:4px 0">잘못 누른 채점은 ✅/❌ 버튼으로 뒤집으세요. 카드 상자·정답률이 자동으로 다시 계산됩니다.</p>
    ${S.log.length ? `<div class="tw"><table><tr><th>시각</th><th>카드</th><th>채점</th></tr>
      ${S.log.slice(-30).map((l,k) => { const idx = S.log.length - Math.min(30, S.log.length) + k; return {l, idx}; }).reverse().map(({l,idx}) =>
        `<tr><td class="small">${esc(dayKey(l.t))} ${new Date(l.t).toTimeString().slice(0,5)}</td><td>${esc(CARD[l.id] ? CARD[l.id].q : l.id)}</td>
        <td><button class="${l.ok?'b-red':'b-line'}" data-flip="${idx}">${l.ok?'✅ 알았다':'❌ 몰랐다'}</button></td></tr>`).join('')}</table></div>`
      : '<p class="mute">아직 푼 카드가 없습니다.</p>'}
  </div>
  <div class="card"><b>백지 복원 기록</b>
    ${papers.length ? `<div class="tw"><table><tr><th>날짜</th><th>점수</th><th>메모</th></tr>${papers.map(x =>
      `<tr><td>${esc(dayKey(x.t))}</td><td><b>${x.ok}/${x.n}</b> (${pct(x.ok,x.n)}%)</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table></div>`
      : '<p class="mute">📊 대조·숫자 탭 맨 아래에서 백지 복원을 하고 점수를 남기면 여기에 쌓입니다.</p>'}
  </div>
  <div class="card"><b>실험 아이디어</b>
    <ul class="mn">
      <li><b>가설 A</b> 빈칸 회독 vs 단순 재독: 같은 조문 5개를 한쪽은 재독만, 한쪽은 빈칸 회독 후 다음 날 카드로 비교</li>
      <li><b>가설 B</b> 두문자·스토리: 28=19+8+1, 8·12·2·6 같은 숫자 공식을 쓴 주제와 안 쓴 주제의 정답률 비교</li>
      <li><b>가설 C</b> 하루 지난 뒤(다시 풀기) 정답률이 처음보다 얼마나 떨어지는지 → 간격 조정</li>
      <li><b>가설 D</b> 입력해서 쓰기 vs 머릿속으로만 답하고 정답 확인: 주관식 대비에는 쓰기가 유리한지</li>
    </ul></div>
  <div class="card"><b>데이터 백업</b>
    <p class="small mute" style="margin:4px 0">기록은 이 브라우저에만 저장됩니다. 기기를 바꾸기 전에 복사해 두세요.</p>
    <div class="row"><button class="b-line" id="lab-exp">JSON 복사</button>
    <button class="b-line" id="lab-imp">붙여넣어 복원</button>
    <button class="b-line" id="lab-rst">전부 초기화</button></div></div>`;
};
$('#p-lab').addEventListener('click', e => {
  const f = e.target.closest('[data-flip]');
  if (f){
    const l = S.log[+f.dataset.flip]; if (!l) return;
    l.ok = !l.ok;
    const ss = S.sessions.filter(x => x.t <= l.t && x.tag === l.tag).pop();
    if (ss) ss.ok = Math.max(0, ss.ok + (l.ok ? 1 : -1));
    replay(l.id); save(); renderers.lab(); return;
  }
  if (e.target.id === 'lab-exp') copyText(JSON.stringify(S), '백업 JSON을 복사했습니다.');
  if (e.target.id === 'lab-imp'){
    dlg({title:'백업 JSON으로 복원', text:'내보낸 JSON을 아래에 붙여 넣으세요. 지금 기록은 덮어쓰기 됩니다.', area:'', okText:'복원', onOk: v => {
      try { const o = JSON.parse(v); if (typeof o !== 'object' || !o) throw 0; S = Object.assign(S, o); save(); toast('복원했습니다.'); setTimeout(() => location.reload(), 600); }
      catch(err){ toast('형식이 올바르지 않습니다.'); return false; }
    }});
  }
  if (e.target.id === 'lab-rst'){
    dlg({title:'모든 학습 기록 초기화', text:'카드·회독·세션 기록이 모두 지워집니다. 되돌릴 수 없습니다.', okText:'초기화', onOk: () => {
      S = {checks:{}, reads:{}, cards:{}, log:[], sessions:[], papers:[], theme:S.theme}; save(); setTimeout(() => location.reload(), 600);
    }});
  }
});

/* ───────── Claude 질문 ───────── */
renderers.ask = function(){
  $('#p-ask').innerHTML = `
  <h2>Claude와 같이 외우기</h2>
  <p class="mute small">아래 문장을 복사해 Claude에 붙여 넣으세요. 저장소가 연결된 Claude Code에서는 원문 MD와 기출 파일을 읽고 답합니다. 폰의 일반 Claude 대화에는 원문이 없으니, 조문 본문을 함께 붙여 넣으세요. <b>빈칸 정답은 원문 글자 그대로</b>여야 합니다.</p>
  ${D.prompts.map((x,i) => `<div class="card"><div class="row"><b class="grow">${esc(x[0])}</b><button class="b-line" data-copy="${i}">복사</button></div>
    <pre class="pr">${esc(x[1])}</pre></div>`).join('')}`;
};
$('#p-ask').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const txt = D.prompts[+b.dataset.copy][1];
  copyText(txt, '복사했습니다. Claude에 붙여 넣으세요.');
});

/* 시작 */
fixPad();
showTab(location.hash.slice(1) || (()=>{ try { return localStorage.getItem('orgmaster.tab'); } catch(e){ return ''; } })() || 'today');
</script>
