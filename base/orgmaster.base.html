이 수료하지 아니하거나 연수태도가 불량할 때 또는 능력과 건강, 적성 등이 부적당하다고 인정될 때에는 직원으로 임용하지 아니할 수 있다.<span class=\"amend\">&lt;개정 2022.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">②제23조의2 제1항에서 정한 기간 내에 신규임용자과정을 수료하지 아니한 자는 신규임용자과정을 수료한 일로부터 최초로 도래하는 승급일자에 승급한다. 다만, 교육과정이 개설되지 아니한 경우는 제외하며, 의무 수료 기간 내에 업무상 질병 또는 부상으로 인한 휴직, 육아휴직, 가족돌봄휴직 중인 경우에는 해당 휴직기간을 의무 수료기간에 포함하지 아니한다.<span class=\"amend\">&lt;개정 2004.1.15, 2012.12.1., 2022.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">③신규임용자과정을 수료하지 아니한 직원은 차상의 계급으로 승진할 수 없다.<span class=\"amend\">&lt;개정 2022.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "23의5", "title": "본사 및 기관 대기", "topics": [12], "html": "<div class=\"ln\">본 운영규정 제18조의 <span class=\"b b1\">임용권자<\/span>는 각 기관의 인력사정 등을 고려하여 직원을 본사 또는 각 기관에 대기시킬 수 있으며, 이에 관한 세부사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;신설 2005.4.1, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제3장 보수"}, {"law": "운영규정", "type": "a", "no": "24", "title": "보수결정의 한계", "topics": [14], "html": "<div class=\"ln\">직원의 보수는 본 운영규정 제3조에 규정된 급별로 그 직무와 책임에 적응하도록 운영위원회의 <span class=\"b b2\">의결<\/span>을 거쳐 따로 「직원 보수 운영규정」으로 정한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "24의2", "title": "보수결정의 원칙", "topics": [14], "html": "<div class=\"ln\">보수에 관한 규정에는 일반의 임금, 생활비 및 기타 사정을 고려하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "25", "title": "시설이용 등", "topics": [14], "html": "<div class=\"ln\">①삭제<span class=\"amend\">&lt;2013.12.1&gt;<\/span><\/div><div class=\"ln\">②직원이 적십자기관 또는 사업장, 기타 관련 시설을 이용하는 경우에는 적절한 혜택을 부여할 수 있다.<span class=\"amend\">&lt;개정 2013.12.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "25의2", "title": "자가운전", "topics": [14], "html": "<div class=\"ln\">①승용차량을 소유하는 직원이 그 승용차량을 공무수행에 사용할 경우에는 예산의 범위 안에서 그에 필요한 차량의 유지비 등을 지급할 수 있다.<\/div><div class=\"ln\">②제1항의 규정에 의한 차량유지비의 지급대상, 지급기준 등 기타 필요한 사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조신설 1985.3.26]<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제4장 능률"}, {"law": "운영규정", "type": "a", "no": "26", "title": "교육훈련", "topics": [14], "html": "<div class=\"ln\">①직원은 적십자 이념 및 담당직무와 관련된 학식, 기술 및 응용력의 배양을 위하여 교육훈련을 받아야 한다.<span class=\"amend\">&lt;개정 2017.4.1, 2021.4.1&gt;<\/span><\/div><div class=\"ln\">②본사 <span class=\"b b1\">사무총장<\/span>은 교육훈련에 관한 종합적인 기획 및 조정을 행한다.<span class=\"amend\">&lt;개정 2017.4.1&gt;<\/span><\/div><div class=\"ln\">③교육훈련성적은 인사관리면에 반영시켜야 한다.<span class=\"amend\">&lt;개정 2017.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "26의2", "title": "학술연구", "topics": [14], "html": "<div class=\"ln\">①직원이 업무와 관련되는 학술연구를 하였을 때에는 예산의 범위안에서 연구에 소요되는 비용을 지급할 수 있다.<span class=\"amend\">&lt;개정 1985.3.26&gt;<\/span><\/div><div class=\"ln\">②연구비 지급에 관한 사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "26의3", "title": "공로연수", "topics": [14], "html": "<div class=\"ln\">①정년퇴직 예정 직원에게 <span class=\"b b1\">9개월<\/span> 범위 내에서 공로연수를 실시할 수 있다.<span class=\"amend\">&lt;개정 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">②공로연수에 관한 세부사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2014.7.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "27", "title": "근무성적의 평정", "topics": [14], "html": "<div class=\"ln\">①각 기관의 장은 정기 또는 수시로 소속직원의 근무성적을 평정하여 인사관리면에 반영시켜야 한다.<\/div><div class=\"ln\">②전항에 규정된 근무성적평정에 관하여 필요한 사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "28", "title": "포상제도", "topics": [14], "html": "<div class=\"ln\">①직원으로서 직무에 정려하거나 사회에 공헌한 공적이 현저한 자에 대하여는 포상 또는 표창을 행한다.<\/div><div class=\"ln\">②포상 및 표창에 관한 규정은 별도로 정한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "28의2", "title": "제안제도", "topics": [14], "html": "<div class=\"ln\">①각 기관의 장은 업무와 관련하여 직원의 창의적인 제안으로 예산을 절감하였거나, 적극적인 사업활동으로 사업확장에 크게 기여하였을 경우 또는 새로운 제도를 도입하여 업무능률의 향상에 현저한 기여를 하였을 경우 등에는 자체 심사를 통하여 표창 및 포상 또는 포상금을 지급할 수 있다. 다만, 포상금 지급액은 <span class=\"b b1\">1회<\/span> <span class=\"b b1\">300만원<\/span>을 초과하지 못한다.<span class=\"amend\">&lt;신설 2000.10.23&gt;<\/span><\/div><div class=\"ln\">②각 기관의 장은 직원의 창의적인 제안이 모든 기관에 통용되어 예산절감 등의 효과를 가져올 수 있다고 인정될 경우 본사에 그 시행을 건의할 수 있으며, <span class=\"b b1\">회장<\/span>은 이에 대해 별도의 표창 및 포상 또는 포상금을 지급할 수 있다.<span class=\"amend\">&lt;신설 2000.10.23, 개정 2017.6.3.&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제5장 복무"}, {"law": "운영규정", "type": "a", "no": "29", "title": "성실과 복종의 의무", "topics": [15], "html": "<div class=\"ln\">직원은 성실과 능력을 다하여 직무를 수행하며 상사의 직무상의 정당한 명령에 복종하여야 한다.<span class=\"amend\">&lt;개정 2020.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "30", "title": "봉사와 친절의 의무", "topics": [15], "html": "<div class=\"ln\">직원은 적십자정신을 바탕으로 하여 전인류의 봉사자로서 친절하고 공정하게 집무하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "31", "title": "비밀엄수의 의무", "topics": [15], "html": "<div class=\"ln\">직원은 재직중은 물론 퇴직후라도 직무상의 비밀을 엄수하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "31의2", "title": "개인정보보호 의무", "topics": [15], "html": "<div class=\"ln\">직원은 개인정보를 업무 외적으로 무단조회, 열람하거나 직무상 알게 된 개인정보를 부당한 목적을 위하여 사용하여서는 아니된다.<span class=\"amend\">&lt;신설 2017.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "32", "title": "청렴의 의무", "topics": [15], "html": "<div class=\"ln\">직원은 직무와 관련하여 직접 또는 간접의 사례․증여 또는 향응을 주거나 받을 수 없다.<span class=\"amend\">&lt;개정 2020.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "33", "title": "품위유지의 의무", "topics": [15], "html": "<div class=\"ln\">직원은 직무의 내외를 불문하고 그 품위를 손상하는 행위를 하여서는 아니된다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "34", "title": "영리업무 금지 및 겸직허가", "topics": [15], "html": "<div class=\"ln\">①직원은 다음 각 호의 어느 하나에 해당하는 업무에 종사함으로써 직무 능률을 떨어뜨리거나, 사에 불명예스러운 영향을 끼칠 우려가 있는 경우에는 그 업무에 종사할 수 없다.<span class=\"amend\">&lt;개정 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 상업·공업·금융업 또는 그 밖의 영리를 목적으로 하는 업무를 스스로 경영하여 영리를 추구함이 뚜렷한 업무<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 상업·공업·금융업 또는 그 밖의 영리를 목적으로 하는 사기업체의 이사·감사 업무를 집행하는 무한책임사원·지배인·발기인 또는 그 밖의 임원이 되는 것<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 본인의 직무와 관련이 있는 타인의 기업에 대한 투자<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 그 밖에 계속적으로 재산상의 이득을 목적으로 하는 업무<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln\">② 제34조제1항의 영리업무에 해당하지 아니하는 다른 직무를 겸하려는 경우에는 <span class=\"b b1\">소속기관장<\/span>의 사전 <span class=\"b b2\">허가<\/span>(담당 직무수행에 지장이 없는 경우에 한하여)를 받아야 한다.<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "35", "title": "정치운동금지", "topics": [15], "html": "<div class=\"ln\">직원은 적십자의 특수성에 비추어 정당 기타 정치단체의 결성에 관여하거나 이에 가입할 수 없으며 선거에 있어서 특정정당 또는 특정인의 지지나 반대를 하기 위한 행위를 하여서는 아니된다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "36", "title": "직장 내 괴롭힘의 금지", "topics": [15], "html": "<div class=\"ln\">직장에서의 지위 또는 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 직원에게 신체적․정신적 고통을 주거나 근무환경을 악화시키는 행위를 하여서는 아니 된다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2019.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "37", "title": "당직근무", "topics": [15], "html": "<div class=\"ln\">①휴일 또는 근무시간외의 화재 도난 기타 사고의 경계와 문서처리 및 사무연락을 하기 위하여 일직, 숙직, 순시 등 당직근무자는 제반사고를 미연에 방지하여야 하며 사고가 발생할 때에는 신속하게 필요한 조치를 취하여야 한다.<\/div><div class=\"ln\">②당직근무자는 무단히 근무장소를 이탈하지 못하며 음주 기타 품위를 손상하는 행위를 하여서는 아니된다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "38", "title": "출장직원", "topics": [15], "html": "<div class=\"ln\">①출장직원은 지정된 출장기일내에 그 임무를 완수하지 못할 사유가 발생할 때에는 전화 등의 방법으로 <span class=\"b b1\">기관장<\/span> 또는 <span class=\"b b1\">소속기관장<\/span>에게 보고하고 지시를 받아야 한다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\">②직원이 출장용무를 마치고 귀사한 때에는 <span class=\"b b1\">5일<\/span>(공무국외출장의 경우 <span class=\"b b1\">30일<\/span>) 이내에 <span class=\"b b1\">기관장<\/span> 또는 <span class=\"b b1\">소속기관장<\/span>에게 결과보고서를 제출하여야 한다. 다만, 경미한 사항에 대한 결과 보고는 구술로 할 수 있다.<span class=\"amend\">&lt;개정 2017.1.1. 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "38의2", "title": "출장의 절차", "topics": [15], "html": "<div class=\"ln\">직원이 출장하려는 때에는 사전에 출장신청 및 명령서에 의하여 <span class=\"b b1\">소속기관장<\/span>의 <span class=\"b b2\">승인<\/span>을 받아야 한다. 다만, 불가피한 사유로 사전에 <span class=\"b b2\">승인<\/span>을 받지 못한 경우에는 사후에 지체 없이 <span class=\"b b2\">승인<\/span>을 받아야 한다.<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "39", "title": "국외출장", "topics": [15], "html": "<div class=\"ln\">①제18조 제2호에 해당하는 직원이 국외출장을 하고자 할 때에는 사전에 <span class=\"b b1\">사무총장<\/span>의 <span class=\"b b2\">승인<\/span>을 얻어야 하고, 그외 직원의 국외출장은 해당 <span class=\"b b1\">기관장<\/span>의 <span class=\"b b2\">승인<\/span>을 얻어야 하며, 귀국 후 본사에 보고하여야 한다.<span class=\"amend\">&lt;개정 1995.1.1, 2000.10.23., 2002.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">③출장 기간 내에 복귀하지 아니하거나 소환에 응하지 아니하였을 때에는 소요비용을 즉시 변상시키고 면직한다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "39의2", "title": "공무외 국외여행", "topics": [15], "html": "<div class=\"ln\"><span class=\"b b1\">1급<\/span>직원 및 사무처장을 포함한 기관장급 상당직원은 국외여행을 하는 경우에는 사전에 <span class=\"b b1\">회장<\/span>에게 보고하여야 한다.<span class=\"amend\">&lt;개정 2008.10.10, 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "39의3", "title": "국외파견", "topics": [15], "html": "<div class=\"ln\">①<span class=\"b b1\">회장<\/span>은 적십자 사업수행이나 연수, 기타 능력개발 등의 목적으로 필요한 경우에 적십자사에서 주관하는 소정의 교육을 이수한 자로 하여금 일정기간 동안 국외파견 근무를 명할 수 있다.<span class=\"amend\">&lt;신설 1998.4.1, 개정 2000.10.23., 2017.6.3. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">②국외파견 근무직원은 귀국 후 그 기간의 <span class=\"b b1\">3배<\/span>되는 기한까지 <span class=\"b b1\">사무총장<\/span>이 지정하는 기관에서 근무할 의무가 있다.<span class=\"amend\">&lt;개정 2000.10.23. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">③국외파견에 관한 세부적인 사항은 시행규칙으로 정한다.<span class=\"amend\">&lt;개정 2000.10.23. 2025.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[제목개정 2025.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "40", "title": "해면직원근무", "topics": [15], "html": "<div class=\"ln\">해면된 직원에 대하여 사무인계 또는 잔무처리상 필요한 경우에는 <span class=\"b b1\">소속기관장<\/span>은 <span class=\"b b1\">15일<\/span>을 한도로 계속 근무하게 할 수 있다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "41", "title": "근무시간", "topics": [16], "html": "<div class=\"ln\">직원의 근무시간은 휴게시간을 제하고 <span class=\"b b1\">1일<\/span> <span class=\"b b1\">8시간<\/span>, <span class=\"b b1\">1주<\/span> <span class=\"b b1\">40시간 이내<\/span>로 한다.<span class=\"amend\">&lt;개정 2004.7.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "41의2", "title": "출장중 근무시간", "topics": [16], "html": "<div class=\"ln\">직원이 출장, 기타 사업장외에서 근무하는 경우에 근무시간을 산정하기 곤란할 때에는 <span class=\"b b1\">1일<\/span> <span class=\"b b1\">8시간<\/span> 근무한 것으로 본다. 다만, 별도의 지시가 있었을 경우에는 예외로 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "42", "title": "근무시간의 변경 및 연장", "topics": [16], "html": "<div class=\"ln\"><span class=\"b b1\">회장<\/span>은 직무의 성질, 지역 및 기관의 특수성 또는 필요하다고 인정할 때에는 제41조의 근무시간을 변경 또는 연장할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3.&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "43", "title": "시간외근무", "topics": [16], "html": "<div class=\"ln\">각 <span class=\"b b1\">기관장<\/span> 또는 <span class=\"b b1\">소속기관장<\/span>은 사무처리상 긴급을 요한다고 인정할 때에는 제41조 및 제42조의 규정에 불구하고 통상근무시간외에 근무하게 할 수 있다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "44", "title": "휴일", "topics": [16], "html": "<div class=\"ln\">휴일은 다음과 같다.<span class=\"amend\">&lt;개정 2004.1.15&gt;<\/span><\/div><div class=\"ln it\">1. 공휴일, 주휴일<\/div><div class=\"ln it\">2. 관공서의 임시공휴일, 근로자의 날<\/div><div class=\"ln it\">3. 기타 <span class=\"b b1\">회장<\/span>이 필요하다고 정한 휴일<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "45", "title": "휴가의 종류", "topics": [16], "html": "<div class=\"ln\">직원의 휴가는 연차유급휴가, 병가, 공가, 생리휴가, 출산전후휴가, 유산․사산휴가 및 경조휴가 등으로 구분하며 각 기관의 장은 직무수행 상 특별한 지장이 없는 한 직원의 청원에 의하여 이를 <span class=\"b b2\">허가<\/span>할 수 있다.<span class=\"amend\">&lt;개정 2002.4.1, 2004.7.1, 2006.1.1, 2012.8.20, 2013.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 연차유급휴가<\/div><div class=\"ln it2\">가. 입사일로부터 계속근로연수가 <span class=\"b b1\">1년 미만<\/span>인 직원 또는 <span class=\"b b1\">1년<\/span>간 <span class=\"b b1\">80퍼센트 미만<\/span> 출근한 직원에게는 <span class=\"b b1\">1개월<\/span>간(<span class=\"b b1\">1일<\/span>부터 말일까지) 개근시 <span class=\"b b1\">1일<\/span>의 연차유급휴가를 부여한다.<span class=\"amend\">&lt;개정 2004.7.1, 2013.4.1., 2018.4.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it2\">나. 입사 <span class=\"b b1\">2년<\/span>차 직원의 연차유급휴가 발생일수는 가목의 규정에 의하여 입사 <span class=\"b b1\">2년<\/span>차에 발생하는 연차유급휴가 발생일수와 입사연도 <span class=\"b b1\">80퍼센트 이상<\/span> 출근 시 발생하는 <span class=\"b b1\">15일<\/span>에 입사연도 월할계산한 출근율을 곱한 일수(소수점 이하 둘째자리에서 0.5일 단위로 올림)를 가산하여 부여한다..<span class=\"amend\">&lt;신설 2004.7.1, 개정 2013.4.1., 2018.4.1. 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it2\">다. 입사 <span class=\"b b1\">3년<\/span>차 이상 직원의 연차유급휴가 발생일수는 전년도 <span class=\"b b1\">80퍼센트 이상<\/span> 출근 시 <span class=\"b b1\">15일<\/span>을 부여한다.<span class=\"amend\">&lt;신설2026.1.1&gt;<\/span><\/div><div class=\"ln it2\">라. <span class=\"b b1\">3년 이상<\/span> 계속 근로한 직원에게는 최초 <span class=\"b b1\">1년<\/span>을 초과하는 계속근로연수 <span class=\"b b1\">2년<\/span>에 대하여 기본 휴가 일수 <span class=\"b b1\">15일<\/span>에 <span class=\"b b1\">1일<\/span>씩 가산하되, 총 연차유급휴가일수는 가산휴가를 포함하여 <span class=\"b b1\">25일<\/span>을 초과 할 수 없다.<span class=\"amend\">&lt;개정 2004.7.1.,2026.1.1&gt;<\/span><\/div><div class=\"ln it2\">마. 라목의 재직기간 산정 시 「직원 운영규정」에 의한 강등, 정직, 직위해제 및 휴직(업무상 재해로 인한 휴직, 육아휴직, 가족돌봄휴직, 「직원 운영규정」 제53조 제2항 제1호에 따른 휴직은 제외) 기간은 이를 재직하지 아니한 것으로 본다. <span class=\"amend\">&lt;개정 2004.7.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it2\">바. 연차유급휴가일수 중 미사용한 휴가일수에 대하여는 연가보상비로 대체 지급할 수 있다.<span class=\"amend\">&lt;개정 2026.1.1.&gt;<\/span><\/div><div class=\"ln it2\">사. 연차유급휴가는 직원 개인의 신청에 의하여 최대 <span class=\"b b1\">10일까지<\/span>는 시간 단위로, 잔여일수는 <span class=\"b b1\">반일<\/span>(<span class=\"b b1\">4시간<\/span>) 단위로 사용할 수 있다.<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln it2\">아. 연차유급휴가 운영에 관한 세부사항은 별도 지침으로 정한다.<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">4. 병  가<\/div><div class=\"ln\">직원이 질병(심각한 임신 관련 증상 및 부작용을 포함한다) 또는 상해로 인하여 집무불능할 때에는 연 <span class=\"b b1\">2개월 이내<\/span>, 업무로 인한 상해 질병으로 요양할 때에는 <span class=\"b b1\">10개월까지<\/span> 병가를 <span class=\"b b2\">허가<\/span>할 수 있다. 다만, 본인의 중대한 과실로 인한 업무상의 상해와 질병은 예외로 한다. 병가가 <span class=\"b b1\">3일 이상<\/span> <span class=\"b b1\">10일 미만<\/span>일 경우에는 요양기관의 진료증빙서류를, <span class=\"b b1\">10일 이상<\/span>일 경우에는 요양기관의 진단서를 첨부하여야 한다.<span class=\"amend\">&lt;개정 1994.1.7., 2013.12.1. 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it\">5. 공  가<\/div><div class=\"ln\">직원이 다음 사유로 근무하지 못하는 경우에는 필요로 하는 기간을 공가로 한다.<\/div><div class=\"ln it2\">가. 병역관계로 관공서의 출두명령이 있을 때<\/div><div class=\"ln it2\">나. 공무로 사직당국에 소환되었을 때<\/div><div class=\"ln it2\">다. 법정투표에 참가하게 되었을 때<\/div><div class=\"ln it2\">라. 천재지변 또는 교통차단이 되었을 때<\/div><div class=\"ln it2\">마. 한국방송통신대학에 재학할 때(연 <span class=\"b b1\">12일 이내<\/span>)<\/div><div class=\"ln it2\">바. 장기 등을 기증할 때<span class=\"amend\">&lt;신설 2006.6.10., 개정 2025.1.1.&gt;<\/span><\/div><div class=\"ln it3\">(1) 신장·간장·골수 등의 기증 전 신체 검진일<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it3\">(2) 신장·간장·골수 등의 기증을 위한 입원 및 수술(말초혈조혈모세포 채취 포함)시 진단서상의 요양일<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it3\">(3) 신장·간장·골수 등을 기증한 후 기증자의 사후관리를 위한 신체 검진일<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">사. 「산업안전보건법」 및 「국민건강보험법」에 따른 건강검진 일수<span class=\"amend\">&lt;신설 2015.1.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">아. 「혈액관리법」에 따라 헌혈에 참가한 때(구체적인 사항은 별도로 정한다)<span class=\"amend\">&lt;신설 2020.1.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">6. 생리휴가<\/div><div class=\"ln\">여성직원에게는 본인의 청구가 있을 때에는 월 <span class=\"b b1\">1일<\/span>의 무급생리휴가를 주어야 한다.<span class=\"amend\">&lt;개정 2004.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">7. 출산전후휴가 등<span class=\"amend\">&lt;개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it2\">가. 임산부에게는 출산일을 전후하여 <span class=\"b b1\">90일<\/span> (「고용노동부령」으로 정하는 미숙아를 출산한 경우에는 <span class=\"b b1\">100일<\/span>, 한 번에 둘 이상 자녀를 임신한 경우에는 <span class=\"b b1\">120일<\/span>)의 휴가를 <span class=\"b b2\">허가<\/span>하여야 한다. 다만 출산 후에 <span class=\"b b1\">45일<\/span>(한 번에 둘 이상 자녀를 임신한 경우에는 <span class=\"b b1\">60일<\/span>) 이상이 보장되도록 하여야 하며, 휴가 중 최초 <span class=\"b b1\">60일<\/span>(한 번에 둘 이상 자녀를 임신한 경우에는 <span class=\"b b1\">75일<\/span>)은 유급으로 한다.<span class=\"amend\">&lt;개정 2002.1.1, 2006.1.1, 2012.8.20., 2014.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it2\">나. 임신 중인 직원이 다음 어느 하나에 해당하는 사유로 가목의 휴가를 청구하는 경우 출산 전 어느 때라도 휴가를 나누어 사용할 수 있다. 이 경우 출산 후의 휴가 기간은 연속하여 <span class=\"b b1\">45일<\/span>(한 번에 둘 이상 자녀를 임신한 경우에는 <span class=\"b b1\">60일<\/span>)이상이 되어야 한다.<span class=\"amend\">&lt;신설 2012.8.20, 개정 2014.7.1&gt;<\/span><\/div><div class=\"ln it3\">(1) 유산․사산의 경험이 있는 경우<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it3\">(2) 출산전후휴가를 청구할 당시 연령이 만 <span class=\"b b1\">40세 이상<\/span>인 경우<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it3\">(3) 유산․사산의 위험이 있다는 의료기관의 진단서를 제출한 경우<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it2\">다. 임신 중인 직원이 유산 또는 사산한 경우에는 그 시기에 따라 유산․사산 휴가를 부여하여야 하며, 휴가 중 최초 <span class=\"b b1\">60일까지<\/span>는 유급으로 한다. 다만, 인공임신중절수술(「모자보건법」 제14조 제1항의 규정에 의한 경우 제외)에 의한 유산의 경우에는 휴가를 부여하지 아니한다.<span class=\"amend\">&lt;신설 2006.1.1, 개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it3\">(1) 삭제<span class=\"amend\">&lt;2025.4.1&gt;<\/span><\/div><div class=\"ln it3\">(2) 임신 <span class=\"b b1\">15주 이내<\/span>: 유산 또는 사산한 날로부터 <span class=\"b b1\">10일까지<\/span><span class=\"amend\">&lt;신설 2012.8.20. 개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it3\">(3) 임신 <span class=\"b b1\">16주 이상<\/span> <span class=\"b b1\">21주 이내<\/span>: 유산 또는 사산한 날로부터 <span class=\"b b1\">30일까지<\/span><span class=\"amend\">&lt;개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it3\">(4) 임신 <span class=\"b b1\">22주 이상<\/span> <span class=\"b b1\">27주 이내<\/span>: 유산 또는 사산한 날로부터 <span class=\"b b1\">60일까지<\/span><span class=\"amend\">&lt;개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it3\">(5) 임신 <span class=\"b b1\">28주 이상<\/span>: 유산 또는 사산한 날로부터  <span class=\"b b1\">90일까지<\/span><span class=\"amend\">&lt;개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it2\">라. 다목의 유산․사산 휴가를 신청하고자 하는 직원은 유산일 또는 사산일로부터 <span class=\"b b1\">10일 이내<\/span>에 휴가신청사유, 유산․사산 발생일, 임신기간 등이 기재된 유산․사산 휴가신청서에 의료기관 진단서를 첨부하여 제출하여야 한다.<span class=\"amend\">&lt;신설 2006.1.1, 개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it2\">마. 삭제<span class=\"amend\">&lt;2025.4.1&gt;<\/span><\/div><div class=\"ln it2\">바. 임신 중인 직원은 임신기간 중 임신(태아)검진을 위해 <span class=\"b b1\">10일 이내<\/span>의 임신(태아)검진휴가를 <span class=\"b b1\">반일<\/span> 또는 <span class=\"b b1\">1일<\/span> 단위로 사용할 수 있다. 다만, <span class=\"b b1\">3일 이상<\/span> 연속하여 사용 시 임신(태아)검진을 확인할 수 있는 증빙서류를 제출하여야 한다. <span class=\"amend\">&lt;신설 2022.1.1.&gt;<\/span><\/div><div class=\"ln it\">7의2. 인공수정 또는 체외수정 등 난임치료 시술을 받는 직원은 다음 각 목에 따라 난임치료휴가를 받을 수 있다.<span class=\"amend\">&lt;신설 2025.4.1&gt;<\/span><\/div><div class=\"ln it2\">가. 여성직원<\/div><div class=\"ln it3\">(1) 인공수정 시술을 받는 경우: 총 <span class=\"b b1\">2일<\/span>(시술일 당일을 반드시 포함하고, 나머지 <span class=\"b b1\">1일<\/span>은 시술일 전날, 시술 후 <span class=\"b b1\">2일 이내<\/span>, 시술 관련 진료일 중 선택)<\/div><div class=\"ln it3\">(2) 동결 보존된 배아를 이식하는 체외수정 시술을 받는 경우: 총 <span class=\"b b1\">3일<\/span>(시술일 당일을 반드시 포함하고, 나머지 <span class=\"b b1\">2일<\/span>은 시술일 전날, 시술 후 <span class=\"b b1\">2일 이내<\/span>, 시술 관련 진료일 중 선택)<\/div><div class=\"ln it3\">(3) 난자를 채취하여 체외수정 시술을 받는 경우: 총 <span class=\"b b1\">4일<\/span>(난자 채취일 당일과 시술일 당일을 반드시 포함하고, 나머지 <span class=\"b b1\">2일<\/span>은 난자 채취일 전날, 시술일 전날, 난자 채취일 후 <span class=\"b b1\">2일 이내<\/span>, 시술 후 <span class=\"b b1\">2일 이내<\/span>, 시술 관련 진료일 중 선택)<\/div><div class=\"ln it2\">나. 남성직원: 정자 채취일에 <span class=\"b b1\">1일<\/span><\/div><div class=\"ln it\">8. 경조휴가<\/div><div class=\"ln\">직원은 다음과 같은 경조휴가를 받을 수 있다.<span class=\"amend\">&lt;개정 95.1.1, 2000.10.23, 2008.6.26 2012.8.20, 2013.4.1., 2020.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"tw\"><table><tr><td>구  분<\/td><td>대     상<\/td><td>일수<\/td><\/tr><tr><td>결  혼<\/td><td>본인<br>자녀<\/td><td><span class=\"b b1\">5<\/span><br><span class=\"b b1\">1<\/span><\/td><\/tr><tr><td>출  산<\/td><td>배우자(처)<\/td><td><span class=\"b b1\">20<\/span><\/td><\/tr><tr><td>입  양<\/td><td>본인<\/td><td><span class=\"b b1\">20<\/span><\/td><\/tr><tr><td>사  망<\/td><td>배우자, 본인 및 배우자의 부모<br>본인 및 배우자의 조부모, 외조부모<br>자녀와 그 자녀의 배우자<br>본인 및 배우자의 형제자매<\/td><td><span class=\"b b1\">5<\/span><br><span class=\"b b1\">3<\/span><br><span class=\"b b1\">3<\/span><br><span class=\"b b1\">3<\/span><\/td><\/tr><\/table><\/div><div class=\"ln\">※ 단, 입양은『입양특례법』에 따른 입양으로 한정하며, 입양 외의 경조사 휴가를 실시할 때 원격지일 경우에는 실제 왕복에 필요한 일수를 더할 수 있다.<span class=\"amend\">&lt;개정 2013.4.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">※ 본인 결혼 휴가의 경우에는 그 사유가 발생한 날(결혼식일 또는 혼인<span class=\"b b2\">신고<\/span>일)로부터 <span class=\"b b1\">30일 이내<\/span>의 범위에서 사용 가능하며, 휴가 마지막 날이 <span class=\"b b1\">30일<\/span> 범위 내에 있어야 한다.<span class=\"amend\">&lt;신설 2026.1.1&gt;<\/span><\/div><div class=\"ln\">※ 출산휴가의 사용은 직원의 배우자가 출산한 날부터 <span class=\"b b1\">120일 이내<\/span>에 하여야 하며, <span class=\"b b1\">3회<\/span> 분할 사용이 가능하다.<span class=\"amend\">&lt;신설 2008.6.26. 개정 2020.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">10. 육아시간<\/div><div class=\"ln\">생후 <span class=\"b b1\">1년 미만<\/span>의 유아를 가진 여성직원에게는 <span class=\"b b1\">1일<\/span> <span class=\"b b1\">2회<\/span> 각 <span class=\"b b1\">30분<\/span>의 수유시간을 <span class=\"b b2\">허가<\/span>할 수 있다.<span class=\"amend\">&lt;개정 2025.1.1.&gt;<\/span><\/div><div class=\"ln it\">12. 자녀가 있는 직원은 ｢영유아보육법｣에 따른 어린이집, ｢유아교육법｣에 따른 유치원 및 ｢초・중등교육법｣ 제2조 각 호의 학교에서 공식적으로 주최하는 행사 또는 교사와의 상담에 참여할 경우, 자녀의 병원 진료에 동행하는 경우, 휴업·휴원·휴교의 경우, 그 밖에 이에 준하는 사유로 자녀를 돌봐야 하는 경우 연간 <span class=\"b b1\">2일<\/span>(자녀가 <span class=\"b b1\">2명 이상<\/span>이거나 장애인인 경우 또는 한부모가족지원법의 모 또는 부에 해당하는 경우에는 <span class=\"b b1\">3일<\/span>)의 범위에서 자녀돌봄휴가를 받을 수 있다.<span class=\"amend\">&lt;신설 2018.1.1, 개정 2020.1.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">13. 가족돌봄휴가<\/div><div class=\"ln it2\">가. 직원은 가족(조부모, 부모, 배우자, 배우자의 부모, 자녀 또는 손자녀. 단, 조부모 또는 손자녀의 경우 직원 외에도 직계비속 또는 직계존속이 있는 등 대통령령으로 정하는 경우는 제외)의 질병, 사고, 노령 또는 자녀의 양육으로 인하여 긴급하게 그 가족을 돌보기 위한 휴가를 받을 수 있다.<\/div><div class=\"ln it2\">나. 휴가는 무급으로 하며, 연간 최장 <span class=\"b b1\">10일<\/span>[「남녀고용평등과 일·가정 양립 지원에 관한 법률」제22조의2제4항제3호에 따라 가족돌봄휴가 기간이 연장되는 경우 <span class=\"b b1\">20일<\/span>(「한부모가족지원법」제4조제1호의 모 또는 부에 해당하는 근로자의 경우 <span class=\"b b1\">25일<\/span>) 이내]로 하며, 일단위로 사용할 수 있다. 다만, 가족돌봄휴가 기간은 가족돌봄휴직 기간에 포함된다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">다. 나목에 따라 연장된 휴가는 「남녀고용평등과 일·가정 양립 지원에 관한 법률」제22조의2제5항에서 정하는 어느 하나에 해당하는 경우에만 사용할 수 있다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[전부개정 2020.12.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "46", "title": "휴가기간 계산기준", "topics": [16], "html": "<div class=\"ln\">①휴가기간은 역년을 기준으로 한다.<\/div><div class=\"ln\">②전조에 의한 연가기간은 휴직 및 정직기간에 산입하지 아니한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "47", "title": "휴가중의 휴일 및 휴무일", "topics": [16], "html": "<div class=\"ln\">휴가기간 중의 공휴일, 주휴일, 근로자의 날, 토요휴무일은 해당 휴가일수에 산입하지 아니한다. 다만, 연가를 제외한 휴가일수가 <span class=\"b b1\">30일 이상<\/span> 계속되는 경우에는 산입한다.<span class=\"amend\">&lt;개정 2001.4.1, 2002.1.1, 2004.1.15, 2004.4.1, 2004.7.1, 2013.4.1., 2020.12.1. 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "48", "title": "휴가의 취소", "topics": [16], "html": "<div class=\"ln\">본 운영규정 제45조 각 호에도 불구하고 비상재해가 발생한 때 또는 필요하다고 인정할 때에는 일단 <span class=\"b b2\">허가<\/span>한 휴가도 이를 취소할 수 있다. 다만, 업무가 종료되었을 때에는 직원의 요구에 의하여 잔여 일수에 대한 휴가를 <span class=\"b b2\">허가<\/span>하여야 한다.<span class=\"amend\">&lt;개정 2020.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "49", "title": "착임신고", "topics": [15], "html": "<div class=\"ln\">직원이 신임 또는 전임발령을 받았을 때에는 <span class=\"b b1\">7일 이내<\/span>에 부임하여야 하며 착임한지 <span class=\"b b1\">3일 이내<\/span>에 <span class=\"b b1\">소속기관장<\/span>에게 <span class=\"b b2\">신고<\/span>하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "49의2", "title": "휴직직원", "topics": [15], "html": "<div class=\"ln\">휴직 중인 직원이 휴직기간 중 휴직의 목적 달성에 현저히 위배되는 행위(이하 “휴직의 목적 외 사용”이라 한다)를 금지하며, <span class=\"b b1\">기관장<\/span> 및 <span class=\"b b1\">소속기관장<\/span>은 직원이 휴직의 목적 외 사용을 하지 않도록 복무관리를 하여야 한다.<span class=\"amend\">&lt;신설 2020.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제6장 신분보장"}, {"law": "운영규정", "type": "a", "no": "50", "title": "의사에 반한 신분조치", "topics": [17], "html": "<div class=\"ln\">직원은 형의 선고, 징계처분 또는 본 운영규정에서 정하는 사유에 의하지 아니하고는 그 의사에 반하여 휴직, 강임 또는 면직을 당하지 아니한다. 다만, <span class=\"b b1\">1급<\/span>직원과 특정직원은 그러하지 아니한다.<span class=\"amend\">&lt;개정 1994.5.1, 2015.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "51", "title": "당연퇴직", "topics": [17], "html": "<div class=\"ln\">직원은 다음 각 호의 어느 하나에 해당될 때에는 당연퇴직된다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 제20조 각 호의 어느 하나에 해당되는 경우. 다만, 제20조제2호와 제5호는 다음 각 목에 해당될 경우에 한한다.<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">가. 제20조제2호는 파산선고를 받은 사람으로서 「채무자 회생 및 파산에 관한 법률」에 따라 신청기한 내에 면책신청을 하지 아니하였거나 면책불<span class=\"b b2\">허가<\/span> 결정 또는 면책 취소가 확정된 경우<\/div><div class=\"ln it2\">나. 제20조제5호는 「형법」 제129조부터 제132조까지, 「성폭력범죄의 처벌 등에 관한 특례법」 제2조, 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제74조제1항제2호ㆍ제3호, 「스토킹범죄의 처벌 등에 관한 법률」 제2조제2호, 「아동ㆍ청소년의 성보호에 관한 법률」 제2조제2호 및 직무와 관련하여 「형법」 제355조 또는 제356조에 규정된 죄를 범한 사람으로서 금고 이상의 형의 선고유예를 받은 경우<\/div><div class=\"ln it\">2. 정년에 도달한 경우<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "52", "title": "직권면직", "topics": [17], "html": "<div class=\"ln\">①직원이 다음 각 호의 어느 하나에 해당할 때에는 <span class=\"b b1\">임용권자<\/span>는 직권에 의하여 면직시킬 수 있다.<span class=\"amend\">&lt;개정 1993.1.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 직제와 정원의 개폐 또는 예산의 감소 등에 의하여 폐직 또는 과원이 되었을 때<span class=\"amend\">&lt;개정 1994.5.1&gt;<\/span><\/div><div class=\"ln it\">3. 휴직기간의 만료 또는 휴직사유가 소멸된 후에도 직무에 복귀하지 아니하거나 직무를 감당할 수 없다고 판단될 때<span class=\"amend\">&lt;신설 1993.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 제55조의2 제1항 제1호, 제2호 및 제5호의 규정에 의하여 대기명령을 받은 자가 그 기간 중 능력 또는 근무성적의 향상을 기대하기 어렵고 개전의 정이 없다고 인정될 때 또는 인력종합수급과(인력풀과) 배치 후 <span class=\"b b1\">3개월<\/span>이 경과하도록 재임용되지 아니할 때<span class=\"amend\">&lt;신설 1994.5.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">5. 해당 직급에서 직무를 수행하는데 필요한 자격증의 효력이 상실되거나 면<span class=\"b b2\">허가<\/span> 취소되어 담당직무를 수행할 수 없게 된 때<span class=\"amend\">&lt;신설 1994.5.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">6. 병역판정검사, 입영 또는 소집의 명령을 받고 정당한 이유없이 이를 기피하거나 군복무를 위하여 휴직 중인 자가 군복무 중 군무를 이탈하였을 때<span class=\"amend\">&lt;신설 1994.5.1, 개정 2018.4.1&gt;<\/span><\/div><div class=\"ln it\">7. 채용 비위, 성비위 등 기타 사유로 인하여 부적당하다고 인정될 때<span class=\"amend\">&lt;신설 2018.4.1, 개정 2020.4.1, 2020.6.1&gt;<\/span><\/div><div class=\"ln it\">8. 부정한 방법으로 임용되었을 때<span class=\"amend\">&lt;신설 2018.4.1&gt;<\/span><\/div><div class=\"ln\">②<span class=\"b b1\">임용권자<\/span>는 제1항 제2호의 규정에 의하여 면직시킬 경우에는 관할 인사위원회, 제3호, 제4호, 제7호, 제8호에 따라 면직시킬 경우에는 미리 관할 징계위원회의 <span class=\"b b2\">동의<\/span>를 받아야 한다.<span class=\"amend\">&lt;개정 1998.10.22, 2018.4.1&gt;<\/span><\/div><div class=\"ln\">다만, <span class=\"b b1\">1급<\/span>직원과 기관장급 직원은 그러하지 아니하다.<span class=\"amend\">&lt;개정 1996.4.1, 2000.10.23&gt;<\/span><\/div><div class=\"ln\">③제1항제3호의 규정에 의한 직권면직일은 휴직기간의 만료일 또는 휴직사유의 소멸일로 한다.<span class=\"amend\">&lt;개정 1994.5.1&gt;<\/span><\/div><div class=\"ln\">④위의 제1항 및 제2항에 의거 면직시키고자 할 때에는 <span class=\"b b1\">30일<\/span>전에 예고하거나 <span class=\"b b1\">30일<\/span>분의 통상임금을 지급하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "52의2", "title": "비위행위자 의원면직 제한", "topics": [17], "html": "<div class=\"ln\"><span class=\"b b1\">임용권자<\/span>는 다음 각 호에 해당하는 경우에는 의원면직을 허용하여서는 아니된다. 다만, 제1호, 제3호 및 제4호의 경우에는 해당 직원이 제57조제5항에 따른 중징계에 해당되는 경우에 한한다.<\/div><div class=\"ln it\">1. 비위와 관련하여 형사사건으로 기소 중인 경우<\/div><div class=\"ln it\">2. 징계위원회에 중징계 <span class=\"b b2\">의결<\/span>요구 중인 경우<\/div><div class=\"ln it\">3. 감사원, 검찰, 경찰 및 그 밖의 수사기관에서 비위와 관련하여 조사 또는 수사 중인 경우<\/div><div class=\"ln it\">4. 내부감사 또는 감독기관의 감사부서 등에서 비위와 관련하여 내사 중인 경우<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2014.7.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "52의3", "title": "적격심사", "topics": [17], "html": "<div class=\"ln\">①<span class=\"b b1\">회장<\/span>은 본 운영규정 제18조제2호에 해당하는 직원에 대해 적격한지 여부를 심사할 수 있다.<\/div><div class=\"ln\">②적격심사에 관한 세부사항은 별도 지침으로 정한다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2021.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "52의4", "title": "비위행위자 신고", "topics": [17], "html": "<div class=\"ln\">직원은 본인이 제52조의2 제1호, 제3호에 해당되는 경우 그 내용을 지체없이 해당 <span class=\"b b1\">기관장<\/span> 또는 <span class=\"b b1\">소속기관장<\/span>에게 <span class=\"b b2\">신고<\/span>하여야 한다. <span class=\"amend\">&lt;신설 2022.1.1. 개정 2025.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "53", "title": "휴직", "topics": [18], "html": "<div class=\"ln\">①직원이 다음 각 호의 어느 하나에 해당될 때에는 <span class=\"b b1\">임용권자<\/span>는 본인의 의사에 불구하고 휴직을 명하여야 한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">1. 신체·정신상의 장애로 장기 요양이 필요할 때(불임 및 난임 치료를 위해 장기간 치료가 필요할 때를 포함)<span class=\"amend\">&lt;개정 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 병역복무로 소집되었을 때<\/div><div class=\"ln it\">4. 천재지변, 전란 및 기타 재해로 인하여 생사 또는 소재가 불명하게 되었을 때<\/div><div class=\"ln it\">5. 기타 법률의 규정에 의한 의무 수행을 위하여 직무를 이탈하게 되었을 때<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\">②직원이 다음 각 호의 어느 하나에 해당하는 사유로 휴직을 원하는 경우에는 <span class=\"b b1\">임용권자<\/span>는 휴직을 명할 수 있다. 다만, 제1호의 경우에는 사전에 <span class=\"b b1\">회장<\/span>의 <span class=\"b b2\">승인<\/span>을 받아야 한다.<span class=\"amend\">&lt;신설 1996.4.1, 개정 2001.10.23, 2008.1.1, 2018.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 직무와 관련되는 국제기구 또는 외국기관, 국가기관에 임시로 고용될 때<span class=\"amend\">&lt;개정 2018.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 직무와 관련되는 해외유학을 하게 될 때<span class=\"amend\">&lt;개정 2001.10.23&gt;<\/span><\/div><div class=\"ln it\">3. 직무와 관련되는 연구기관이나 교육기관 등에서 연수를 하게 될 때<span class=\"amend\">&lt;개정 2001.10.23&gt;<\/span><\/div><div class=\"ln it\">4. 임신 중인 직원이 모성을 보호하거나 만 <span class=\"b b1\">8세 이하<\/span> 또는 초등학교 2학년 이하 자녀(입양한 자녀를 포함한다)를 양육하기 위하여 필요한 때. 단, 휴직을 신청하는 직원의 계속근로기간이 <span class=\"b b1\">6개월 미만<\/span>(육아휴직 시작일을 기준으로 한다)인 경우 제외한다.<span class=\"amend\">&lt;개정 2008.1.1, 2010.4.1, 2014.7.1, 2019.4.1, 2020.4.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">5. 질병, 사고, 노령으로 인하여 요양을 요하는 조부모, 부모, 배우자, 자녀 또는 배우자의 부모, 손자녀의 돌봄을 위하여 필요한 때(「남녀고용평등과 일․가정 양립지원에 관한 법률」에 의한 가족돌봄휴직 및 가족돌봄휴직에 추가하는 휴직)<span class=\"amend\">&lt;개정 2012.8.20., 2020.1.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">7. <span class=\"b b1\">10년 이상<\/span> 근속한 직원이 직무 관련 연구과제 수행 또는 자기개발을 위하여 학습·연구 등을 하게 된 때<span class=\"amend\">&lt;신설 2020.1.1., 개정 2026.1.1&gt;<\/span><\/div><div class=\"ln it\">8. 외국에서 근무·유학 또는 연수하게 되는 배우자를 동반하게 된 때<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln\">③제2항제5호의 가족돌봄휴직은 다음 각 호의 어느 하나에 해당하는 경우 <span class=\"b b2\">허가<\/span>하지 않을 수 있다.<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it\">1. 가족돌봄휴직 개시 예정일의 전날까지 계속 근로한 기간이 <span class=\"b b1\">6개월 미만<\/span>인 직원이 신청한 경우<span class=\"amend\">&lt;신설 2012.8.20, 개정 2020.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 가족돌봄휴직을 신청한 직원 외에 돌봄이 필요한 가족의 부모, 자녀, 배우자 등이 가족을 돌볼 수 있는 경우<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it\">3. 「직업안정법」제2조의2제1호에 따른 직업안정기관에 구인신청을 하고 <span class=\"b b1\">14일 이상<\/span> 대체인력을 채용하기 위하여 노력하였으나 대체인력을 채용하지 못한 경우. 다만 직업안정기관의 장의 직업소개에도 불구하고 정당한 이유 없이 <span class=\"b b1\">2회 이상<\/span> 채용을 거부한 경우는 제외<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it\">4. 직원의 가족돌봄휴직으로 인하여 정상적인 사업 운영에 중대한 지장이 초래되는 경우<span class=\"amend\">&lt;신설 2012.8.20&gt;<\/span><\/div><div class=\"ln it\">5. 조부모 또는 손자녀를 돌보기 위하여 가족돌봄휴직을 신청한 직원 외에도 조부모의 직계비속 또는 손자녀의 직계존속이 있는 경우. 다만, 조부모의 직계비속 또는 손자녀의 직계존속에게 질병, 노령, 장애 또는 미성년 등의 사유가 있어 신청한 직원이 돌봐야 하는 경우 제외<span class=\"amend\">&lt;신설 2020.4.1&gt;<\/span><\/div><div class=\"ln\">④제2항제4호의 휴직을 직원이 신청하는 경우 제2항에도 불구하고 <span class=\"b b1\">임용권자<\/span>는 허용하여야 하고 육아휴직을 이유로 불리한 처우를 해서는 아니된다.<span class=\"amend\">&lt;신설 2017.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "54", "title": "휴직기간", "topics": [18], "html": "<div class=\"ln\">휴직기간은 다음과 같다.<\/div><div class=\"ln it\">1. 제53조 제1항 제1호 규정에 의한 휴직기간은 <span class=\"b b1\">1년 이내<\/span>로 하되, 부득이한 경우 <span class=\"b b1\">1년<\/span> 범위내에서 연장할 수 있다. 다만 「산업재해보상보험법」에 따른 업무상 질병 또는 부상으로 인한 휴직은 <span class=\"b b1\">3년 이내<\/span>로 한다.<span class=\"amend\">&lt;개정 2014.4.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">2. 제53조 제1항 제3호 및 제5호의 규정에 의한 휴직기간은 그 복무기간이 만료되는 날까지로 한다.<\/div><div class=\"ln it\">3. 제53조 제1항 제4호의 휴직기간은 <span class=\"b b1\">3개월 이내<\/span>로 한다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 제53조 제2항 제1호의 규정에 의한 휴직기간은 <span class=\"b b1\">2년 이내<\/span>로 하되, 부득이한 경우 인사위원회를 통해 연장할 수 있다.<span class=\"amend\">&lt;개정 2024.1.1.&gt;<\/span><\/div><div class=\"ln it\">5. 제53조 제2항 제2호의 규정에 의한 휴직기간은 <span class=\"b b1\">2년이내<\/span>로 하되, 학위취득등 부득이한 경우에는 <span class=\"b b1\">2년<\/span> 범위내에서 연장할 수 있다.<\/div><div class=\"ln it\">6. 제53조 제2항 제3호의 규정에 의한 휴직기간은 <span class=\"b b1\">2년이내<\/span>로 한다.<\/div><div class=\"ln it\">7. 제53조 제2항 제4호의 규정에 의한 휴직기간은 다음과 같다.<span class=\"amend\">&lt;개정 1998.4.1, 2008.1.1, 2010.4.1, 2011.12.1, 2013.4.1 2020.1.1, 2021.4.1., 2022.1.1., 2023.1.1. 2025.4.1.&gt;<\/span><\/div><div class=\"ln it2\">가. 자녀 <span class=\"b b1\">1명<\/span>에 대하여 <span class=\"b b1\">3년 이내<\/span>로 사용한다. 단, 자녀 <span class=\"b b1\">1명<\/span>에 대한 총 육아휴직 기간이 <span class=\"b b1\">1년<\/span>을 넘는 경우에는 최초 <span class=\"b b1\">1년<\/span>을 근속기간에 포함하고, 셋째 자녀부터는 전체 육아휴직 기간을 근속기간에 포함한다.<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln it2\">나. 다음의 어느 하나에 해당하는 직원의 경우 <span class=\"b b1\">6개월 이내<\/span>에서 추가로 육아휴직을 사용할 수 있으며, 근속기간에 포함한다.<span class=\"amend\">&lt;개정 2026.1.1.&gt;<\/span><\/div><div class=\"ln it3\">(1) 같은 자녀를 대상으로 부모가 모두 육아휴직을 각각 <span class=\"b b1\">3개월 이상<\/span> 사용한 경우의 부 또는 모<\/div><div class=\"ln it3\">(2) 「한부모가족지원법」 제4조제1호의 부 또는 모<\/div><div class=\"ln it3\">(3) 「고용노동부령」으로 정하는 장애아<span class=\"b b2\">동의<\/span> 부 또는 모<\/div><div class=\"ln it\">8. 제53조제2항제5호의 규정에 의한 휴직기간은 연간 <span class=\"b b1\">90일 이내<\/span>로 하되 분할 사용(<span class=\"b b1\">1회<\/span> 기간은 <span class=\"b b1\">30일 이상<\/span>)이 가능하며 휴직기간은 근속기간에 포함한다.(이상 가족돌봄휴직) 다만, 장기간의 요양이 필요한 경우에는 가족돌봄휴직에 추가하여 연간 <span class=\"b b1\">9개월 이내<\/span>, 재직기간 중 총 <span class=\"b b1\">3년<\/span>을 초과하지 않는 범위 내에서 휴직을 부여할 수 있으며, 가족돌봄휴직에 추가하는 휴직은 근속기간에 포함하지 아니한다.<span class=\"amend\">&lt;개정 2012.8.20&gt;<\/span><\/div><div class=\"ln it\">10. 53조제2항제7호의 규정에 의한 휴직은 <span class=\"b b1\">1년<\/span>으로 한다. 해당휴직은 무급이며, 근속기간에 포함하지 아니한다. <span class=\"amend\">&lt;신설 2020.1.1., 개정 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">11. 제53조제2항제8호의 규정에 의한 휴직은 <span class=\"b b1\">3년 이내<\/span>로 하되, 부득이한 경우 <span class=\"b b1\">2년<\/span> 범위내에서 연장할 수 있다. 해당휴직은 무급이며, 근속기간에 포함하지 아니한다.<span class=\"amend\">&lt;신설 2022.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[전문개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "54의2", "title": "육아기 근로시간 단축", "topics": [18], "html": "<div class=\"ln\">①직원이 만 <span class=\"b b1\">12세 이하<\/span> 또는 초등학교 6학년 이하의 자녀를 양육하기 위하여 육아기 근로시간 단축을 신청하는 경우에 이를 허용하여야 한다. 다만, 다음 각 호에 해당하는 경우에는 그러하지 아니하다.<span class=\"amend\">&lt;개정 2020.1.1. 2025.4.1.&gt;<\/span><\/div><div class=\"ln it\">1. 단축개시예정일의 전날까지 계속 근로기간이 <span class=\"b b1\">6개월 미만<\/span>인 직원이 신청한 경우<span class=\"amend\">&lt;개정 2020.4.1&gt;<\/span><\/div><div class=\"ln it\">3. 「직업안정법」 제2조의2제1호에 따른 직업안정기관에 구인신청을 하고 <span class=\"b b1\">14일 이상<\/span> 대체인력을 채용하기 위하여 노력하였으나 대체인력을 채용하지 못한 경우. 다만 직업안정기관의 장의 직업소개에도 불구하고 정당한 이유 없이 <span class=\"b b1\">2회 이상<\/span> 채용을 거부한 경우는 제외<\/div><div class=\"ln it\">4. 육아기 근로시간 단축을 신청한 직원의 업무성격상 근로시간을 분할하여 수행하기가 곤란하거나 그 밖에 근로시간 단축이 정상적인 사업운영에 중대한 지장을 초래하는 경우<\/div><div class=\"ln\">②육아기 근로시간 단축기간은 <span class=\"b b1\">1년 이내<\/span>로 하며, 제54조 제7호 가목의 육아휴직 미사용 기간을 가산하여 사용할 수 있고 단축 후 근로시간은 주당 <span class=\"b b1\">15시간 이상<\/span>, <span class=\"b b1\">35시간 이내<\/span>로 한다. 다만, 제54조 제7호 가목에 의한 육아휴직과 육아기 근로시간단축 사용은 합산하여 최대 <span class=\"b b1\">3년 이내<\/span>로 한다.<span class=\"amend\">&lt;개정 2020.1.1., 2022.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">③제54조 제7호 가목의 육아휴직이나 육아기 근로시간 단축을 하고자 하는 직원은 다음 각 호의 방법 중 하나를 선택하여 사용할 수 있다.<span class=\"amend\">&lt;개정 2013.4.1., 2020.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">1. 육아휴직의 사용(최대 <span class=\"b b1\">3년<\/span>)<span class=\"amend\">&lt;개정 2020.1.1, 2021.4.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 육아기 근로시간 단축 사용(최대 <span class=\"b b1\">3년<\/span>)<span class=\"amend\">&lt;개정 2020.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 육아휴직의 분할 사용(기관의 인력운영사정 등을 고려하여 <span class=\"b b1\">1년<\/span> <span class=\"b b1\">3회<\/span>에 한함. 다만, 임신 중인 직원이 육아휴직을 사용한 횟수는 분할 사용 횟수에서 제외)<span class=\"amend\">&lt;개정 2020.1.1, 2021.4.1., 2022.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">4. 육아기 근로기간 단축의 분할 사용(<span class=\"b b1\">1회<\/span> 최소 <span class=\"b b1\">1개월 이상<\/span>)<span class=\"amend\">&lt;개정 2020.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">5. 육아휴직의 사용과 육아기 근로시간 단축 사용(최대 <span class=\"b b1\">3년<\/span>)<span class=\"amend\">&lt;개정 2020.1.1&gt;<\/span><\/div><div class=\"ln\">④육아기 근로시간 단축을 하고 있는 직원에 대하여 근로시간에 비례하여 적용하는 경우 외에는 육아기 근로시간 단축을 이유로 근로조건을 불리하게 하여서는 아니된다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2012.8.20]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "54의3", "title": "임산부 근로시간 단축", "topics": [18], "html": "<div class=\"ln\">①임신 후 <span class=\"b b1\">12주 이내<\/span> 또는 <span class=\"b b1\">32주<\/span> 이후에 있는 여성 근로자(「고용노동부령」으로 정하는 유산, 조산 등 위험이 있는 여성 근로자의 경우 임신 전 기간)가 <span class=\"b b1\">1일<\/span> <span class=\"b b1\">2시간<\/span>의 근로시간 단축을 신청하는 경우 이를 허용하여야 한다. 다만, <span class=\"b b1\">1일<\/span> 근로시간이 <span class=\"b b1\">8시간 미만<\/span>인 근로자에 대하여는 <span class=\"b b1\">1일<\/span> 근로시간이 <span class=\"b b1\">6시간<\/span>이 되도록 근로시간 단축을 허용할 수 있다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln\">②제1항에 따른 근로시간 단축을 이유로 근로자의 임금을 삭감하지 않는다.<\/div><div class=\"ln\">③제1항에 해당하는 직원은 <span class=\"b b1\">1일<\/span> <span class=\"b b1\">2시간<\/span>의 단축된 근로시간을 적치하여 근로시간 단축이 발생한 주에 한해 <span class=\"b b1\">1일<\/span>(<span class=\"b b1\">8시간<\/span>)단위로 사용할 수 있다.<span class=\"amend\">&lt;신설 2022.1.1.&gt;<\/span><\/div><div class=\"ln\">④ 임신 중인 여성 근로자가 <span class=\"b b1\">1일<\/span> 소정근로시간을 유지하면서 업무의 시작 및 종료 시각의 변경을 신청하는 경우 이를 허용하여야 한다. 다만, 다음 각 호에 해당하는 경우에는 그러하지 아니하다.<span class=\"amend\">&lt;신설 2023.1.1.&gt;<\/span><\/div><div class=\"ln it\">1. 정상적인 사업 운영에 중대한 지장을 초래하는 경우<\/div><div class=\"ln it\">2. 업무의 시작 및 종료시각을 변경하게 되면 임신 중인 여성 근로자의 안전과 건강에 관한 관계 법령을 위반하게 되는 경우<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2015.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "54의4", "title": "가족돌봄 등을 위한 근로시간 단축", "topics": [18], "html": "<div class=\"ln\">①직원이 다음 각 호의 어느 하나에 해당하는 사유로 근로시간의 단축을 신청하는 경우에 이를 허용하여야 한다. 다만, 대체인력 채용이 불가능한 경우, 정상적인 사업 운영에 중대한 지장을 초래하는 경우 등에는 그러하지 아니하다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 가족의 질병, 사고, 노령으로 인하여 그 가족을 돌보기 위한 경우<\/div><div class=\"ln it\">2. 자신의 질병이나 사고로 인한 부상 등의 사유로 건강을 돌보기 위한 경우<\/div><div class=\"ln it\">3. <span class=\"b b1\">55세 이상<\/span>의 직원이 은퇴를 준비하기 위한 경우<\/div><div class=\"ln it\">4. 직원의 학업을 위한 경우<\/div><div class=\"ln\">②제1항 단서에 따라 근로시간 단축을 허용하지 아니하는 경우에는 해당 직원에게 그 사유를 서면으로 통보하고 휴직을 사용하게 하거나 그 밖의 조치를 통하여 지원할 수 있는지를 직원과 <span class=\"b b2\">협의<\/span>하여야 한다.<\/div><div class=\"ln\">③제1항에 따라 근로시간 단축을 허용하는 경우 단축 후 근로시간은 주당 <span class=\"b b1\">15시간 이상<\/span>, <span class=\"b b1\">30시간 이내<\/span>로 한다.<\/div><div class=\"ln\">④근로시간 단축의 기간은 <span class=\"b b1\">1년 이내<\/span>로 한다. 다만, 제1항제1호부터 제3호까지의 어느 하나에 해당하는 직원은 합리적 이유가 있는 경우에 추가로 <span class=\"b b1\">2년<\/span>의 범위 안에서 근로시간 단축의 기간을 연장할 수 있다.<\/div><div class=\"ln\">⑤근로시간 단축을 하고 있는 직원에게 단축된 근로시간 외에 연장근로를 요구할 수 없다. 다만, 직원이 명시적으로 청구하는 경우에는 주 <span class=\"b b1\">12시간 이내<\/span>에서 연장근로를 시킬 수 있다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2020.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "55", "title": "휴직의 효력", "topics": [18], "html": "<div class=\"ln\">①휴직자는 직원으로서 신분을 보유하나 직무에 종사하지 못한다.<\/div><div class=\"ln\">②휴직기간중 그 사유가 소멸되었을 때에는 <span class=\"b b1\">임용권자<\/span>는 복직을 명하여야 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "55의2", "title": "직위의 해제", "topics": [17], "html": "<div class=\"ln\">①<span class=\"b b1\">임용권자<\/span>는 다음 각 호의 어느 하나에 해당하는 직원에 대하여는 직위를 해제할 수 있다. 단, 채용비위에 연루되어 수사의뢰 되거나 징계<span class=\"b b2\">의결<\/span>이 요구된 경우에는 해당 직원의 직위를 즉시 해제하여야 한다.<span class=\"amend\">&lt;개정 2000.1.18. 2025.1.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">1. 직무수행 능력이 부족하거나 근무성적이 극히 불량한 경우 또는 직원으로서의 근무태도가 심히 불성실한 경우<\/div><div class=\"ln it\">2. <span class=\"b b1\">4급이상<\/span> 간부직원으로서 소속 부하직원에 대한 지휘감독 능력이 현저히 불량하다고 인정될 경우<\/div><div class=\"ln it\">3. 중징계에 해당하는 징계<span class=\"b b2\">의결<\/span>이 요구중인 경우<span class=\"amend\">&lt;개정 2004.4.1&gt;<\/span><\/div><div class=\"ln it\">4. 형사사건으로 기소된 경우(약식명령이 청구된 자는 제외한다.)<span class=\"amend\">&lt;신설 2003.1.1&gt;<\/span><\/div><div class=\"ln it\">5. 적십자정신에 반한 행위를 하였을 때<span class=\"amend\">&lt;신설 1994.5.1&gt;<\/span><\/div><div class=\"ln it\">6. 직제와 정원의 개폐 또는 예산의 감소등에 의해 폐직 또는 과원이 되어 인력종합수급과(인력풀과)로 배치되었을 때<span class=\"amend\">&lt;개정 2000.1.18&gt;<\/span><\/div><div class=\"ln it\">7. 직무 관련 금품 비위행위로 인하여 감사원 및 검찰・경찰 등 수사기관에서 조사나 수사 중인 자로서 비위의 정도가 중대하고 이로 인하여 정상적인 업무수행을 기대하기가 현저히 어려운 경우<span class=\"amend\">&lt;신설 2018.1.1.&gt;<\/span><\/div><div class=\"ln\">②제1항의 규정에 의하여 직위를 부여하지 아니한 경우에 그 사유가 소멸된 때에는 <span class=\"b b1\">임용권자<\/span>는 지체없이 직위를 부여하여야 한다.<\/div><div class=\"ln\">③<span class=\"b b1\">임용권자<\/span>는 제1항 제1호, 제2호 및 제5호에 의하여 직위해제된 직원에 대하여 <span class=\"b b1\">3개월 이내<\/span>의 기간 대기를 명한다.<span class=\"amend\">&lt;개정 1996.11.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">④<span class=\"b b1\">임용권자<\/span>는 동 처분을 받은 직원이 대기명령 기간중 능력을 회복하였다고 판단되면 복직시켜야 한다.<span class=\"amend\">&lt;개정 1994.5.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "55의3", "title": "직위해제의 효력", "topics": [17], "html": "<div class=\"ln\">직위해제된 경우에는 직원으로서의 신분은 보유하나 직무에는 종사하지 못하며 직위해제 기간은 승진기간 및 승급기간과 경력평정기간 그리고 연가기간 계산에서 제외한다.<span class=\"amend\">&lt;개정 1996.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "55의4", "title": "강임", "topics": [17], "html": "<div class=\"ln\">①<span class=\"b b1\">임용권자<\/span>는 직제 또는 정원의 변경이나 예산의 감소 등으로 인하여 직위가 폐지되거나 하위직위로 변경되어 과원이 된 때 또는 본인이 <span class=\"b b2\">동의<\/span>한 경우에는 소속직원을 강임할 수 있다.<span class=\"amend\">&lt;개정 2003.1.1, 2015.1.1&gt;<\/span><\/div><div class=\"ln\">②제1항의 규정에 의하여 강임된 직원은 상위직급에 결원이 생긴 때에는 본인의 경력과 해당 기관의 인력사정 등을 고려하여 임용할 수 있다. 다만 본인의 <span class=\"b b2\">동의<\/span>에 의한 강임의 경우에는 그러하지 아니하다.<span class=\"amend\">&lt;개정 1998.11.1., 2003.1.1. 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "56", "title": "정년", "topics": [17], "html": "<div class=\"ln\">직원의 정년은 만<span class=\"b b1\">60세<\/span>로 한다. 정년은 만으로 산정하여 1~<span class=\"b b1\">6월<\/span>에 해당될 때에는 <span class=\"b b1\">6월<\/span>말에 7~<span class=\"b b1\">12월<\/span>에 해당될 때에는 <span class=\"b b1\">12월<\/span>말에 자연 퇴직된다.<span class=\"amend\">&lt;개정 2016.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "56의2", "title": "명예퇴직등", "topics": [17], "html": "<div class=\"ln\">①직원으로서 <span class=\"b b1\">20년이상<\/span> 근속한 자가 정년전에 자진하여 퇴직한 경우에는 예산의 범위안에서 명예퇴직수당을 지급할 수 있다.<span class=\"amend\">&lt;신설, 개정 2001.10.23&gt;<\/span><\/div><div class=\"ln\">②직제와 정원의 개폐 또는 예산의 감소등에 의하여 폐직 또는 과원이 되었을 때에 <span class=\"b b1\">20년미만<\/span> 근속한 자가 정년전에 자진하여 퇴직하는 경우에는 예산의 범위안에서 수당을 지급할 수 있다.<span class=\"amend\">&lt;개정 2001.10.23&gt;<\/span><\/div><div class=\"ln\">③제1항의 명예퇴직수당 및 제2항의 수당의 지급범위, 지급액, 지급절차 기타 필요한 사항은 <span class=\"b b1\">회장<\/span>이 별도로 정한다.<span class=\"amend\">&lt;개정 1998.12.28, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">④위 각항의 규정에도 불구하고 재직중 직위해제 또는 정직 이상의 징계처분을 총 <span class=\"b b1\">3회 이상<\/span> 받은 직원은 명예퇴직의 대상으로 할 수 없다.<span class=\"amend\">&lt;신설 2000.10.23, 개정 2002.11.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제7장 징계"}, {"law": "운영규정", "type": "a", "no": "57", "title": "징계사유와 종류", "topics": [19], "html": "<div class=\"ln\">①직원이 다음 각 호의 어느 하나에 해당할 경우에는 징계<span class=\"b b2\">의결<\/span>의 요구를 하여야 하고 동 징계의 <span class=\"b b2\">의결<\/span> 결과에 따라 징계처분을 행하여야 한다.<span class=\"amend\">&lt;개정 1994.5.1. 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 본 운영규정에 위반하여 직원의 신분에 배치되는 행위가 있을 때<\/div><div class=\"ln it\">2. 직무상의 의무에 위반하거나 또는 직무를 태만하였을 때<\/div><div class=\"ln it\">3. 직무의 내외를 불문하고 공직상의 체면 또는 위신을 손상하거나 적십자정신에 반하는 행위가 있을 때<\/div><div class=\"ln\">②제1항의 징계<span class=\"b b2\">의결<\/span>요구는 팀(과)장급 이상에 보직된 <span class=\"b b1\">4급 이상<\/span>의 직원과 팀(과)장급 이상 특정직원은 해당 <span class=\"b b1\">기관장<\/span>이, 비보직 <span class=\"b b1\">4급 이하<\/span> 직원과 비보직 특정직원, 기술직원 및 기능직원은 <span class=\"b b1\">소속기관장<\/span> 또는 해당 <span class=\"b b1\">기관장<\/span>이 관할 징계위원회에 요구하여야 한다. 다만, <span class=\"b b1\">사무총장<\/span>은 직원이 징계사유가 있다고 인정할 때에는 해당 징계위원회에 대하여 그 직원의 징계를 요구할 수 있다.<span class=\"amend\">&lt;개정 1996.4.1, 2005.4.1, 2008.7.1., 2010.9.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">③보통징계위원회가 설치된 기관 및 소속기관의 장은 징계내용이 중대하거나 해당 기관에 설치된 징계위원회에서는 위원회 구성이 안되거나, 공정한 <span class=\"b b2\">의결<\/span>을 못할 우려가 있다고 인정한 때에는 상급기관에 설치된 징계위원회에 징계<span class=\"b b2\">의결<\/span>을 요구할 수 있다.<span class=\"amend\">&lt;신설 1996.4.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\">④징계<span class=\"b b2\">의결<\/span>의 요구는 징계사유가 발생한 날로부터 <span class=\"b b1\">3년<\/span>이 경과한 때에는 이를 행하지 못한다. 다만, 제57조의2 제1항 및 채용비위에 해당하는 경우는 <span class=\"b b1\">5년<\/span>, 성매매·성폭력·성희롱의 경우는 <span class=\"b b1\">10년<\/span>을 경과한 때에는 이를 행하지 못한다.<span class=\"amend\">&lt;신설 1996.4.1, 개정 1998.11.1, 2009.6.15, 2019.1.1., 2020.4.1. 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln\">⑤징계는 중징계인 파면, 해임, 강등, 정직과 경징계인 감봉, 견책으로 구분한다.<span class=\"amend\">&lt;개정 1996.4.1, 2000.10.23, 2004.1.15, 2015.1.1&gt;<\/span><\/div><div class=\"ln\">⑥제2항 및 제3항의 규정에 의한 징계<span class=\"b b2\">의결<\/span>요구시에는 징계사유에 대한 충분한 조사를 행한 후에 입증에 필요한 다음 각 호의 관계 자료를 첨부하여 관할 징계위원회에 제출하여야 하고 중징계 또는 경징계로 구분하여 요구하여야 한다.<span class=\"amend\">&lt;신설 2004.1.15&gt;<\/span><\/div><div class=\"ln it\">1. 징계<span class=\"b b2\">의결<\/span>요구서<\/div><div class=\"ln it\">2. 인사기록카드사본<\/div><div class=\"ln it\">3. 혐의내용을 입증할 수 있는 문서 등 관련 자료<\/div><div class=\"ln it\">4. 혐의내용에 대한 조사기록 또는 수사기록<\/div><div class=\"ln it\">5. 관련 법규 또는 지시문서 등의 발췌문<\/div>"}, {"law": "운영규정", "type": "a", "no": "57의2", "title": "징계부가금", "topics": [19], "html": "<div class=\"ln\">①제57조에 따라 징계<span class=\"b b2\">의결<\/span>을 요구하는 경우 그 징계사유가 금품·향응 수수 및 기타 재산상 이익의 취득·제공, 공금의 횡령‧유용·업무상 배임에 해당하는 경우에는 그 행위로 취득하거나 제공한 금전 또는 재산상 이득의 <span class=\"b b1\">5배 이내<\/span>의 징계부가금 부과 <span class=\"b b2\">의결<\/span>을 징계위원회에 요구하여야 한다.<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">②징계부가금 부과대상, 부과금액 산정, 감경‧조정 등에 관한 세부사항은 ｢국가공무원법｣ 및 ｢공무원 징계령｣ 등 관계 법령을 준용한다.<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조 신설 2026.1.1.]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "58", "title": "징계의 효력", "topics": [19], "html": "<div class=\"ln\">①강등은 1계급 아래로 계급을 내리고, 처분기간 <span class=\"b b1\">3개월<\/span>간은 직무에 종사하지 못하며 그 기간 동안 보수 및 수당을 지급하지 아니한다.<span class=\"amend\">&lt;개정 1996.4.1., 2015.1.1., 2023.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln\">②정직의 기간은 <span class=\"b b1\">1개월 이상<\/span> <span class=\"b b1\">3개월 이하<\/span>로 하고 그 기간중 직원으로서의 신분을 유지하나 직무에 종사하지 못하며 보수 및 수당을 지급하지 아니한다.<span class=\"amend\">&lt;개정 2023.1.1. 2025.1.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln\">③감봉기간은 <span class=\"b b1\">1개월 이상<\/span> <span class=\"b b1\">6개월 이하<\/span>로 하며, <span class=\"b b1\">1회<\/span>(<span class=\"b b1\">1개월<\/span>) 감액은 일 평균임금의 <span class=\"b b1\">2분<\/span>의 1로 하되, 감봉기간 중의 감액총액은 월 평균 임금의 <span class=\"b b1\">10분<\/span>의 1을 초과하지 못한다.<span class=\"amend\">&lt;개정 2017.1.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">⑤견책은 전과에 대하여 훈계하고 회개하게 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "59", "title": "징계위원회의 종류와 관할", "topics": [19], "html": "<div class=\"ln\">①징계위원회는 본사 특별징계위원회, 혈액관리본부 특별징계위원회, 의료원 특별징계위원회, 기관 보통징계위원회 및 소속기관 보통징계위원회로 구분한다.<span class=\"amend\">&lt;개정 2007.4.1, 2021.7.1&gt;<\/span><\/div><div class=\"ln\">②본사 특별징계위원회는 본사에 두며 다음 각 호의 1의 사항을 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>한다.<\/div><div class=\"ln it\">1. 본사 및 지사, 직할기관에서 근무하는 기관장급(<span class=\"b b1\">1급<\/span> 직원은 보직과 무관하게 포함) 직원에 대한 징계<span class=\"amend\">&lt;개정 2002.11.1, 2004.4.1, 2004.11.1, 2007.4.1, 2021.7.1&gt;<\/span><\/div><div class=\"ln it\">2. 제2항 제1호의 <span class=\"b b2\">의결<\/span>에 대한 이의 신청<\/div><div class=\"ln it\">3. 제3항 제1호의 <span class=\"b b2\">의결<\/span>에 대한 이의 신청<span class=\"amend\">&lt;신설 2007.4.1&gt;<\/span><\/div><div class=\"ln it\">4. 본사 및 지사, 직할기관 보통징계위원회 <span class=\"b b2\">의결<\/span>에 대한 이의 신청<span class=\"amend\">&lt;신설 2007.4.1, 개정 2021.7.1.&gt;<\/span><\/div><div class=\"ln it\">5. 관할 보통징계위원회의 <span class=\"b b2\">의결<\/span>에 대해 <span class=\"b b1\">회장<\/span> 또는 징계<span class=\"b b2\">의결<\/span>요구권자가 청구한 재심<span class=\"amend\">&lt;신설 2007.4.1, 개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③혈액관리본부 특별징계위원회 및 의료원 특별징계위원회는 각 해당 기관에 두며, 다음 각 호의 사항을 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>한다.<span class=\"amend\">&lt;신설 2007.4.1, 개정 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 해당 기관 및 소속기관에서 근무하는 기관장급(<span class=\"b b1\">1급<\/span> 직원은 보직과 무관하게 포함) 직원에 대한 징계<span class=\"amend\">&lt;신설 2007.4.1, 개정 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 해당 기관 보통징계위원회 및 소속기관 보통징계위원회 <span class=\"b b2\">의결<\/span>에 대한 이의신청<span class=\"amend\">&lt;신설 2007.4.1, 개정 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 관할 보통징계위원회의 <span class=\"b b2\">의결<\/span>에 대해 <span class=\"b b1\">회장<\/span> 또는 징계<span class=\"b b2\">의결<\/span>요구권자가 청구한 재심<span class=\"amend\">&lt;신설 2007.4.1, 개정 2017.6.3., 2021.7.1., 2025.1.1&gt;<\/span><\/div><div class=\"ln\">④기관 보통징계위원회는 본사, 지사, 직할기관, 혈액관리본부, 의료원에 두며 해당 기관에서 근무하고 있는 팀(실·부·과)장급 이하 직원의 징계에 대해 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>한다. 다만, 혈액관리본부 및 의료원 보통징계위원회는 소속기관에서 근무하는 팀(실·부)장급 직원의 징계에 대해 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>한다. <span class=\"amend\">&lt;신설 2007.4.1, 개정 2008.7.1, 2010.9.1., 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">⑤소속기관 보통징계위원회는 혈액관리본부 소속기관 및 의료원 소속기관에 두며, 해당 소속기관에 근무하고 있는 팀(부)장급 미만 직원의 징계에 대해 <span class=\"b b2\">심의<\/span> <span class=\"b b2\">의결<\/span>한다.<span class=\"amend\">&lt;개정 1998.4.1, 2002.4.1, 2002.11.1, 2005.4.1, 2006.1.1, 2007.4.1, 2008.7.1, 2010.9.1, 2019.1.1., 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln\">⑥제4항과 제5항에도 불구하고, 지사, 직할기관, 병원, 혈액관리본부 소속기관 직원의 성희롱, 성매매, 성폭력 징계는 상급기관 보통징계위원회에서 <span class=\"b b2\">심의<\/span>․<span class=\"b b2\">의결<\/span>한다.<span class=\"amend\">&lt;신설 2019.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div><div class=\"ln\">⑦<span class=\"b b1\">2인이상<\/span>이 관련된 징계사건에서 관련자의 관할 징계위원회가 서로 다른 경우에는 제3항 내지 제4항의 규정에도 불구하고 관련자 중 가장 상급직원이 속하는 관할 징계위원회에서 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>토록 한다. 다만, 관련자에 대한 징계를 분리하여 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>함이 타당하다고 인정될 경우에는 관할 징계위원회의 <span class=\"b b2\">의결<\/span>에 의하여 제3항 내지 제5항의 규정에 의한 관할 징계위원회로 이송할 수 있다.<span class=\"amend\">&lt;신설 2000.1.18, 개정 2002.11.1, 2019.1.1&gt;<\/span><\/div><div class=\"ln\">⑧제2항 내지 제7항에도 불구하고 징계내용이 중대하거나 공정한 <span class=\"b b2\">의결<\/span>이 어렵다고 판단되는 경우 <span class=\"b b1\">회장<\/span>이 정하는 징계위원회에서 관할한다.<span class=\"amend\">&lt;신설 2019.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "60", "title": "징계절차", "topics": [19], "html": "<div class=\"ln\">징계위원회는 징계<span class=\"b b2\">의결<\/span> 요구권자의 요청에 의하여 해당 징계위원장이 소집한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "61", "title": "징계위원회의 구성", "topics": [19], "html": "<div class=\"ln\">①본사 특별징계위원회는 <span class=\"b b1\">사무총장<\/span>을 위원장으로 하고, 기획조정실장, 본사 부서장과 기관장급(혈액관리본부 실·국장, 의료원 부서장 포함) 직원으로 구성한다. 다만, 인사주무부서장이 해당 위원회 안건의 대상자가 되는 경우에는 <span class=\"b b1\">1급<\/span> 일반직원 중에서 그 대리를 위원장이 <span class=\"b b2\">임명<\/span>하고, 제59조 제2항 제1호 내지 제3호에 해당하는 경우에는 <span class=\"b b1\">회장<\/span>이 <span class=\"b b2\">지명<\/span>하는 부<span class=\"b b1\">회장<\/span>이 위원장이 되고 <span class=\"b b1\">사무총장<\/span>을 위원으로 추가할 수 있다.<span class=\"amend\">&lt;개정 1994.5.1, 2004.4.1, 2005.4.1, 2007.4.1, 2012.12.1, 2015.4.1, 2017.4.1, 2017.6.3. 2021.7.1&gt;<\/span><\/div><div class=\"ln\">②혈액관리본부 특별징계위원회는 혈액관리본부장을 위원장으로 하고, 기획관리국장, 혈액관리본부장이 혈액관리본부 부서장 및 소속기관 기관장급(부원장 포함) 직원 중에서 <span class=\"b b2\">지명<\/span>하는 자로 구성하며, 의료원 특별징계위원회는 의료원장을 위원장으로 하고, 병원사업본부장, 의료원장이 소속기관 기관장급(부원장 포함) 직원 중에서 <span class=\"b b2\">지명<\/span>하는 자로 구성한다.<span class=\"amend\">&lt;신설 2007.4.1, 개정 2014.4.1, 2021.7.1&gt;<\/span><\/div><div class=\"ln\">③기관 보통징계위원회는 본사는 기획조정실장, 지사는 지사회장이 <span class=\"b b2\">지명<\/span>하는 지사부<span class=\"b b1\">회장<\/span>, 혈액관리본부는 기획관리국장, 의료원은 병원사업본부장, 기타 기관은 해당 <span class=\"b b1\">기관장<\/span>을 위원장으로 하고, 위원장이 <span class=\"b b2\">지명<\/span>하는 내부 및 외부위원 <span class=\"b b1\">6인<\/span>으로 구성한다.<span class=\"amend\">&lt;개정 1996.11.1, 2000.1.18, 2002.11.1, 2005.4.1, 2007.4.1, 2008.7.1, 2010.9.1, 2014.4.1, 2015.10.1, 2017.4.1, 2017.6.3., 2021.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">④소속기관 보통징계위원회는 해당 <span class=\"b b1\">소속기관장<\/span>을 위원장으로 하고, 위원장이 <span class=\"b b2\">지명<\/span>하는 내부 및 외부위원 <span class=\"b b1\">6인<\/span>으로 구성한다.<span class=\"amend\">&lt;신설 2002.11.1, 개정 2004.11.1, 2005.4.1, 2007.4.1, 2008.7.1, 2010.9.1., 2015.10.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">⑥위원장 유고시에는 위원장이 미리 지정한 위원이 그 직무를 대리한다.<span class=\"amend\">&lt;개정 1996.4.1&gt;<\/span><\/div><div class=\"ln\">⑦제1항 내지 제4항의 규정에 의한 징계위원회 구성 시 외부위원을 포함하여 구성하고, 외부위원의 수는 위원장을 제외한 위원 수의 <span class=\"b b1\">2분<\/span>의 1 이상이어야 한다.<span class=\"amend\">&lt;신설 2015.1.1, 개정 2015.10.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln\">⑧성희롱 또는 성폭력과 관련한 징계사건을 처리하기 위해 징계위원회를 구성하는 경우 피해자와 같은 성별의 위원이 위원장을 제외한 위원의 <span class=\"b b1\">3분<\/span>의 1 이상 포함되도록 하여야 한다.<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "61의2", "title": "제척 및 기피", "topics": [19], "html": "<div class=\"ln\">①징계위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 징계 등 사건의 <span class=\"b b2\">심의<\/span>‧<span class=\"b b2\">의결<\/span>에서 제척되어야 한다.<span class=\"amend\">&lt;개정 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">1. 징계 등 혐의자와 친족 관계에 있거나 있었던 경우<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">2. 징계 등 혐의자의 직근 상급자이거나 징계 사유가 발생한 기간 동안 직근 상급자였던 경우<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln it\">3. 해당 징계 등 사건의 사유와 관계가 있는 경우<span class=\"amend\">&lt;신설 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">②징계 등 혐의자는 위원장이나 위원 중에서 불공정한 <span class=\"b b2\">의결<\/span>을 할 우려가 있다고 인정할 만한 상당한 사유가 있을 때에는 그 사실을 서면으로 밝히고 기피를 신청할 수 있다.<\/div><div class=\"ln\">③징계위원회의 위원장 또는 위원은 제1항에 해당하면 스스로 해당 징계등 사건의 <span class=\"b b2\">심의<\/span>‧<span class=\"b b2\">의결<\/span>을 회피하여야 하며, 제2항에 해당하면 회피할 수 있다.<\/div><div class=\"ln\">④제2항의 기피신청이 있을 때에는 재적위원 <span class=\"b b1\">과반수<\/span>의 출석과 출석위원 <span class=\"b b1\">과반수<\/span>의 찬성으로 기피 여부를 <span class=\"b b2\">의결<\/span>한다. 이 경우 기피신청을 받은 사람은 그 <span class=\"b b2\">의결<\/span>에 참여하지 못한다.<\/div><div class=\"ln\">⑤제1항 내지 제3항까지의 사유로 징계위원회 구성이 어려운 때에는 해당 징계위원회가 설치된 기관의 장에게 임시위원의 <span class=\"b b2\">임명<\/span>을 요청하여야 한다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2021.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "62", "title": "진술기회 부여 등", "topics": [19], "html": "<div class=\"ln\">징계위원회는 <span class=\"b b2\">의결<\/span>을 하기 전에 징계혐의자 본인에게 진술의 기회를 부여하여야 하며, 필요에 따라 관계자의 출석을 요구할 수 있다.<span class=\"amend\">&lt;개정 1996.4.1. 2013.12.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "63", "title": "징계위원회의 의결", "topics": [19], "html": "<div class=\"ln\">①각 징계위원회는 비공개회의로 하고 위원장외 <span class=\"b b1\">3인이상<\/span>의 출석이 있어야 하며 출석위원 <span class=\"b b1\">과반수<\/span>의 찬성으로 <span class=\"b b2\">의결<\/span>하며 위원장도 표결권을 가진다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\">②<span class=\"b b1\">회장<\/span> 또는 징계<span class=\"b b2\">의결<\/span>요구권자는 보통징계위원회의 <span class=\"b b2\">의결<\/span>이 정당하지 아니하다고 인정 할 때에는 징계<span class=\"b b2\">의결<\/span> 등을 통보받은 날부터 <span class=\"b b1\">15일 이내<\/span>에 이를 해당 특별징계위원회에 재심을 청구할 수 있다.<span class=\"amend\">&lt;개정 2003.1.1, 2007.4.1, 2017.4.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "63의2", "title": "징계의 양정", "topics": [19], "html": "<div class=\"ln\">①징계위원회가 징계사건을 <span class=\"b b2\">의결<\/span>함에 있어서는 징계혐의자의 소행·근무성적·공적·개전의 정, 징계요구의 내용 기타 정상을 참작하여야 한다.<\/div><div class=\"ln\">②전항의 규정에 의한 징계<span class=\"b b2\">의결<\/span>에 있어서의 양정에 관한 세부사항은 시행규칙으로 정한다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2008.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "64", "title": "의결의 통고", "topics": [19], "html": "<div class=\"ln\">①징계위원회가 <span class=\"b b2\">의결<\/span>을 하였을 때에는 지체없이 <span class=\"b b2\">의결<\/span>서의 주문과 이유를 명기하여 징계<span class=\"b b2\">의결<\/span> 요구권자, 징계처분권자 및 <span class=\"b b1\">소속기관장<\/span>에게 <span class=\"b b2\">통고<\/span>하여야 한다.<span class=\"amend\">&lt;개정 1996.4.1&gt;<\/span><\/div><div class=\"ln\">②징계위원회는 징계사유를 <span class=\"b b2\">심의<\/span>한 결과 해당 직원이 사의 재산에 손해를 입힌 것이 인정될 때에는 이를 변상시키거나 법령과 규정에 따라 조치하여야 한다.<span class=\"amend\">&lt;개정 1996.4.1. 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "65", "title": "징계처분", "topics": [19], "html": "<div class=\"ln\">①징계처분은 징계위원회의 <span class=\"b b2\">의결<\/span>을 거쳐 징계위원회가 설치된 기관 또는 소속기관의 장이 행한다. 다만, 파면, 해임, 강등은 <span class=\"b b1\">임용권자<\/span>가 행한다.<span class=\"amend\">&lt;신설 1996.4.1, 개정 2004.1.15, 2015.1.1&gt;<\/span><\/div><div class=\"ln\">②징계처분권자는 징계<span class=\"b b2\">의결<\/span>서를 받은 날로부터 <span class=\"b b1\">15일 이내<\/span>에 이를 집행하여야 한다.<span class=\"amend\">&lt;신설 1996.4.1&gt;<\/span><\/div><div class=\"ln\">⑤징계의 감경에 대한 세부사항은 ｢공무원 징계령 시행규칙｣을 준용하며, 그 세부사항은 <span class=\"b b1\">회장<\/span>이 시행규칙으로 따로 정한다.<span class=\"amend\">&lt;신설 2024.1.1., 개정 2026.1.1&gt;<\/span><\/div><div class=\"ln\">⑥징계위원회는 제12조에 따른 승진제한 기간에 발생한 비위로 다시 징계<span class=\"b b2\">의결<\/span>이 요구된 경우에는 그 비위에 해당하는 징계보다 2단계 위의 징계로 <span class=\"b b2\">의결<\/span>할 수 있고, 승진제한기간이 끝난 날로부터 <span class=\"b b1\">1년 이내<\/span>에 발생한 비위로 징계<span class=\"b b2\">의결<\/span>이 요구된 경우에는 1단계 위의 징계로 <span class=\"b b2\">의결<\/span>할 수 있다.<span class=\"amend\">&lt;신설 2020.6.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1998.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "65의2", "title": "징계 등 처분기록의 말소", "topics": [19], "html": "<div class=\"ln\">①<span class=\"b b1\">회장<\/span>은 징계 처분을 받은 직·용원이 다음의 기간이 경과한  때에는 직원의 인사기록카드에 등재된 징계처분기록을 말소하여야 한다. 다만, 징계처분을 받고 그 집행이 종료된 날로부터 기간이 경과하기 전에 다른 징계처분을 받은 경우 각각의 징계처분에 대한 해당기간을 합산한 기간이 경과하여야 한다.<span class=\"amend\">&lt;개정 2015.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">강등 : <span class=\"b b1\">9년<\/span>    정직 : <span class=\"b b1\">7년<\/span>    감봉 : <span class=\"b b1\">5년<\/span>    견책 : <span class=\"b b1\">3년<\/span><\/div><div class=\"ln\">②<span class=\"b b1\">회장<\/span>은 직위해제처분을 받은 직·용원이 직위해제처분의 종료일로부터 <span class=\"b b1\">2년<\/span>이 경과한 때에는 직원의 인사기록카드에 등재된 직위해제처분의 기록을 말소하여야 한다. 다만, 직위해제처분을 받고 그 집행이 종료된 날로부터 <span class=\"b b1\">2년<\/span>이 경과하기 전에 다른 직위해제처분을 받은 경우 각 직위해제처분마다 <span class=\"b b1\">2년<\/span>을 가산한 기간이 경과하여야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③<span class=\"b b1\">회장<\/span>은 제1항 및 제2항의 규정에 의한 말소 이외에 다른 법규에서 정하는 경우 또는 법원판결 및 행정소송, 노동위원회의 결정 등으로 징계 또는 직위해제가 무효·취소로 판결 등이 확정된 경우 처분기간을 포함하여 말소하여야 한다.<span class=\"amend\">&lt;개정 2017.6.3., 2023.4.1.&gt;<\/span><\/div><div class=\"ln\">④<span class=\"b b1\">회장<\/span>은 제1항 내지 제3항 규정에 의한 말소 이외에 기록말소심사위원회의 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>을 거쳐 말소할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">⑤징계처분과 직위해제처분 및 기타 인사기록 말소방법과 절차 등에 관한 세부사항은 시행규칙 등으로 이를 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3, 2018.4.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2008.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "65의3", "title": "기록말소심사위원회 기능 및 구성", "topics": [19], "html": "<div class=\"ln\">①제65의2제4항의 규정에 의거한 기록말소에 관한 적정성을 심사하기 위하여 기록말소심사위원회(이하 “위원회”라 한다)를 둔다.<span class=\"amend\">&lt;개정 2022.4.1&gt;<\/span><\/div><div class=\"ln\">②전항의 규정에 의한 위원회는 <span class=\"b b1\">회장<\/span>이 <span class=\"b b2\">위촉<\/span> 또는 <span class=\"b b2\">임명<\/span>하는 위원장 <span class=\"b b1\">1인<\/span>을 포함한 <span class=\"b b1\">5인<\/span>의 위원으로 구성한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">1. 부<span class=\"b b1\">회장<\/span> <span class=\"b b1\">1인<\/span><span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">2. 중앙위원 <span class=\"b b1\">2인<\/span><\/div><div class=\"ln it\">3. <span class=\"b b1\">사무총장<\/span><\/div><div class=\"ln it\">4. 기관장급 직원 <span class=\"b b1\">1인<\/span><\/div><div class=\"ln\">③위원회의 위원장은 부<span class=\"b b1\">회장<\/span>이 된다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">④위원회는 위원장이 소집하며 위원<span class=\"b b1\">과반수<\/span>의 출석으로 개의하고 출석위원 <span class=\"b b1\">과반수<\/span>의 찬성으로 <span class=\"b b2\">의결<\/span>한다.<\/div><div class=\"ln\">⑤기록말소대상자는 위원회의 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>을 거쳐 <span class=\"b b1\">회장<\/span>이 확정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2008.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "66", "title": "이의신청", "topics": [19], "html": "<div class=\"ln\">①직권면직, 직권휴직, 징계처분, 징계부가금 등 본인의 의사에 반하여 불리한 처분에 대한 이의신청은 처분통보를 받은 날로 부터 <span class=\"b b1\">15일 이내<\/span>에 서면으로 해당 특별징계위원회에 제출할 수 있다.<span class=\"amend\">&lt;개정 2007.4.1., 2026.1.1&gt;<\/span><\/div><div class=\"ln\">②이의신청을 받은 특별징계위원회가 설치되어 있는 기관의 장은 이의신청서를 접수하였을 때에는 지체없이 이를 심사결정하여 <span class=\"b b1\">30일이내<\/span>에 본인 및 해당 <span class=\"b b1\">기관장<\/span>에게 <span class=\"b b2\">통고<\/span>하여야 한다.<span class=\"amend\">&lt;개정 2007.4.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "67", "title": "시말서", "topics": [19], "html": "<div class=\"ln\">징계를 요하지 않는 경미한 과실에 대하여는 그때마다 해당 <span class=\"b b1\">기관장<\/span> 또는 <span class=\"b b1\">소속기관장<\/span>은 전말서 또는 시말서를 받는다. 단, 시말서를 연 <span class=\"b b1\">3회 이상<\/span> 받았을 때는 그 정상에 따라 징계의 대상이 된다.<span class=\"amend\">&lt;개정 2022.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1, 2000.10.23]<\/span><\/div>"}], "byeol": [["인재개발원", "강원특별자치도 원주시"], ["서울특별시지사", "서울특별시"], ["전남광주통합특별시지사", "전남광주통합특별시"], ["부산광역시지사", "부산광역시"], ["대구광역시지사", "대구광역시"], ["인천광역시지사", "인천광역시"], ["울산광역시지사", "울산광역시"], ["경기도지사  "fbaf9d22", "t": 10, "q": "사무총장은 누가 임명하고 어떤 승인이 필요한가?", "a": "회장이 임명, 중앙위원회의 승인", "src": "조직법 제19조③ · 정관 제24조③", "alt": []}, {"id": "e44f655e", "t": 10, "q": "적십자 표장 무단 사용자에 대한 벌칙은?", "a": "1천만원 이하의 벌금", "src": "조직법 제28조", "alt": ["1천만원이하의벌금", "1천만원"]}, {"id": "79ed34e2", "t": 10, "q": "적십자 유사명칭 무단 사용자에 대한 제재는?", "a": "500만원 이하의 과태료", "src": "조직법 제29조①", "alt": ["500만원이하의과태료", "500만원"]}, {"id": "7fbd8bec", "t": 10, "q": "금지되는 적십자 표장의 모양은?", "a": "흰색 바탕에 붉은 희랍식 십자", "src": "조직법 제25조", "alt": []}, {"id": "20c865da", "t": 10, "q": "금지되는 유사명칭 예시 2가지는?", "a": "적십자, 제네바적십자", "src": "조직법 제26조", "alt": []}, {"id": "75373698", "t": 10, "q": "표장·명칭을 쓸 수 있는 자 3종은?", "a": "적십자사, 군 의료기관, 적십자사로부터 사용승인을 받은 자", "src": "조직법 제25조·제26조", "alt": []}, {"id": "823ccd39", "t": 10, "q": "정관 제1조의 목적에서 '다음 각 호'는 무엇인가?", "a": "국제적십자운동기본원칙 (인도·공평·중립·독립·자발적 봉사·단일·보편)", "src": "정관 제1조", "alt": []}, {"id": "c5fda1e4", "t": 10, "q": "사무총장은 누구의 명을 받아 사무를 관장하는가?", "a": "회장", "src": "조직법 제19조② · 정관 제24조②", "alt": ["회장"]}, {"id": "8080878c", "t": 7, "q": "2026.9.1 개정 별표에서 광주광역시·전라남도지사는 어떤 명칭의 지사로 바뀌었나? (소재지 포함)", "a": "전남광주통합특별시지사 (소재지: 전남광주통합특별시)", "src": "정관 별표 (2026.9.1 개정)", "alt": ["전남광주통합특별시지사", "전남광주통합특별시"]}, {"id": "3d712a40", "t": 6, "q": "별표 기준(2026.9.1) 두 개 이상 광역자치단체를 통합 관할하여 지역명을 병기하는 지사는?", "a": "대전광역시·세종특별자치시지사", "src": "정관 제25조② · 별표", "alt": ["대전세종지사", "대전광역시세종특별자치시지사"]}, {"id": "46780992", "t": 11, "q": "운영규정은 누구에게 적용하지 않는가? (예외 포함)", "a": "본사 및 지사의 각 위원과 임원 (단, 계약직원은 달리 정하지 않는 한 준용)", "src": "운영규정 제2조", "alt": ["위원과 임원", "각 위원과 임원"]}, {"id": "96eedb32", "t": 11, "q": "직원의 직렬과 직종 구분은 어디에 정해져 있는가?", "a": "별표 제1호", "src": "운영규정 제3조", "alt": ["별표1호", "별표 제1호"]}, {"id": "27d081dd", "t": 11, "q": "인사위원회는 무엇을 위해 어디에 구성하고, 운영 사항은 누가 정하는가?", "a": "직원 및 고용원의 효율적 인사관리와 고충심사 처리를 위해 각 기관 및 소속기관에 구성 · 운영은 회장이 시행규칙으로", "src": "운영규정 제7조", "alt": []}, {"id": "1829d534", "t": 11, "q": "사무총장은 인사에 관하여 관하 기관에 대해 무엇을 할 수 있는가?", "a": "인사에 관한 기록의 보고를 받을 수 있고 사무감사를 행할 수 있다", "src": "운영규정 제6조", "alt": []}, {"id": "87049fee", "t": 11, "q": "“직위”와 “보직”의 정의는?", "a": "직위 = 1인의 직원에 부여할 수 있는 직무와 책임 · 보직 = 직원에게 직위를 부여함", "src": "운영규정 제5조①1~2호", "alt": []}, {"id": "39f155de", "t": 11, "q": "“강임”의 정의는?", "a": "동일한 직종 내에서 하위의 계급에 임명하는 것", "src": "운영규정 제5조③", "alt": ["동일한 직종 내에서 하위의 계급에 임명"]}, {"id": "0c22a9af", "t": 11, "q": "“전보”의 정의는?", "a": "동일한 직종 및 계급 내에서 직무의 책임도가 유사한 보직으로의 변경", "src": "운영규정 제5조④", "alt": []}, {"id": "6abb1bda", "t": 11, "q": "“전직”의 정의는?", "a": "직종을 달리하는 임명", "src": "운영규정 제5조⑦", "alt": ["직종을 달리하는 임명"]}, {"id": "5b880b19", "t": 11, "q": "“임용”에 포함되는 것을 말하라.", "a": "신규채용, 승진, 전직, 전보, 겸임, 파견, 강임, 휴직, 직위해제, 정직, 강등, 복직, 면직, 해임 및 파면", "src": "운영규정 제5조⑤", "alt": []}, {"id": "2b0b4cd0", "t": 11, "q": "“직렬”과 “직종”의 정의는?", "a": "직렬 = 직무의 성질이 유사하고 책임과 곤란성의 정도가 상이한 직종의 군 · 직종 = 동일한 직렬 내에서 담당분야가 동일 또는 유사한 직무의 군", "src": "운영규정 제5조⑩~⑪", "alt": []}, {"id": "704973d4", "t": 11, "q": "“기관장”과 “소속기관장”은 각각 누구를 말하는가?", "a": "기관장 = 각 지사회장, 의료원장, 본사 직할기관장, 혈액관리본부장 · 소속기관장 = 지사 및 혈액관리본부 소속기관의 장, 병원장", "src": "운영규정 제5조⑫~⑬", "alt": []}, {"id": "a20a2546", "t": 11, "q": "“계약직원”의 정의는?", "a": "계약형태와 관계없이 기간의 정함이 있는 직원", "src": "운영규정 제5조⑭", "alt": []}, {"id": "a39b8e90", "t": 11, "q": "“무기계약직원”의 정의는?", "a": "계약직원으로 2년을 초과 근무하여 기간제법에 따라 기간의 정함이 없는 근로자로 간주되어 임용절차를 거쳐 임용된 직원 또는 무기계약직원 신규채용(전환채용 포함) 절차를 거쳐 임용된 직원", "src": "운영규정 제5조⑮", "alt": []}, {"id": "3bb6c9d3", "t": 11, "q": "“시간선택제직원”의 정의는?", "a": "주 40시간, 1일 8시간인 통상근로자의 근무시간보다 짧게 근무하는 직원", "src": "운영규정 제5조⑯", "alt": []}, {"id": "0325b237", "t": 11, "q": "“채용형 인턴직원”의 정의는?", "a": "공개경쟁을 거쳐 선발되어 일정기간 근무 후 평가를 통해 정규직 직원으로 전환할 수 있는 인턴직원", "src": "운영규정 제5조⑰", "alt": []}, {"id": "d135a143", "t": 11, "q": "직원의 임용은 누가 하는가(원칙)?", "a": "회장", "src": "운영규정 제18조", "alt": ["회장"]}, {"id": "86844c0a", "t": 11, "q": "본사 부서장·직할기관장·혈액관리본부장·지사 사무처장·의료원장 등은 누구의 제청으로 누가 임용하는가?", "a": "사무총장의 제청으로 회장이 임용", "src": "운영규정 제18조2호", "alt": []}, {"id": "73f275c4", "t": 11, "q": "병원장은 누구의 제청으로 회장이 임용하는가?", "a": "의료원장의 제청", "src": "운영규정 제18조2호", "alt": ["의료원장"]}, {"id": "a202e455", "t": 11, "q": "기관장급을 제외한 일반·전문직 2~3급 직원의 임용권은 누가 행사하는가?", "a": "사무총장", "src": "운영규정 제18조의2①1호", "alt": ["사무총장"]}, {"id": "99417a17", "t": 11, "q": "특정직원, 4급 이하 일반직원·전문직원, 기술직원, 기능직원, 고용원의 임용권은 누가 행사하는가?", "a": "해당 기관장 (본사는 사무총장)", "src": "운영규정 제18조의2①2호", "alt": []}, {"id": "5d39a8e8", "t": 11, "q": "지사 직원의 정기승급 발령권자는?", "a": "지사회장", "src": "운영규정 제18조의2①6호나목", "alt": ["지사회장"]}, {"id": "2bed82e8", "t": 11, "q": "별정직원은 회장 취임 후 얼마 이내에 재신임을 받지 못하면 퇴임하는가?", "a": "1개월 이내", "src": "운영규정 제18조의3", "alt": ["1개월"]}, {"id": "10cd4479", "t": 11, "q": "회장은 위임한 임용내용이 어떠할 때 시정을 지시할 수 있는가?", "a": "위법하거나 현저히 부당하다고 인정될 때", "src": "운영규정 제18조의2①8호", "alt": []}, {"id": "8dc2186f", "t": 11, "q": "임용권 위임에도 불구하고 인사운영상 필요시(기관 간 인사교류 등) 임용권을 행사할 수 있는 사람은?", "a": "회장이 전행 가능(제18조의2②) · 정원조정·순환보직·기관 간 인사교류는 사무총장(①7호)", "src": "운영규정 제18조의2②", "alt": []}, {"id": "2da07677", "t": 11, "q": "신규임용자의 자격·경력 기준표와 경력산출기준은 각각 어디에 있는가?", "a": "자격·경력 기준 = 별표 제3호~제5호 · 경력산출기준 = 별표 제6호", "src": "운영규정 제19조①~②", "alt": []}, {"id": "25f2d2e9", "t": 12, "q": "직원 임용의 원칙(근거)은?", "a": "임용권자가 전형성적 또는 고시성적, 근무성적, 기타 능력의 실증에 의하여 행한다", "src": "운영규정 제8조", "alt": []}, {"id": "4b973e1e", "t": 12, "q": "결원보충의 방법 4가지는?", "a": "신규채용, 승진, 강임, 전보", "src": "운영규정 제9조", "alt": []}, {"id": "a5738156", "t": 12, "q": "신규채용은 어떤 방법으로 하는가?", "a": "공개경쟁에 의한 서류심사 및 면접시험 (직종에 따라 직무능력검사·필기·실기시험 등 추가 가능)", "src": "운영규정 제10조①", "alt": []}, {"id": "14c53847", "t": 12, "q": "공개경쟁 외에 특별채용은 언제 할 수 있는가?", "a": "법령 등에 규정된 경우", "src": "운영규정 제10조③", "alt": []}, {"id": "fe6a4606", "t": 12, "q": "전직시험의 방법은?", "a": "서류심사, 필기시험 및 면접시험 (필요에 따라 실기시험 등 추가 가능)", "src": "운영규정 제10조의2①", "alt": []}, {"id": "12712455", "t": 12, "q": "채용연령 제한에 관한 원칙은?", "a": "원칙적으로 제한할 수 없다 (불가피한 경우에 회장이 제한 가능)", "src": "운영규정 제10조의3①", "alt": []}, {"id": "96377efc", "t": 12, "q": "계약직원은 누가 채용하며 채용기간은?", "a": "기관장과 소속기관장이 예산과 정원의 범위 내에서 채용 · 2년 이내", "src": "운영규정 제10조의4①~②", "alt": []}, {"id": "d0711ee6", "t": 12, "q": "계약직원의 채용기간에 적용되지 않는 규정은?", "a": "제56조(정년)", "src": "운영규정 제10조의4②", "alt": []}, {"id": "87c03ae9", "t": 12, "q": "일반·특정직·전문직 팀(과)장급 이상 직원을 계약직으로 채용할 때 필요한 것은?", "a": "회장의 승인", "src": "운영규정 제10조의4③", "alt": ["회장 승인"]}, {"id": "1cc1a3da", "t": 12, "q": "개방형 직위 상한: 본사 부서장·팀장 각각 몇 직위까지인가?", "a": "부서장 2직위, 팀장 3직위", "src": "운영규정 제10조의5①", "alt": []}, {"id": "bfba5d67", "t": 12, "q": "혈액관리본부와 의료원의 개방형 직위는?", "a": "혈액관리본부: 본부장 직위와 부서장 1직위 · 의료원: 의료원장 직위와 팀장 1직위", "src": "운영규정 제10조의5①", "alt": []}, {"id": "8570fc24", "t": 12, "q": "개방형직위에 임용되는 외부전문가의 신분은?", "a": "계약직원", "src": "운영규정 제10조의5③", "alt": ["계약직원"]}, {"id": "336e7643", "t": 12, "q": "무기계약직원 임용의 임용권자와 절차·자격 결정자는?", "a": "임용: 기관장과 소속기관장 · 절차·자격 등: 회장이 별도로 정함", "src": "운영규정 제10조의6", "alt": []}, {"id": "d5f57975", "t": 12, "q": "시간선택제직원 전환·채용은 누가 하는가?", "a": "기관장과 소속기관장 (유연근무의 일환으로 필요할 경우)", "src": "운영규정 제10조의7", "alt": []}, {"id": "faeb4740", "t": 12, "q": "경력직원은 누가 몇 급으로 채용하며 대상 3가지는?", "a": "회장이 3급 내지 6급으로 · 전문자격 소지자 / 해당분야 박사학위 소지자 / 해당분야 경력이 있는 자", "src": "운영규정 제10조의8", "alt": []}, {"id": "37c671d3", "t": 12, "q": "고시의 실시 원칙은?", "a": "공고에 의한 일반공개로 하고 각 계급 및 직무의 종류별로 구분하여 실시", "src": "운영규정 제13조", "alt": []}, {"id": "ffd5a6e4", "t": 12, "q": "고시의 방법과 시행 규정자는?", "a": "필기시험, 실기시험, 면접, 서류심사 및 신체검사 · 시행은 회장이 시행규칙으로", "src": "운영규정 제14조①", "alt": []}, {"id": "5fef1a81", "t": 12, "q": "일반직 2급 이상 및 부장급 이상 특정·전문직원의 전형·고시위원은 누가 임명 또는 위촉하는가?", "a": "사무총장", "src": "운영규정 제15조1호", "alt": ["사무총장"]}, {"id": "8b9814ae", "t": 12, "q": "일반직 3~7급 및 팀(과)장급 특정·전문직원의 전형·고시위원은 누가 임명하며 예외는?", "a": "해당 기관장 · 예외: 4급 승진전형고시의 필기시험 출제·채점위원과 본사직원은 사무총장", "src": "운영규정 제15조2호", "alt": []}, {"id": "6e433162", "t": 12, "q": "신규채용 시 문제출제와 면접위원 원칙은?", "a": "출제: 외부전문가 위촉 또는 전문업체 위탁 · 면접위원: 외부위원 포함", "src": "운영규정 제15조4호", "alt": []}, {"id": "f91c196d", "t": 12, "q": "합격자 결정 기준과 불합격 점수는?", "a": "최고득점자 순 · 매과목 40% 미만 또는 전과목 평균 60% 미만이면 불합격", "src": "운영규정 제16조", "alt": []}, {"id": "a1c88578", "t": 12, "q": "신규 임용 시 수습기간은? 예외로 허용되는 임용은?", "a": "3개월 · 제10조의5 개방형 직위는 예외 가능", "src": "운영규정 제23조①", "alt": []}, {"id": "50ec2924", "t": 12, "q": "수습기간 없이 임용하는 4가지는?", "a": "특정직원의 의무직 / 채용형 인턴직원 / 계약직원 / 무기계약직원", "src": "운영규정 제23조②", "alt": []}, {"id": "8feb410a", "t": 12, "q": "신규임용자과정은 언제까지 수료해야 하는가?", "a": "수습기간 내 (못 한 경우 임용 후 9개월 이내)", "src": "운영규정 제23조의2①", "alt": []}, {"id": "93aa9772", "t": 12, "q": "전직 임용된 일반·전문직원의 신규임용자과정 수료 기한은?", "a": "전직 임용 후 1년 이내", "src": "운영규정 제23조의2③", "alt": []}, {"id": "4fd60022", "t": 12, "q": "의무직원이 반드시 수료해야 하는 과정은?", "a": "기본연수 중 관리자 심화과정(II)", "src": "운영규정 제23조의2②", "alt": []}, {"id": "eae81f47", "t": 12, "q": "신규임용자과정 미수료자의 승급·승진 효과는?", "a": "승급은 수료일 후 최초 도래하는 승급일자에 · 차상 계급으로 승진 불가", "src": "운영규정 제23조의3②~③", "alt": []}, {"id": "874b32f6", "t": 12, "q": "수습직원을 직원으로 임용하지 않을 수 있는 사유는?", "a": "신규임용자과정을 정당한 사유 없이 미수료 / 연수태도 불량 / 능력·건강·적성 등이 부적당하다고 인정될 때", "src": "운영규정 제23조의3①", "alt": []}, {"id": "ef0d33b1", "t": 12, "q": "본사 및 기관 대기를 시킬 수 있는 사람과 세부사항 결정자는?", "a": "임용권자 · 세부사항은 회장이 따로 정한다", "src": "운영규정 제23조의5", "alt": []}, {"id": "abbc7b15", "t": 13, "q": "승진임용 기준: 1~3급 / 4급 / 5급 이하는 각각 어떻게?", "a": "1~3급: 능력과 경력 등 고려 · 4급: 승진고시를 거쳐야 함 · 5급 이하: 필요하다고 인정할 때 승진고시 병용 가능", "src": "운영규정 제11조①", "alt": []}, {"id": "7f5558ba", "t": 13, "q": "5급 근속승진 요건은?", "a": "해당 계급 15년 이상 근무 + 근무성적 우수 → 승진고시·전형 없이 4급으로 (이 경우 그 다음 계급으로만 승진 가능)", "src": "운영규정 제11조②", "alt": []}, {"id": "02ee627c", "t": 13, "q": "특별승진은 누가 어떤 직원에게 할 수 있는가?", "a": "회장 · 사 발전에 지대한 공로가 있는 직원", "src": "운영규정 제11조④", "alt": []}, {"id": "2176bbf8", "t": 13, "q": "승진소요 최저연수: 2급 / 3~4급 / 5급 / 6급 / 7급", "a": "2급 3년 · 3~4급 5년 · 5급 4년 · 6급 3년 · 7급 1년", "src": "운영규정 제11조의2①1~5호", "alt": ["3 5 4 3 1"]}, {"id": "e76be1c2", "t": 13, "q": "기술직원 승진소요 최저연수는?", "a": "기술2급 6년 이상 · 기술3급 1년 이상", "src": "운영규정 제11조의2①6~7호", "alt": []}, {"id": "ea2287d9", "t": 13, "q": "승진소요 최저연수에 포함하지 않는 기간은?", "a": "휴직, 직위해제, 징계 처분기간, 승진 임용의 제한기간", "src": "운영규정 제11조의2②", "alt": []}, {"id": "f0e11a2b", "t": 13, "q": "휴직 중에도 승진소요 최저연수에 포함되는 휴직은?", "a": "업무상 질병·부상 휴직, 법률의 의무 수행 휴직, 육아휴직(일정 범위), 가족돌봄휴직, 제53조②1호 휴직", "src": "운영규정 : "f55cbdc5", "t": 19, "q": "징계의결 요구 시 첨부하는 관계 자료는?", "a": "징계의결요구서 / 인사기록카드사본 / 혐의내용 입증 문서 / 조사기록 또는 수사기록 / 관련 법규·지시문서 발췌문", "src": "운영규정 제57조⑥", "alt": []}, {"id": "cef4c9f6", "t": 19, "q": "징계의결 요구권자: 팀(과)장급 이상 보직 4급 이상 직원은 누가 요구하는가?", "a": "해당 기관장 (비보직 4급 이하 등은 소속기관장 또는 해당 기관장) · 사무총장도 직접 요구 가능", "src": "운영규정 제57조②", "alt": []}, {"id": "7a8b4bcd", "t": 19, "q": "징계부가금은 무엇의 몇 배 이내인가?", "a": "금품·향응 수수, 공금 횡령·유용, 업무상 배임 등으로 취득·제공한 금전 또는 재산상 이득의 5배 이내", "src": "운영규정 제57조의2①", "alt": ["5배"]}, {"id": "8e01b5e5", "t": 19, "q": "강등의 효력은?", "a": "1계급 아래로 내리고, 처분기간 3개월간 직무에 종사하지 못하며 보수·수당 미지급", "src": "운영규정 제58조①", "alt": []}, {"id": "eaa48ded", "t": 19, "q": "정직의 기간과 효력은?", "a": "1개월 이상 3개월 이하 · 신분 유지, 직무 종사 불가, 보수·수당 미지급", "src": "운영규정 제58조②", "alt": []}, {"id": "b1025c00", "t": 19, "q": "감봉의 기간과 감액 한도는?", "a": "1개월 이상 6개월 이하 · 1회 감액 일 평균임금의 2분의 1 · 감봉기간 중 감액총액은 월 평균임금의 10분의 1 초과 불가", "src": "운영규정 제58조③", "alt": []}, {"id": "4ebd020c", "t": 19, "q": "견책은?", "a": "전과에 대하여 훈계하고 회개하게 한다", "src": "운영규정 제58조⑤", "alt": []}, {"id": "e466025d", "t": 19, "q": "징계위원회의 종류 5가지는?", "a": "본사 특별 / 혈액관리본부 특별 / 의료원 특별 / 기관 보통 / 소속기관 보통 징계위원회", "src": "운영규정 제59조①", "alt": []}, {"id": "42abbe15", "t": 19, "q": "본사 특별징계위원회가 심의·의결하는 사항은?", "a": "본사·지사·직할기관 기관장급(1급은 보직 무관) 징계 / 특별·보통위 의결에 대한 이의신청 / 보통위 의결에 대해 회장·징계의결요구권자가 청구한 재심", "src": "운영규정 제59조②", "alt": []}, {"id": "eb2403ca", "t": 19, "q": "기관 보통징계위원회는 어디에 두며 누구의 징계를 다루는가?", "a": "본사·지사·직할기관·혈액관리본부·의료원 · 해당 기관 팀(실·부·과)장급 이하 직원", "src": "운영규정 제59조④", "alt": []}, {"id": "ec8bc4f3", "t": 19, "q": "소속기관 보통징계위원회는 누구의 징계를 다루는가?", "a": "해당 소속기관의 팀(부)장급 미만 직원", "src": "운영규정 제59조⑤", "alt": []}, {"id": "6e7baaea", "t": 19, "q": "지사·직할기관·병원·혈액관리본부 소속기관 직원의 성희롱·성매매·성폭력 징계는 어디서 하는가?", "a": "상급기관 보통징계위원회", "src": "운영규정 제59조⑥", "alt": []}, {"id": "ea2e7a4e", "t": 19, "q": "2인 이상 관련 징계사건에서 관할이 서로 다르면?", "a": "관련자 중 가장 상급직원이 속하는 관할 징계위원회에서 심의·의결", "src": "운영규정 제59조⑦", "alt": []}, {"id": "ed5d6e49", "t": 19, "q": "징계위원회는 누가 소집하는가?", "a": "징계의결 요구권자의 요청에 의해 해당 징계위원장이 소집", "src": "운영규정 제60조", "alt": []}, {"id": "8b228b73", "t": 19, "q": "본사 특별징계위원회 위원장은?", "a": "사무총장 (혈액관리본부 특별: 혈액관리본부장 · 의료원 특별: 의료원장)", "src": "운영규정 제61조①~②", "alt": ["사무총장"]}, {"id": "74a64962", "t": 19, "q": "기관 보통징계위원회의 위원장은 기관별로?", "a": "본사: 기획조정실장 · 지사: 지사회장이 지명하는 지사부회장 · 혈액관리본부: 기획관리국장 · 의료원: 병원사업본부장 · 기타: 해당 기관장", "src": "운영규정 제61조③", "alt": []}, {"id": "f70cf287", "t": 19, "q": "보통징계위원회 위원 구성은?", "a": "위원장이 지명하는 내부 및 외부위원 6인", "src": "운영규정 제61조③~④", "alt": ["6인"]}, {"id": "d5a5cb6a", "t": 19, "q": "징계위원회의 외부위원 수는?", "a": "위원장을 제외한 위원 수의 2분의 1 이상", "src": "운영규정 제61조⑦", "alt": []}, {"id": "4395e2dd", "t": 19, "q": "성희롱·성폭력 징계위원회의 위원 성별 구성은?", "a": "피해자와 같은 성별의 위원이 위원장을 제외한 위원의 3분의 1 이상", "src": "운영규정 제61조⑧", "alt": []}, {"id": "e2609f65", "t": 19, "q": "징계위원이 제척되는 사유 3가지는?", "a": "징계 등 혐의자와 친족 관계 / 혐의자의 직근 상급자(이었던 경우 포함) / 해당 사건의 사유와 관계가 있는 경우", "src": "운영규정 제61조의2①", "alt": []}, {"id": "4f040ed4", "t": 19, "q": "기피신청은 어떻게 하고 어떻게 의결하는가?", "a": "서면으로 사실을 밝혀 신청 · 재적위원 과반수 출석, 출석위원 과반수 찬성 · 신청받은 사람은 의결 불참", "src": "운영규정 제61조의2②·④", "alt": []}, {"id": "ed1b21a1", "t": 19, "q": "징계위원회는 의결 전 무엇을 부여해야 하는가?", "a": "징계혐의자 본인에게 진술의 기회 (필요시 관계자 출석 요구)", "src": "운영규정 제62조", "alt": []}, {"id": "c75fb608", "t": 19, "q": "징계위원회의 개의·의결 정족수는?", "a": "비공개 · 위원장 외 3인 이상 출석 · 출석위원 과반수 찬성 · 위원장도 표결권 있음", "src": "운영규정 제63조①", "alt": []}, {"id": "4ae677e2", "t": 19, "q": "보통징계위 의결에 대한 재심 청구권자·기한·청구처는?", "a": "회장 또는 징계의결요구권자 · 통보받은 날부터 15일 이내 · 해당 특별징계위원회", "src": "운영규정 제63조②", "alt": ["15일"]}, {"id": "1fc47b2a", "t": 19, "q": "징계양정에서 참작할 사항은?", "a": "징계혐의자의 소행·근무성적·공적·개전의 정, 징계요구의 내용 기타 정상", "src": "운영규정 제63조의2①", "alt": []}, {"id": "4d10b663", "t": 19, "q": "징계 의결 통고 상대와 손해 처리는?", "a": "징계의결 요구권자, 징계처분권자 및 소속기관장에게 지체없이 통고 · 사 재산 손해 인정 시 변상 또는 법령·규정에 따라 조치", "src": "운영규정 제64조", "alt": []}, {"id": "d1b6dd99", "t": 19, "q": "징계처분은 누가 하며, 파면·해임·강등은?", "a": "징계위원회가 설치된 기관 또는 소속기관의 장 · 파면·해임·강등은 임용권자", "src": "운영규정 제65조①", "alt": []}, {"id": "0c09fbcd", "t": 19, "q": "징계 3>\n<div class=\"tw blankable\"><table>\n<tr><th><\/th><th>전국대의원총회<\/th><th>중앙위원회<\/th><th>운영위원회<\/th><\/tr>\n<tr><th>구성<\/th><td>회장 + 대의원: 대통령 [[8명]] · 국회 [[12명]] · 시·도지사 각 [[2명]] · 지사 선출 각 [[6명]]<\/td><td>회장 포함 [[28명]] = 총회 선출 [[19명]] + 장관 [[8명]]<\/td><td>회장 포함 [[7명]] = 중앙위 호선 [[4명]] + [[행정안전부장관]]·[[보건복지부장관]]<\/td><\/tr>\n<tr><th>임기<\/th><td>[[3년]]<\/td><td>선출직 [[3년]]<\/td><td>(별도 임기 없음 · 호선 위원)<\/td><\/tr>\n<tr><th>기능<\/th><td>조직법 [[3호]] / 정관 [[5호]]: 중앙위원 선출, 사업계획·예산 [[승인]], 중요사항 [[심의]], 정책사항 심의, 해산 [[승인]]<\/td><td>조직법 [[9호]] / 정관 [[12호]]: 정관 변경, 임원 선출, 예산·결산, 부동산·차입, 해산·잔여재산 …<br>모두 [[심의·의결]]<\/td><td>중앙위 [[위임]]·[[긴급]]사항, 운영규정 제정·개정, 예산·결산 [[사전 심의]] → 결과는 중앙위에 [[보고]]<\/td><\/tr>\n<tr><th>소집<\/th><td>매년 [[1회]] 이상 회장 / 요구 [[3분의 1]] 이상<\/td><td>매년 [[1회]] 이상 회장 / 요구 [[3분의 1]] 이상 / 통지 [[7일 전]] 문서<\/td><td>필요한 때 [[회장]]이 소집<\/td><\/tr>\n<tr><th>정족수<\/th><td colspan=\"3\">모두 동일: 재적 [[과반수]] 출석 개의, 출석 [[과반수]] 찬성 의결 (조직법 제13조②, 정관 제14조)<\/td><\/tr>\n<\/table><\/div>\n\n<h3>2. 누가 승인·인가·인준하나?<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>용어<\/th><th>대상<\/th><th>주체<\/th><th>근거<\/th><\/tr>\n<tr><td rowspan=\"2\"><b>인가<\/b><\/td><td>정관 변경 / 기본재산 취득·처분 / 잔여재산 처분<\/td><td>[[보건복지부장관]]<\/td><td>조직법 5②·22의2, 정관 43·50③<\/td><\/tr>\n<tr><td>(정관 변경 의결: 중앙위 출석 [[3분의 2]] 찬성)<\/td><td>[[중앙위원회]]<\/td><td>정관 48<\/td><\/tr>\n<tr><td rowspan=\"2\"><b>인준<\/b><\/td><td>회장 (중앙위 선출 후)<\/td><td>[[대통령]]<\/td><td>조직법 15③, 정관 17②<\/td><\/tr>\n<tr><td>지사회장 선출 / 상임위원 선거 결과<\/td><td>[[회장]]<\/td><td>정관 30②·26②<\/td><\/tr>\n<tr><td rowspan=\"8\"><b>승인<\/b><\/td><td>사업계획·예산안<\/td><td>[[전국대의원총회]]<\/td><td>조직법 10·21<\/td><\/tr>\n<tr><td>적십자사 해산<\/td><td>[[전국대의원총회]]<\/td><td>정관 5·50②<\/td><\/tr>\n<tr><td>사무총장 임명<\/td><td>[[중앙위원회]]<\/td><td>조직법 19③, 정관 24③<\/td><\/tr>\n<tr><td>명예고문 위촉<\/td><td>[[중앙위원회]]<\/td><td>정관 16<\/td><\/tr>\n<tr><td>임원 상근(특수업무)<\/td><td>[[운영위원회]]<\/td><td>정관 17④<\/td><\/tr>\n<tr><td>지사명예고문 위촉<\/td><td>[[지사 상임위원회]]<\/td><td>정관 31②<\/td><\/tr>\n<tr><td>국가·지자체 보조 사업계획<\/td><td>[[주무부장관
