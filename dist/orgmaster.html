n· 원생활근거지(연고지) : 제주서귀포시안덕면\n※상기명시된내용외고려하지않음\n· 2026년4월급여지급명세서\n지급내역\n금\n액\n봉급\n㉠\n업무수당\n㉡\n직급보조비\n㉢\n위험수당\n0원\n정기상여금\n㉣\n※일반직원및전문직원봉급표(일부발췌)\n(2026. 4. 1.기준, 단위:원)\n호봉\n계급\n1\n2\n3\n4\n7급\n1,683,000\n1,707,000\n1,733,000\n1,759,000\n가. ㉠에들어갈봉급은1,707,000원이다.\n나. ㉡에들어갈업무수당은80,000원이다.\n다. ㉢에들어갈직급보조비는85,000원이다.\n라. ㉣에들어갈정기상여금은936,000원이다.\n\n① 가(X) 나(X) 다(O) 라(X)\n\n② 가(X) 나(O) 다(X) 라(X)\n\n③ 가(O) 나(X) 다(X) 라(O)\n\n④ 가(O) 나(O) 다(O) 라(O)","a":"①","ex":""},{"id":"2026-18","grp":"2026","no":18,"kind":"mc","area":"","q":"재무운영규정에관한사항이다. 다음【보기】를읽고,\n세입과세출의회계연도소속구분에관한가∼마의\n설명중옳은것을모두고른것은?\n【보기】\n가. 회비수입의제비용은그사업이속하는연도\n또는전년도\n나. 보수, 여비, 수수료등은그지급을하여야할\n사실이발생한날이속하는연도\n다. 부동산\n및\n동산의\n매각대금, 임대료\n등은\n그것을수입하기로된일자가속하는연도\n라. 공사제조비, 물건구입대가, 운임, 보조비등으\n로서상대방의행위가완료된후지급하는것은\n그지급이확정된일자가속하는연도\n마. 예금및유가증권의이자는그이자를수입\n하기로약정된일자가속하는연도\n\n① 가, 다, 라\n\n② 가, 나, 라, 마\n\n③ 나, 다, 라, 마\n\n④ 가, 나, 다, 라, 마","a":"④","ex":""},{"id":"2026-19","grp":"2026","no":19,"kind":"mc","area":"","q":"재무운영규정에\n관한\n사항이다.\n다음【보기】의\n설명중옳은것은모두몇개인가?\n【보기】\n가. 각기관의장은예산이정한각정책사업의\n금액을본사의승인없이전용할수있다.\n나. 소속기관장은전용한금액을집행후그사유와\n실정을명시하여해당기관장에게보고함으로써\n각항의금액을전용할수있다.\n다. 예산성립후에생긴사유로예산에변경을가할\n필요가\n있을\n때는추가경정예산을\n편성해야\n하며전용과는달리심의·의결·승인절차가요구\n된다.\n라. 예산집행상필요에의하여중앙위원회의의결을\n얻었을때에는예산이정한각장은상호이용\n할수있다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개","a":"②","ex":""},{"id":"2026-20","grp":"2026","no":20,"kind":"mc","area":"","q":"재무운영규정에관한사항이다. 다음【보기】에관한\n설명으로가장적절하지않은것은?\n【보기】\n재난구호,\n평시구호,\n특수구호,\n국제구호\n또는\n구호장비등의구호사업개량을목적으로적립\n하는금액\n\n① 위적립금을사용하고자할때에는본사운영\n위원회의사전승인을받아야한다.\n\n② 지사에서사업비가총3억원인구호사업을위해\n사용할경우본사의승인을받아우선사용하고\n매년도결산시운영위원회에보고하여야한다.\n\n③ 구호사업을위한사업비등에충당하기위하여\n세출예산에계상할수있다.\n\n④ 위적립금이용에있어회장은기관의재정상태를\n평가하여기관상호간에일정기간자금을이용할\n수있다.","a":"①","ex":""},{"id":"2026-21","grp":"2026","no":21,"kind":"mc","area":"","q":"여비운영규정에관한사항이다. 여비계산및지급\n원칙에관한다음의설명중가장적절한것은?\n\n① 근무지가대전광역시에소재하고거주지가부산\n광역시인직원이거주지로부터서울병원으로고속\n철도를이용하여출장을가는경우, 부산광역시에서\n서울특별시까지의여비를지급한다.\n\n② 여행일수가7일이내인출장중인직원이이동\n중에신분변동이발생하면사유발생후최초\n목적지에도달한날이후에는변동된신분을기\n준으로구분하여계산한다.\n\n③ 국내여비의결제는기관법인카드를사용하는것을\n원칙으로하며, 운임과숙박비는출장지의구분없이\n항상실제법인카드로사용한실비전액을지급\n한다.\n\n④ 여비는통상의경로와방법에의하여계산하며,\n사무형편상부득이한경우조정하여지급할수\n있다.","a":"④","ex":""},{"id":"2026-22","grp":"2026","no":22,"kind":"mc","area":"","q":"감사운영규정에관한사항이다. 다음밑줄친㉮∼㉳\n중옳지않은것은몇개인가?\n감사부서의장인박중립감사실장은㉮2026년1월5일\n2026년도연간감사계획을수립하였다. 박중립실장은\n연간감사계획에따라2026년2월9일부터2월13일까지\nA지사종합감사를시작으로2026년도의감사활동을\n개시하도록계획하고, ㉯1월19일A지사에감사대상과\n감사범위, 감사반편성등의사항을구두로통보하\n였다.\n2024년종합감사결과우수기관으로선정된A지사의\n종합감사는2년만에실시하는것으로, A지사의조직,\n인사, 예산등업무전반의타당성등을점검하는\n동시에, ㉰A지사회계관계직원김인도과장의비위\n행위에\n대한\n제보내용의\n사실관계를\n확인하고자\n종합감사주기가도래하기전에특별히감사를실시\n할필요가있었다.\n㉱박중립실장은A지사의종합감사를위한감사반\n편성시, 감사실직원4명과본사총무팀직원1명을\n임의로편성하였으며, 감사실이공평팀장을감사\n반장으로지정하였다. 박중립실장이A지사에감사\n실시를구두로통보하였기에, ㉲이공평팀장은감사\n실시당일감사명령서를A지사회장에게제시하지\n않았다.\nA지사\n종합감사결과김인도과장의비위행위는\n사실로확인되었다. 이에㉳박중립실장은A지사\n회장에게김인도과장의징계및변상조치를요구하\n였다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개","a":"②","ex":""},{"id":"2026-23","grp":"2026","no":23,"kind":"mc","area":"","q":"국제인도법에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 국가가 인도주의적 근거로 충돌 당사자에 무력 개입할 권리를 인정한다.\n\n② 국제적 또는 비국제적 성격에 상관없이 특별히 무력충돌 상황에서 적용되며, ‘전쟁법’ 및 ‘무력충돌법’과 동의어로 사용될 수 있다.\n\n③ 무력충돌 희생자를 보호하고 지원하며, 전쟁의 수단과 방법을 제한하는데 목적이 있다.\n\n④ 마르텐스 조항은 일반적으로 국제인도법에서 명시적으로 금지하지 않았다고 해서 자동적으로 허용되는 것은 아니라고 해석된다.","a":"①","ex":"<b>해설<\/b>:<br>• <b>① (적절하지 않음)<\/b>: 국가가 무력을 행사할 수 있는 조건과 권리를 규율하는 것은 개전법(Jus ad Bellum, 유엔 헌장 제2조 4항·제51조)이고, 국제인도법은 교전법(Jus in Bello)으로서 개전법과 완전히 독립적으로 작동한다. (근거: IHL Q&amp;A Q02, 원문 p.8~p.10)<br>• ②: 국제인도법은 무력충돌의 국제적·비국제적 성격에 상관없이 적용되며, 실무상 ‘전쟁법(Law of War)’ 또는 ‘무력충돌법(LOAC)’으로도 불린다. (근거: IHL Q&amp;A Q01, 원문 p.4~p.7)<br>• ③: 국제인도법의 핵심 목적은 무력충돌 희생자의 보호·지원과 전쟁의 수단·방법 제한이다. (근거: IHL Q&amp;A Q01, 원문 p.4~p.7)<br>• ④: 마르텐스 조항의 해석 — <b>근거 미확인<\/b> (시험 범위 자료에 해당 문장이 없음)."},{"id":"2026-24","grp":"2026","no":24,"kind":"mc","area":"","q":"국제인도법에 따른 국제적 무력충돌과 비국제적 무력충돌에 관한 사항이다. 다음 중 가장 적절한 것은?\n\n① 국제적 무력충돌에는 1949년 4개 제네바협약과 1977년 제1추가의정서만 적용된다.\n\n② 1977년 제2추가의정서는 비국가 무장단체 간의 무력 충돌에는 적용되지 않는다.\n\n③ 비국제적 무력충돌 시 충돌당사국은 비국가 무장단체 구성원의 행위에 대하여 국내법에 따라 기소할 수 없다.\n\n④ 비국제적 무력충돌에 관한 정의는 1977년 제2추가의정서가 1949년 4개 제네바협약 공통 제3조보다 넓은 의미를 가진다.","a":"②","ex":"<b>해설<\/b>:<br>• <b>② (적절)<\/b>: 1977년 제2추가의정서는 체약국 영토 내에서 정부군과 영토 통제력을 가진 반군 간의 충돌에만 적용되고, 무장단체 상호 간의 충돌에는 적용되지 않는다(이 경우 공통 제3조가 적용된다). (근거: IHL Q&amp;A Q05, 원문 p.18~p.21)<br>• ①: 국제적 무력충돌에는 제네바 4개 협약과 제1추가의정서 외에 관습국제인도법도 적용되므로 ‘~만 적용된다’는 틀렸다. (근거: IHL Q&amp;A Q04·Q05, 원문 p.14~p.21)<br>• ③: 비국제적 무력충돌에서 체포된 반군 구성원에게는 조약상 전쟁포로 지위가 자동 부여되지 않으므로 국내법상 반란죄 등으로 처벌·기소할 수 있다. (근거: IHL Q&amp;A Q10, 원문 p.42~p.45)<br>• ④: 제2추가의정서는 공통 제3조보다 적용 문턱(Threshold)이 높아 적용 범위가 더 좁다. (근거: IHL Q&amp;A Q05, 원문 p.18~p.21)"},{"id":"2026-25","grp":"2026","no":25,"kind":"mc","area":"","q":"국제인도법 조약에 관한 사항이다. 다음【보기】중 채택 연도가 오래된 순서대로 나열한 것은?\n\n【보기】  \n가. 아동권리협약  \n나. 집속탄 금지 협약  \n다. 국제형사재판소에 관한 로마규정  \n라. 대인지뢰 사용, 비축, 생산, 이전 금지 및 폐기에 대한 협약  \n마. 무력충돌 시 문화재 보호에 관한 1954년 헤이그협약에 대한 제2의정서\n\n① 가 - 마 - 나 - 다 - 라\n\n② 라 - 다 - 마 - 가 - 나\n\n③ 가 - 라 - 다 - 마 - 나\n\n④ 라 - 다 - 가 - 나 - 마","a":"③","ex":"<b>해설 조약 채택 연도<\/b>:<br>• 가. 아동권리협약: <b>1989년<\/b><br>• 라. 대인지뢰 금지 협약(오타와 협약): <b>1997년<\/b><br>• 다. 국제형사재판소 로마규정: <b>1998년<\/b><br>• 마. 1954 헤이그협약 제2의정서: <b>1999년<\/b><br>• 나. 집속탄 금지 협약: <b>2008년<\/b><br>→ 오래된 순서는 가 - 라 - 다 - 마 - 나 이므로 정답은 ③.<br>(근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` 조약 채택 연도표 / IHL Q&amp;A Q12, 원문 p.50~p.54)"},{"id":"2026-26","grp":"2026","no":26,"kind":"mc","area":"","q":"국제인도법에 관한 사항이다. 다음【보기】중 적대행위를 규정한 규칙에 관한 내용으로 옳지 않은 것은 몇 개인가?\n\n【보기】  \n가. 1977년 제1추가의정서에 명시적 근거가 있으며, 국제적 및 비국제적 무력 충돌에 대한 관습국제법에도 존재한다.  \n나. 특정재래식무기 협약 제4의정서는 영구적 실명을 유발하기 위해 특별히 고안된 레이저 무기의 사용 및 이전을 금지한다.  \n다. 무차별 공격의 금지는 구별의 원칙에서 파생되었다.  \n라. 군사 목표물은 가능한 한 민간인 대중 및 민간 물자 주변에 위치해서는 안되며, 군사 작전 수행 시 기타 필요한 모든 사전 경고 조치가 취해져야 한다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개","a":"①","ex":"<b>해설<\/b>: 가~라 4개 보기가 모두 옳으므로 옳지 않은 것은 <b>0개<\/b>(정답 ①).<br>• 가 (옳음): 적대행위 규율 규칙은 제1추가의정서(제48·51·57조)에 명시적 근거가 있고, 관습국제인도법은 국제적·비국제적 무력충돌 모두에 대해 구별·비례성 등 대다수 규칙이 동일하게 적용된다고 본다. (근거: IHL Q&amp;A Q04, 원문 p.14~p.17 / Q11, 원문 p.46~p.49)<br>• 나 (옳음): CCW 제4의정서(1995년 채택)는 영구 실명 레이저 무기의 사용 및 이전을 전면 금지한다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• 다 (옳음): 무차별적 효과를 갖는 공격의 금지는 구별의 원칙에서 파생된다. (근거: IHL Q&amp;A Q11·Q12, 원문 p.46~p.54)<br>• 라 (옳음): 방어 측 예방조치로 민간인·민간 시설을 군사목표물 근처로부터 이동시켜야 하고, 상황이 허용하는 한 민간인 주민에게 유효한 사전 경고를 발령해야 한다. (근거: IHL Q&amp;A Q11, 원문 p.46~p.49)"},{"id":"2026-27","grp":"2026","no":27,"kind":"mc","area":"","q":"국제인도법에서 규제하는 전쟁의 수단과 방법에 관한 사항이다. 다음【보기】의 설명 중 옳지 않은 것은 몇 개인가?\n\n【보기】  \n가. 국제사법재판소는 국가 존립을 위협하는 극단적인 상황에서조차 핵무기 사용이 적법한지 여부에 대해서는 결정을 내리지 못했다.  \n나. 국제사회는 제2차 세계대전 이후 화학무기와 생물학무기의 사용을 금지하기 시작했다.  \n다. 특정재래식무기 협약 제2의정서는 네이팜탄의 사용을 규제한다.  \n라. 특정재래식무기 협약 제1의정서는 엑스레이로 인간의 몸에서 탐지 불가능한 파편으로 상해를 입히는 것을 주요 효과로 하는 모든 무기의 사용을 금지한다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개","a":"③","ex":"<b>해설<\/b>: 옳지 않은 설명은 나, 다 <b>2개<\/b>(정답 ③).<br>• 가 (옳음): 국제사법재판소(ICJ)는 1996년 핵무기 사용의 적법성에 관한 권고적 의견에서 국가 존립이 걸린 극단적 자위 상황에 대해서는 결론을 내리지 않았다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• <b>나 (옳지 않음)<\/b>: 화학무기·생물무기의 전시 사용 금지는 제2차 세계대전 <b>이전<\/b>인 1925년 제네바 가스 의정서에서 시작되었다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• <b>다 (옳지 않음)<\/b>: CCW 제2의정서는 지뢰·부비트랩 및 기타 장치의 사용을 제한하며, 네이팜탄 등 소이무기 규제는 제3의정서이다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• 라 (옳음): CCW 제1의정서는 엑스선으로 탐지되지 않는 파편 무기를 금지한다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)"},{"id":"2026-28","grp":"2026","no":28,"kind":"mc","area":"","q":"국제인도법 이행과 관련한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 이익보호국은 적국에서 충돌 당사자와 그 국민의 이익을 보호하기 위해 임명된 중립국이며, 국제기구는 이익보호국을 대신할 수 없다.\n\n② 국가는 평시와 무력충돌 시 모두 국제인도법이 완전히 준수되도록 보장하기 위하여 예방, 감시, 억제 등 법적·실무적 조치를 취할 의무가 있다.\n\n③ 국제인도주의사실조사위원회는 제네바 제협약과 제1추가의정서의 중대한 위반 혐의에 대해 심문할 수 있으며, 공식 권한은 국제적 무력충돌 상황에만 적용된다.\n\n④ 국가는 국제인도법이 준수되도록 보장하기 위한 예방적 조치로 군 내 법률자문관을 임명한다.","a":"①","ex":"<b>해설<\/b>:<br>• <b>① (적절하지 않음)<\/b>: 이익보호국은 조약 준수를 감시하기 위해 지정된 중립국이지만, 현실적으로 지정이 어려울 경우 <b>ICRC가 그 역할을 대행(Substitute)<\/b>한다. 따라서 국제기구가 대신할 수 없다는 서술은 틀렸다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87)<br>• ②: 체약국은 공통 제1조의 ‘존중 및 존중 보장의 의무’를 지며, 평시에도 보급·교육 등 이행 의무를 부담한다. (근거: IHL Q&amp;A Q08, 원문 p.31~p.34 / Q19, 원문 p.84~p.87)<br>• ③: 국제인도조사위원회(IHFFC)는 제1추가의정서 제90조에 의해 설립된 상설 공식 사실조사 기구로 중대한 위반 혐의의 사실관계를 조사한다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87) 공식 권한이 국제적 무력충돌에 한정되는지에 관한 서술은 <b>근거 미확인<\/b>이나, 정답표는 본 선지를 적절한 것으로 처리하였다.<br>• ④: 사전 예방 조치로 군 사령관에게 법률고문(법률자문관)을 배치한다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87)"},{"id":"2026-29","grp":"2026","no":29,"kind":"mc","area":"","q":"국제적십자운동대표자회의에관한사항이다. 다음\n중가장적절하지않은것은?\n\n① 각국적십자사의3분의1, ICRC, IFRC 또는상치\n위원회의요청이있을경우개최된다.\n\n② 가까운장래에승인받을것으로예상되는적십자사를\n옵서버로참가시킬수있다.\n\n③ 출석하여투표하는구성원과반수의찬성을얻어\n앙리뒤낭메달규정을개정할수있다.\n\n④ 각국적십자사, ICRC 및IFRC의대표단으로구성된다.","a":"③","ex":"<b>해설<\/b>: 규약 제14조 제4항에 따라 대표자회의에서 앙리뒤낭 메달 규정을 개정하려면 출석하여 투표하는 구성원 <b>3분의 2 이상<\/b>의 찬성을 얻어야 함(과반수 찬성 X)."},{"id":"2026-30","grp":"2026","no":30,"kind":"mc","area":"","q":"국제인도법과 국제인권법에 관한 사항이다. 다음【보기】의 설명 중 옳은 것은 몇 개인가?\n\n【보기】  \n가. 국제적 무력 충돌을 규율하는 국제인도법의 역외 적용은 논란의 대상이 되지 않으나, 무력사용에 관한 인권 규범의 역외 적용에 대한 인권 판례법은 아직 확립되지 않았다.  \n나. 국제인도법은 전투원과 민간인을 구분하는 반면, 국제인권법은 피보호자의 범주를 명시하고 있지 않다.  \n다. 국제인도법은 무력충돌 상황에서만 적용된다. 반면, 국제인권법은 국가의 존립을 위협하는 공적인 위기 상황 시 정부의 특정 의무를 해제시킬 수 있으나, 생명권, 고문의 금지 등 일부 인권 의무는 해제될 수 없다.  \n라. 국제인도법은 무력충돌 당사자인 국가와 비국가 무장단체를 모두 구속하나, 국제인권법은 국가만 구속한다. 다만, 국가처럼 행동할 수 있는 권한이 있는 비국가 무장단체의 경우 인권에 대한 책임이 인정될 수 있다.  \n마. 국제인도법은 적대행위 시 민간인 및 민간 물자에 대한 모든 폭력 행위 및 무차별적인 공격을 금지하나, 국제인권법은 충돌 당사자들 간의 적대행위가 아닌 법집행 시 무력 사용 방식을 규제한다.\n\n① 2개\n\n② 3개\n\n③ 4개\n\n④ 5개","a":"④","ex":"<b>해설<\/b>: 【보기】는 가~마 <b>5개<\/b>이고 5개 모두 옳으므로 정답은 ④(5개)이다.<br>• 나 (옳음): 국제인도법은 전투원과 민간인을 엄격히 구별하나, 국제인권법은 피보호자 범주를 별도로 구분하지 않고 모든 인간을 대상으로 한다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 다 (옳음): 국제인도법은 오직 무력충돌 상황에서만 적용되고, 국제인권법은 국가비상사태 시 일부 권리의 유예가 허용되지만 생명권·고문 금지 등 비이탈 권리는 해제될 수 없다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 라 (옳음): 국제인도법은 국가·비국가 무장단체·개인을 모두 구속하고, 국제인권법은 원칙적으로 국가가 부담하되 예외적으로 비국가 무장단체의 인권 책임이 인정될 수 있다. (근거: IHL Q&amp;A Q08, 원문 p.31~p.34 / Q09, 원문 p.35~p.41)<br>• 마 (옳음): 국제인도법은 적대행위를 규제하고, 국제인권법은 법집행(치안유지) 차원의 무력 사용 방식을 규제한다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 가: 역외 적용에 관한 인권 판례법의 확립 여부는 <b>근거 미확인<\/b>이나, 정답표는 본 보기를 옳은 설명으로 처리하였다."},{"id":"2026-31","grp":"2026","no":31,"kind":"mc","area":"","q":"국제인도법의 포로의 대우에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 1949년 제네바 제3협약에 근거해 보호되어야 하며, 포로의 억류는 처벌이 아니라 이들이 앞으로 충돌에 가담하는 것을 막기 위한 수단이다.\n\n② 교전 당사국은 권한 내의 모든 포로에 대하여 중앙심인국에 통보하고 이들의 신원과 관련된 수집 가능한 모든 정보를 제공해야 한다.\n\n③ 구금 당국은 전쟁범죄를 범한 포로를 기소할 수 있다.\n\n④ 적극적인 적대행위가 종료된 후 포로는 지체 없이 석방되어 본국으로 송환되어야 한다.","a":"②","ex":"<b>해설<\/b>:<br>• <b>② (적절하지 않음)<\/b>: 교전 당사국이 직접 통보하는 상대는 중앙심인국(중앙추적국, CTA)이 아니다. 체약국은 제네바 제3협약 제122조에 따라 자국 내에 <b>국내정보국(NIB)<\/b>을 의무적으로 설치하고, 국내정보국이 포로의 명부와 정보를 수집하여 전달한다. <b>중앙추적국(중앙심인국, CTA)<\/b>은 ICRC가 관장하며 중립국에 설치된다. (근거: IHL Q&amp;A Q14, 원문 p.59~p.63)<br>• ①: 포로의 억류는 처벌이 아니라 적대행위 재가담을 방지하기 위한 예방적·행정적 격리 조치이다. (근거: IHL Q&amp;A Q07, 원문 p.26~p.30 / Q10, 원문 p.42~p.45)<br>• ③: 체약국은 중대한 위반을 저지른 혐의자를 자국 법원에서 기소하거나 관련국으로 인도해야 할 의무를 부담한다(인도 또는 기소). (근거: IHL Q&amp;A Q21, 원문 p.93~p.96)<br>• ④: 유효한 적대행위가 종료되면 포로는 지체 없이 석방·본국 송환되어야 한다. (근거: IHL Q&amp;A Q10, 원문 p.42~p.45)"},{"id":"2026-32","grp":"2026","no":32,"kind":"mc","area":"","q":"국제인도법의 문화재 보호에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 1954년 문화재보호에 대한 헤이그협약은 청색과 흰색의 방패로 재산을 표시할 것을 장려하였다.\n\n② 1907년 헤이그협약과 1977년 제1추가의정서 및 제2추가의정서에 법적 근거가 있다.\n\n③ 1954년 헤이그협약에 대한 제2의정서는 긴급한 군사적 필요가 있더라도 인류의 문화적 또는 정신적 유산의 일부를 구성하는 문화재에 대한 공격을 금지한다.\n\n④ 점령국은 피점령지로부터의 문화재 불법 유출을 방지하고 불법 유출된 문화재를 피점령지의 권한 있는 기관에 반환해야 한다.","a":"③","ex":"<b>해설<\/b>:<br>• <b>③ (적절하지 않음)<\/b>: 1999년 채택된 1954 헤이그협약 제2의정서는 문화재 보호를 강화하면서 <b>군사적 필요 예외를 엄격화<\/b>한 것이지 예외를 완전히 배제한 것이 아니다. 따라서 긴급한 군사적 필요가 있는 경우에도 언제나 공격이 금지된다는 서술은 틀렸다. (근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` — ‘1999년 1954 헤이그협약 제2의정서: 문화재 보호 강화, 군사적 필요 예외 엄격화’)<br>• ①: 1954년 헤이그 문화재보호협약은 청색과 흰색의 방패(푸른 방패, Blue Shield) 표장을 사용한다. (근거: IHL Q&amp;A Q17, 원문 p.72~p.79)<br>• ②: 1907년 헤이그협약 및 1977년 제1·제2추가의정서상의 문화재 보호 근거 조문은 <b>근거 미확인<\/b> (시험 범위 자료에 조문 명시가 없음).<br>• ④: 점령지 문화재의 불법 유출 방지 및 반환 의무는 <b>근거 미확인<\/b> (시험 범위 자료에 해당 문장이 없음)."},{"id":"2026-34","grp":"2026","no":34,"kind":"sa","area":"감사운영규정 (감사인력의 지원)","q":"감사운영규정에관한사항이다. □에들어갈단어를\n순서대로쓰시오.\n제10조(감사인력의\n지원)\n감사인력이\n부족하거나\n감사내용이고도의전문지식\n또는실무경험이\n필요하다고\n인정되는\n경우에는\n㉮(□□□),\n㉯(□□)\n및\n㉰(□□)\n기타\n사항을\n참작하여\n해당감사사항에대한감사를효율적으로수행\n할수있는직원및외부전문가를활용할수\n있다.\n제11조(중앙위원회) ①(생략)\n②중앙위원회는회장을포함한28명의위원으로\n구성하며, 위원은다음각호의사람이된다.\n1. 전국대의원총회에서선출하는사람19명\n2.\n㉮(□□□□□)장관,\n교육부장관,\n외교부장관,\n통일부장관,\n㉯(□□□)장관,\n국방부장관,\n행정\n안전부장관, 보건복지부장관\n③∼④(생략)","a":"㉮ 전문성, ㉯ 경력, ㉰ 자질","ex":""},{"id":"2026-35","grp":"2026","no":35,"kind":"sa","area":"직원운영규정 (제척 및 기피)","q":"직원운영규정에관한사항이다. □에들어갈단어를\n순서대로쓰시오.\n제61조의2(제척및기피) ①징계위원회의위원이\n다음각호의어느하나에해당하는경우에는\n해당징계등사건의심의‧의결에서제척되어야\n한다.\n1. 징계등혐의자와㉮(□□□□)에있거나있었던\n경우\n2. 징계등혐의자의직근상급자이거나징계사유가\n㉯(□□)한기간동안직근상급자였던경우\n3. 해당징계등사건의사유와㉰(□□)(이)가있는\n경우\n②～⑤(생략)","a":"㉮ 친족 관계, ㉯ 발생, ㉰ 관계","ex":""},{"id":"2026-36","grp":"2026","no":36,"kind":"sa","area":"직원보수운영규정 (보수 계산 및 감액)","q":"직원보수운영규정에관한사항이다. □에들어갈\n단어를순서대로쓰시오.\n제41조(규정개정시보수의계산)「직원보수운영\n규정」개정으로인하여새로이지급할보수는\n개정운영규정의㉮(□□□)부터이를계산한다.\n제43조(보수등의감액지급) ①직원의㉯(□□)에\n있어1회㉰(□□)(은)는일평균임금의2분의1,\n총액이월평균임금의10분의1을초과하지\n못한다.\n②～⑤(생략)","a":"㉮ 시행일, ㉯ 감급, ㉰ 감액","ex":""},{"id":"2026-37","grp":"2026","no":37,"kind":"sa","area":"조직법 및 재무운영규정 (예산 및 결산 기한)","q":"다음은적십자사의사업계획, 예산및결산절차에\n관한설명이다. 조직법및재무운영규정의관련\n규정에부합하도록□에알맞은숫자를순서대로\n쓰시오. (단, 정부의회계연도는1월1일부터12월\n31일까지로한다.)\n· 적십자사가작성한2027년도사업계획및예산\n안의보건복지부장관제출기한은㉮(□□□□)년\n◍◍월◍◍일이다.\n· 2026년도세입세출결산의운영위원회의심의와\n중앙위원회의의결기한은◍◍◍◍년㉯(□□)월\n◍◍일이다.\n· 각기관의장이작성한2026년도세입세출의결산\n보고안,\n계속비결산보고서의본사제출기한은\n◍◍◍◍년◍◍월㉰(□□)일이다.","a":"㉮ 2026, ㉯ 03, ㉰ 10","ex":""},{"id":"2026-38","grp":"2026","no":38,"kind":"sa","area":"인사관리시행규칙 (징계 감경 불가 사유)","q":"인사관리시행규칙에관한사항이다. □에들어갈\n단어를순서대로쓰시오.\n제24조의4(징계양정의기준) ①∼②(생략)\n③제2항에도불구하고징계사유가다음각호의\n어느하나에해당하는경우에는해당징계를감경\n할수없다.\n1. ｢직원운영규정｣제57조의2제1항어느하나에\n해당하는비위\n1의2. ｢직원운영규정｣제57조의2제1항의어느하나에\n해당하는비위를신고하지않거나고발하지\n않은행위\n2. ｢성폭력범죄의처벌등에관한특례법｣에따른\n성폭력범죄\n3. ｢성매매알선등행위의처벌에관한법률｣에\n따른성매매\n4. ｢㉮(□□□□□□□)｣에따른성희롱\n5.∼10. (생략)\n11. 직무상비밀또는㉯(□□□□□)(을)를이용한\n부당행위\n12. 우월적지위등을이용하여다른직원등에게\n신체적․정신적고통을주는등의부당행위","a":"㉮ 양성평등기본법, ㉯ 미공개정보","ex":""},{"id":"2026-39","grp":"2026","no":39,"kind":"sa","area":"국제인도법 (보편적 관할권, ICTY, ICTR)","q":"국제인도법에 관한 사항이다. □에 들어갈 단어를 순서대로 쓰시오.\n\n· ㉮(□□□ □□□)은(는) 다른 국가에서 국제 범죄를 저지른 사람을 한 국가의 법원에서 기소할 수 있도록 하는 국내법에 대한 국제법적 기반이 된다.  \n· 국제형사재판소 이전에 ㉯(□□□) 국제형사재판소(ICTY)와 ㉰(□□□) 국제형사재판소(ICTR)는 1993년과 1994년 이들 국가의 내전 시 전쟁범죄를 범했다는 혐의를 받는 사람들을 재판하기 위해 유엔안보리가 설치하였다.","a":"㉮ 보편적 관할권, ㉯ 구유고, ㉰ 르완다","ex":"<b>해설<\/b>:<br>• ㉮ <b>보편적 관할권<\/b> `(□□□ □□□)`: 범죄 발생지나 피의자·피해자의 국적과 무관하게 모든 국가가 전쟁범죄자를 처벌할 수 있는 사법 관할권. (근거: IHL Q&amp;A Q21, 원문 p.93~p.96)<br>• ㉯ <b>구유고<\/b> `(□□□)`: 1993년 유엔 안보리가 설치한 구유고 국제형사재판소(ICTY).<br>• ㉰ <b>르완다<\/b> `(□□□)`: 1994년 유엔 안보리가 설치한 르완다 국제형사재판소(ICTR).<br>(근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` 조약 채택 연도표)"},{"id":"2026-40","grp":"2026","no":40,"kind":"sa","area":"국제적십자운동 규약 (전문 평화 선언)","q":"국제적십자운동\n규약에\n관한\n사항이다.\n□에\n들어갈단어를순서대로쓰시오.\n· 국제적십자운동은국제적십자운동의인도주의\n활동과적십자이념보급을통해단순히전쟁이\n없는상태가아닌모든나라와사람들간의\n역동적인협력, 사람들의욕구에부응하기위한\n자유와㉮(□□), ㉯(□□□), 평등, ㉰(□□),\n그리고공평하고평등한자원의분배에기초한\n협력인항구적평화를증진시킨다는것을선언\n한다.\n※ 그동안수고많으셨습니다.","a":"㉮ 독립, ㉯ 자주권, ㉰ 인권","ex":""},{"id":"st1-김배성-1","grp":"st1","no":1,"kind":"ox","area":"김배성","q":"(OX) 적십자사의 사업계획 및 예산은 운영위원회 심의, 중앙위원회 의결, 전국대의원총회 승인을 거쳐 회계연도 시작 1개월 전까지 보건복지부장관에게 제출하면 된다.","a":"O","ex":"조직법 제21조①"},{"id":"st1-김배성-2","grp":"st1","no":2,"kind":"ox","area":"김배성","q":"(OX) 천재지변이나 그 밖의 돌발적인 사태로 중앙위원회 위원을 선출하지 못한 경우에는 전임 중앙위원의 임기가 차기 중앙위원회가 구성될 때까지 연장된다.","a":"X","ex":"정관 제7조③ — 중앙위원회가 아니라 <b>다음 전국대의원총회 때까지<\/b> 연장."},{"id":"st1-김배성-3","grp":"st1","no":3,"kind":"ox","area":"김배성","q":"(OX) 특수업무를 담당하게 하기 위하여 회장은 임원 중에서 중앙위원회의 승인을 얻어 상근하게 할 수 있다.","a":"X","ex":"정관 제17조④ — 중앙위원회가 아니라 <b>운영위원회<\/b>의 승인."},{"id":"st1-김배성-4","grp":"st1","no":4,"kind":"ox","area":"김배성","q":"(OX) 지사 상임위원회는 지사회장과 18명의 위원으로 구성되며, 상임위원의 임기는 3년이고 한 차례 중임할 수 있으므로 최대 가능한 재임기간은 6년이다.","a":"X","ex":"정관 제28조② — 3년 + 중임 3년 + 지사대의원총회 의결에 따른 연장 3년 = <b>최대 9년<\/b>."},{"id":"st1-김배성-5","grp":"st1","no":5,"kind":"ox","area":"김배성","q":"(OX) 적십자사를 해산하는 경우 채무를 변제하고도 잔여재산이 있을 때에 그 재산은 중앙위원회 의결을 거쳐 전국대의원총회 승인 이후 보건복지부장관의 인가를 받는다.","a":"X","ex":"정관 제50조③ — 잔여재산 처분에는 <b>전국대의원총회 승인이 필요 없음<\/b>(중앙위 의결 + 복지부장관 인가). 총회 승인은 해산 자체(제50조②)에 필요."},{"id":"st1-김배성-6","grp":"st1","no":6,"kind":"mc","area":"김배성","q":"다음 중 정관상 지사 관련 설명으로 가장 옳은 것은?\n① 지사대의원총회는 지사 상임위원회에서 선출한 사람 10명과 명예지사회장·지사회장이 협의하여 선출한 사람 10명으로 구성한다.\n② 지사대의원총회는 지사상임위원회의 위원을 선출 또는 보선하고, 지사 사업에 대한 보고를 받는다.\n③ 지사운영위원회는 지사회장을 포함하여 7명으로 구성하되, 위원 6명은 지사 대의원총회가 그 대의원 중에서 선출한다.\n④ 지사 임원은 지사회장 1명, 지사부회장 4명 이내, 재정감독 1명 및 법률고문 1명으로 구성된다.","a":"②","ex":"정관 제27조②. ① 시·군·구의 장이 선출한 1명(6개 지역 이하면 2명)도 포함 / ③ 상임위원회가 호선하는 6명(제29조②) / ④ 법률고문은 임원이 아님(제30조①)."},{"id":"st1-김배성-7","grp":"st1","no":7,"kind":"mc","area":"김배성","q":"다음 중 조직법 및 정관의 내용 중 옳은 것의 개수는?\nㄱ. 국가나 지방자치단체는 적십자사의 사업 목적을 달성하기 위하여 필요할 때에는 「국유재산법」 및 「공유재산 및 물품관리법」의 규정에도 불구하고 국유·공유 재산을 적십자사에 무상으로 대부해야 한다.\nㄴ. 적십자사는 매 회계연도 경과 후 3개월 이내에 세입·세출결산서에 공인회계사 또는 회계법인 회계감사 보고서를 첨부하여 운영위원회의 심의와 중앙위원회의 의결을 거친 후 국회 및 보건복지부장관에게 제출하여야 한다.\nㄷ. 해산 및 잔여재산의 처분에 관한 의결 또는 승인은 재적위원 또는 재적대의원 3분의 1이상의 출석으로 개의하고, 출석위원 또는 출석대의원 4분의 3이상의 찬성으로 의결 또는 인가한다.\nㄹ. 사무처에 사무총장 1명을 두며, 사무총장은 회장의 명을 받아 적십자사의 사업을 총괄하고 소속 직원들을 지휘·감독한다.\nㅁ. 부회장은 회장을 보좌하며, 회장이 부득이한 사유로 직무를 수행할 수 없을때에는 차기 운영위원회에 소집된 임원 순서에 따라 그 직무를 대행한다.\n① 1개  ② 2개  ③ 3개  ④ 4개  ⑤ 5개","a":"①","ex":"옳은 것은 ㄴ뿐(조직법 제21조③). ㄱ 무상으로 <b>대부할 수 있다<\/b>(제23조) / ㄷ <b>3분의 2<\/b> 이상 출석(정관 제50조④) / ㄹ 사무를 <b>관장<\/b>(제19조②) / ㅁ <b>회장이 미리 지명한 순위<\/b>(제17조②)."},{"id":"st1-신희훈-1","grp":"st1","no":1,"kind":"ox","area":"신희훈","q":"(OX) 회장이 부득이한 사유로 직무를 수행할 수 없을 때에는 부회장 중 연장자의 순으로 회장의 직무를 대행한다.","a":"X","ex":"조직법 제17조②, 정관 제21조 — <b>회장이 미리 지명한 순위<\/b>에 따라 대행."},{"id":"st1-신희훈-2","grp":"st1","no":2,"kind":"ox","area":"신희훈","q":"(OX) 법령과 정관 및 중앙위원회 의결에 따른 적십자사의 공고는 회장이 필요하다고 인정하는 경우에 전국을 대상으로 발간되는 일간신문에 게재할 수 있다.","a":"O","ex":"정관 제47조① (원칙: 인터넷 홈페이지 14일 이상 게시)"},{"id":"st1-신희훈-3","grp":"st1","no":3,"kind":"ox","area":"신희훈","q":"(OX) 적십자사의 등기에 관하여는 「민법」 중 사단법인의 등기에 관한 규정을 준용한다.","a":"O","ex":"조직법 제3조"},{"id":"st1-신희훈-4","grp":"st1","no":4,"kind":"ox","area":"신희훈","q":"(OX) 적십자사 해산에 관한 의결 또는 승인은 출석위원 또는 출석대의원 3분의 2 이상의 찬성으로 의결 또는 승인하여야 한다.","a":"X","ex":"정관 제50조④ — <b>재적 3분의 2 이상 출석 + 출석 4분의 3 이상 찬성<\/b>."},{"id":"st1-신희훈-5","grp":"st1","no":5,"kind":"ox","area":"신희훈","q":"(OX) 운영위원회는 매년 1회 이상 회장이 소집하며, 위원 3분의 1 이상이 회의의 소집을 요구한 때에는 회장은 이를 소집하여야 한다.","a":"X","ex":"조직법 제12조④, 정관 제12조 — 운영위원회는 <b>필요한 때에 회장이 소집<\/b>."},{"id":"st1-신희훈-6","grp":"st1","no":6,"kind":"mc","area":"신희훈","q":"다음 괄호 안에 들어갈 숫자의 총합으로 옳은 것은?\nㄱ. 전국대의원총회는 회장과 (144)명의 대의원으로 구성한다.\nㄴ. 중앙위원회는 회장과 전국대의원총회에서 선출하는 사람 19명, 국무위원 (8)명으로 구성한다.\nㄷ. 운영위원회는 회장과 중앙위원회가 그 위원 중에서 호선하는 사람 (4)명, 행정안전부장관 및 보건복지부장관 2명으로 구성한다.\nㄹ. 적십자사의 임원으로 회장 1명, 부회장 (2)명 및 재정감독 1명을 두고, 고문으로 법률고문 1명을 둔다.\n① 156  ② 157  ③ 158  ④ 159","a":"③","ex":"144+8+4+2 = 158. 대의원 144 = 대통령 8 + 국회 12 + 시·도지사 2×17 + 지사 선출 6×15 (정관 제4조, 시·도·지사 수는 개편에 따라 달라질 수 있음)."},{"id":"st1-신희훈-7","grp":"st1","no":7,"kind":"mc","area":"신희훈","q":"다음 중 중앙위원회 심의, 의결사항으로 옳지 않은 것은?\n① 적십자사의 해산 및 잔여재산 처분에 관한 사항\n② 지사 및 사업기관의 설치·폐지에 관한 사항\n③ 사업계획 및 예산에 관한 사항\n④ 중앙위원회 위원의 선출에 관한 사항","a":"④","ex":"정관 제8조 — 중앙위원회 위원은 <b>전국대의원총회<\/b>가 선출(제5조1호)."},{"id":"st1-최강락-1","grp":"st1","no":1,"kind":"ox","area":"최강락","q":"(OX) 적십자사로부터 그 사용승인을 받지 아니한 자가 사업용으로 적십자 표장을 사용한 경우 500만원 이하의 과태료를 부과한다.","a":"X","ex":"조직법 제25조·제28조 — 표장 무단 사용은 <b>1천만원 이하의 벌금<\/b>. (과태료 500만원은 유사명칭, 제26조·제29조)"},{"id":"st1-최강락-2","grp":"st1","no":2,"kind":"ox","area":"최강락","q":"(OX) 적십자사의 해산에 관한 사항 승인은 중앙위원회에서 처리한다.","a":"X","ex":"정관 제5조5호, 제50조② — <b>전국대의원총회<\/b>가 승인."},{"id":"st1-최강락-3","grp":"st1","no":3,"kind":"ox","area":"최강락","q":"(OX) 운영규정의 제정 또는 개정은 운영위원회에서 심의, 의결한다.","a":"O","ex":"정관 제11조3호"},{"id":"st1-최강락-4","grp":"st1","no":4,"kind":"ox","area":"최강락","q":"(OX) 회장은 적십자사 운영에 필요한 시행규칙을 정관 및 운영규정의 위임에 따라 제정 시행한다.","a":"O","ex":"정관 제20조②"},{"id":"st1-최강락-5","grp":"st1","no":5,"kind":"ox","area":"최강락","q":"(OX) 적십자사의 정관을 변경하고자 할 때에는 중앙위원 과반수의 출석과 출석위원 과반수의 찬성으로 중앙위원회의 의결을 거쳐야 한다.","a":"X","ex":"정관 제48조 — 출석위원 <b>3분의 2 이상<\/b> 찬성."},{"id":"st1-최강락-6","grp":"st1","no":6,"kind":"mc","area":"최강락","q":"대한적십자사 정관 중 '해산'에 대한 설명으로 틀린 것은?\n① 적십자사는 「대한적십자사 조직법」이 폐지되었을 때 해산한다.\n② 적십자사의 해산은 중앙위원회 의결과 전국대의원총회의 승인을 거쳐야 한다.\n③ 적십자사를 해산하는 경우 채무를 변제하고도 잔여재산이 있을 때에 그 재산은 중앙위원회의 의결을 거쳐 대통령의 인가를 받아 국가 또는 지방자치단체에 귀속하거나, 유사한 설립목적을 가진 공익법인에 기부할 수 있다.\n④ 해산 및 잔여재산의 처분에 관한 의결 또는 승인은 재적위원 또는 재적대의원 3분의 2 이상의 출석으로 개의하고, 출석위원 또는 출석대의원 4분의 3 이상의 찬성으로 의결 또는 승인하여야 한다.","a":"③","ex":"정관 제50조③ — 대통령이 아니라 <b>보건복지부장관<\/b>의 인가."},{"id":"st1-최강락-7","grp":"st1","no":7,"kind":"mc","area":"최강락","q":"대한적십자사 조직법 중 '회원'에 관한 설명으로 틀린 것은?\n① 대한민국 국적을 보유한 사람은 성별, 종교 또는 정치적 신념과 관계 없이 적십자사의 회원이 될 수 있다.\n② 대한민국의 법률에 따라 설립된 법인 또는 단체는 적십자사의 회원이 될 수 있다.\n③ 적십자사의 회원은 회비를 납부하는 자로 한다.\n④ 적십자사는 개인, 사업자, 법인 또는 단체 등을 대상으로 회원모집 및 회비모금 활동을 할 수 있다.","a":"①","ex":"조직법 제6조① — <b>대한민국에 거주하는 사람<\/b>은 성별, <b>국적<\/b>, 종교 또는 정치적 신념과 관계없이 회원이 될 수 있다."},{"id":"st1-구현지-1","grp":"st1","no":1,"kind":"ox","area":"구현지","q":"(OX) 운영위원회 위원 3분의 1 이상이 회의의 소집을 요구할 때는 회장은 회의를 소집하여야 한다.","a":"X","ex":"조직법 제12조④ — 운영위원회는 필요한 때 회장이 소집. (원문 대조 답)"},{"id":"st1-구현지-2","grp":"st1","no":2,"kind":"ox","area":"구현지","q":"(OX) 지사 운영에 관한 기타 사항은 회장이 운영규정으로 정한다.","a":"X","ex":"정관 제32조② — <b>본사 운영위원회<\/b>가 운영규정으로 정함. (원문 대조 답)"},{"id":"st1-구현지-3","grp":"st1","no":3,"kind":"ox","area":"구현지","q":"(OX) 적십자사 사업을 목적으로 가액이 6억인 400평 토지를 기본재산으로 취득하려고 할 때는 보건복지부장관의 인가를 받아야 한다.","a":"O","ex":"정관 제43조 — 면제는 400평 <b>미만<\/b> 토지로서 7억 미만. 400평은 미만이 아니므로 인가 필요."},{"id":"st1-구현지-4","grp":"st1","no":4,"kind":"ox","area":"구현지","q":"(OX) 사무총장은 중앙위원회에서 선출하되, 회장의 승인을 얻어야 한다.","a":"X","ex":"조직법 제19조③ — 회장이 임명 + 중앙위원회 승인."},{"id":"st1-구현지-5","grp":"st1","no":5,"kind":"ox","area":"구현지","q":"(OX) 법률고문은 중앙위원회에 출석하여 의견을 진술할 수 있다.","a":"O","ex":"조직법 제17조⑤, 정관 제23조"},{"id":"st1-구현지-6","grp":"st1","no":6,"kind":"mc","area":"구현지","q":"조직법 및 정관에 관한 사항이다. 다음 보기 중 옳은 것은 몇 개 인가?\n가. 비상근 임원 및 고문의 보수에 관한 사항은 중앙위원회에서 정한다.\n나. 적십자사는 국가나 지방자치단체로부터 사업비를 보조받은 사업에 대해서는 해당 사업실적에 관하여 사업을 관장하는 주무부장관 또는 지방자치단체 장에 보고하여야 한다.\n다. 국가나 지방자치단체는 적십자사에 국유·공유 재산을 무상으로 대부할 수 있다.\n라. 운영위원회는 관장 사항 중 긴급히 처리해야 할 사항이나 경미한 사항에 대하여 서면의결을 시행할 수 있다.\n① 0개  ② 1개  ③ 2개  ④ 3개","a":"③","ex":"다(조직법 제23조), 라(정관 제14조의2)만 옳음. 가: 비상근은 보수 불지급(정관 제17조⑥) / 나: <b>사업계획<\/b>에 관한 <b>승인<\/b>(조직법 제21조②)."},{"id":"st1-구현지-7","grp":"st1","no":7,"kind":"mc","area":"구현지","q":"다음 중 □ 안 숫자의 합은?\n가. 적십자사는 매 회계연도의 사업계획 및 예산안을 작성하여 ... 해당 회계연도가 시작되기 □개월 전에 보건복지부장관에게 제출하여야 한다. (1)\n나. 적십자사는 매 회계연도 경과 후 □개월 이내에 세입·세출결산서에 ... 제출하여야 한다. (3)\n다. 법령과 정관 및 중앙위원회 의결에 따른 적십자사의 공고는 인터넷 홈페이지에 □일 이상 게시하여야 한다. (14)\n라. 적십자사는 연간 기부금 모금액 및 활용실적을 매년 사업연도 종료일로부터 □개월 이내에 인터넷 홈페이지에 공개하여야 한다. (4)\n① 23  ② 22  ③ 21  ④ 20","a":"②","ex":"1+3+14+4 = 22 (조직법 제21조①③, 정관 제47조①②). (원문 대조 답)"},{"id":"st1-전권능-1","grp":"st1","no":1,"kind":"ox","area":"전권능","q":"(OX) 정관에 구체적으로 명문화 된 적십자사가 할 수 있는 수익사업은 적십자병원의 운영사업, 적십자 교육·홍보 및 출판사업, 자산의 임대사업이다.","a":"X","ex":"정관 제41조②에는 병원 운영사업이 없음(조직법 제24조1호에는 있음)."},{"id":"st1-전권능-2","grp":"st1","no":2,"kind":"ox","area":"전권능","q":"(OX) 정관으로 정하는 기본재산을 취득·매매·증여·교환 또는 임대하거나 담보로 제공하려면 보건복지부장관의 승인을 받아야 한다.","a":"X","ex":"조직법 제22조의2 — 승인이 아니라 <b>인가<\/b>."},{"id":"st1-전권능-3","grp":"st1","no":3,"kind":"ox","area":"전권능","q":"(OX) 회장은 전국대의원총회, 중앙위원회 및 운영위원회의 관장 사항 중 긴급히 처리해야 할 사항이나 경미한 사항에 대해 서면의결 시행할 수 있으며, 서면의결 결과는 차기 회의에 보고하여야 한다.","a":"O","ex":"정관 제14조의2"},{"id":"st1-전권능-4","grp":"st1","no":4,"kind":"ox","area":"전권능","q":"(OX) 지사를 설치하고자 할 때 회장은 관할 시·도지사를 조직위원장으로 위촉하여 지사조직위원회를 구성하게 하며, 상임위원의 선거가 끝나면 조직위원장은 소정의 회의록을 첨부하여 중앙위원회 인준을 받아야 한다.","a":"X","ex":"정관 제26조② — 인준 주체는 <b>회장<\/b>."},{"id":"st1-전권능-5","grp":"st1","no":5,"kind":"ox","area":"전권능","q":"(OX) 적십자사로부터 자료제공을 요청받은 국가와 지방자치단체는 특별한 사유가 없으면 그 자료를 제공하여야 한다.","a":"O","ex":"조직법 제8조③"},{"id":"st1-전권능-6","grp":"st1","no":6,"kind":"mc","area":"전권능","q":"다음 중 옳지 않은 것은?\n① 적십자사의 운영 및 사업에 사용되는 경비는 회비, 국가 또는 지방자치단체의 보조금, 수익사업으로 인한 수익금, 그 밖에 수입금으로 충당한다.\n② 국가와 지방자치단체는 적십자사가 「공공보건의료에 관한 법률」에 따른 보건의료를 수행하는 경우 시설장비 확충 등 이에 사용되는 경비의 일체를 보조하여야 한다.\n③ 국가나 지방자치단체는 적십자사의 사업 목적을 달성하기 위하여 필요할 때에는 국유·공유 재산을 적십자사에 무상으로 대부할 수 있다.\n④ 적십자 회계연도는 정부의 회계연도에 따른다.","a":"②","ex":"조직법 제22조② — <b>일부를 보조할 수 있다<\/b>."},{"id":"st1-전권능-7","grp":"st1","no":7,"kind":"mc","area":"전권능","q":"조직법과 정관 중 전국대의원총회에 관한 사항이다. □에 들어갈 숫자의 곱은?\n가. 국회가 위촉하는 대의원 □명\n나. 대통령이 위촉하는 대의원 □명\n다. 시·도지사가 위촉하는 대의원은 각 □명\n라. 전국대의원총회 대의원의 임기는 □년\n① 576  ② 480  ③ 384  ④ 1440","a":"①","ex":"12 × 8 × 2 × 3 = 576 (조직법 제10조②③, 정관 제4조)."},{"id":"st1-박준규-1","grp":"st1","no":1,"kind":"ox","area":"박준규","q":"(OX) 적십자사는 정관을 변경하려면 보건복지부장관의 허가를 받아야 한다.","a":"X","ex":"조직법 제5조② — 허가가 아닌 <b>인가<\/b>."},{"id":"st1-박준규-2","grp":"st1","no":2,"kind":"ox","area":"박준규","q":"(OX) 전국대의원총회를 구성하는 대의원의 총 재적수는 142명이다.","a":"X","ex":"회장 1 + 대통령 8 + 국회 12 + 시·도지사 위촉 (시·도 수×2) + 지사 선출 (지사 수×6). 시·도·지사 수는 행정구역 개편에 따라 달라질 수 있어 정관 개정본 확인 필요. 142는 아님."},{"id":"st1-박준규-3","grp":"st1","no":3,"kind":"ox","area":"박준규","q":"(OX) 중앙위원회 위원의 임기는 3년이다.","a":"X","ex":"조직법 제11조③ — <b>전국대의원총회에서 선출한 위원<\/b>만 3년. 장관 8명은 당연직."},{"id":"st1-박준규-4","grp":"st1","no":4,"kind":"ox","area":"박준규","q":"(OX) 적십자사는 매 회계연도 경과 후 3개월 이내에 세입세출결산서에 회계감사 보고서를 첨부하여 운영위원회 심의와 중앙위원회 의결을 거쳐 국회 및 보건복지부장관에게 제출한다.","a":"O","ex":"조직법 제21조③"},{"id":"st1-박준규-5","grp":"st1","no":5,"kind":"ox","area":"박준규","q":"(OX) 적십자사로부터 사용승인을 받지 않은 자가 적십자, 제네바적십자 또는 이와 유사한 명칭을 사용한 경우에는 500만원 이하의 벌금에 처한다.","a":"X","ex":"조직법 제26조·제29조 — 유사명칭 사용은 500만원 이하의 <b>과태료<\/b>."},{"id":"st1-박준규-6","grp":"st1","no":6,"kind":"mc","area":"박준규","q":"대한적십자사 정관에 관한 내용 중 옳은 것의 개수는 몇 개인가?\n가. 대한적십자사의 정식 영문표기는 THE REPUBLIC OF KOREAN NATIONAL RED CROSS 이다.\n나. 중앙위원회를 소집하고자 하는 때에는 회의 개최 7일전에 각 위원에게 문서로 통지하여야 한다.\n다. 임원이 특수업무를 담당하게 하기 위하여 회장은 임원 중에서 중앙위원회의 승인을 얻어 상근하게 할 수 있다.\n라. 외국에 거주하고 있는 박준규(대한민국 국적)는 회비를 납부하더라도 적십자사의 회원이 될 수 없다.\n① 0개  ② 1개  ③ 2개  ④ 3개","a":"③","ex":"나(정관 제9조②), 라(제35조① 거주자)가 옳음. 가: KOREA(KOREAN X) / 다: <b>운영위원회<\/b> 승인(제17조④)."},{"id":"st1-박준규-7","grp":"st1","no":7,"kind":"mc","area":"박준규","q":"대한적십자사 정관 제45조에서 규정하고 있는 업무로 잘못 기술된 것은?\n① 전쟁 또는 돌발사태로 인한 외국난민의 수용보호사업\n② 국민헌혈운동추진, 혈액원운영 등 혈액사업\n③ 종합봉사회관, 민·군병원봉사실 등 각종 복지시설 운영\n④ 보건지식, 가정보건, 재활치료, 무료진료 등 지역보건사업","a":"④","ex":"정관 제45조7호 — 재활치료가 아니라 <b>언어치료<\/b>."},{"id":"st1-신승현-1","grp":"st1","no":1,"kind":"ox","area":"신승현","q":"(OX) 운영위원회는 매년 1회 이상 회장이 소집한다.","a":"X","ex":"조직법 제12조④, 정관 제12조 — 운영위원회는 필요한 때에 회장이 소집."},{"id":"st1-신승현-2","grp":"st1","no":2,"kind":"ox","area":"신승현","q":"(OX) 지사운영위원회는 지사회장을 포함하여 7명으로 구성하되 위원은 상임위원회가 그 위원 중에서 호선하는 사람 6명으로 한다.","a":"O","ex":"정관 제29조②"},{"id":"st1-신승현-3","grp":"st1","no":3,"kind":"ox","area":"신승현","q":"(OX) 상근 임원 및 고문의 보수에 관한 사항은 중앙위원회에서 정한다. 단, 비상근 임원 및 고문은 보수를 지급하지 아니하며, 예산의 범위 내에서 업무수행에 필요한 수당 및 경비를 지급할 수 있다.","a":"X","ex":"정관 제17조⑥ — 수당 및 <b>여비<\/b>(경비 X)."},{"id":"st1-신승현-4","grp":"st1","no":4,"kind":"ox","area":"신승현","q":"(OX) 적십자사의 해산은 중앙위원회 의결과 전국대의원총회의 승인을 거쳐야한다.","a":"O","ex":"정관 제50조②"},{"id":"st1-신승현-5","grp":"st1","no":5,"kind":"ox","area":"신승현","q":"(OX) 사무총장은 회장이 임명하되, 중앙위원회의 승인을 받아야한다.","a":"O","ex":"조직법 제19조③, 정관 제24조③"},{"id":"st1-신승현-6","grp":"st1","no":6,"kind":"mc","area":"신승현","q":"전국대의원총회에서 위촉되거나 선출된 대의원의 구성 내용 중 틀린 것은?\n① 국회에서 위촉하는 사람 12명\n② 시·도지사가 위촉하는 사람 각 2명\n③ 적십자사 지사에서 위촉하는 사람 각 6명\n④ 대통령이 위촉하는 사람 8명","a":"③","ex":"정관 제4조①4호 — 지사에서 <b>선출<\/b>하는 사람 각 6명 (위촉 X). (원문 보기 가나다라 → ①②③④)"},{"id":"st1-신승현-7","grp":"st1","no":7,"kind":"mc","area":"신승현","q":"다음 중 중앙위원회의 심의의결사항이 아닌 것은?\n① 사업계획 및 예산의 관한 사항의 승인\n② 본사의 기구에 관한 사항\n③ 전국대의원총회가 건의한 정책에 관한 사항\n④ 임원 및 법률고문 선출에 관한 사항\n⑤ 회원의 모집 및 회비수납에 관한 사항","a":"①","ex":"정관 제5조2호, 제8조 — 사업계획 및 예산의 <b>승인<\/b>은 전국대의원총회. 중앙위는 심의·의결. (원문 보기 가~마 → ①~⑤)"},{"id":"st1-하영진-1","grp":"st1","no":1,"kind":"ox","area":"하영진","q":"(OX) 전국대의원총회는 매년 1회 이상 회장이 소집하며, 대의원 3분의 1 이상이 회의 소집을 요구할 때에는 회장이 지체 없이 회의를 소집하여야 한다.","a":"O","ex":"정관 제6조, 조직법 제10조④"},{"id":"st1-하영진-2","grp":"st1","no":2,"kind":"ox","area":"하영진","q":"(OX) 대한적십자사 회장의 임기는 2년으로 하고, 부회장·재정감독·법률고문의 임기는 3년으로 하며, 각각 한 차례만 중임할 수 있다.","a":"X","ex":"정관 제18조, 조직법 제16조 — <b>회장 3년<\/b>, 나머지 <b>2년<\/b>."},{"id":"st1-하영진-3","grp":"st1","no":3,"kind":"ox","area":"하영진","q":"(OX) 전국대의원총회·중앙위원회·운영위원회의 회의는 재적 대의원 또는 재적위원 3분의 2 이상의 출석으로 개의하고, 출석자의 4분의 3 이상의 찬성으로 의결한다.","a":"X","ex":"정관 제14조 — 일반 의결은 <b>과반수 출석·과반수 찬성<\/b>. 3분의 2·4분의 3은 해산(제50조④)."},{"id":"st1-하영진-4","grp":"st1","no":4,"kind":"ox","area":"하영진","q":"(OX) 대한적십자사는 정관을 변경하려는 경우 보건복지부장관의 인가를 받아야 한다.","a":"O","ex":"조직법 제5조②"},{"id":"st1-하영진-5","grp":"st1","no":5,"kind":"ox","area":"하영진","q":"(OX) 대한적십자사는 매 회계연도의 사업계획 및 예산안을 작성하여 운영위원회의 심의와 중앙위원회의 의결을 거친 후 전국대의원총회의 승인을 받아야 하며, 해당 회계연도가 시작되기 1개월 전에 보건복지부장관에게 제출하여야 한다.","a":"O","ex":"조직법 제21조①"},{"id":"st1-하영진-6","grp":"st1","no":6,"kind":"mc","area":"하영진","q":"대한적십자사 정관상 지사 대의원총회에 관한 설명으로 옳은 것은?\n① 지사 대의원총회 대의원은 지사 상임위원회에서 선출하는 12명으로 구성한다.\n② 지사 대의원총회 대의원은 지사 상임위원회에서 선출하는 10명, 명예지사회장과 지사회장이 공동으로 선출하는 10명 및 시·군·구청장이 선출하는 사람으로 구성한다. 다만, 시·군·구 지역이 6개 이하인 경우에는 각 2명으로 한다.\n③ 지사 대의원의 임기는 2년으로 하며, 지사 상임위원회에서 선출한다.\n④ 지사 대의원총회는 지사 사업계획과 예산을 최종 승인하는 기관이다.","a":"②","ex":"정관 제27조. ①은 10명 / ③ 임기 3년 / ④ 주요 기능은 상임위원 선출·보선과 지사 사업 보고 수령(제27조②)."},{"id":"st1-하영진-7","grp":"st1","no":7,"kind":"mc","area":"하영진","q":"대한적십자사 조직법상 금지행위와 벌칙에 관한 설명으로 옳은 것은?\n① 적십자 표장을 무단으로 사용한 경우 500만원 이하의 과태료를 부과한다.\n② 적십자사와 유사한 명칭을 무단으로 사용한 경우 1천만원 이하의 벌금에 처한다.\n③ 적십자 표장을 무단으로 사용한 경우 1천만원 이하의 벌금에 처하고, 유사명칭을 무단으로 사용한 경우 500만원 이하의 과태료를 부과한다.\n④ 적십자 표장과 유사명칭을 무단으로 사용한 경우 모두 1천만원 이하의 벌금에 처한다.","a":"③","ex":"조직법 제25조·제26조·제28조·제29조"},{"id":"st2-이재길-1","grp":"st2","no":1,"kind":"mc","area":"이재길","q":"직원 운영규정에 관한 사항이다. 다음 중 회장이 승인하거나 정하는 사항은 몇 개인가?\n[보기]\n가. 각 기관에 대하여 인사에 관한 기록의 보고\n나. 인사위원회 운영에 대한 사항\n다. 전직 이용에 대한 세부절차\n라. 채용 연령의 제한 사항\n① 1개 ② 2개 ③ 3개 ④ 4개","a":"③","ex":"회장이 정하는 사항은 나·다·라 3개. 가(인사기록 보고·사무감사)는 사무총장 사항이다. 나=제7조(인사위원회 운영, 회장 시행규칙), 다=제10조의2 ②(전직 세부절차, 회장), 라=제10조의3(채용연령 제한, 회장), 가=제6조(사무총장).","my":"③"},{"id":"st2-이재길-2","grp":"st2","no":2,"kind":"mc","area":"이재길","q":"직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 혈액관리본부는 혈액관리본부장 직위와 팀장 1직위를 개방형 직위로 할 수 있다.\n② 5급 직원으로서 해당 계급에서 15년 이상 근무하고 근무성적이 우수한 자는 근속 승진을 할 수 있다.\n③ 일반직 2~4급 팀장급 직원의 기관 내 전보는 사무총장이 행사한다.\n④ 별정직원은 회장 취임 후 3개월 이내에 재신임을 득하지 못하면 퇴임하여야 한다.","a":"②","ex":"② 제11조 ②(5급 15년 이상 + 근무성적 우수 → 4급 근속승진). ① 혈액관리본부는 본부장 직위와 '부서장' 1직위(팀장 아님, 제10조의5). ③ 기관 내 전보권은 해당 기관장(본사는 사무총장), 제18조의2 ①1호. ④ 별정직원 재신임은 '1개월' 이내(제18조의3).","my":"②"},{"id":"st2-이재길-3","grp":"st2","no":3,"kind":"mc","area":"이재길","q":"직원 운영규정에 관한 사항이다. 각 빈칸의 합계는 무엇인가?\n[보기]\n가. 일반직 2급에서 1급이 되기위한 기간 : □년\n나. 기술2급 직원의 기술1급이 되기 위한 기간 : □년\n다. 금고 이상 실형을 선고받고 그 집행이 끝나거나 집행이 면제된 날로부터 □년이 지나지 아니한 자는 임용될 수 없다.\n라. 합격자 결정 사항 중 매과목 □% 미만의 득점자는 합격할 수 없다.\n① 49 ② 53 ③ 54 ④ 74","a":"③","ex":"합계 54. 가 3년(2급 승진소요 최저연수 3년, 제11조의2 ①1호. 별표3 임용소요경력연수 2급18-1급21=3년으로 봐도 같음) + 나 6년(기술2급 승진소요 최저연수, 제11조의2 ①6호) + 다 5년(제20조 3호) + 라 40%(제16조) = 54. 내 답 ②(53)는 나를 5년으로 잡은 것으로 보임.","my":"②"},{"id":"st2-이재길-4","grp":"st2","no":4,"kind":"mc","area":"이재길","q":"직원 운영규정에 관한 사항이다. 다음 중 사무총장이 정하는 사항으로 옳은 것은?\n① 교육훈련에 관한 종합적인 기획 및 조정\n② 근무성적평정에 관하여 필요한 사항\n③ 기관장이 업무와 관련하여 직원의 창의적인 제안이 모든 기관에 통용되어 예산절감이 인정되어 본사에 시행을 건의하고 이에 대한 표창을 수여하는 경우\n④ 적십자와 관련된 업무로 국외파견근무를 명하는 경우","a":"①","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>'사무총장이 정하는 사항' 중 맞는 것은 ① 교육훈련 종합 기획·조정(제26조 ②, 본사 사무총장이 행함). ② 근무성적평정 필요사항=회장(제27조 ②). ③ 기관장이 건의한 제안의 표창·포상=회장(제28의2 ②). ④ 국외파견 근무 명령=회장(제39의3 ①). 문구가 '정한다'가 아니라 '행한다'여서 출제자 확인 필요하나 나머지 셋이 전부 회장이라 ①이 답.","my":"②"},{"id":"st2-이재길-5","grp":"st2","no":5,"kind":"mc","area":"이재길","q":"직원 운영규정에 관한 사항이다. 다음 중 수습기간 없이 임용될 수 있는 사람이 아닌 자는?\n① 의무직으로 채용된 제조관리부장 A씨\n② 채용형 인턴직원으로 채용된 B씨\n③ 무기계약직원으로 채용된 C씨\n④ 정규직 전환 후 퇴사하여 재입사한 D씨","a":"④","ex":"수습기간 없이 임용되는 경우는 의무직, 채용형 인턴, 계약직원, 무기계약직원(제23조 ②). '재입사한 정규직'은 해당 없음. (신규임용자과정 재수료 면제는 제23조의2 ①로 별개 규정.)","my":"④"},{"id":"st2-이재길-6","grp":"st2","no":6,"kind":"ox","area":"이재길","q":"(OX) 정년퇴직 예정직원에게 9개월 범위 내에서 공로연수를 실시 할 수 있다.","a":"O","ex":"정년퇴직 예정 직원에게 9개월 범위 내 공로연수 실시 가능(제26조의3 ①, 2026.1.1. 개정).","my":"X"},{"id":"st2-이재길-7","grp":"st2","no":7,"kind":"ox","area":"이재길","q":"(OX) 연차 유급휴가는 개인의 신청에 의해 최대 10일까지 시간단위로, 잔여일수는 반일(4시간) 단위로 사용할 수 있다.","a":"O","ex":"연차유급휴가는 개인 신청으로 최대 10일까지 시간 단위, 잔여일수는 반일(4시간) 단위 사용 가능(제45조 2호 사목, 2026.1.1. 신설).","my":"X"},{"id":"st2-이재길-8","grp":"st2","no":8,"kind":"ox","area":"이재길","q":"(OX) 한국방송통신대학에 재학하는 직원에게 연 12일 이내로 공가를 부여할 수 있다.","a":"O","ex":"한국방송통신대학 재학 시 연 12일 이내 공가(제45조 5호 마목).","my":"O"},{"id":"st2-이재길-9","grp":"st2","no":9,"kind":"ox","area":"이재길","q":"(OX) 쌍둥이를 출산한 직원 B씨는 100일의 출산전후 휴가를 받을 수 있다.","a":"X","ex":"쌍둥이(한 번에 둘 이상 자녀)는 120일(유급 75일). 100일은 미숙아 출산(제45조 7호 가목).","my":"X"},{"id":"st2-이재길-10","grp":"st2","no":10,"kind":"ox","area":"이재길","q":"(OX) 가족돌봄휴가는 최대 10일을 받을 수 있으며, 무급 휴가이다.","a":"O","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>가족돌봄휴가는 무급, 연간 최장 10일(제45조 13호 나목). 단, 연장되는 경우 20일(한부모 25일)이 있어서 '최대 10일'이 걸릴 수 있음. 출제의도는 O로 보임.","my":"O"},{"id":"st2-황해민-1","grp":"st2","no":1,"kind":"mc","area":"황해민","q":"직원 운영규정 제9조(결원보충)에 관한 문제이다. 다음 괄호 안에 들어갈 말로 알맞은 것을 모두 고르시오.\n임용권자 및 임용제청권자는 해당 기관의 결원을 (  ), (  ), (  ), (  )의 방법에 의하여 보충 실시한다.\n① 승진 ② 전직 ③ 강임 ④ 신규채용 ⑤ 복직","a":"①③④","ex":"결원보충 방법은 신규채용, 승진, 강임, 전보(제9조, 2025.1.1. 개정). 전직·복직은 해당 없음. 내 답은 ②전직, ⑤복직을 넣고 ③강임을 빠뜨렸다.","my":"①②④⑤"},{"id":"st2-황해민-2","grp":"st2","no":2,"kind":"mc","area":"황해민","q":"직원 운영규정에 관한 사항이다. 다음에 들어갈 숫자를 모두 더한 값을 고르시오.\n제20조(결격사유)\n가. 금고이상의 실형을 선고받고 그 집행이 면제된 날로부터 (  )년이 지나지 아니한 자\n나. 징계에 의하여 해임 처분을 받은 때로부터 (  )년을 경과하지 아니한 자\n다. 스토킹범죄를 범한 사람으로서 (  )만원 이상의 벌금형을 선고받고 그 형이 확정된 후 (  )년이 지나지 아니한 자\n라. 공공기관에서 채용비위로 면직된 때부터 (  )년이 지나지 아니한 자\n① 116 ② 118 ③ 315 ④ 317 ⑤ 114","a":"①","ex":"116 = 5(제20조 3호) + 3(제20조 8호) + 100(만원)과 3(년)(제20조 11호 다목) + 5(제20조 10호) = 5+3+100+3+5.","my":"①"},{"id":"st2-황해민-3","grp":"st2","no":3,"kind":"mc","area":"황해민","q":"직원 운영규정에 관한 사항이다. 다음 중 같은 것 끼리 묶인 것은?\n가. 운영규정의 공정한 운영을 위하여 ( ㉠ )은 관하 각 기관에 대하여 인사에 관한 기록의 보고를 받고 사무감사를 행할 수 있다.\n나. 일반·특정·전문직 팀(과)장급 이상 직원을 계약직으로 채용할 때에는 ( ㉡ )의 승인을 받아야 한다.\n다. 일반직 2급 이상 직원 및 부장급 이상 특정·전문 직원의 전형, 고시 위원은 ( ㉢ )이 위촉 또는 임명한다.\n라. ( ㉣ )은 교육훈련에 관한 종합적인 기획 및 조정을 행한다.\n마. 1급직원 및 사무처장을 포함한 기관장급 상당 직원은 국외여행을 하는 경우에 사전에 ( ㉤ )에게 보고하여야 한다.\n① ㉠㉡㉢ ② ㉠㉢㉣ ③ ㉡㉢㉣ ④ ㉣㉤","a":"②","ex":"같은 것은 ㉠㉢㉣ = 사무총장(제6조, 제15조 1호, 제26조 ②). ㉡=회장 승인(제10조의4 ③), ㉤=회장 보고(제39조의2).","my":"②"},{"id":"st2-황해민-4","grp":"st2","no":4,"kind":"mc","area":"황해민","q":"직원 운영규정에 관한 사항이다. 다음에 공통적으로 해당되는 휴직을 모두 고르시오.\n가. 승진소요 최저연수에 포함되는 휴직\n나. 승진제한 휴직에서 제외되는 휴직\n다. 신규임용자과정 의무수료기간에 포함되지 않는 휴직\n① 업무상 질병 또는 부상으로 인한 휴직\n② 육아휴직\n③ 가족돌봄휴직\n④ 제53조제2항제1호(직무와 관련된 국제기구 임시고용)","a":"②③","ex":"공통 휴직은 육아휴직·가족돌봄휴직. 승진소요 최저연수 포함(제11조의2 ②), 승진제한 제외(제12조 ①), 신규임용자과정 의무수료기간 불포함(제23조의3 ②). ①업무상 질병은 승진제한 제외 대상이 아니고, ④제53조 ②1호는 신규임용자과정 불포함 목록에 없음. '모두 고르시오'라 ②만 고르면 오답.","my":"②"},{"id":"st2-황해민-5","grp":"st2","no":5,"kind":"mc","area":"황해민","q":"직원 운영규정에 관한 사항이다. 다음 중 옳은 것의 개수는?\n가. 재직 중 간호사 면허증을 취득한 일반직원을 간호직에 전직임용 시 전직시험 일부 또는 전부를 면제할 수 있다.\n나. 약무직원은 회장의 사전승인 하에 5급 직원으로 채용할 수 있다.\n다. 박사학위 소지자를 3급 직원으로 채용할 수 있다.\n라. 국외파견 근무직원은 귀국 후 그 3배되는 기한까지 본사에 근무할 의무가 있다.\n① 4개 ② 3개 ③ 2개 ④ 1개 ⑤ 없음","a":"③","ex":"옳은 것은 나(약무직원은 회장 사전승인으로 5급 채용, 별표3 비고)와 다(박사학위 소지자 3급 채용, 제10조의8) 2개. 가: 전직시험 면제는 '기술·기능직원·고용원'이 대상이라 일반직원은 아님(제10조의2 ①1호). 라: 귀국 후 3배 기간은 '사무총장이 지정하는 기관'에서 근무(제39조의3 ②), '본사'가 아님.","my":"④"},{"id":"st2-황해민-6","grp":"st2","no":6,"kind":"ox","area":"황해민","q":"(OX) 의료기사는 임상심리사, 방사선사, 물리치료사, 치과위생사 등을 말한다.","a":"X","ex":"의료기사 = 임상병리사, 방사선사, 치과기공사, 치과위생사, 물리치료사, 작업치료사, 보건의료정보관리사(별표1 비고1). 임상심리사는 별도 직종(전문직원 보건직).","my":"O"},{"id":"st2-황해민-7","grp":"st2","no":7,"kind":"ox","area":"황해민","q":"(OX) 혈액관리본부 및 혈액관리본부 소속기관, 의료원 및 의료원 소속기관 4급 특정·전문직원의 책임보직으로의 임용은 소속기관장의 추천으로 혈액관리본부장과 의료원장이 임용권을 행사한다.","a":"X","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>제18조의2 ①5호: 혈액관리본부·의료원 및 소속기관 4급 '전문직원' 책임보직 임용을 본부장·의료원장이 행사. 문제는 '특정·전문직원'으로 특정직원이 섞여 있어 X로 판단. 출제의도 확인 필요.","my":"X"},{"id":"st2-황해민-8","grp":"st2","no":8,"kind":"ox","area":"황해민","q":"(OX) 5급직원 중 15년이상 근무하고 근무성적이 우수한 자는 승진고시를 거치지 않고 4급으로 근속승진할 수 있다.","a":"O","ex":"제11조 ② 근속승진.","my":"O"},{"id":"st2-황해민-9","grp":"st2","no":9,"kind":"ox","area":"황해민","q":"(OX) 각 기관의 장은 사회에 공헌한 공적이 현저한 직원에게 표창 및 포상 또는 포상금을 지급할 수 있으며 이 때 포상금 지급액은 회당 300만원을 초과하지 못한다.","a":"O","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>포상금 1회 300만원 초과 금지(제28의2 ①). 다만 문제는 제28조(사회공헌 포상)와 제28의2(창의적 제안) 문구가 섞여 있다. 출제의도는 300만원 확인으로 O로 보임.","my":"O"},{"id":"st2-황해민-10","grp":"st2","no":10,"kind":"ox","area":"황해민","q":"(OX) 임신(태아) 검진휴가는 10일 이내, 자녀돌봄휴가는 연간 2일의 범위(한부모 근로자는 3일), 가족돌봄휴가는 연간 최장 10일(연장되는 경우 20일, 한부모 근로자는 25일 이내) 사용할 수 있다.","a":"O","ex":"임신검진휴가 10일, 자녀돌봄휴가 2일(한부모 3일), 가족돌봄휴가 10일(연장 20일, 한부모 25일)(제45조 7호 바목, 12호, 13호).","my":"O"},{"id":"st2-전영민-1","grp":"st2","no":1,"kind":"mc","area":"전영민","q":"직원 운영규정에 관한 사항이다. □에 들어갈 숫자의 합은?\n가. 한 번에 둘 이상의 자녀를 임신한 경우 출산전후휴가 중 유급일수 : □일\n나. 업무로 인한 상해 질병으로 요양할 때에 병가 일수 : □개월\n다. 시간 단위 연가로 사용 가능한 시간 : □시간\n라. 해면 직원에 대하여 사무인계 또는 잔무처리상 필요한 경우에는 소속기관장은 □일을 한도로 계속 근무하게 할 수 있다.\n마. 직장 내 괴롭힘으로 인해 감봉 처분을 받은 경우 승진·승급 제한 기간 : □개월\n① 177 ② 183 ③ 192 ④ 198","a":"③","ex":"75(둘 이상 자녀 출산전후휴가 유급, 제45조 7호 가목) + 10개월(업무상 병가, 4호) + 80시간(시간단위 최대 10일×8시간, 2호 사목) + 15일(해면직원 근무, 제40조) + 12개월(감봉 승진·승급 제한, 제12조 ②) = 192. 직장 내 괴롭힘은 6개월 가산 사유에 없어서 12개월 그대로.","my":"③"},{"id":"st2-전영민-2","grp":"st2","no":2,"kind":"mc","area":"전영민","q":"직원 운영규정에 관한 사항이다. 다음 중 제20조(결격사유)에 해당하지 않는 것은?\n① 횡령 죄로 300만원 이상의 벌금형을 선고받고 그 형이 확정된 후 2년이 지나지 아니한 자\n② 징계에 의하여 해임의 처분을 받은 때로부터 3년을 경과하지 아니한 자\n③ 스토킹범죄를 범한 사람으로서 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 자\n④ 금고 이상의 실형을 선고받고 그 집행이 면제된지 2년이 지나지 아니한 자","a":"④","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>'해당하지 않는 것'. ②해임 3년(제20조 8호), ③스토킹 100만원·3년(11호 다목)은 맞는 내용. ④는 집행면제 후 5년인데 2년으로 바꾼 숫자 함정으로 보임. 다만 ①은 '직무와 관련하여'가 빠져 있어 엄밀히는 ①도 해당하지 않을 수 있음(제20조 13호). 출제의도는 ④.","my":"④"},{"id":"st2-전영민-3","grp":"st2","no":3,"kind":"mc","area":"전영민","q":"직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 사무보조원으로 재직 중 임상병리사 면허를 취득한 경우 전직 시험을 면제하여야 한다.\n② 일반·전문직원의 3급까지의 임용소요경력연수 기간은 12년이다.\n③ 2016년에 입사한 간호조무사는 기술직이다.\n④ 산업안전보건법에 따른 특수검진은 공가의 대상이다.","a":"④","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>④ 산안법 건강검진은 공가(제45조 5호 사목)로 확실. ① 전직시험 면제는 '할 수 있다'(하여야 아님), ② 3급 임용소요경력연수는 12년이 아니라 13년(별표3). ③ 2016.12.31 현재 재직 중인 기술직 간호조무사는 기술직 유지(별표1 비고5)라 2016년 입사자도 기술직일 수 있어 복수정답 가능성이 있다.","my":"④"},{"id":"st2-전영민-4","grp":"st2","no":4,"kind":"mc","area":"전영민","q":"직원 운영규정에 관한 사항이다. 다음 [보기]를 읽고 옳은 것은 몇 개인지 고르시오.\n[보기]\n· 직원 인사기본사항\n  성명 전병원 / 입사일 26. 7. 1.\n  직종 약무직 / 소속 서울병원\n  계급 5급 / 면허 취득일 24. 3. 1.\n· 입사 전 경력\n  - 군경력 : 18. 3. 1. ~ 19. 6. 30.\n  - A병원 : 20. 1. 1. ~ 20. 12. 31.\n  - B병원 : 25. 1. 1. ~ 25. 12. 31.\n· 현재 배우자(처)가 26.10.1. 출산 예정으로 26.10.1.부터 배우자 출산휴가 사용 예정\n· 상기 명시된 내용 외 고려하지 않음\n가. 전병원이 2026년도에 발생하는 연차유급휴가의 개수는 6개이다.\n나. 전병원의 입사 전 경력은 군경력 100%, A병원 50%, B병원 100% 인정된다.\n다. 전병원의 정기승급 발령권자는 서울병원 관리부원장이다.\n라. 전병원의 배우자 출산휴가 기간은 26.10.1.~26.10.20. 이다.\n마. 전병원은 27.3.31.까지 신규임용자과정을 수료해야한다.\n① 0개 ② 1개 ③ 3개 ④ 4개","a":"③","ex":"⚠ 정답 추정(출제의도 기준) — 정식 답지가 나오면 다시 확인.<br>가 O(2026.7.1 입사 → 매월 개근 1일씩 7~12월 6개), 마 O(수습 중 미수료 시 임용 후 9개월 → 27.3.31), 나 X(전문직원은 자격증 취득 이후 경력만, 유사업무 100%·기타업무 '-'라 A병원 50%는 불가, 별표6), 다 X(소속기관 직원 승급은 소속기관장=병원장이 발령, 제18조의2 ①6호 라목). 라(출산휴가 10.1~10.20)를 O로 봐야 3개가 되는데, 제47조(휴가 중 휴일 불산입)를 적용하면 X라 1개가 될 수도 있다. 보기에 2개가 없어서 3개로 판단.","my":"③"},{"id":"st2-전영민-5","grp":"st2","no":5,"kind":"mc","area":"전영민","q":"직원 운영규정에 관한 사항이다. 다음 중 옳은 것은?\n① 의무직은 기본연수 중 관리자 기초과정을 반드시 수료하여야 한다.\n② 학력 또는 경력에 관하여 거짓 기타 부정한 방법에 의하여 임명된 자는 그 사실이 발견된 즉시 해임한다.\n③ 동일직종으로 재입사하거나 정규직으로 전환된 직원 중 신규임용자과정을 수료한 경우에는 재수료하지 않는다.\n④ 직원이 임신 28주 이내 유·사산한 경우 유·사산휴가는 유급이다.","a":"③","ex":"③ 제23조의2 ① 단서(동일직종 재입사·정규직 전환자 중 수료자는 재수료 안 함). ① 의무직은 관리자 '심화과정(II)' 수료(제23조의2 ②). ② 거짓 기재는 즉시 '파면'(제21조). ④ 유·사산휴가는 휴가 중 최초 60일까지 유급이고 28주 이상은 90일이라 전 기간 유급이 아님(제45조 7호 다목).","my":"④"},{"id":"st2-전영민-6","grp":"st2","no":6,"kind":"ox","area":"전영민","q":"(OX) 임신 중인 직원은 임신(태아)검진을 위해 연간 10일 이내의 임신(태아)검진휴가를 반일 또는 1일 단위로 사용할 수 있다.","a":"O","ex":"제45조 7호 바목.","my":"O"},{"id":"st2-전영민-7","grp":"st2","no":7,"kind":"ox","area":"전영민","q":"(OX) 배우자 출산휴가의 사용은 마지막 날이 120일 이내에 있어야 한다.","a":"O","ex":"출산휴가의 사용은 배우자가 출산한 날부터 120일 이내, 3회 분할 가능(제45조 8호 단서).","my":"O"},{"id":"st2-전영민-8","grp":"st2","no":8,"kind":"ox","area":"전영민","q":"(OX) 가족돌봄휴가는 10일까지는 유급이고, 연장 20일은 무급이다.","a":"X","ex":"가족돌봄휴가는 연장분만이 아니라 전체가 무급(제45조 13호 나목).","my":"X"},{"id":"st2-전영민-9","grp":"st2","no":9,"kind":"ox","area":"전영민","q":"(OX) 상주병원 관리부원장의 정기승급에 대한 발령은 의료원장이 시행한다.","a":"X","ex":"⚠ 정 <script>
"use strict";
document.body.dataset.rd = "0";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───────── 저장소 ───────── */
const KEY = 'orgmaster.v1';
let S = {checks:{}, reads:{}, cards:{}, log:[], sessions:[], papers:[], theme:''};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
/* ───────── 인앱 알림·대화상자 (뷰어에서 alert/prompt/confirm은 동작하지 않음) ───────── */
function toast(m){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function dlg({title, text, area, okText, onOk, cancelText}){
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><b>${esc(title)}</b>
    ${text ? `<p class="small" style="margin:8px 0">${text}</p>` : ''}
    ${area !== undefined ? `<textarea id="dlg-ta" spellcheck="false">${esc(area)}</textarea>` : ''}
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      ${cancelText === false ? '' : `<button class="b-line" id="dlg-no">${cancelText || '닫기'}</button>`}
      ${okText ? `<button class="b-red" id="dlg-ok">${esc(okText)}</button>` : ''}</div></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  const ta = $('#dlg-ta', o); if (ta){ ta.focus(); ta.select(); }
  o.addEventListener('click', e => {
    if (e.target === o || e.target.id === 'dlg-no') close();
    if (e.target.id === 'dlg-ok'){ if (!onOk || onOk(ta ? ta.value : '') !== false) close(); }
  });
}
async function copyText(txt, okMsg){
  try { await navigator.clipboard.writeText(txt); toast(okMsg || '복사했습니다.'); }
  catch(e){ dlg({title:'직접 복사하세요', area:txt}); }
}

/* ───────── 저장: 기기(localStorage) + 가능하면 서버(db 기능, 기기 간 동기화) ───────── */
let DBR = null, syncTimer = null, pushing = false, dirty = false;
function setSync(t){ const el = document.getElementById('sync'); if (el) el.textContent = t; }
function save(){
  S.upd = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (DBR){ dirty = true; clearTimeout(syncTimer); setSync('☁ 저장 중…'); syncTimer = setTimeout(push, 1200); }
}
async function push(){
  if (pushing){ clearTimeout(syncTimer); syncTimer = setTimeout(push, 800); return; }
  pushing = true; dirty = false;
  const body = {upd: S.upd, json: JSON.stringify(S)};
  try { await DBR.set(body); setSync(dirty ? '☁ 저장 중…' : '☁ 동기화됨'); }
  catch(e){ setSync('☁ 서버 저장 실패 · 기기에는 저장됨'); }
  pushing = false;
  if (dirty){ clearTimeout(syncTimer); syncTimer = setTimeout(push, 800); }
}
function applyRemote(r){
  try {
    S = Object.assign({checks:{}, reads:{}, cards:{}, log:[], sessions:[], papers:[], theme:''}, JSON.parse(r.json)); S.upd = r.upd;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    if (S.theme) document.documentElement.dataset.theme = S.theme;
    const cur = (TABS.find(t => document.getElementById('p-'+t[0]).classList.contains('on')) || ['today'])[0];
    if (!(cur === 'quiz' && Q.sess)) { if (renderers[cur]) renderers[cur](); }
  } catch(e){}
}

/* 스터디 2주차 문제: 이미 채점한 내 답을 오답노트에 한 번만 반영 */
function applySeeds(){
  try {
    S.seeds = S.seeds || {};
    if (S.seeds.st2) return;
    S.ex = S.ex || {};
    D.exam.filter(e => e.grp === 'st2' && e.my).forEach(e => {
      if (S.ex[e.id]) return;
      const a = (e.a.match(/[①②③④⑤]/g) || []), m = (e.my.match(/[①②③④⑤]/g) || []);
      const ok = e.kind === 'ox' ? e.a === e.my : (m.length === a.length && m.every(c => a.includes(c)));
      S.ex[e.id] = {n: 1, w: ok ? 0 : 1, last: ok, t: Date.now()};
    });
    S.seeds.st2 = 1; save();
    try { const cur = (TABS.find(t => document.getElementById('p-'+t[0]).classList.contains('on')) || ['today'])[0]; if (cur === 'exam' && !X.sess) renderers.exam(); } catch(e){}
  } catch(e){}
}
(async function initSync(){
  try {
    if (!(window.claude && window.claude.use)){ setTimeout(applySeeds, 0); return; }
    const db = await window.claude.use('db'); if (!db) return;
    DBR = db.doc('state/progress');
    const snap = await DBR.get();
    const r = snap.exists ? snap.data() : null;
    if (r && r.upd > (S.upd || 0)) applyRemote(r);
    else if (S.upd) push();
    setSync('☁ 동기화됨'); applySeeds();
    DBR.onSnapshot(sn => {
      if (!sn.exists) return;
      const x = sn.data();
      if (x.upd > (S.upd || 0) && !dirty && !pushing) applyRemote(x);
    }, () => {});
  } catch(e){ setSync(''); applySeeds(); }
})();
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const todayKey = () => dayKey(Date.now());
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
let tl = t => +t <= 10 ? t+'순위' : (+t-10 <= 6 ? '1주차' : '2주차')+'·운'+(+t-10);
const lawOfTopic = t => +t >= 11 ? '운영규정' : '조직법·정관';

/* ───────── 테마·탭 ───────── */
(function(){
  if (S.theme) document.documentElement.dataset.theme = S.theme;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    S.theme = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme; save();
  };
})();
const TABS = [['today','🎯 오늘'],['read','📖 회독'],['bt','🕳 뻥뚫'],['quiz','🧠 복습 카드'],['exam','🗂 기출·오답'],['rev','🆕 개정'],['find','🔍 검색'],['table','📊 대조·숫자'],['lab','🔬 실험실'],['ask','💬 Claude 질문']];
const renderers = {};
function showTab(id){
  if (!TABS.some(t => t[0] === id)) id = 'today';
  $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-'+id));
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === id));
  window.scrollTo(0, 0);
  if (renderers[id]) renderers[id]();
  try { history.replaceState(null, '', '#'+id); } catch(e){}
  try { localStorage.setItem('orgmaster.tab', id); } catch(e){}
  const fb = document.getElementById('fabs'); if (fb) fb.hidden = id !== 'read';
  if (id === 'read') resumeRead(false);
}
function fixPad(){ const h = document.querySelector('header'); if (h){ document.documentElement.style.scrollPaddingTop = (h.offsetHeight + 48) + 'px'; document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); } }
addEventListener('resize', fixPad);
$('#tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-id="${t[0]}">${t[1]}</button>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.id); };

/* D-day: 가장 가까운 시험 */
function examList(){
  const now = new Date(); now.setHours(0,0,0,0);
  return (D.exams || [{date:D.target, label:'시험'}]).map(e => Object.assign({}, e, {n: Math.round((new Date(e.date+'T00:00:00') - now) / 864e5)}));
}
const fmtDD = n => n > 0 ? `D-${n}` : n === 0 ? 'D-DAY' : `D+${-n}`;
(function(){
  const ex = examList();
  const nx = ex.find(e => e.n >= 0) || ex[ex.length-1];
  $('#dday').textContent = fmtDD(nx.n) + ' · ' + nx.label;
})();

/* ───────── 오늘 ───────── */
let dayIdx = null;
function pickDay(){
  const t = todayKey();
  let i = D.days.findIndex(d => d.date === t);
  if (i < 0) i = t < D.days[0].date ? 0 : D.days.length - 1;
  return i;
}
function cardStats(){
  const all = Object.entries(S.cards);
  const first = all.filter(([,c]) => c.first !== undefined);
  const firstOk = first.filter(([,c]) => c.first).length;
  const lastOk = all.filter(([,c]) => c.last).length;
  const seen = all.length;
  const mastered = all.filter(([,c]) => c.box >= 3).length;
  const byTopic = {};
  D.cards.forEach(c => {
    const st = S.cards[c.id];
    const o = byTopic[c.t] || (byTopic[c.t] = {n:0, seen:0, right:0, wrong:0, mastered:0});
    o.n++;
    if (st){ o.seen++; o.right += st.right||0; o.wrong += st.wrong||0; if (st.box >= 3) o.mastered++; }
  });
  return {seen, mastered, first:first.length, firstOk, lastOk, byTopic};
}
renderers.today = function(){
  if (dayIdx === null) dayIdx = pickDay();
  const d = D.days[dayIdx];
  const tk = todayKey();
  const todays = S.log.filter(l => dayKey(l.t) === tk);
  const todayOk = todays.filter(l => l.ok).length;
  const st = cardStats();
  const total = d.goals.length;
  const done = d.goals.filter((g,j) => S.checks[`d${dayIdx}.${j}`]).length;
  const weak = Object.entries(st.byTopic)
    .filter(([,o]) => o.right + o.wrong >= 3)
    .map(([t,o]) => [t, pct(o.right, o.right + o.wrong), o])
    .sort((a,b) => a[1] - b[1]).slice(0, 3);
  $('#p-today').innerHTML = `

/* 주차·묶음 정의 — 새 규정/주차가 생기면 이 목록에 한 줄만 추가하면 복습 카드·회독 선택에 나타난다 */
const GROUPS = [

  {id:'g3',  label:'🗓 운영규정 2주차 (10/16~22 · 6~7장)', topics:[17,18,19], law:null, lawName:'운영규정'}
];
const GR = id => GROUPS.find(g => g.id === id);

  const m = t.match(/(?:순위|주제)\s*([^\s(]+)/);

}

/* 본문의 '제N조'·'별표 제N호' 참조를 링크로 만든다 (더블클릭/더블탭 이동) */
const XA = new Set(D.articles.filter(a => a.type === 'a').map(a => a.law + ':' + a.no));
const XB = new Set([...((D.extra && D.extra['운영규정']) || '').matchAll(/\[별표 제(\d+)호\]/g)].map(m => '운영규정:' + m[1]).concat(['정관:1']));
const XRE = /별표(?:\s*제?(\d+)호?)?|제(\d+)조(?:의(\d+))?/g;
function linkRefs(){
  $$('#r-body .chap').forEach(c => { const m = c.textContent.match(/^\[별표(?:\s*제(\d+)호)?\]/); if (m) c.id = 'byeol-' + R.law + '-' + (m[1] || 1); });
  $$('#r-body .ln, #r-body td').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()) { const n = w.currentNode; if (!n.parentElement.closest('.b, .xr')) nodes.push(n); }
    nodes.forEach(n => {
      const t = n.nodeValue; XRE.lastIndex = 0; let m, last = 0, out = null;
      while ((m = XRE.exec(t))){
        const pre = t.slice(Math.max(0, m.index - 12), m.index);
        let law = R.law;

        else { key = law + ':' + m[2] + (m[3] ? '의' + m[3] : ''); kind = 'a'; if (!XA.has(key)) continue; }
        if (!out){ out = document.createDocumentFragment(); }
        out.appendChild(document.createTextNode(t.slice(last, m.index)));

        out.appendChild(sp); last = m.index + m[0].length;

}

/* ③ 조사·접속어·'한다'류 어미만 남기고 나머지 낱말을 모두 가린다 (눌러서 확인) */
const CK3 = new Set(['및','또는','그','이','각','다만','이를','이에','그리고','하여야','한다','된다','이다','있다','없다','아니한다','않는다','같다']);
const PA2 = /(으로서|으로써|으로부터|에게서|이라고|라고|에서는|에서도|으로는|으로도|까지는|부터는|에게는|에서|에게|으로|로서|로써|로부터|까지|부터|보다|마다|조차|이나|이고|이라|에는|에도|에의|와의|과의|에만|이란)$/;
const PA1 = /[은는이가을를의에로도만과와며고나]$/;
const EN3 = /(한다|된다|이다|있다|없다)$/;
function split3(t){
  if (CK3.has(t)) return null;
  let m;
  if ((m = t.match(PA2)) && t.length > m[1].length) return [t.slice(0, -m[1].length), m[1]];
  if ((m = t.match(EN3)) && t.length > m[1].length) return [t.slice(0, -m[1].length), m[1]];
  if (t.length >= 3 && PA1.test(t)) return [t.slice(0, -1), t.slice(-1)];
  return [t, ''];
}
function cloze3(){
  $$('#r-body .ln, #r-body td').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()){ const n = w.currentNode; if (!n.parentElement.closest('.b, .xr, .amend')) nodes.push(n); }
    nodes.forEach(n => {
      const t = n.nodeValue, re = /[가-힣A-Za-z0-9]+/g; let m, last = 0, out = document.createDocumentFragment(), hit = false;
      while ((m = re.exec(t))){
        if (/^\d+$/.test(m[0]) && /^[.)]/.test(t.slice(re.lastIndex, re.lastIndex + 1))) continue;
        const sp = split3(m[0]); if (!sp) continue;
        out.appendChild(document.createTextNode(t.slice(last, m.index)));
        const b = document.createElement('span'); b.className = 'b b3'; b.textContent = sp[0]; out.appendChild(b);
        if (sp[1]) out.appendChild(document.createTextNode(sp[1]));
        last = re.lastIndex; hit = true;
      }
      if (hit){ out.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(out, n); }
    });
  });
}

function findIndex(){
  if (F.idx) return F.idx;
  F.idx = [].concat(
    D.articles.filter(a => a.type === 'a').map(a => ({k:'law', sc:a.law, a, t:nl(a.no) + '(' + a.title + ')', h:a.title, x:plain(a.html)})),

const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function findRun(){

const INT_H = [0, 4, 20, 44, 90]; // 상자별 다음 복습 간격(시간)

/* 로그를 처음부터 다시 계산해 카드 상태를 복원 (기록 수정용) */
function replay(id){
  const es = S.log.filter(l => l.id === id);
  if (!es.length){ delete S.cards[id]; return; }
  const st = {box:0, right:0, wrong:0, due:0}, was = S.cards[id];
  es.forEach((l,k) => {
    if (k === 0) st.first = l.ok;
    st.last = l.ok;
    if (l.ok){ st.right++; st.box = Math.min(4, st.box + 1); } else { st.wrong++; st.box = 0; }
    st.due = l.t + INT_H[st.box] * 36e5;
  });
  if (was && was.cleared && st.last) st.cleared = true;
  S.cards[id] = st;
}
/* 오답노트: 한 번이라도 틀렸고, '완전히 알겠다'로 뺀 적이 없는 카드 */
const inNote = c => { const s = S.cards[c.id]; return !!(s && s.wrong > 0 && !s.cleared); };
function norm(s){ return String(s).toLowerCase().replace(/[\s·ㆍ,.\-~()「」\[\]'"“”]/g, ''); }

/* 카드 출처(src)에서 조문을 뽑아, 회독한 조문의 카드만 '공부한 범위'로 본다 */
function cardArts(c){
  if (c._arts) return c._arts; if (c.art) return (c._arts = [c.art]);
  const out = []; let law = null;
  c.src.split(/\s*·\s*/).forEach(seg => {
    const m = seg.match(new RegExp('^(' + LAW_LIST.join('|') + ')')); if (m) law = m[1];
    for (const x of seg.matchAll(/제(\d+)조(?:의(\d+))?/g)) if (law) out.push(law + ':' + x[1] + (x[2] ? '의' + x[2] : ''));
  });
  return c._arts = out;
}
const inScope = c => { const a = cardArts(c); return !a.length || a.some(k => S.reads[k] > 0); };
/* 정답을 낱말로 쪼개 조사를 떼고(명예회장은→명예회장), 입력에 그 낱말이 들어 있는지 본다 */
const PARTICLE = /(에서|으로|은|는|이|가|을|를|의|에|로|과|와|도|한다|된다|이다)$/;
function segs(a){
  const out = [];
  a.split(/[\s,，·/→+=:()「」]+/).forEach(w => {
    let t = w.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]/, '');
    const st = t.replace(PARTICLE, '');
    if (norm(st).length >= 2) t = st;
    if (norm(t).length >= 2 && !out.includes(t)) out.push(t);
  });
  return out;
}
function dueNow(c){ const st = S.cards[c.id]; return !st || st.due <= Date.now(); }
function curGroup(){
  if (Q.group === null){
    const t = dayTarget().topics[0], g = GROUPS.find(g => !g.sub && g.topics.includes(t));
    Q.group = g ? g.id : 'all';

  return Q.group === 'all' ? null : GR(Q.group);
}
function inGroup(c, g){ g = g === undefined ? curGroup() : g; return !g || (g.topics.includes(c.t) && (!g.law || c.src.includes(g.law))); }
function syncQ(){ const g = id => document.getElementById(id); if (!g('q-mode')) return;
  Q.study = g('q-study').checked; Q.retry = g('q-retry').value; Q.mode = g('q-mode').value; Q.limit = +g('q-limit').value; Q.tag = g('q-tag').value; }
function buildQueue(){
  let cs = D.cards.filter(c => inGroup(c) && (Q.topics.size === 0 || Q.topics.has(c.t)) && (!Q.scope || inScope(c)));
  if (Q.mode === 'due') cs = cs.filter(dueNow);

}

function reveal(){
  if (Q.shown) return;

  }
  Q.typed = auto;
  let part = '';
  if (typed && auto === null){
    const sg = segs(c.a), nt = norm(typed);
    if (sg.length >= 1){
      const hit = sg.map(x => nt.includes(norm(x)));
      part = `<div class="small" style="margin-top:8px">입력에 들어 있는 핵심어 <b>${hit.filter(Boolean).length}/${sg.length}</b> : ` +

function grade(ok, clear){
  if (!Q.shown) return;
  const c = Q.queue[Q.i], now = Date.now();
  Q.hist.push({i:Q.i, id:c.id, retry:!!c.retry, prev:S.cards[c.id] ? JSON.stringify(S.cards[c.id]) : null,
    sess:JSON.stringify(Q.sess), qLen:Q.queue.length, logged:false});
  Q.sess.n++; Q.sess.ms += now - Q.t0;
  if (c.retry){
    Q.sess.retry++; if (ok) Q.sess.retryOk++;
  } else {
    if (ok) Q.sess.ok++;
    const st = S.cards[c.id] || (S.cards[c.id] = {box:0, right:0, wrong:0, due:0});
    if (st.first === undefined) st.first = ok;
    st.last = ok;
    if (!ok) delete st.cleared; else if (clear) st.cleared = true;
    if (ok){ st.right++; st.box = Math.min(4, st.box + 1); }
    else { st.wrong++; st.box = 0; }
    st.due = now + INT_H[st.box] * 36e5;
    S.log.push({t:now, id:c.id, ok, tag:Q.sess.tag}); Q.hist[Q.hist.length-1].logged = true;
    if (S.log.length > 1000) S.log.splice(0, S.log.length - 1000);
    if (!ok && Q.retry === 'end'){ Q.queue.push(Object.assign({}, c, {retry:true})); }
  }
  save(); Q.i++; drawCard();
}
function studyNext(){
  const c = Q.queue[Q.i];
  Q.hist.push({i:Q.i, id:c.id, retry:false, prev:null, sess:JSON.stringify(Q.sess), qLen:Q.queue.length, logged:false});
  Q.sess.study++;
  S.cards[c.id] = {box:0, right:0, wrong:0, due:Date.now() + INT_H[1] * 36e5};
  save(); Q.i++; drawCard();
}
function undoGrade(){
  const h = Q.hist.pop(); if (!h || !Q.sess) return;
  if (h.logged) S.log.pop();
  if (h.prev === null) delete S.cards[h.id]; else S.cards[h.id] = JSON.parse(h.prev);
  if (Q.queue.length > h.qLen) Q.queue.pop();
  Q.sess = JSON.parse(h.sess); Q.i = h.i; save(); drawCard();
}
function endSession(){
  const s = Q.sess; Q.sess = null;
  if (s && s.n > 0){ S.sessions.push(s); save(); }
  const first = s ? s.n - s.retry : 0;
  const nextMsg = s && s.study ? '<p>새로 익힌 카드는 <b>4시간 뒤</b> 🧠 복습 카드의 "복습할 차례"에 올라옵니다. 그때 시험을 보세요.</p>' : '';
  $('#p-quiz').innerHTML = `<h2>세션 종료</h2>
  <div class="kpis">
    <div class="kpi"><b>${s?s.study:0}</b>새로 익힌 카드</div>
    <div class="kpi"><b>${first}</b>시험 본 카드</div>
    <div class="kpi"><b>${pct(s?s.ok:0, first)}%</b>첫 시도 정답률</div>
    <div class="kpi"><b>${s?s.retry:0}</b>다시 도전</div>
    <div class="kpi"><b>${s&&s.n?Math.round(s.ms/s.n/1000):0}초</b>카드당 시간</div></div>
  ${nextMsg}
  <p>틀린 카드는 원문에서 조문을 찾아 <b>소리 내어 한 번</b> 읽고, 내일 아침에 다시 꺼내 보세요.</p>
  <div class="row"><button class="b-red" id="q-home">다시 설정</button>
  <button class="b-line" data-go="lab" onclick="showTab('lab')">🔬 실험실 보기</button></div>`;
}
document.addEventListener('keydown', e => {
  if (!$('#p-quiz').classList.contains('on') || !Q.sess) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.key !== 'Enter') return;
  if (Q.studyView){ if (e.key === 'Enter' || e.key === '1'){ e.preventDefault(); studyNext(); } return; }
  if (e.key === 'Enter'){ e.preventDefault(); if (!Q.shown) reveal(); return; }
  if (!Q.shown) return;
  if (e.key === '1') grade(true);
  if (e.key === '2') grade(false);
  if (e.key === '3' && Q.shown && inNote(Q.queue[Q.i])) grade(true, true);
});

/* ═════ 규정 데이터: 앞의 3종(조직법·정관·운영규정)은 페이지에 들어 있고, 나머지는 처음 열 때 파일에서 불러온다 ═════ */
const LAW_INDEX = D.lawIndex || [];
const BASE_LAWS = ['조직법', '정관', '운영규정'];
const LAW_LIST = BASE_LAWS.concat(LAW_INDEX.map(l => l.law));
const LAW_STATE = {};                                   /* 규정 이름 → 'loaded' 또는 불러오는 중인 Promise */
const lawReady = law => BASE_LAWS.includes(law) || LAW_STATE[law] === 'loaded';
const allLawsReady = () => LAW_INDEX.every(l => lawReady(l.law));
function loadLaw(law){
  if (lawReady(law)) return Promise.resolve();

function rvDiff(a, b){
  const A = rvTok(a), B = rvTok(b), n = A.length, m = B.length;

    if (A[i] === B[j]){ push('=', A[i]); i++; j++; }

    else { push('+', B[j]); j++; }

  while (j < m) push('+', B[j++]);

  const out = [];
  ops.forEach((o, k) => {

/* ═════════ 🕳 뻥뚫: 난이도·빈칸 수를 고르고 조문의 빈칸을 직접 채운다 ═════════ */
const BT = Object.assign({law:'조직법', topic:'0', lv:2, max:10, md:'type', cnt:10, ord:'weak', ch:0}, S.btp || {},
  {sess:false, done:false, queue:[], i:0, res:[], checked:false});
const btRec = id => (S.bt && S.bt[id]) || null;
const btPrefs = () => { S.btp = {law:BT.law, topic:BT.topic, lv:BT.lv, max:BT.max, md:BT.md, cnt:BT.cnt, ord:BT.ord, ch:BT.ch}; save(); };
const LVD = {1:['쉬움', '숫자·주체(기관·장관)만 가립니다.'], 2:['보통', '숫자·주체에 승인·의결 같은 동사까지 가립니다.'], 3:['어려움', '조사·접속어만 남기고 낱말을 가립니다.']};
const btNorm = s => String(s).replace(/\s+/g, '');
function btTopics(law){
  const out = [{v:'0', l:'전체 조문'}];
  if (!BASE_LAWS.includes(law)){ const ix = LAW_INDEX.find(x => x.law === law); (ix ? ix.chapters : []).forEach(c => out.push({v:'c' + c.i, l:c.title})); return out; }
  if (law !== '운영규정') Object.keys(D.topics).filter(k => +k < 11).forEach(k => out.push({v:k, l:tl(k) + ' ' + D.topics[k]}));
  else GROUPS.filter(g => g.lawName === law).forEach(g => {
    out.push({v:g.id, l:g.label.replace(/^\S+\s/, '').replace(/\s*\(.*$/, '') + ' 전체', g:1});
    g.topics.forEach(k => out.push({v:String(k), l:tl(k) + ' ' + D.topics[k]}));
  });
  return out;
}
const blankCount = (a, lv) => lv === 3 ? 99 : (a.html.match(/class="b b1"/g) || []).length + (lv === 2 ? (a.html.match(/class="b b2"/g) || []).length : 0);
function btCands(){ return D.articles.filter(a => a.type === 'a' && a.law === BT.law && inTopic(a, BT.topic) && blankCount(a, BT.lv) > 0); }
const btShuffle = arr => { const q = arr.slice(); for (let i = q.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; } return q; };
function btPick(){
  let c = btCands();
  if (BT.ord === 'rand') c = btShuffle(c);
  else if (BT.ord === 'weak'){ const k = a => { const r = btRec(artId(a)); return r ? r.last : -1; }; c = c.map((a, i) => [a, i]).sort((x, y) => k(x[0]) - k(y[0]) || x[1] - y[1]).map(x => x[0]); }
  return BT.cnt ? c.slice(0, BT.cnt) : c;
}
/* 조사·접속어만 남기고 낱말을 빈칸으로 (회독 ③ 모드와 같은 규칙, 임의의 요소 안에서) */
function clozeIn(root){
  $$('.ln, td', root).forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()){ const n = w.currentNode; if (!n.parentElement.closest('.b, .xr, .amend')) nodes.push(n); }
    nodes.forEach(n => {
      const t = n.nodeValue, re = /[가-힣A-Za-z0-9]+/g; let m, last = 0, hit = false; const out = document.createDocumentFragment();
      while ((m = re.exec(t))){
        if (/^\d+$/.test(m[0]) && /^[.)]/.test(t.slice(re.lastIndex, re.lastIndex + 1))) continue;
        const sp = split3(m[0]); if (!sp) continue;
        out.appendChild(document.createTextNode(t.slice(last, m.index)));
        const b = document.createElement('span'); b.className = 'b b3'; b.textContent = sp[0]; out.appendChild(b);
        if (sp[1]) out.appendChild(document.createTextNode(sp[1]));
        last = re.lastIndex; hit = true;
      }
      if (hit){ out.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(out, n); }
    });
  });
}
function btBuild(a){
  const root = document.createElement('div'); root.innerHTML = a.html;
  $$('.b', root).forEach(b => {
    const t = b.classList.contains('b1') ? 1 : b.classList.contains('b2') ? 2 : 0;
    const keep = BT.lv === 1 ? t === 1 : BT.lv === 2 ? t > 0 : false;
    if (!keep) b.replaceWith(document.createTextNode(b.textContent));
  });
  root.normalize();
  if (BT.lv === 3) clozeIn(root);
  let bl = $$('.b', root);
  if (BT.max > 0 && bl.length > BT.max){
    const keep = new Set(btShuffle(bl.map((_, i) => i)).slice(0, BT.max));
    bl.forEach((b, i) => { if (!keep.has(i)) b.replaceWith(document.createTextNode(b.textContent)); });
    bl = bl.filter((_, i) => keep.has(i));
  }
  bl.forEach(b => {
    const ans = b.textContent, n = [...ans].length;
    if (BT.md === 'type'){
      const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'bt-in'; inp.dataset.ans = ans;
      inp.style.width = Math.max(3.4, n * 1.05 + 1.6) + 'em'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('aria-label', '빈칸');
      if (BT.ch) inp.placeholder = czCho(ans);
      b.replaceWith(inp);
    } else {
      const s = document.createElement('span'); s.className = 'bt-tap'; s.dataset.ans = ans; s.textContent = ans; b.replaceWith(s);
    }
  });
  return root;
}

function btRecord(ok, tot){

function btCheck(){
  if (BT.checked) return;

  ins.forEach(inp => {
    const good = btNorm(inp.value) === btNorm(inp.dataset.ans);
    inp.classList.add(good ? 'ok' : 'no'); inp.disabled = true;
    if (good) ok++; else { const fx = document.createElement('span'); fx.className = 'bt-fix'; fx.textContent = inp.dataset.ans; inp.after(fx); }
  });
  $('#bt-res').innerHTML = `<div class="${ok === ins.length ? 'note' : 'xex'}"><b>${ok} / ${ins.length}</b> ${ok === ins.length ? '모두 맞혔습니다 👏' : '· 틀린 칸의 정답을 초록색으로 표시했습니다.'}</div>`;

function drawBtEnd(){
  const tot = BT.res.reduce((s, r) => s + r.tot, 0), ok = BT.res.reduce((s, r) => s + r.ok, 0);

  $('#p-bt').innerHTML = `<h2>결과 ${ok} / ${tot} <span class="mute small">(${pct(ok, tot)}%) · ${BT.res.length}개 조문</span></h2>

$('#p-bt').addEventListener('click', e => {
  const t = e.target, id = t.id, pick = (attr, fn) => { const b = t.closest('[' + attr + ']'); if (b){ fn(b.getAttribute(attr)); btPrefs(); drawBtHome(); return true; } };
  if (pick('data-bl', v => { BT.law = v; BT.topic = '0'; })) return;
  if (pick('data-btt', v => { BT.topic = v; })) return;
  if (pick('data-lv', v => { BT.lv = +v; })) return;
  if (pick('data-max', v => { BT.max = +v; })) return;
  if (pick('data-md', v => { BT.md = v; })) return;
  if (pick('data-ch', v => { BT.ch = +v; })) return;
  if (pick('data-cnt', v => { BT.cnt = +v; })) return;
  if (pick('data-ord', v => { BT.ord = v; })) return;
  const ga = t.closest('[data-goart]'); if (ga){ showTab('read'); setTimeout(() => goRef('a|' + ga.dataset.goart), 60); return; }
  const tap = t.closest('.bt-tap'); if (tap){ tap.classList.toggle('rev'); return; }
  if (id === 'bt-start'){ const q = btPick(); if (!q.length){ toast('출제할 조문이 없습니다.'); return; } BT.queue = q; BT.i = 0; BT.res = []; BT.sess = true; BT.done = false; drawBt(); window.scrollTo(0, 0); }
  else if (id === 'bt-hint') $$('#bt-art .bt-in:not(:disabled)').forEach(i => { if (!i.value) i.placeholder = czCho(i.dataset.ans); });
  else if (id === 'bt-check') btCheck();
  else if (id === 'bt-ok' || id === 'bt-no'){ if (BT.checked) return; $$('#bt-art .bt-tap').forEach(s => s.classList.add('rev')); const n = $$('#bt-art .bt-tap').length; btRecord(id === 'bt-ok' ? n : 0, n); }
  else if (id === 'bt-next'){ BT.i++; drawBt(); window.scrollTo(0, 0); }
  else if (id === 'bt-end'){ BT.done = true; drawBtEnd(); }
  else if (id === 'bt-home'){ BT.sess = false; drawBtHome(); }
  else if (id === 'bt-retry'){
    const q = BT.res.filter(r => r.ok < r.tot).map(r => D.articles.find(a => a.type === 'a' && artId(a) === r.id)).filter(Boolean);
    BT.queue = q; BT.i = 0; BT.res = []; BT.done = false; drawBt(); window.scrollTo(0, 0);
  }
});
$('#p-bt').addEventListener('keydown', e => {

const _rToday = renderers.today;
renderers.today = function(){ _rToday(); try { todayEnhance(); } catch(e){ console.warn(e); } };
function todayEnhance(){
  const p = $('#p-today'), t = todayKey(); S.skip = S.skip || {};
  const idx = D.days.map((_, i) => i), firstUp = D.days.findIndex(d => d.date >= t);
  const pastIdx = idx.filter(i => D.days[i].date < t);
  const gstat = i => ({tot: D.days[i].goals.length, done: D.days[i].goals.filter((g, j) => S.checks[`d${i}.${j}`]).length});
  const late = []; pastIdx.forEach(i => { if (S.skip[i]) return; D.days[i].goals.forEach((g, j) => { if (!S.checks[`d${i}.${j}`]) late.push({i, j, g}); }); });
  const row = $$('.row', p).find(r => r.querySelector('[data-day]')); if (!row) return;
  const show = new Set(firstUp < 0 ? [] : idx.filter(i => i >= firstUp && i < firstUp + 7)); if (dayIdx !== null) show.add(dayIdx);
  row.innerHTML = [...show].sort((a, b) => a - b).map(i => `<button class="chip ${i === dayIdx ? 'on' : ''}" data-day="${i}">${esc(D.days[i].label)}${D.days[i].date === t ? ' · 오늘' : ''}</button>`).join('');
  /* 약점 기반 추천 */
  const wr = exWrongCount(), weakB = Object.values(S.bt || {}).filter(r => r.last < 0.7).length;
  const items = amendItems(), maxY = +items[0].latest.slice(0, 4), seenR = S.revSeen || {};
  const revNew = items.filter(it => +it.latest.slice(0, 4) >= maxY - 1 && !seenR[revKey(it)]).length;
  const st = cardStats(), weakT = Object.entries(st.byTopic).filter(([, o]) => o.right + o.wrong >= 3).map(([k, o]) => [k, pct(o.right, o.right + o.wrong)]).filter(x => x[1] < 70).sort((a, b) => a[1] - b[1]).slice(0, 2);
  const recs = [];
  if (wr) recs.push(['📕', `오답노트 <b>${wr}</b>문제`, '풀기', 'data-recx="1"']);
  if (weakB) recs.push(['🕳', `뻥뚫 정답률 낮은 조문 <b>${weakB}</b>개`, '뻥뚫', 'data-go="bt"']);
  if (weakT.length) recs.push(['🧠', '약한 주제 ' + weakT.map(([k, v]) => `${esc(D.topics[k])} ${v}%`).join(', '), '복습 카드', 'data-go="quiz"']);
  if (revNew) recs.push(['🆕', `확인 안 한 최근 개정 <b>${revNew}</b>건`, '보기', 'data-go="rev"']);
  const recHtml = `<div class="card rec-card"><b>🎯 오늘 추천</b>${recs.length ? recs.map(r => `<div class="rec"><span>${r[0]}</span><span class="grow">${r[1]}</span><button class="rc" ${r[3]}>${r[2]}</button></div>`).join('')
    : '<p class="small mute" style="margin:6px 0 0">아직 약점 기록이 없습니다. <b>🕳 뻥뚫</b>이나 <b>🗂 기출</b>을 한 번 풀면 여기에 복습할 것이 나타납니다.</p>'}</div>`;
  const lateHtml = late.length ? `<div class="card late-card"><div class="row"><b class="grow">⏰ 밀린 일 ${late.length}개</b><button class="rc" data-skipall="1">모두 건너뛰기</button></div>
    ${late.slice(0, 8).map(({i, j, g}) => `<label class="check"><input type="checkbox" data-chk="d${i}.${j}"><span>${g.tag ? `<span class="badge">${esc(g.tag)}</span>` : ''}${g.t} <span class="mute small">· ${esc(D.days[i].label)}</span></span></label>`).join('')}
    ${late.length > 8 ? `<p class="small mute" style="margin:6px 0 0">나머지 ${late.length - 8}개는 아래 '지난 일정'에서 날짜별로 볼 수 있습니다.</p>` : ''}</div>` : '';
  const skipN = pastIdx.filter(i => S.skip[i]).length;
  const pastHtml = pastIdx.length ? `<details class="card past-card"><summary><b>지난 일정 ${pastIdx.length}일</b> <span class="mute small">미완료 ${late.length}개${skipN ? ' · 건너뜀 ' + skipN + '일' : ''}</span></summary>
    ${pastIdx.map(i => { const s = gstat(i), sk = !!S.skip[i]; return `<div class="exrow past"><span class="dd">${esc(D.days[i].label)}</span><span class="nm grow">${esc(D.days[i].title)}</span><span class="mute small">${s.done}/${s.tot}${sk ? ' · 건너뜀' : ''}</span><button class="rc" data-day="${i}">보기</button><button class="rc" data-skip="${i}">${sk ? '건너뜀 해제' : '건너뛰기'}</button></div>`; }).join('')}</details>` : '';
  row.insertAdjacentHTML('beforebegin', recHtml + lateHtml + pastHtml);
}

function schedPrep(s){

      const g = /제6장/.test(x) ? 'g3' : /제1장/.test(x) ? 'g2' : '0';
      out.push({law:'운영규정', topic:g, l: g === 'g3' ? '운영규정 6~7장' : g === 'g2' ? '운영규정 1~5장' : '운영규정'});
    } else {

/* ── 회독 목차 사이드바 (가로 화면) ── */
function syncToc(){
  const body = $('#r-body'); if (!body) return;
  let wrap = $('.rd-wrap');
  if (!wrap){
    wrap = document.createElement('div'); wrap.className = 'rd-wrap';
    const aside = document.createElement('aside'); aside.id = 'r-toc'; aside.setAttribute('aria-label', '목차');
    const main = document.createElement('div'); main.className = 'rd-main';
    body.parentNode.insertBefore(wrap, $('#r-crumb'));
    main.appendChild($('#r-crumb')); main.appendChild(body); wrap.append(aside, main);
    aside.addEventListener('click', e => { const b = e.target.closest('[data-tj]'); if (!b) return; const j = $('#r-jump'); j.value = b.dataset.tj; j.dispatchEvent(new Event('change')); });
  }
  const jump = $('#r-jump'); let h = '';
  const item = o => { const id = o.value.slice(2), read = S.reads[id] > 0; return `<button class="toc-a" data-tj="${esc(o.value)}" data-id="${esc(id)}"><span class="ck">${read ? '✓' : ''}</span><span>${esc(o.textContent.trim())}</span></button>`; };
  [...jump.children].forEach(c => {
    if (c.tagName === 'OPTION' && c.value.startsWith('a-')) h += item(c);
    if (c.tagName === 'OPTGROUP'){
      const first = c.querySelector('option');
      h += `<button class="toc-ch" data-tj="${esc(first ? first.value : '')}">${esc(c.label)}</button>` + [...c.querySelectorAll('option')].filter(o => o.value.startsWith('a-')).map(item).join('');
    }
  });
  $('#r-toc').innerHTML = h || '<p class="small mute" style="padding:8px">목차가 없습니다.</p>';
  tocSpy();
}
let tocRaf = 0;
function tocSpy(){
  tocRaf = 0; const aside = $('#r-toc'); if (!aside || !aside.offsetParent) return;
  const top = (parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 100) + 40;
  let cur = null; for (const a of $$('#r-body .art')){ if (a.getBoundingClientRect().top > top) break; cur = a; }
  $$('#r-toc .toc-a.on').forEach(b => b.classList.remove('on'));
  if (!cur) return;
  const b = $('#r-toc [data-id="' + cur.id.slice(2).replace(/"/g, '\\"') + '"]'); if (!b) return;
  b.classList.add('on');
  const bt = b.offsetTop, bh = b.offsetHeight; if (bt < aside.scrollTop + 8) aside.scrollTop = bt - 40; else if (bt + bh > aside.scrollTop + aside.clientHeight - 8) aside.scrollTop = bt + bh - aside.clientHeight + 40;
}
addEventListener('scroll', () => { if (!tocRaf && $('#p-read').classList.contains('on')) tocRaf = requestAnimationFrame(tocSpy); }, {passive: true});

/* ═════ 선배 앱 문제 (기출 12묶음 · 스터디 문제 98묶음): 묶음 파일은 누를 때 불러온다 ═════ */
const QINDEX = D.quizIndex || [];
const QNAME = Object.fromEntries(QINDEX.map(g => [g.id, g.name]));
const QLOADED = {}, QPROM = {};                         /* 묶음 id → 문제 목록 / 불러오는 중인 Promise */
function loadQuizGroup(id){
  if (QLOADED[id]) return Promise.resolve(QLOADED[id]);
  if (QPROM[id]) return QPROM[id];
  const g = QINDEX.find(x => x.id === id);
  if (!g) return Promise.reject(new Error('알 수 없는 묶음: ' + id));
  return (QPROM[id] = fetch(g.file).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { QLOADED[id] = j.items; delete QPROM[id]; return j.items; })
    .catch(e => { delete QPROM[id]; throw e; }));
}
const loadQuizGroups = ids => Promise.all(ids.map(loadQuizGroup));
const QID_RX = /^((?:past|sen)-\d+)-\d+$/;
const exById = id => D.exam.find(e => e.id === id) || ((QLOADED[(id.match(QID_RX) || [])[1]] || []).find(e => e.id === id));
const exWrongCount = () => Object.values(S.ex || {}).filter(r => !r.last).length;
const wrongGroupIds = () => [...new Set(Object.entries(S.ex || {}).filter(([id, r]) => !r.last && QID_RX.test(id)).map(([id]) => id.match(QID_RX)[1]))];
const groupProgress = id => { let n = 0, w = 0; for (const [k, r] of Object.entries(S.ex || {})) if (k.startsWith(id + '-')){ n++; if (!r.last) w++; } return {n, w}; };
/* 불러오는 데 시간이 걸리면 알림 */
function withLoadingToast(p, msg){ const t = setTimeout(() => toast(msg || '문제 불러오는 중…'), 250); const done = () => clearTimeout(t); p.then(done, done); return p; }

/* 원문 복원본 2024·2025 기출은 선배 앱 기출로 대체했으므로, 예전 풀이 기록을 새 번호로 한 번만 옮긴다 */
(function(){
  try {
    if (S.exmig || !D.exMap) return;
    S.ex = S.ex || {};
    for (const [o, nw] of Object.entries(D.exMap)) if (S.ex[o]){ if (!S.ex[nw]) S.ex[nw] = S.ex[o]; delete S.ex[o]; }
    S.exmig = 1; save();
  } catch (e) { console.warn(e); }
})();

/* 기존 기출·오답 코드가 새 문제에서도 맞게 동작하도록 이어 붙인다 */
const _exLabel = exLabel;
exLabel = e => QNAME[e.grp] ? QNAME[e.grp] + ' ' + e.no + '번' : _exLabel(e);
const _exChoices = exChoices;
exChoices = e => {
  if (e.kind === 'mc'){
    const n = Math.max(0, ...(e.q.match(/^[①-⑥]/gm) || []).map(c => '①②③④⑤⑥'.indexOf(c) + 1));
    if (n >= 2) return '①②③④⑤⑥'.slice(0, n).split('');
  }
  return _exChoices(e);
};
const _xPool = xPool;
xPool = function(){
  if (X.grp === 'custom') return X.custom || [];
  if (QLOADED[X.grp]) return QLOADED[X.grp];
  if (X.grp === 'wrong'){
    const extra = []; wrongGroupIds().forEach(gid => (QLOADED[gid] || []).forEach(e => { if (exWrong(e)) extra.push(e); }));
    return _xPool().concat(extra);
  }
  return _xPool();
};
const _xQueue = xQueue;
xQueue = function(){ let q = _xQueue(); if (X.grp === 'custom' && X.limit > 0) q = q.slice(0, X.limit); return q; };
X.limit = (S.xlim !== undefined ? S.xlim : 20);
const _xStart = xStart;
xStart = async function(grp){
  try {
    if (grp === 'wrong') await withLoadingToast(loadQuizGroups(wrongGroupIds()));
    else if (QINDEX.some(g => g.id === grp)) await withLoadingToast(loadQuizGroup(grp));
  } catch (e){ toast('문제 파일을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  _xStart(grp);
};
/* 법령별로 모아 풀기: 그 법령 문제가 들어 있는 묶음만 불러와 같은 문제는 한 번만 담는다 */
async function startLawQuiz(laws){
  const cand = QINDEX.filter(g => laws.some(l => (g.areas || {})[l]));
  let gids = cand.map(g => g.id);
  if (X.limit > 0 && X.mode !== 'new'){            /* 문제 수가 정해져 있으면 필요한 만큼의 묶음만 무작위로 골라 불러온다 (중복 제거 여유분 3배) */
    let acc = 0; gids = [];
    for (const g of btShuffle(cand)){ gids.push(g.id); acc += laws.reduce((m, l) => m + ((g.areas || {})[l] || 0), 0); if (acc >= X.limit * 3) break; }
  }
  try { await withLoadingToast(loadQuizGroups(gids), '문제 ' + gids.length + '개 묶음 불러오는 중…'); }
  catch (e){ toast('문제 파일을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  const seen = new Set(), items = [];
  gids.forEach(id => QLOADED[id].forEach(e => { if (!laws.includes(e.area)) return; const k = e.q + '|' + e.a; if (seen.has(k)) return; seen.add(k); items.push(e); }));
  X.custom = items;
  if (X.mode === 'order') X.mode = 'rand';
  _xStart('custom');
}
const lawQuizCount = laws => QINDEX.reduce((n, g) => n + laws.reduce((m, l) => m + ((g.areas || {})[l] || 0), 0), 0);

/* ── 기출·오답 첫 화면 ── */
const _drawXHome2 = drawXHome;

drawXHome = function(){
  _drawXHome2();
  const notes = $$('#p-exam > p.small.mute').slice(1).map(n => n.outerHTML).join('');

      <span class="small mute">${sub} · 푼 ${d} · 오답 ${w}</span>

      <button class="b-red" data-xstart="${grp}" ${total ? '' : 'disabled'}>풀기</button></div>`;
  const local = g => { const p = all.filter(e => e.grp === g); return {t: p.length, d: p.filter(e => exRec(e.id)).length, w: p.filter(exWrong).length}; };
  const lawCard = l => { const n = lawQuizCount([l]); return `<div class="pk"><div class="pk-m"><b>${esc(l)}</b><span class="small mute">문제 ${n}개 · 묶음에서 모아 풀기</span></div><button class="b-red" data-xlaw="${esc(l)}" ${n ? '' : 'disabled'}>풀기</button></div>`; };
  const past = QINDEX.filter(g => g.kind === 'past'), sen = QINDEX.filter(g => g.kind === 'senior');
  const yr = g => (g.name.match(/^(\d{4})년/) || [])[1] || '기타';

  $('#p-exam').innerHTML = `

  <div class="cs-box">
    <div class="cs-row"><span class="cs-lab">방식</span><div class="cs">${[['order', '번호 순서'], ['rand', '무작위'], ['new', '안 푼 문제만']].map(m => chip('data-xmode', m[0], m[1], X.mode === m[0])).join('')}</div></div>
    <div class="cs-row"><span class="cs-lab">유형</span><div class="cs">${[['', '전체'], ['mc', '객관식·OX'], ['sa', '주관식']].map(m => chip('data-xkind', m[0], m[1], (X.kind || '') === m[0])).join('')}</div></div>
    <div class="cs-row"><span class="cs-lab">모아 풀기</span><div class="cs">${[[10, '10문제'], [20, '20문제'], [50, '50문제'], [0, '전부']].map(m => chip('data-xlim', m[0], m[1], X.limit === m[0])).join('')}</div></div>
  </div>
  <p class="small mute" style="margin:8px 0">번호를 누르면 바로 채점되고, 틀린 문제는 오답노트에 쌓입니다. 오답노트에서 다시 맞히면 빠집니다.</p>
  <h3>📕 오답노트</h3>
  <div class="pk-grid"><div class="pk"><div class="pk-m"><b>틀린 문제만</b><span class="small mute">전체 묶음의 오답 ${wr}문제</span></div><button class="b-red" data-xstart="wrong" ${wr ? '' : 'disabled'}>풀기 (${wr})</button></div></div>
  <h3>📚 법령별로 모아 풀기 <span class="mute small">모든 기출·스터디 문제에서 그 법령만 골라 위의 '모아 풀기' 개수만큼</span></h3>
  <div class="pk-grid">${LAW_LIST.map(lawCard).join('')}</div>
  <h3>🗂 기출 (선배 앱) <span class="mute small">2018~2025년 4급 · 전직시험</span></h3>
  <div class="pk-grid">${past.map(grpCard).join('')}</div>
  <h3>📝 2026 기출 · 스터디 문제 <span class="mute small">원문 복원본 (선배 앱에 없는 문제)</span></h3>
  <div class="pk-grid">${XG.map(([g, l]) => { const c = local(g); return card(g, l.replace(/^📕 /, ''), c.t + '문제', c.d, c.w, c.t); }).join('')}</div>
  <details class="card" ${X.sfOpen ? 'open' : ''} id="x-sen"><summary><b>🧑‍🤝‍🧑 스터디 문제 묶음 (${sen.length})</b> <span class="mute small">선배 스터디에서 만든 문제</span></summary>
    <div class="fsc" style="margin:10px 0">${years.map(y => chip('data-xsf', y, y === 'all' ? '전체' : y, X.sf === y)).join('')}</div>
    <div class="pk-grid">${senShown.map(grpCard).join('')}</div></details>

};
$('#p-exam').addEventListener('click', e => {
  const l = e.target.closest('[data-xlaw]'); if (l){ startLawQuiz([l.dataset.xlaw]); return; }

/* ═════ 복습 카드: 스터디 일정의 '1회독 차수'를 한 단위로 (2회독 이후는 같은 과목의 반복이라 따로 세지 않는다) ═════ */

const _tl = tl;
tl = t => CARD_UNITS[t] ? CARD_UNITS[t] + '차' : (+t >= 11 && +t <= 16 ? '2차' : +t >= 17 && +t <= 19 ? '3차' : _tl(t));

/* 묶음 이름도 같은 차수 표기로 */
GR('g1').label = '📚 1차 · 조직법·정관 (10/8)';

GR('g3').label = '🗓 3차 · 운영규정 6~7장 (10/22)';
GROUPS.push(
  {id:'g4', label:'🗓 4차 · 인사관리시행규칙 (10/29)', topics:[21]},
  {id:'g5', label:'🗓 5차 · 보수운영규정 (11/5)', topics:[22]},

);
/* 처음 열면 '다음 스터디 시험'의 묶음을 고른다 (9차 이후는 같은 과목 반복이므로 전체) */

/* 시작 */
fixPad();
showTab(location.hash.slice(1) || (()=>{ try { return localStorage.getItem('orgmaster.tab'); } catch(e){ return ''; } })() || 'today');
