able>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>징계의 종류<\/td><td>중징계 [[파면·해임·강등·정직]] / 경징계 [[감봉·견책]]<\/td><\/tr>\n<tr><td>징계의결 요구 시효<\/td><td>[[3년]] · 징계부가금·채용비위 [[5년]] · 성매매·성폭력·성희롱 [[10년]]<\/td><\/tr>\n<tr><td>강등 / 정직 / 감봉<\/td><td>[[1계급]] 아래, 직무 불가 [[3개월]] / [[1개월 이상 3개월 이하]] / [[1개월 이상 6개월 이하]] (1회 일 평균임금 [[2분의 1]], 총액 월 평균임금 [[10분의 1]] 이하)<\/td><\/tr>\n<tr><td>징계부가금<\/td><td>취득·제공 이득의 [[5배]] 이내<\/td><\/tr>\n<tr><td>위원회 5종<\/td><td>본사·혈액관리본부·의료원 [[특별]] + 기관·소속기관 [[보통]]<\/td><\/tr>\n<tr><td>특별징계위원장<\/td><td>본사 [[사무총장]] · 혈액관리본부 [[혈액관리본부장]] · 의료원 [[의료원장]]<\/td><\/tr>\n<tr><td>보통징계위원장<\/td><td>본사 [[기획조정실장]] · 지사 [[지사회장이 지명하는 지사부회장]] · 혈액 [[기획관리국장]] · 의료원 [[병원사업본부장]] · 소속기관 [[소속기관장]]<\/td><\/tr>\n<tr><td>보통위 위원 구성<\/td><td>위원장 지명 내부·외부위원 [[6인]] · 외부위원 위원장 제외 [[2분의 1]] 이상<\/td><\/tr>\n<tr><td>성희롱·성폭력 사건<\/td><td>피해자와 같은 성별 위원 위원장 제외 [[3분의 1]] 이상<\/td><\/tr>\n<tr><td>의결 정족수<\/td><td>비공개 · 위원장 외 [[3인]] 이상 출석 · 출석위원 [[과반수]] 찬성 · 위원장도 표결권<\/td><\/tr>\n<tr><td>기피 의결<\/td><td>재적위원 [[과반수]] 출석 · 출석위원 [[과반수]] 찬성 · 신청받은 자 불참<\/td><\/tr>\n<tr><td>기록말소심사위원회<\/td><td>[[5인]] = [[부회장]](위원장) 1 + [[중앙위원]] 2 + [[사무총장]] + [[기관장급]] 1<\/td><\/tr>\n<\/table><\/div>\n\n<h3>12. 기한 사다리 (운영규정)<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>기한<\/th><th>무엇<\/th><\/tr>\n<tr><td>[[3일]]<\/td><td>착임 신고 (착임한 지) · 병가 증빙: 3일 이상 10일 미만 진료증빙<\/td><\/tr>\n<tr><td>[[5일]]<\/td><td>출장 결과보고서 (공무국외출장은 [[30일]])<\/td><\/tr>\n<tr><td>[[7일]]<\/td><td>발령 후 부임 기한<\/td><\/tr>\n<tr><td>[[10일]]<\/td><td>유산·사산 휴가 신청 기한<\/td><\/tr>\n<tr><td>[[15일]]<\/td><td>해면직원 계속 근무 한도 · 재심 청구 · 이의신청 · 징계 집행<\/td><\/tr>\n<tr><td>[[30일]]<\/td><td>이의신청 결정·통고 · 직권면직 예고(또는 30일분 통상임금)<\/td><\/tr>\n<tr><td>[[1개월]]<\/td><td>별정직원 재신임 기한 (회장 취임 후)<\/td><\/tr>\n<tr><td>[[3개월]]<\/td><td>수습기간 · 직위해제 대기명령 · 강등 처분기간 · 소재불명 휴직<\/td><\/tr>\n<tr><td>[[9개월]]<\/td><td>신규임용자과정 미수료 시 수료 기한 · 공로연수 범위<\/td><\/tr>\n<\/table><\/div>\n\n<h3>13. 암기 공식 (운영규정)<\/h3>\n<ul class=\"mn\">\n<li>승진 최저연수는 <b>3·5·4·3·1<\/b> (2급 3 · 3~4급 5 · 5급 4 · 6급 3 · 7급 1) + 기술 <b>6·1<\/b><\/li>\n<li>징계 제한 <b>18·18·12·6<\/b> / 기록 말소 <b>9·7·5·3<\/b> (강등→견책 순)<\/li>\n<li>결격 기간: 실형 <b>5<\/b> · 집유 <b>2<\/b> · 파면 <b>5<\/b> · 해임 <b>3<\/b> · 채용비위 <b>5<\/b><\/li>\n<li>출장 보고 <b>5일<\/b>, 부임 <b>7일<\/b> + 착임 신고 <b>3일<\/b>, 재심·이의신청·집행 <b>15일<\/b>, 이의 통고·면직 예고 <b>30일<\/b><\/li>\n<li>출산 <b>90·100·120<\/b> / 유산·사산 <b>10·30·60·90<\/b> / 난임 <b>2·3·4·1<\/b> / 경조 결혼 <b>5·1<\/b>, 사망 <b>5·3<\/b><\/li>\n<li>징계 시효 <b>3·5·10<\/b> / 보통위 위원 <b>6인<\/b> + 외부 <b>1/2<\/b> + 성별 <b>1/3<\/b><\/li>\n<li>누가 정하나: 임용 <b>회장<\/b> → 2~3급 <b>사무총장<\/b> → 4급 이하 <b>기관장<\/b> · 징계처분 <b>설치기관장<\/b> / 파면·해임·강등 <b>임용권자<\/b><\/li>\n<\/ul>\n\n\n<h3>14. 백지 복원<\/h3>\n<p class=\"mute small\">위 표를 가리고 아래에 의결기관 3종의 인원·임기·정족수를 써 보세요. 채점은 표를 열어 직접 하고 점수를 기록합니다. (입력 내용은 저장되지 않습니다)<\/p>\n<textarea class=\"paper\" id=\"paper\" placeholder=\"예) 중앙위원회: 28명 = 19 + 8 + 회장 ...\"><\/textarea>\n<div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" id=\"paper-n\" placeholder=\"맞은 칸/전체 칸 (예: 14/20)\" size=\"22\">\n<input type=\"text\" id=\"paper-note\" class=\"grow\" placeholder=\"메모(선택)\"><button class=\"b-red\" id=\"paper-save\">점수 기록<\/button><\/div>\n", "prompts": [["오늘 범위 빈칸 퀴즈 (주관식 대비)", "docs/03_규정_마스터/01_조직법_원문_회독용.md의 제11조와 제13조에서 빈칸 문제 5개를 내줘. 빈칸은 원문 단어 그대로 정답이고 칸 수는 글자 수와 같게 해줘. 내가 답하면 동의어는 오답 처리하고, 틀리면 해당 항을 원문 그대로 인용해서 알려줘."], ["누가 의결·승인·인가? 함정 훈련", "조직법과 정관에서 '의결', '심의', '승인', '인가', '인준'을 구분해야 하는 항목을 하나씩 물어봐 줘. 기관명 바꿔치기(중앙위원회/운영위원회/전국대의원총회/보건복지부장관/회장) 함정을 섞어서, 내가 답하면 근거 조문과 함께 채점해줘."], ["기출 한 문항씩 + 조문 근거", "기출문제/2026/2026년_4급_승진고시_법규_기출문제.md의 Q01~Q05(조직법·정관)를 한 문제씩 내줘. 내가 풀면 정답 여부와 함께 근거 조문을 원문에서 찾아 인용해주고, 틀린 건 비슷한 변형 문제를 하나 더 내줘."], ["두문자·스토리 만들기", "조직법 제10조·제11조·제12조의 인원과 임기를 한 번에 외우기 좋은 두문자나 짧은 이야기로 만들어줘. 숫자 하나도 빠지면 안 되고, 공식 단어와 다른 표현은 따로 표시해줘."], ["약점 진단 (실험실 결과 붙여넣기)", "🔬 실험실의 학습법별 정답률 표와 오늘 약한 주제를 붙여넣을게. 어느 학습법이 나에게 효과적인지 해석해주고, 내일 90분 일정을 약한 주제 중심으로 다시 짜줘."], ["백지 복원 채점", "아래에 내가 외운 중앙위원회·운영위원회·전국대의원총회의 구성·임기·소집·정족수를 적을게. 원문과 한 글자씩 대조해서 틀린 숫자·단어만 표로 알려줘. 정답을 먼저 보여주지 마."], ["2026 개정 포인트 점검", "조직법 제11조②2호의 장관 8개 부 이름을 내가 말하면 순서와 이름을 채점하고, 정관 제7조①2호(2026.4.1 개정)와 비교해 달라진 점도 같이 물어봐 줘. 이어서 정관 별표에서 2026.9.1 개정으로 바뀐 지사 명칭도 한 문제 내줘."], ["운영규정 빈칸 퀴즈 (주관식 대비)", "직원 운영규정 [제45조 / 제20조 / 제65조의2 중 오늘 범위]에서 빈칸 문제 5개를 내줘. 빈칸은 원문 단어 그대로 정답이고 칸 수는 글자 수와 같게 해줘. 내가 답하면 동의어는 오답 처리하고, 틀리면 해당 항을 원문 그대로 인용해서 알려줘."], ["운영규정 누가 승인·동의·허가? 함정 훈련", "직원 운영규정에서 '회장 / 사무총장 / 기관장 / 소속기관장 / 임용권자 / 징계위원회 / 인사위원회 / 운영위원회' 중 누가 하는지 구분해야 하는 항목을 하나씩 물어봐 줘. 주체를 바꿔치기한 함정을 섞고, 내가 답하면 근거 조문과 함께 채점해줘."], ["징계 시나리오 문제", "직원 운영규정 제7장(징계)을 근거로 시나리오형 문제를 5개 내줘. 예: '지사 직원 A가 성희롱 징계 대상이다. 어느 위원회가 관할하고 누가 처분하는가?' 내가 답하면 조문을 인용해 채점하고, 틀린 건 변형 문제를 하나 더 내줘."], ["숫자 두문자 만들기 (휴가·휴직)", "직원 운영규정 제45조 휴가와 제54조 휴직기간의 숫자를 한 번에 외우기 좋은 두문자나 짧은 이야기로 만들어줘. 숫자 하나도 빠지면 안 되고, 공식 단어와 다른 표현은 따로 표시해줘."]], "extra": {"운영규정": "<div class=\"chap\">[별표 제1호] <span class=\"amend\">&lt;개정 1998.4.1, 2002.11.1, 2005.4.1, 2011.12.1, 2015.1.1, 2017.1.1, 2017.6.3, 2020.1.1, 2020.4.1., 2022.1.1., 2023.1.1., 2026.4.1&gt;<\/span><\/div><div class=\"ln\">직원의 분류 및 직급, 계급의 구분표<\/div><div class=\"tw\"><table><tr><td>직     렬<\/td><td>직      종<\/td><td>직     급<\/td><td>계      급<\/td><\/tr><tr><td>1. 별정직원<\/td><td>중앙위원회의<br>승인을 요하는 직<\/td><td>사무총장<\/td><td><\/td><\/tr><tr><td>2. 일반직원<\/td><td>1. 사무직<br>2. 삭제<\/td><td>1. 관리사: 1급내지 4급<br>간사: 5급내지 7급<br>2. 삭제<\/td><td>1급 내지 7급<\/td><\/tr><tr><td>3. 특정직원<\/td><td>1. 의무직<br>2. 연구직<\/td><td>1. 의사<br>2. 연구원<\/td><td>단일호봉제<\/td><\/tr><tr><td>4. 전문직원<\/td><td>1. 약무직<br>2. 간호직<br>3. 보건직<br>4. 이공직<\/td><td>1. 약사<br>2. 간호사<br>3. 의료기사, 영양사,<br>환경기사, 언어재활사<br>사회복지사, 임상심리사<br>4. 이공기사<\/td><td>1급 내지 7급<\/td><\/tr><tr><td>5. 특수경력직원<\/td><td>1. 본사<br>비상계획담당관<br>2. 삭제<\/td><td>사무직과 같음<\/td><td>일반직원<br>2급 내지 3급에<br>상당하는 계급<\/td><\/tr><tr><td>6. 기술직원<\/td><td>1. 기술직<br>2. 운수직<br>3. 생산직<\/td><td>1. 기술원<br>2. 운전원<br>3. 생산원<\/td><td>기술1급 내지 기술3급<\/td><\/tr><tr><td>7. 기능직원<\/td><td>1. 사무보조직<br>2. 생산직<br>3. 기타 기능직<br>4. 간호보조직<\/td><td>1. 사무보조원<br>2. 생산원<br>3. 기능원<br>장례지도사<br>4. 간호조무사<\/td><td>단일호봉제<\/td><\/tr><\/table><\/div><div class=\"ln\">[비고]<\/div><div class=\"ln it\">1. 의료기사는 임상병리사, 방사선사, 치과기공사, 치과위생사, 물리치료사, 작업치료사, 보건의료정보관리사를 말한다.<\/div><div class=\"ln it\">2. 기술원은 국가기능사 <span class=\"b b1\">2급이상<\/span> 자격증 소지자로서 전기원, 기관원, 환경관리원, 통신원, 통화품질관리원, 조리원, 전산원을 말하며, 그 직에 종사하여야 한다.<\/div><div class=\"ln it\">3. 운전원은 1종 대형면허 소지자로, 간호조무사는 간호조무사 자격증 소지자로, 장례지도사는 장례지도사 자격증 소지자로 각각 그 직에 종사하여야 한다.<\/div><div class=\"ln it\">4. 기능원은 이 규정의 시행일 이전부터 기능직원으로서 전기원, 기관원, 운전원, 목공원, 교환원, 조무원으로 근무하고 있는 직원들을 말하며, 이 규정의 시행이후부터는 인력의 수급상황과 기관의 필요에 의해 <span class=\"b b1\">회장<\/span>이 <span class=\"b b2\">승인<\/span>한 자 및 목공원에 한하여 기능원으로 신규 임용할 수 있다.<\/div><div class=\"ln it\">5. <span class=\"b b1\">2017년<\/span> <span class=\"b b1\">1월<\/span> <span class=\"b b1\">1일<\/span>자 시행 개정규정에도 불구하고 <span class=\"b b1\">2016년<\/span> <span class=\"b b1\">12월<\/span> <span class=\"b b1\">31일<\/span> 현재 기술직원으로 재직중인 간호조무사는 종전의 직렬 및 직종을 유지한다.<\/div><div class=\"ln it\">6. 삭제<span class=\"amend\">&lt;2023.1.1&gt;<\/span><\/div><div class=\"chap\">[별표 제3호] <span class=\"amend\">&lt;개정 1994.1.7, 2000.1.18, 2002.1.1, 2002.11.1, 2008.1.1, 2011.12.1, 2013.4.1, 2017.6.3, 2018.1.1, 2021.4.1., 2022.1.1., 2025.4.1&gt;<\/span><\/div><div class=\"tw\"><table><tr><td>구      분<\/td><td>7급<\/td><td>6급<\/td><td>5급<\/td><td>4급<\/td><td>3급<\/td><td>2급<\/td><td>1급<\/td><\/tr><tr><td>임용소요<br>경력연수<\/td><td>-<\/td><td>1<\/td><td>4<\/td><td>8<\/td><td>13<\/td><td>18<\/td><td>21<\/td><\/tr><\/table><\/div><div class=\"ln it\">1. 일반직원 및 전문직원 임용소요경력연수기준표<\/div><div class=\"ln\">① 삭제<span class=\"amend\">&lt;2021.4.1&gt;<\/span><\/div><div class=\"ln\">② 약무직원은 인력수급상황 등을 고려하여 상기 기준표의 임용소요 경력연수에도 불구하고, <span class=\"b b1\">회장<\/span>의 사전 <span class=\"b b2\">승인<\/span>을 득하여 <span class=\"b b1\">5급<\/span> 또는 <span class=\"b b1\">6급<\/span> 직원으로 채용할 수 있다.<\/div><div class=\"ln it\">2. 삭제 <span class=\"amend\">&lt;2002.11.1&gt;<\/span><\/div><div class=\"chap\">[별표 제4호] <span class=\"amend\">&lt;신설 2002.11.1, 개정 2011.12.1, 2013.12.1, 2014.4.1, 2017.1.1, 2017.6.3., 2018.1.1., 2023.1.1., 2024.1.1&gt;<\/span><\/div><div class=\"ln\">기술직원 및 기능직원 임용 기준표<\/div><div class=\"tw\"><table><tr><td>직  렬<\/td><td>직  명<\/td><td>자 격 기 준<\/td><\/tr><tr><td rowspan=\"3\">기술직원<\/td><td>기 술 원<\/td><td>해당업무와 관련된 국가기능사 2급이상 자격증 소지자<\/td><\/tr><tr><td>운 전 원<\/td><td>운전 1종 대형면허 소지자<\/td><\/tr><tr><td>생 산 원<\/td><td>기능직 생산원으로 임용 후 제제생산업무에 8년 이상 종사하여 기술력이 인정되는 자<\/td><\/tr><tr><td rowspan=\"4\">기능직원<\/td><td>사무보조원<\/td><td>국가기술자격법시행규칙 제3조의 규정에 의거 별표 제2호에서 규정하고 있는 중직무분야 중 사무분야 자격증 소지자<\/td><\/tr><tr><td>생 산 원<\/td><td>고용원으로 입사 후 제제생산업무에 2년 이상 종사하고 업무능력이 우수한 자<\/td><\/tr><tr><td>기 능 원,<br>장례지도사<\/td><td>인력의 수급상황과 기관의 필요성에 의해 기능직 임용이 불가피하다고 회장이 인정한 자로 하되, 장례지도사의 경우 자격증 소지한 자<\/td><\/tr><tr><td>간호조무사<\/td><td>간호조무사 자격증 소지자<\/td><\/tr><\/table><\/div><div class=\"ln\">①삭제<span class=\"amend\">&lt;2011.12.1&gt;<\/span><\/div><div class=\"ln\">②혈장분획센터 및 혈액원 고용원 중 제제생산업무에 <span class=\"b b1\">2년 이상<\/span> 종사하고 업무능력이 우수한 자는 전형고시를 거쳐 정원의 범위내에서 기능직으로 임용할 수 있다.<\/div><div class=\"ln\">③기능직 생산원으로 임용 후 제제 생산업무에 <span class=\"b b1\">8년 이상<\/span> 종사하여 기술력이 인정되는 자는 전형고시를 거쳐 정원의 범위내에서 기술직으로 임용할 수 있다.<\/div><div class=\"chap\">[별표 제5호] <span class=\"amend\">&lt;개정 1992.1.1, 2004.4.1, 2005.4.1, 2008.7.1, 2011.12.1&gt;<\/span><\/div><div class=\"ln\">연 구 직 임 용 기 준 표<\/div><div class=\"tw\"><table><tr><td>보    직<\/td><td>자     격     기     준<\/td><\/tr><tr><td>수석연구원<br>(부․실장)<\/td><td>1. 4년제 대학의 부교수 이상인 자<br>2. 박사학위 취득 후 4년 이상 연구경력이 있는 자<br>3. 석사학위 취득 후 9년 이상 연구경력이 있는 자<br>4. 책임연구원으로 4년 이상 근무한 경력이 있는 자<br>5. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>책임연구원<br>(팀․과장)<\/td><td>1. 4년제 대학의 전임강사 이상인 자<br>2. 박사학위 취득자<br>3. 석사학위 취득 후 5년 이상 연구경력이 있는 자<br>4. 선임연구원으로 3년 이상 근무한 경력이 있는 자<br>5. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>선임연구원<\/td><td>1. 전문대학의 전임강사 이상인 자<br>2. 석사학위 취득 후 2년 이상 또는 4년제 대학졸업 후 5년 이상 소정 기술분야에 근무한 경력이 있는 자<br>3. 연구원 경력 5년 이상인 자<br>4. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>연  구  원<\/td><td>1. 관련학과를 졸업한 전문학사 이상의 자<\/td><\/tr><\/table><\/div><div class=\"chap\">[별표 제6호] <span class=\"amend\">&lt;개정 1993.1.1, 2002.11.1, 2009.4.1, 2018.1.1, 2021.4.1&gt;<\/span><\/div><div class=\"ln\">직원경력산출기준표<\/div><div class=\"tw\"><table><tr><td colspan=\"2\">직    렬<br>경력종별 및 환산율<\/td><td>일반직원<\/td><td>특수경력직원<\/td><td>특정직원<\/td><td>전문직원<\/td><td>기술직원<\/td><td>기능직원<\/td><td>고용원<\/td><\/tr><tr><td rowspan=\"2\">1. 적십자<br>2. 공무원(군인포함)<br>3. 학교교직원<br>4. 특수법인단체<br>5. 공공기관<br>6. 법인기업 및 은행<br>7. 일반기업 및 단체<\/td><td>유사업무<br>환산율<br>(%)<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><\/tr><tr><td>기타업무<br>환산율<br>(%)<\/td><td>50<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>50<\/td><\/tr><\/table><\/div><div class=\"ln\">①유사업무란 경력이 해당직렬 중 동일한 직종에 종사한 경우를 말하며, 기타 업무는 그 외의 직종에 종사한 경우를 말한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln\">②특정, 전문, 기술, 기능직원의 경력은 해당 자격증 취득 이후 해당 직종에 근무한 경력에 한하여 인정한다.<\/div><div class=\"ln\">③군경력 중 의무복무기간은 업무환산율에 관계없이 <span class=\"b b1\">100%<\/span> 인정한다.<\/div><div class=\"ln\">④직원 채용 시 신규임용직원의 초임급은 「직원 보수 운영규정」 제8조에 의거 타기관 경력을 초임급 호봉산정에 반영할 수 있다.<span class=\"amend\">&lt;신설 2021.4.1. 개정 2025.1.1&gt;<\/span><\/div>"}, "exams": [{"date": "2026-10-08", "label": "조직법·정관", "scope": "조직법 전문 · 정관 최신본(2026.9.1)"}, {"date": "2026-10-15", "label": "운영규정 1~5장", "scope": "직원 운영규정 제1~5장 (총칙·전형과 고시·보수·능률·복무)"}, {"date": "2026-10-22", "label": "운영규정 6~7장", "scope": "직원 운영규정 제6~7장 (신분보장·징계) + 별표"}], "exam": [{"id": "2024-01", "grp": "2024", "no": 1, "kind": "mc", "area": "", "q": "조직법, 정관 및 재무운영규정에 관한 사항이다. 다음\n[보기] 중에서 중앙위원회 심의 의결 사항으로 옳은\n것은 몇 개인지 고르시오. (회장이 회의에 부치는\n것은 고려하지 않음)\n[보기]\n가. 2024년 8월, A혈액원 사옥 보수를 위한 1억 원\n의 공사 자금 대출\n나. 2024년 10월, B지사의 건물 노후화로 인해 예\n산에 편성된 5억 원의 시설개량적립금을 사용\n하는 방수공사 및 소방시설 보수공사 실시\n다. 2025년 1월, 내원 환자의 이동 편의를 위해 7천\n만원의 예산이 소요되는 C병원 주차장 부지\n매입\n라. 2025년 4월, D지사 봉사관 사옥 매각\n㉦ 1개 2개 3개 ㉦ 4개", "a": "③", "ex": ""}, {"id": "2024-02", "grp": "2024", "no": 2, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 다음 [보기] 중에서\n옳은 것은 몇 개인지 고르시오.\n[보기]\n가. 적십자사는 사업수행기금을 목적으로 한 수\n익사업을 할 수 있다.\n나. 적십자사는 연간 기부금 모금액 및 활용실\n적을 매년 사업연도 종료일로부터 4개월 이\n내에 일간신문에 게재하여야 한다.\n다. 적십자사의 정관을 변경하고자 할 때에는\n중앙위원 과반수의 출석과 출석위원 3분의 2\n이상의 찬성으로 중앙위원회의 의결을 거\n쳐야 한다.\n라.\n중앙위원회 위원의 임기는 3년으로 하며,\n한 차례만 중임할 수 있다. 다만, 전국대의\n원총회는 그 의결에 따라 중임한 중앙위원의\n임기를 한 차례에 한하여 연장할 수 있다.\n마. 지사 상임위원의 임기는 3년으로 하며, 한\n차례만 중임할 수 있다. 다만, 지사대의원\n총회는 그 의결에 따라 중임한 상임위원의\n임기를 한 차례에 한하여 연장할 수 있다.\n㉦ 2개 3개 4개 ㉦ 5개\n\n\n및\n인 도 법)", "a": "②", "ex": ""}, {"id": "2024-03", "grp": "2024", "no": 3, "kind": "mc", "area": "", "q": "조직법, 정관 및 재무운영규정에 관한 사항이다. 옳지 않은 것은?\n\n① A지사 봉사관 사옥 신축을 위해 7억원 가액의 400평 토지를 취득하는 경우 중앙위원회 의결을 거쳐 보건복지부장관의 인가를 받아야 한다.\n② B병원은 수익금을 목적으로 원내 유휴공간을 임대할 수 있다.\n③ C지사는 북한이탈주민 지원을 위한 사업계획을 해당 지방자치단체의 장의 승인을 받아 사업비의 일부를 보조받았다.\n④ D지사는 회계연도 중에 외부로부터 자립준비청년 지원을 위해 모금된 기부금을 집행하고 그 결과를 지사 상임위원회에 보고해야 한다.", "a": "④", "ex": ""}, {"id": "2024-04", "grp": "2024", "no": 4, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 옳지 않을 것은?\n적십자사의 A는 총 4명을 두고, B는 1명을 둔다. A\n및 B는 비상근을 원칙으로 하되 필요에 따라 상\n근할 수 있다. 단, 비상근 A 및 B는 보수를 지급\n하지 아니하며, 예산의 범위 내에서 업무수행에\n필요한 수당 및 여비를 지급할 수 있다. A 및 B\n의 처우에 관한 사항은 C로 정한다.\n㉦ 상근 A 및 B의 보수에 관한 사항은 운영위원회에서\n정한다.\n피성년후견인은 A가 될 수 없다.\nB는 중앙위원회에서 선출한다.\n㉦ 적십자사의 사무를 집행하기 위하여 직원 및 고용\n원을 두며, 이에 따른 정원, 직원의 근무, 보수 등\n에 관하여는 이를 C로 정한다.", "a": "①", "ex": ""}, {"id": "2024-05", "grp": "2024", "no": 5, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 밑줄 친 A에 대\n한 옳은 설명만을 [보기] 에서 고른 것은?\nA는 B의 선출권을 갖고 있으며, 사업계획 및 예\n산에 관한 사항을 승인한다. 회장은 B의 1/3이상\n이 회의소집을 요구하면 회의를 소집하여야 한다.\n천재지변 또는 돌발사태로 인하여 A를 소집하지\n못하여 임기 만료된 B를 선출하지 못할 경우, 당\n해 B의 임기는 다음 A때까지 연장된다.\n[보기]\n가. 특별시장•광역시장•특별자치시장•도지사 또는\n특별자치도지사가 위촉하는 사람 각 2명을\n포함\n나. 적십자사의 해산 및 잔여재산 처분에 관한 사항\n심의•의결\n다. 정관으로 정하는 바에 따라 특별시•광역시•특\n별자치시•도 또는 특별자치도의 적십자사 지\n사에서 선출하는 사람 각 6명을 포함\n㉦ 가, 나 나, 다 가, 다 ㉦ 가, 나, 다", "a": "③", "ex": ""}, {"id": "2024-06", "grp": "2024", "no": 6, "kind": "mc", "area": "", "q": "다음 중 정관 변경사항이 아닌 것은?\n㉦ 서울병원은 서울특별시 종로구에서 서울특별시\n중구로 이전하였다.\n혈장분획센터는 충청북도 음성군에서 충청북도\n보은군으로 이전하였다.\n남부혈액검사센터는 부산광역시에서 대구광역시로\n이전하였다.\n㉦ 거창병원은 경상남도 거창군에서 경상남도 합천\n군으로 이전하였다.", "a": "②", "ex": ""}, {"id": "2024-07", "grp": "2024", "no": 7, "kind": "mc", "area": "", "q": "직원운영규정에 관한 사항이다. 옳고 그름의 표시\n(0, X)가 맞게 나열된 것은?\n가. 승진임용은 근무성적평정, 경력평정 기타 능력의\n실증에 의한다 다만, 1급 내지 3급 직원에의 승진\n임용에 있어서는 능력과 경력 등을 고려하여 임용\n하며, 4급직원에의 승진임용은 승진고시를 거쳐야\n하며, 5급이하 직원의 승진임용에 있어서는 필요\n하다고 인정할 때에는 승진고시를 병용할 수 있다.\n나 직원이 질병(심각한 임신 관련 증상 및 부작용을\n포함한다) 또는 상해로 인하여 집무 불능할 때에\n는 연 2월 이내, 공무로 인한 상해 질병으로 요양\n할 때에는 10개월까지 병가를 허가할 수 있다. 다\n만, 본인의 중대한 과실로 인한 공무상의 상해와\n질병은 예외로 한다 병가가 3일 이상 10일 미만일\n경우에는 요양기관의 진료증빙서류를, 10일 이상일\n경우에는 요양기관의 진단서를 첨부하여야 한다.\n다. 임용권자는 수습직원이 수습기간내에 신입직원 입\n문과정을 이수하게 하여야 한다 다만, 수습기간내\n에 신입직원 입문과정을 이수하지 못한 자는 임용\n후 9월이내 반드시 이를 이수하게 하여야 한다.\n다만, 동일 직종으로 재입사하거나 정규직으로 전\n환된 직원 중 신입직원 입문과정을 이수한 경우에\n도 재이수하여야 한다\n라. 각 기관의 장은 업무와 관련하여 직원의 창의적인\n제안으로 예산을 절감하였거나, 적극적인 사업활\n동으로 사업확장에 크게 기여하였을 경우 또는 새\n로운 제도를 도입하여 업무능률의 향상에 현저한\n기여를 하였을 경우 등에는 외부 심사를 통한 객\n관적인 평가로 표창 및 포상 또는 포상금을 지급\n해야 한다. 다만, 포상금 지급액은 1회 3%만원을\n초과하지 못한다.", "a": "④", "ex": ""}, {"id": "2024-08", "grp": "2024", "no": 8, "kind": "mc", "area": "", "q": "직원운영규정 및 인사관리시행규칙에 관한 사항이다.\n다음 징계의결요구서와 관련된 설명 중 옳지 않은\n것은?\n징 계의 결요구서\n한글 김인도 소속 A병원 직위(계급) 직원(5급)\n성명\n인적사항\n한자 金人道 생년월일 1985.524. 재직기간 10년 9월\n서울특별시 중구 소파로 (XX)\n상기인은 2024년 3월 31일 오전 8시 「도로교통법」 에 따\n른 음주운전(혈중알코올농도 0.08퍼 센트)으로 적 말되었음.\n징계사유 상기인은 해당 사실을 당일 병원장에게 보고하였음. 이에\n직원운영규정 제器조(품위유지의 의무)를 위 반하였으므로\n징계의 결을 요구함.\n징계의결\n구권자의\n의견\n중징계 의결을 요구함.\n위와 같이 징계의결을 요구합니다.\n2024년 4월 24일\n징계의결요구권자 A병원장 홍길동\nA병원 보통징계위원장 귀하\n㉦ A병원 보통징계위원회는 부득이한 사유가 없다\n면 징계의결요구를 받은 날로부터 30일 이내에\n의결을 하여야 한다.\n김인도 직원이 최초 음주운전을 한 경우라면 A\n병원 보통징계위원회는 징계양정기준에 따라 김\n인도 직원에게 정직이나 감봉 처분을 의결할 수\n있으며, 징계처분시 이를 감경할 수 없다.\n㉦ A병원장 외에 의료원장도 김인도 직원의 징계의\n결을 A병원 보통징계위원회에 요구할 수 있다.\n㉦ 김인도 직원에 대한 징계의결의 요구는 2027년\n월 31일이 경과한 때에는 이를 행하지 못한다.", "a": "②", "ex": ""}, {"id": "2024-09", "grp": "2024", "no": 9, "kind": "mc", "area": "", "q": "직원운영규정에 관한 사항이다. 다음 [보기] 의\n설명 중 옳은 것은 몇 개인지 고르시오.\n[보기]\n가. A혈액원 B직원은 사전에 승인을 받아 2024.\n4. 1. 직무와 관련된 국제기구 임시직(2024. 6.\n1.부터 2025. 5.31.까지 근무하는 조건)에 지원\n하여 합격하였다. 이에 휴직을 신청하여 1년간\n휴직을 명 받았다.\n나. C지사 D직원이 임신기간동안 육아휴직을 1회\n분할 사용하였다면, 출산 후 육아휴직 기간에\n는 1년 중 나머지 1회만 분할 사용할 수 있다.\n다. E혈액원 F직원은 2024. 7. 1.부터 2025. 6.30.까지\n배우자의 외국 유학에 동반하게 되어, 1년간\n휴직을 신청하여 명받았다. 해당 휴직은 무급\n이며, 근속기간에 포함하지 않는다.\n라. 가족돌봄휴직 개시 예정일 전일까지 계속 근\n로한 기간이 6개월 미만인 직원이 가족돌봄휴\n직을 신청한 경우 허가하지 않을 수 있다.\n㉦ 1개 2개 3개 ㉦ 4개", "a": "③", "ex": ""}, {"id": "2024-10", "grp": "2024", "no": 10, "kind": "mc", "area": "", "q": "직원운영규정에 관한 사항이다. 해당 징계처분을\n받은 직원과 징계처분권자가 옳게 짝지어진 것은?\n(징계대상자는 본인 단독이며, '징계양정기준' 비밀\n엄수의 의무 위반에 관한 건으로, 그 외 사항은\n고려하지 않음)\n번호\n㉦\n㉦\n징계처분 징계처분 받은 직원 계처분권자\n지사 사무처장\n견책\n(사무직 2급)\n혈액원 팀장\n감봉1월\n(사무직 4급)\n지사회장\n혈액원 원장\n혈액검사센터 팀장\n정직3월\n혈액검시젠터 원장\n(보건직 4급)\n2급병원 원무팀 직원\n강등\n(사무직 5급)\n의료원장", "a": "④", "ex": ""}, {"id": "2024-11", "grp": "2024", "no": 11, "kind": "mc", "area": "", "q": "직원운영규정 및 인사관리시행규칙에 관한 사항\n이다. 다음 (보기] 가~라의 인원 수의 합은?\n[보기]\n가. 기관 보통징계위원회 구성시 위원장을 포함한\n총 위원 수 : 口인\n나. 기록말소심사위원회 구성시 위원장을 포함한\n총 위원 수 : 口인\n다. 일반• 전문직 2급 내지 3급직원에 해당하는 직\n원으로서의 승진은 사무총장 또는 사무총장이\n위임한 직원을 위원장으로 하고 본사 부서장,\n당해지사 사무처장, 혈액관리본부장 및 혈액관\n리본부 국장, 의료원장 및 병원사업본부장, 병\n원장, 혈액원장(부원장 포함) 중 口口인 이내로\n구성한 승진심사위원회에서 심사하여야 한다.\n라. 4급 이하 직원으로의 승진은 당해 임용권자\n또는 임용권자가 위임한 직원이 위원장이 되\n고 口인 이내의 위원으로 승진심사위원회를\n구성 심사하여야 한다.\n㉦ 27 28 29 ㉦ 31", "a": "③", "ex": ""}, {"id": "2024-12", "grp": "2024", "no": 12, "kind": "mc", "area": "", "q": "직원운영규정 및 인사관리시행규칙에 관한 사항\n이다. 다음 [보기] 를 읽고, 가~라의 설명 중 옳\n은 것은 몇 개인지 고르시오.\n[보기]\nA혈액원 인사담당 B직원(사무직 4급)은 신규채\n용서류를 조작한 사실이 인정되어, 2023.10. 1.\n강등 처분을 받았다.\nB직원은 2021. 7. 1. 4급 승진을 하였다.\nB직원은 2023. 4. 1. 14호봉으로 승급을 하였다\n상기 명시된 내용 외에는 고려하지 않음\n가. B직원의 징계건에 대한 말소 제한기간의 기\n산일은 2024. 1. 1.이다.\n나. B직원의 징계에 대한 징계처분 기록말소일자\n는 2033. 1. 1.이다.\n다. B직원의 징계일 이후 첫 승급일자는 2026. 7.\n1.이다.\n라. B직원의 말소 후 승급일자는 2033. 5. 1.이며,\n말소 후 승급일자의 호봉은 23호봉이다.\n㉦ 1개 2개 3개 ㉦ 4개\n\n\n인사관리시행규칙에 관한 사항이다. '인사발령을", "a": "③", "ex": ""}, {"id": "2024-13", "grp": "2024", "no": 13, "kind": "mc", "area": "", "q": "인사관리시행규칙에 관한 사항이다. '인사발령을 위한 구비서류'의 임용구분별 서류종류에 해당하지 않는 것은?\n\n① 당연퇴직 - 판결문 사본\n② 신규채용 - 학력증명서\n③ 강임 - 징계처분사유설명서\n④ 전직 - 봉급사정표", "a": "③", "ex": "<b>해설<\/b>: 인사관리시행규칙 별표에 규정된 인사발령 구비서류 중 '강임' 시 첨부서류는 강임동의서 등이며, 징계처분사유설명서는 직위해제/강등/정직 등 징계 관련 서류임."}, {"id": "2024-14", "grp": "2024", "no": 14, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. 옳은 것은?\n㉦ 해당 월에 당해 직급에서 직무를 수행하는데 필\n요한 면허가 취소되어 면직된 자에게는 정기상여\n금을 지급하지 않는다.\n2024. 7. 1. 신규채용 된 직원에게는 2024년 하계\n상여금을 지급할 수 있다.\n소속을 달리하는 기관의 책임직을 겸직하는 직원\n에 대해서는 그 직에 해당하는 책임직직책보조비\n를 추가 지급하며, 추가 지급액은 통상임금에 포\n함된다.\n㉦ 신규임용의 초임급은 직원운영규정에 의한 경력\n년수한산에 의하여 연수에 의한 호봉으로 획정함\n을 원칙으로 하되, 경력직원은 8호봉을 초과할\n수 없다.", "a": "①", "ex": ""}, {"id": "2024-15", "grp": "2024", "no": 15, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. 옳지 않은 것은?\n㉦ 병원 원무팀 진료비 접수수납업무 종사자는 환자\n및 보호자를 직접 대면하는 직원만 위험수당을\n지급한다.\n4급, 연구직(과장급 연구원), 기술직 및 기능직 15년\n이상의 직급보조비 월지급액은 110,000원이다.\n산업안전보건법에 따른 안전관리자로 선임된 직\n원에게는 월 50,000원의 업무수당을 추가로 지급\n한다.\n㉦ '기술직원봉급표'의 기술직 1급 호봉은 38호봉까\n지이다.", "a": "②", "ex": ""}, {"id": "2024-16", "grp": "2024", "no": 16, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. 옳은 것은?\n㉦ 기능직원 중 기능직 %호봉을 받고, 근무성적이\n양호한 자에게는 당해 승급기간을 경과한 때마다\n일정액의 연공가봉을 지급한다.\n직원이 퇴직 또는 사망하였을 때에는 계속근로년수\n1년에 대하여 30일분의 평균임금을 퇴직금으로\n지급한다. 평균임금은 보수와 실적평가급 최소지\n급률 지급분, 연가보상비, 특별근무수당으로 한다.\n직원운영규정에 규정된 휴가와 초임일수를 제외\n하고 결근한 자에게는 매 결근 1일에 대하여 보\n수일액의 2분의 1을 감하여 지급한다.\n㉦ 채용비위로 수사의뢰되어 2024. 4. 1.자로 직위해\n제된 직원이 2024. 4. 1.부터 3개월이 경과하여도\n직위를 부여받지 못한 경우 그 3개월이 지난 후\n의 기간 중에는 보수의 3할을 지급한다.", "a": "④", "ex": ""}, {"id": "2024-17", "grp": "2024", "no": 17, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. A직원에게 2024년 5월에 지급하는 실적평가급은 얼마인가?\n\n> **<A직원(B기관 사무직 4급 과장) 임금 산정기준>**  \n> (단위: 원)\n> | 항 목 | 2023.12. | 2024. 5. |\n> | :--- | :---: | :---: |\n> | 봉급 | 2,419,000 | 2,455,000 |\n> | 업무수당 | 80,000 | 80,000 |\n> | 장기근속수당 | 70,000 | 70,000 |\n> | 직급보조비 | 110,000 | 110,000 |\n> | 직책보조비 | 260,000 | 260,000 |\n> | 가족수당 | 60,000 | 70,000 |\n> | **소 계** | **2,999,000** | **3,045,000** |\n> \n> **※ 기타사항**\n> - B기관의 2023년도분 실적평가급 지급률은 100%이며, B기관은 2024년 5월에 해당 실적평가급을 지급할 예정이다.\n> - A직원은 육아휴직을 2020. 1. 1.부터 2021. 6.30.까지 사용하였고, 2023. 9. 1.부터 2024. 2.29.까지 추가 사용하였다.\n> - A직원은 배우자와 첫째 자녀를 가족수당으로 신청하여 지급 받고 있다.\n> - 상기 명시된 내용 외에는 고려하지 않음\n\n① 2,679,000원    ② 1,810,000원    ③ 1,786,000원    ④ 지급하지 아니한다.", "a": "③", "ex": ""}, {"id": "2024-18", "grp": "2024", "no": 18, "kind": "mc", "area": "", "q": "재무운영규정에 관한 사항이다. 옳은 것은?\n㉦ 원폭피해자•사할린동포지원본부는 본부장이 물품출\n납원이 된다.\n서울병원은 총무팀장이 물품출납원이 된다.\n혈장분획센터는 총무팀장이 물품출납원이 된다.\n㉦ 의료원은 경영지원팀장이 물품출납원이 된다.", "a": "④", "ex": ""}, {"id": "2024-19", "grp": "2024", "no": 19, "kind": "mc", "area": "", "q": "재무운영규정에 관한 사항이다. 옳지 와우 것은?\n㉦ 대한적십자사의 회계년도는 정부의 회계년도에\n의한다.\n각 회계년도의 경비는 그 연도의 세입으로써 충\n당하여야 한다.\n매 회계연도에 있어서 세입세출 결산상 잉여금\n또는 결손금이 있을 때에는 기업회계 기준에 의거\n당해연도에 처리한다.\n㉦ 1회계년도에 속하는 세입세출의 출납에 관한 사무는\n당해연도 12월 31일까지 완결하여야 한다.", "a": "④", "ex": ""}, {"id": "2024-20", "grp": "2024", "no": 20, "kind": "mc", "area": "", "q": "감사운영규정에 관한 사항이다. 옳은 것은?\n㉦ 종합감사는 3년의 주기로 실시하고, 감사대상기\n관의 특정한 업무•사업•자금 등의 문제점을 파악\n하기 위해 실시하는 감사이다.\n비위사실, 근무실태 점검 및 조사 등을 목적으로\n실시하는 감사는 복무감사에 해당한다.\n㉦ 일상감사는 그 업무의 적법성•타당성 등을 점검•심\n사하는 감사이며, 주요 업무 집행 직후 실시한다.\n㉦ 표본감사는 감사대상기관•감사사항 등을 표본 추\n출하여 실시하는 감사로 표본7감사를 실시했다하\n더라도 종합감사를 생략할 수 없다.", "a": "②", "ex": ""}, {"id": "2024-21", "grp": "2024", "no": 21, "kind": "mc", "area": "", "q": "감사운영규정에 관한 사항이다. 옳은 것은?\n㉦ 감사반장은 감사결과 위법부당하거나 개선이 필\n요하다고 인정되는 사항이 있는 경우 감사대상기\n관의 장에게 시정 또는 주의•경고를 요구할 수\n있다.\n감사대상기관의 장은 처분요구를 받은 날로부터\n1개월이내 필요한 시정 등 조치를 취하고 처분요\n구에 대한 조치결과를 감사실장에게 보고하여야\n한다.\n감사결과 처분을 받은 직원은 이의신청을 할 경우\n해당 이의신청에 대하여 기관장의 의견을 요청할\n수 있다.\n㉦ 감사반에 임의로 편성되어 감사활동을 수행하는\n직원은 감사 상 필요한 경우 금고의 봉인 권한을\n가진다.", "a": "④", "ex": ""}, {"id": "2024-22", "grp": "2024", "no": 22, "kind": "mc", "area": "", "q": "여비운영규정에 관한 사항이다. 다음 [보기] 중에서\n옳은 것은 몇 개인지 고르시오.\n[보기)\n가. 국내 선박운임 중 운임등급을 2등급 이상으로\n구분하는 선로에는 최상급의 운임을 지급한다.\n나. 전철 구간에서 철도운임 외에 전철요금이 따로\n책정되어 있는 경우에는 철도운임을 갈음하여\n전철요금을 지급할 수 있다.\n다. 전 근무기관과 새 근무기관이 협의하여 전 근\n무기관이 가족여비를 지급하기로 한 경우에는\n전 근무기관에 가족여비를 신청하여야 한다.\n라. 운임의 지불을 요하지 아니하는 선박, 항공기\n등을 이용하여 여행할 경우에는 일비, 숙박비,\n식비를 지급한다.\n㉦ 0개 1개 2개\n㉦ 3개", "a": "②", "ex": ""}, {"id": "2024-23", "grp": "2024", "no": 23, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음 [보기] 의 설명\n중 옳은 것은 몇 개인지 고르시오.\n[보기]\n가. 포로의 대우에 관한 제네바협약은\n채택되었다.\n나. 국제인도법은 국가들이 인도주의적\n무력을 사용하는 것을 금지 한다.\n1929년 에\n목적으로\n다. 민족해방운동 단체는 수탁자인 스위스 연방정부에\n일방적 선언의 방식으로 제네바 제협약 및 제\n2추가의정서를 적용하기로 약정할 수 있다.\n라. 제1추가의정서는 실종자를 수색하고 민간인에\n게 인도적 지원을 제공할 의무에 대한 규칙을\n포함한다.\n마. 제2추가의정서는 민간인에 대한 직접 공격 금\n지와 자유를 박탈당한 개인의 대우에 관한 규\n칙을 명시하고 있다.\n㉦ 1개 2개 3개 ㉦ 4개", "a": "③", "ex": ""}, {"id": "2024-24", "grp": "2024", "no": 24, "kind": "mc", "area": "", "q": "국제인도법의 특별 보호 대상에 관한 사항이다. 옳지\n않은 것은?\n㉦ 자연한경에는 모든 식물, 야생동물, 미생물, 토양,\n암석, 공기, 물 및 기타 자연 자원, 기후 등이 포함\n되며, 무력충돌시 어떠한 환경 피해도 용인될 수\n없다.\n문화재라 함은 종교, 예술, 과학, 교육 및 자선 목\n적의 동산 혹은 부동산 또는 역사적 기념물을 의\n미 한다.\n의무수송수단이라 함은 군용 또는 민간용이든, 영\n구적 또는 일시적이든 간에 충돌 당사자의 권한\n있는 기관의 통제 하에서 의무수송에 전적으로 할\n당된 모든 수송수단을 의미한다.\n㉦ 의무부대와 의무수송수단이 인도적 기능에서 벗어나\n적에게 위해가 되는 행위를 하는데 사용된 경우\n보호받을 수 없으며, 공격 대상이 될 수 있다.", "a": "①", "ex": ""}, {"id": "2024-25", "grp": "2024", "no": 25, "kind": "mc", "area": "", "q": "국제인도법 및 평화활동에 관한 사항이다. 옳은 것은?\n㉦ 다국적군은 국제적 및 비국제적 성격에 상관없이\n무력충돌의 당사자가 될 경우 국제인도법 적용 대\n상이 된다.\n제네바 제협약과 추가의정서에 대한 지식을 확산\n시킬 법적 의무는 ICRC에 있다.\n평화활동 임무의 성격과 명칭(평화유지 또는 평화\n집행)은 국제인도법 적용 여부와 관련성이 있다.\n㉦ 평화유지 활동은 관련국의 요청을 받거나 유엔안\n보리의 승인이 있을 시, 유엔군 또는 개별 국가,\n다수의 국가 또는 지역 기구가 수행한다.", "a": "①", "ex": ""}, {"id": "2024-26", "grp": "2024", "no": 26, "kind": "mc", "area": "", "q": "다음 【보기】 중 (  )안의 연도가 오래된 순서대로 나열된 것은?\n\n> **【보기】**\n> 가. (    )년 모든 형태의 인종차별 철폐에 관한 협약이 채택되었다.\n> 나. (    )년 국제인도법의 초석이 되는 4개의 제네바협약이 채택되었다.\n> 다. (    )년 세계인권선언은 유엔 총회 결의안에서 인권법을 최초로 정의했다.\n> 라. (    )년 핵무기비확산조약은 기본적으로 핵무기의 확산을 방지하고 핵군축 달성을 돕는 것을 목적으로 한다.\n\n① 나-다-라-가    ② 나-다-가-라    ③ 다-나-가-라    ④ 다-나-라-가", "a": "③", "ex": "<b>해설 조약 연도<\/b>:<br>• 다. 세계인권선언: <b>1948년<\/b><br>• 나. 4개 제네바협약: <b>1949년<\/b><br>• 가. 인종차별철폐협약: <b>1965년<\/b><br>• 라. 핵무기비확산조약(NPT): <b>1968년<\/b><br>→ 순서: 다(1948) - 나(1949) - 가(1965) - 라(1968) ➡ 정답: ③ (다-나-가-라)"}, {"id": "2024-27", "grp": "2024", "no": 27, "kind": "mc", "area": "", "q": "국제인도법의 적용 대상에 관한 사항이다. 옳지 않은\n것은?\n㉦ 전투원은 전쟁범죄를 범하지 않는 한 적대행위에 직\n접적으로 가담하고도 교전 행위에 대한 기소 면제를\n누릴 권리를 갖는다.\n충돌 당사국의 군대는 자기 부하의 행동에 대해\n충돌 당사국에 책임을 지는 지휘관 휘하에 있는\n모든 조직된 무장병력, 집단 및 부대로 구성되어\n있다.\n비국제적 무력충돌에는 전투원과 포로의 지위가\n없으며, 충돌 시 전투에 참여한 조직된 비국가\n무장단체의 구성원의 행위에 대하여 국내법에 따\n라 기소할 수 있다.\n㉦ 부상자, 병자, 조난자는 지위에 비례하여 보호받을\n권리를 가지며, 이들을 권력 내에 두고 있는 충돌\n당사자는 부상자, 병자, 조난자를 가능한 수색, 수\n용, 간호해야 한다.", "a": "④", "ex": ""}, {"id": "2024-28", "grp": "2024", "no": 28, "kind": "mc", "area": "", "q": "국제인도법의 자유의 박탈에 관한 사항이다. 옳은\n㉦ 국제적 무력충돌 시에 비해서 비국제적 무력충돌\n시에는 중요한 구금조건에 대한 규칙이 세부적이\n지 않으며 피억류자에 대한 절차상 안전장치도 결\n여되어 있다.\n충돌 당사자는 긴급한 안전상의 사유로 정당화될\n지라도 민간인을 억류할 수 없다.\n무력충돌 시 발생하는 억류는 형사 소송 절차상\n최종 유죄 선고 또는 무죄 석방 전까지 형사 용의\n자의 자유를 박탈하는 것이다.\n㉦ 민간인 피억류자는 억류 사유를 통지받고 가능한\n신속히 국제사법재판소에서 결정을 재심사 받을\n수 있어야 한다.", "a": "①", "ex": ""}, {"id": "2024-29", "grp": "2024", "no": 29, "kind": "mc", "area": "", "q": "국제인도법의 실종자 및 가족 찾기 활동에 관한 사\n항이다. 옳지 않은 것은?\n㉦ 무력충돌 당사자는 포로 및 민간인 피억류자의 세\n부 개인 정보를 충돌 당사자 및 적국 내 충돌 당\n사자 국민의 이해관계를 보호하기 위해 지명된 중\n립국 또는 ICRC를 통해 친지에게 전달해야 한다.\n국제적 무력충돌과 다르게 비국제적 무력충돌 당\n사자는 자유를 박탈당한 사람의 등록 등 실종방지\n를 위한 조치를 취할 의무가 없다.\n㉦ 중양포로정보국은 ICRC에서 관장하며, 비포로, 민\n간인, 난민 등 다른 부류의 사람을 포함하는 정보\n국의 모든 활동을 반영하기 위하여 1960년 중양심\n인국으로 개명되었다.\n㉦ 제네바 제협약은 각 충돌 당사자가 그 권한 내에\n있는 포로 및 민간인 피억류자에 관한 정보를 수\n령하고 전달하기 위한 공식적인 정보국을 설치하\n도록 명시하고 있다.", "a": "②", "ex": ""}, {"id": "2024-30", "grp": "2024", "no": 30, "kind": "mc", "area": "", "q": "국제인도법 난민 및 실향민에 관한 사항이다. 옳지\n않은 것은?\n㉦ 모든 이주민의 보호 문제를 특정해서 다루는 보편\n적인 조약은 없다.\n국제인도법은 안전 및 긴급한 군사상의 이유가 있\n을지라도 민간인에게 거주지를 떠나도록 강요하는\n것은 금지하고 있다.\n㉦ 제1추가의정서에서 난민은 모든 상황에서 불리한\n차별없이 피보호인으로 간주되어야 한다고 규정하\n고 있다.\n㉦ 국내 실향민이 필요한 보호를 구체적으로 다루는\n보편적인 조약은 없다.", "a": "②", "ex": ""}, {"id": "2024-31", "grp": "2024", "no": 31, "kind": "mc", "area": "", "q": "국제적십자운동 규약의 각국 적십자사 및 적신월사에\n관한 사항이다. 다음 [보기] 의 설명 중 옳은 것은\n몇 개인지 고르시오.\n(보기]\n가. 국제인도법을 보급하는데 있어 선도적으로 힘\n쓰며, 정부의 보급 노력을 지원한다.\n나. 국제 지원을 받는 적십자사는 상황에 따라\nICRC 또는 IFRC의 동의를 전제로 국내에서\n조정 역할을 수행할 수 있다.\n다. IFRC 헌장에 따라 IFRC를 지원할 의무가 있다.\n라. 자국 내에서 자체 봉사원과 직원들의 활동을\n위하여 필요한 체계를 제공하는 자율적인 전\n국 조직이다.\n마. 자체 정관과 국내법 그리고 적십자운동의 임\n무와 기본원칙에 따라 인도주의 활동을 수행\n한다.\n㉦ 2개 3개 4개 ㉦ 5개", "a": "④", "ex": ""}, {"id": "2024-32", "grp": "2024", "no": 32, "kind": "mc", "area": "", "q": "국제적십자운동 규약에 관한 사항이다. 옳지 않을\n것은?\n㉦ ICRC는 제네바협약과 국제적십자회의의 정식 승\n인을 받은 그 자체의 지위를 보유한 독립적인 인\n도주의 기구이다.\nIFRC는 법인격을 지닌 법인으로서의 모든 권리와\n의무를 가지고 정관에 따라 행동한다.\n국제적십자회의는 적십자운동의 단일과 기본원칙에\n따른 적십자운동의 임무수행에 기여한다.\n㉦ 대표자회의는 절차규정에 규정된 대로 의견일치에\n의하여 결의사항을 채택하도록 노력하여야 한다.", "a": "②", "ex": ""}, {"id": "2024-33", "grp": "2024", "no": 33, "kind": "sa", "area": "직원운영규정 (계약직원 채용 승인 대상 - 특정직, 약무직)", "q": "직원운영규정에 관한 사항이다. □에 들어갈 단어를l\n순서대로 쓰시오.\n제10조의4(계약직원) ㉦기관장과 소속기관장은 예\n산과 정원의 범위 내에서 채용계약에 의하여 계\n약직원을 채용할 수 있다.\n9계약직원의 채용기간은 2년 이내로 하며 제56\n조에 규정을 적용받지 않는다. 다만, 기간제및단\n시간근로자보호등에관한법률 제4조제1항 각호의\n규정에 해당하는 경우에는 기간을 연장하여 사용\n할 수 있다.\n㉦일반•특정직•전문직 팀(과)장급 이상 직원을 계\n약직으로 채용할 때에는 회장의 승인을 받아야\n한다. 다만, ㉮(□□□) 및 전문직 중 ㉯(□□□)\n채용에 필요한 사항은 회장이 따로 정한다.", "a": "㉮ 특정직, ㉯ 약무직", "ex": "<b>근거 조항 (직원운영규정 제10조의4 계약직원)<\/b>:<br>• 일반·특정직·전문직 팀(과)장급 이상 직원을 계약직으로 채용할 때 회장의 승인 필요.<br>• 다만, <b>㉮ 특정직<\/b> 및 전문직 중 <b>㉯ 약무직<\/b> 채용에 필요한 사항은 회장이 따로 정함."}, {"id": "2024-34", "grp": "2024", "no": 34, "kind": "sa", "area": "인사관리시행규칙 (채용 임용고시 공고 - 전형별 합격자 결정, 부정합격자 합격취소)", "q": "인사관리시행규칙에 관한 사항이다. □에 들어갈\n단어를 순서대로 쓰시오.\n제5조(고시공고) ㉦직•용원의 신규채용 임용고시\n공고는 원서접수 종료일로부터 15일 이전에 인터\n넷 공고 방법으로 채용인원, 응시자격, ㉮(□□□)\n합격자 결정 방법, 제출서류, 고시과목, 원서접수\n기간, 장소, 고시일자 및 장소와 합격자발표 일자,\n㉯(□□□□□) 합격취소 내용을 포함하여 표시\n공고하여야 한다. 단, 필요시 신문게재 등 기타\n방법을 병행하여 공고할 수 있다.", "a": "㉮ 전형별, ㉯ 부정합격자", "ex": "<b>근거 조항 (인사관리시행규칙 제5조 고시공고)<\/b>:<br>• 응시자격, <b>㉮ 전형별<\/b> 합격자 결정 방법, 제출서류...<br>• <b>㉯ 부정합격자<\/b> 합격취소 내용을 포함하여 표시 공고하여야 함."}, {"id": "2024-35", "grp": "2024", "no": 35, "kind": "sa", "area": "재무운영규정 (계약이행 검사 및 기성/기납 대가 지급)", "q": "재무운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n• 각 기관의 장은 계약상대자가 계약의 이행을\n완료한 때에는 그 이행을 확인하기 위하여 계\n약서, 설계서 기타 관계서류에 의하여 소속직원\n에게 필요한 ㉮(□□)(을)를 하게 하여야 한다.\n계약에 의하여 기성부분 또는 기납부분에 대하\n여 ㉯(□□□) 또는 ㉰(□□□)에 대가의 전부\n또는 일부를 지급하고자 할 때에도 또한 같다.", "a": "㉮ 검사, ㉯ 완성전, ㉰ 완납전", "ex": "<b>근거 조항 (재무운영규정)<\/b>:<br>• 계약의 이행을 확인하기 위하여 필요한 <b>㉮ 검사<\/b>를 하게 하여야 함.<br>• 기성부분 또는 기납부분에 대하여 <b>㉯ 완성전<\/b> 또는 <b>㉰ 완납전<\/b> 대가의 전부/일부 지급 가능."}, {"id": "2024-36", "grp": "2024", "no": 36, "kind": "sa", "area": "직원보수운영규정 (직위해제 처분 취소/무죄 시 보수 소급지급)", "q": "직원보수운영규정에 관한 사항이다. □에 들어갈\n단어를 순서대로 쓰시오.\n제43조의2(직위해제 및 징계 처분 등의 취소 시\n보수지급) ㉦직위해제 처분 또는 징계처분이 법\n원판결 및 행정소송, 노동위원회의 결정 등으로\n무효•취소되는 경우에는 해당 기간 동안 지급이\n제한된 보수를 소급하여 지급한다.\n9직원운영규정 제石조의2 제1항 제4호에 해당하\n여 직위해제 처분을 받은 사람이 그 처분의 사유\n가 된 ㉮(□□□□)에 대해 법원의 판결에 따라\n무죄로 확정된 경우 또는 동 규정 제1항 제7호에\n해당하여 직위해제 처분을 받은 사람이 징계처분\n을 받지 아니하고 비위행위에 대한 수사결과 ㉯\n(□□□□)(으)로 사법경찰관이 불송치하거나 검\n사가 ㉰(□□□)한 경우에는 해당기간 동안 지급\n이 제한된 보수를 소급하여 지급한다.", "a": "㉮ 형사사건, ㉯ 혐의없음, ㉰ 불기소", "ex": "<b>근거 조항 (직원보수운영규정 제43조의2)<\/b>:<br>• <b>㉮ 형사사건<\/b>으로 기소되어 직위해제된 자가 무죄 확정된 경우<br>• 비위행위에 대한 수사결과 <b>㉯ 혐의없음<\/b>으로 불송치하거나 검사가 <b>㉰ 불기소<\/b>처분한 경우 보수 소급지급."}, {"id": "2024-37", "grp": "2024", "no": 37, "kind": "sa", "area": "여비운영규정 (부정수령 가산징수 - 거짓이나 부정한 방법 시 5배)", "q": "여비운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n제25조(가산징수 등) (소속)기관의 장은 직원이\n㉮(□□)이나 그 밖의 부정한 방법으로 여비를 받\n았을 때는 부정 수령액의 ㉯(□□)에 해당하는 그•\n액을 가산하여 징수한다.", "a": "㉮ 거짓, ㉯ 5배", "ex": "<b>근거 조항 (여비운영규정 제25조 가산징수 등)<\/b>:<br>• <b>㉮ 거짓<\/b>이나 그 밖의 부정한 방법으로 여비를 지급받았을 때<br>• 부정 수령액의 <b>㉯ 5배<\/b>에 해당하는 금액을 가산하여 징수."}, {"id": "2024-38", "grp": "2024", "no": 38, "kind": "sa", "area": "감사운영규정 (이의신청 요건 흠결 시 각하 및 심의절차)", "q": "감사운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n제기조(이의신청) ㉦~2 생략\n쨰사부서의 장은 제1항에 따른 이의신청을 검\n토하여 이의신청이 ㉮(□□)(을)를 갖추지 못하였\n을 때에는 ㉯(□□)하고, ㉮(□□)(을)를 갖춘 이\n의신청에 대하여는 별도의 심의위원회를 통해 ㉰\n(□□□□)(을)를 거쳐야 한다.", "a": "㉮ 요건, ㉯ 각하, ㉰ 심의절차", "ex": "<b>근거 조항 (감사운영규정 제21조 이의신청)<\/b>:<br>• 이의신청이 <b>㉮ 요건<\/b>을 갖추지 못하였을 때에는 <b>㉯ 각하<\/b>하고, 요건을 갖춘 이의신청은 <b>㉰ 심의절차<\/b>를 거쳐야 함."}, {"id": "2024-39", "grp": "2024", "no": 39, "kind": "sa", "area": "국제인도법 및 인권법 (무차별적 공격 금지, 사전 경고, 국가의 학대로부터 보호)", "q": "국제인도법과 인권법에 관한 사항이다. □에 들어갈l\n단어를 순서대로 쓰시오.\n국제인도법에 의하면 민간인 및 민간물자에 대한 모든\n폭력 행위 및 ㉮(□□□□)인 공격은 불법이다. 또한\n국제인도법에 따라 민간인 손실을 최소화하기 위해 ㉯\n(□□) 경고 조치가 취해져야 한다. 인권법은 국가\n의 ㉰(□□)(의로부터 사람들을 보호하기 위해 고안\n되었다.", "a": "㉮ 무차별적, ㉯ 사전, ㉰ 학대", "ex": "<b>근거 조항 (IHL 및 인권법 민간인 보호)<\/b>:<br>• 민간인 및 민간물자에 대한 모든 폭력 행위 및 <b>㉮ 무차별적<\/b>인 공격은 불법임.<br>• 민간인 손실 최소화를 위한 <b>㉯ 사전<\/b> 경고 조치 필요.<br>• 인권법은 국가의 <b>㉰ 학대<\/b>로부터 사람들을 보호하기 위해 고안됨."}, {"id": "2024-40", "grp": "2024", "no": 40, "kind": "sa", "area": "국제인도법 (ICRC 활동 원칙 - 대화 유지, 구금자 접근, 직원 안전 확보)", "q": "국제인도법에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\nICRC는 무력충돌 당사자 및 기타 이해당사자들과 건설\n적인 ㉮(□□)(을)를 유지하고, 분쟁 지역, 구금장소,\n무력충돌 및 기타 폭력 상황의 피해자에 대한 ㉯(□□)\n(을)를 확보하고, 수혜자와 직원들의 ㉰(□□)(을)\n를 확보할 수 있다.\n※ 그동안 수고 많으셨습니다.", "a": "㉮ 대화, ㉯ 접근, ㉰ 안전", "ex": "<b>근거 조항 (IHL - ICRC의 역할)<\/b>:<br>• 충돌 당사자들과 건설적인 <b>㉮ 대화<\/b> 유지<br>• 피해자에 대한 <b>㉯ 접근<\/b> 확보<br>• 직원들의 <b>㉰ 안전<\/b> 확보."}, {"id": "2025-01", "grp": "2025", "no": 1, "kind": "mc", "area": "", "q": "국제적 무력충돌 시 국제인도법의 보호대상에 관한\n사항이다. 다음 중 가장 적절하지 않은 것은?\n㉦ 적국 국민이 아닌 민간인의 경우 충돌 당사자의\n권력 내에 있을 때 피보호자로 분류된다.\n자유를 박탈당한 민간인을 보호하기 위해 억류\n조건, 피구금자가 갖는 사법 및 절차상의 권리,\n피구금자의 석방에 대한 규칙을 제공한다.\n㉦ 민병대, 의용대 및 조직된 저항운동단체의 구성원은\n전투원으로 포함되지 않는다.\n㉦ 포로를 보호하는 규칙으로서 억류조건, 사법 및\n절차상의 권리, 석방 및 본국 송환에 대한 내용을\n포함한다.", "a": "③", "ex": "<b>해설<\/b>: 민병대, 의용대 및 조직된 저항운동단체 구성원이라도 일정한 조건(지휘관 존재, 고유 식별 표지 착용, 공공연한 무기 휴대, 전쟁법규 준수)을 충족하면 전투원 및 포로의 자격을 인정받음."}, {"id": "2025-02", "grp": "2025", "no": 2, "kind": "mc", "area": "", "q": "국제인도법 적용에 관한 사항이다. 다음 중 가장\n적절하지 않은 것은?\n㉦ 자기결정권을 행사하여 인종차별적 정권에 대항\n하는 민족해방전쟁은 특정 조건에서 제2추가\n의정서에 적용된다.\n체약국 영토에서 발생하는 정부 군대와 반정부\n군대 간의 무력충돌은 제2추가의정서에 적용된다.\n체약국 영토에서 발생하는 조직된\n비국가 무장\n단체 간의 무력충돌은 공통 제3조에 적용된다.\n㉦ 특정한 상황에서 여러 무력충돌이 동시에 같은\n영역 내에서 발생할 경우, 국제적\n및 비국제적\n무력충돌의 분류와 적용 가능한 법은 교전자 간의\n관계에 따라 달라진다.\n\n\n및\n인 도 법)", "a": "①", "ex": "<b>해설<\/b>: 민족해방전쟁(인종차별적 정권, 외세 점령, 식민지 지배에 대항하는 무력충돌)은 1977년 <b>제1추가의정서(국제적 무력충돌)<\/b> 제1조 제4항의 적용 대상이지 제2추가의정서(비국제적 무력충돌) 적용 대상이 아님."}, {"id": "2025-03", "grp": "2025", "no": 3, "kind": "mc", "area": "", "q": "적대행위를 규정하는 주요 국제인도법 규칙에 관한\n사항이다. 다음 [보기] 의 설명 중 옳은 것은 몇 개\n인가?\n[보기]\n가. 세 가지 기본규칙으로 구별, 비례, 사전경고가\n있으며, 이들 규칙은 관습국제법 내에 존재하나\n성문화되어 있지는 않다.\n나. 구별의 규칙에 의해 공격은 군사 목표물로만\n제한되어야 하며, 민간 물자는 군사적 목적으로\n사용되었을지라도 군사 목표물이 될 수 없다.\n다. 비례의 원칙은 구체적이고 직접적인 소기의\n군사적 이익에 비해 우발적인 전투원 인명\n손실과 부상, 민간 물자의 손상이 과도할 여지가\n많은 공격의 개시를 금지하는 것을 말한다.\n라. 비례의 원칙에 의해 민간인 손실이 소기의\n군사적 이익을 초과할지라도 군사 목표물인\n경우에는 공격할 수 있다.\n㉦ 0개 1개 2개\n㉦ 3개", "a": "①", "ex": "<b>해설<\/b>: IHL의 교전규칙(구별, 비례, 예방조치)은 관습국제법일 뿐만 아니라 1977년 제1추가의정서 등에 명문으로 성문화되어 있음."}, {"id": "2025-04", "grp": "2025", "no": 4, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음 [보기) 중 ( )\n안의 채택 또는 체결연도가 오래된 순서대로 나열된\n고르시 오.\n)년\n)년\n)년\n)년\n㉦ 가-나-라-다\n㉦ 가-다-라-나\n것을\n가(\n나(\n다(\n라(\n[보기]\n4개 제네바협약에 대한 2개 추가의정서\n아동의 무력충돌 참여에 관한 아동의\n권리 보호 협약에 대한 선택의정서\n모든 이주노동자와 그 가족의 권리\n보호에 관한 국제협약\n강제실종으로부터 모든 사람을 보호\n하기 위한 국제협약\n가-나-다-라\n㉦ 가-다-나-라", "a": "④", "ex": "<b>해설 조약 연도<\/b>:<br>• 가. 4개 제네바협약에 대한 2개 추가의정서: <b>1977년<\/b><br>• 나. 아동의 무력충돌 참여에 관한 아동권리협약 선택의정서: <b>2000년<\/b><br>• 다. 모든 이주노동자와 그 가족의 권리 보호에 관한 국제협약: <b>1990년<\/b><br>• 라. 강제실종으로부터 모든 사람을 보호하기 위한 국제협약: <b>2006년<\/b><br>→ 순서: 가(1977) - 다(1990) - 나(2000) - 라(2006) ➡ 정답: ④ (가-다-나-라)"}, {"id": "2025-05", "grp": "2025", "no": 5, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음 중 가장 적절\n하지 않은 것은?\n㉦ 조직된 비국가 무장단체는 제네바협약과 추가\n의정서와 같은 국제 조약의 당사자가 될 수 있는\n주체가 아니다.\n2 국제인도법은 국가와 비국가의 행위로 피해巨 입는\n모든 이들을 위해 국가 쪽과 비국가 쪽에 권리와\n의무를 공평하게 부가한다.\n㉦ 자유를 박탈당한 사람에 대한 보호는 국제적 무력\n충돌 시에 비해서 비국제적 무력충돌 시 덜 구체적\n이고 덜 명확하다.\n㉦ 적수정 안에 다른 표장 또는 표지를 포함시킬 수\n있기 위해서는 다른 표장 또는 표지는 이미 실제로\n사용되고 있어야 하고, 제3의정서 채택 후 스위스\n연방정부를 통해 다른 체약국 및 ICRC에 사용에\n관한 사항이 전달되어야 한다.", "a": "④", "ex": "<b>해설 포인트 (출제오류 이의신청 기각 결정문 참조)<\/b>:<br>• ④번(오답/정답): 적수정 안에 다른 표장/표지를 포함시키기 위해서는 이미 실제로 사용되고 있어야 하며, 제3추가의정서 채택 후 스위스 연방정부를 통해 체약국 및 ICRC에 통보되어야 함.<br>• ①번 선지 검토: '국제인도법 질문과 답변' p.31에 따르면 조약의 당사자가 될 수 있는 주체는 '국가'로 한정됨. 비국가 무장단체는 무력충돌의 당사자로서 구속되는 것일 뿐 조약의 체결 당사자가 될 수 있는 주체는 아니므로 옳은 설명임."}, {"id": "2025-06", "grp": "2025", "no": 6, "kind": "mc", "area": "", "q": "국제인도법의 테러리즘에 관한 사항이다.\n[보기) 의 설명 중 옳은 것은 몇 개인가?\n[보기)\n다음\n가. 테러리즘에 대한 투쟁으로 벌어진 국제적\n무력충돌 시 적대행위에 직접 가담한 민간인은\n적국 국민인 경우 제3제네바협약의 보호를\n받는다.\n나. 평시에 행해지는 테러 행위는 국제인도법에\n의해 규제 받지 않고 국내법 및 국제법, 특히\n인권법의 적용을 받는다.\n다. 테러리즘에 대한 투쟁의 일환으로 벌어진\n국제적 무력충돌과 관련해 구금된 사람들은\n공통 제3조와 제2추가의정서 그리고 관련 관습\n국제인도법 규칙의 보호를 받는다.\n라. 테러리즘에 대한 투쟁 중 무력충돌의 영역 밖\n에서 구금된 모든 사람은 구금 국가의 국내법과\n인권법의 보호를 받는다.\n㉦ 0개 1개 ㉦ 2개\n㉦ 3개", "a": "③", "ex": ""}, {"id": "2025-07", "grp": "2025", "no": 7, "kind": "mc", "area": "", "q": "국제인도법의 전쟁 수단의 규제에 관한 사항이다.\n다음 중 가장 적절하지 않은 것은?\n㉦ 국제사회는 제1차 세계대전 이후, 1925년 화학무기와\n생물학무기의 사용을 금지 했다.\n1996년 국제사법재판소는 권고적 의견에서 핵무기에\n국제인도법이 적용되며, 특히 비례의 원칙과 불필\n요한 고통 유발 금지 원칙이 적용된다고 밝혔다.\n㉦ 2011년 핵무기에 대한 적십자운동의 입장을 설명\n하는 결의안으로서 “핵무기 제거를 위한 노력”이\n채택되었다.\n㉦ 국제인도법은 무기 기술의 발달과 국가의 신무기\n획득을 규제하기도 한다.", "a": "②", "ex": ""}, {"id": "2025-08", "grp": "2025", "no": 8, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음 (보기) 의 설명\n중 옳은 것은 몇 개인가?\n[보기]\n가. 포로가 된 전투원은 가족과 연락을 취하고\n원조를 받을 권리가 있다.\n나. 무력충돌 시 아동의 부양, 종교생활 및 교육은\n어느 경우에나 용이해야 한다.\n다. 자유를 박탈당한 여성은 남성이 아닌 여성의\n직접 감독 하에 놓여야 한다.\n라. 국제인도법에서는 일반적으로 구금의 적법성\n여부에 대한 사법 심사를 하지 않는다.\n마.\n자유를 박탈당한 사람은 절 대적인 군사적\n필요성이 있는 경우, 통신의 권리가 제한될\n수 있다.\n㉦ 2개 3개\n4개\n㉦ 5개", "a": "④", "ex": ""}, {"id": "2025-09", "grp": "2025", "no": 9, "kind": "mc", "area": "", "q": "국제적십자운동 규약에 관한 사항이다. 다음 중\n가장 적절하지 않은 것은?\n㉦ 적십자사로 승인받기 위해서는 인도주의 분야에\n있어서 공공당국의 보조적 역할을 하는 봉사단체\n로서 제네바협약과 국내법에 근거하여 그 나라의\n합법적 정부의 정식 승인을 받아야 한다.\nICRC는 무력충돌에 대비하여 각국 적십자사, 군\n및 민간 의료기관, 그 밖의 관계 당국과 협력하여\n의무요원의 훈련과 의료장비 준비에 기여한다.\n㉦ IFRC는 각국 내에서 적십자사를 통하여 또는\n적십자사와 합의 하에 해당 국가의 국내법에 따라\n활동하여야 한다.\n㉦ 제네바협약 체약국은 제네바협약과 국제적십자운동\n절차규정 및 국제적십자회의 결의사항에 따라 적십자\n운동 구성기관들과 협력한다.", "a": "④", "ex": ""}, {"id": "2025-10", "grp": "2025", "no": 10, "kind": "mc", "area": "", "q": "국제적십자회의에 관한 사항이다. 다음 중 가장\n적 절하지 않은 것은?\n㉦ 국제적십자회의는 ICRC 정관, IFRC 헌장 및\n국제적십자운동 규약의 범위 내에서 양 기관에\n임무를 부여할 수 있다.\n국제적십자회의 기간 중 국제적십자운동 절차\n규정에 따라 보조기관을 설치할 수 있다.\n㉦ 국제적십자회의는 ICRC 정관과 IFRC 헌장을 개정\n할 수 없다.\n㉦ 국제적십자회의는 국제적십자운동 규약에 규정된\n대로 의견일치에 의하여 결의사항을 채택하여야\n한다.", "a": "④", "ex": ""}, {"id": "2025-11", "grp": "2025", "no": 11, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 다음에 해당하는\n대상에 대한 설명으로 가장 적절하지 않은 것은?\n적십자사에 대하여 업무수행과 관련한 의견을\n대의원을 통하여 보고받거나 제의할 수 있다.\n적십자사의 임원, 중앙위원 및 전국대의원총회의\n대의원으로 선임될 수 있다.\n㉦ 대한민국의 법률에 따라 설립된 법인도 될 수 있다.\n법률로 정하는 바에 따라 권리와 의무를 가진다.\n㉦ 대한민국에 거주하는 자는 누구나 될 수 있다.\n㉦ 지사대의원으로 선출될 수 있다.", "a": "②", "ex": ""}, {"id": "2025-12", "grp": "2025", "no": 12, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 다음 중 A에 대한\n설명으로 가장 적절하지 않은 것은?\n적십자사는 정관을 변경하려면 A의 인가를\n받아야 한다.\n적십자사가 사업목적에 필요한 토지 및 사옥의\n취득, 양도, 교환 또는 담보로 제공하고자 할\n때에는 A의 인가를 받아야 한다.\n㉦ 행정안전부장관 및 다른 6개 부처 장관과 함께\n중앙위원회의 위원이 된다.\n적십자사 의결기관의 의결이 현저히 부당하다고\n인정할 때에는 그 시정을 요구할 수 있다.\n㉦ 중앙위원회가 운영위원회 위원으로 호선(互選)할\n수 있다.\n㉦ 조직법상 유사명칭의 사용금지 조항을 위반한 자\n에게 과태료를 부과•징수할 수 있다.", "a": "③", "ex": ""}, {"id": "2025-13", "grp": "2025", "no": 13, "kind": "mc", "area": "", "q": "정관에 관한 사항이다. 다음의 이유가 발생했을 때\n필요한 조치에 관한 설명으로 가장 적절하지 않은\n「대한적십자사 조직법」 이 폐지되었을 때\n• 제네바협약과 국제적십자운동기본원칙에 따라\n사업을 수행할 수 없을 때\n㉦ 중앙위원회 재적위원 중 19명의 출석으로 개의하고,\n그 중 15명이 찬성한 경우 의결할 수 있다.\n중앙위원회의 의결을 거쳐 보건복지부장관의 인가를\n받아야 한다.\n㉦ 채무가 있는 경우 우선 변제한다.\n㉦ 잔여재산이 있을 때에는 절차에 따라 그 재산을\n지방자치단체에 귀속할 수 있다.\n[14~15] 조직법, 정관 및 재무운영규정에 관한 사항이다.\n다음 [보기) 를 보고 질문에 답하시오.\n[보기]\n대한적십자사 회장은 운영위원회 및 중앙위원회\n회의를 소집하여 2025년 5월 23일에 다음의 안건을\n처리하였다.\n<운영위원회>\n• 제1호 의안\n• 제2호 의안\n• 제3호 의안\n<중앙위원회>\n• 제1호 의안\n• 제2호 의안\n• 제3호 의안\n전국대의원총회에서 건의한 정책의 심의\n예산에 편성되지 않은 사업발전준비금\n3억 원의 사용 승인\n직원 임용 관련 '고시의 방법'을 조정하기\n위한 운영규정 개정\n인재개발원 제주 이전에 따른 소재지 변경\n임기만료가 예정된 법률고문 선출\n0 ()지사 봉사관 건물(면적 150평, 가액\n6억 5천만 원) 처분", "a": "②", "ex": ""}, {"id": "2025-14", "grp": "2025", "no": 14, "kind": "mc", "area": "", "q": "[14~15] 조직법, 정관 및 재무운영규정에 관한 사항이다. 다음 【보기】를 보고 질문에 답하시오.\n\n> **【보기】**\n> 대한적십자사 회장은 운영위원회 및 중앙위원회 회의를 소집하여 2025년 5월 23일에 다음의 안건을 처리하였다.\n> **<운영위원회>**\n> • 제1호 의안: 전국대의원총회에서 건의한 정책의 심의\n> • 제2호 의안: 예산에 편성되지 않은 사업발전준비금 3억 원의 사용 승인\n> • 제3호 의안: 직원 임용 관련 '고시의 방법'을 조정하기 위한 운영규정 개정\n> **<중앙위원회>**\n> • 제1호 의안: 인재개발원 제주 이전에 따른 소재지 변경\n> • 제2호 의안: 임기만료가 예정된 법률고문 선출\n> • 제3호 의안: ○○지사 봉사관 건물(면적 150평, 가액 6억 5천만 원) 처분\n\n14. 위 【보기】 중 운영위원회 및 중앙위원회 회의에 상정하는 안건이 조직법, 정관 및 재무운영규정에 위배되거나 부합되지 않는 것은 몇 개인가? (단, 다른 회의에 안건을 위임하거나 긴급을 요하는 사항은 고려하지 않음)\n\n① 1개    ② 2개    ③ 3개    ④ 4개", "a": "②", "ex": ""}, {"id": "2025-15", "grp": "2025", "no": 15, "kind": "mc", "area": "", "q": "15. 다음 중 가장 적절하지 않은 것은?\n\n① 중앙위원회 제1호 의안은 중앙위원회 재적위원 3분의 2의 출석과 출석위원 3분의 2의 찬성으로 의결하여 안건을 처리하였다.\n② 회장은 인도주의 사업운영상 필요하다고 판단되어 회의 당일 특별기금 설치건을 안건으로 상정하여 중앙위원회의 승인을 받았다.\n③ 법률고문은 중앙위원회에 출석하여 제3호 안건에 대한 의견을 진술하였다.\n④ 회장은 2025년 5월 18일에 각 중앙위원회 위원에게 문서로 회의의 소집을 통지하였다.", "a": "④", "ex": ""}, {"id": "2025-16", "grp": "2025", "no": 16, "kind": "mc", "area": "", "q": "조직법 및 정관에 관한 사항이다. 다음 설명 중\n가장 적절하지 않은 것은?\n㉦ 회장은 중앙위원회 승인을 받아 명예고문을 위촉\n할 수 있다.\n중앙위원회 위원 10명이 중앙위원회 회의의 소집을\n요구할 때에는 회장은 회의를 소집하여야 한다.\n운영위원회 관장 사항 중 긴급히 처리해야 할\n사항이나 중요한 사항은 서면의결을 시행할 수\n있다.\n㉦ 회장은 부회장이 특수업무를 담당하도록 운영\n위원회의 승인을 얻어 상근하게 할 수 있다.", "a": "③", "ex": ""}, {"id": "2025-17", "grp": "2025", "no": 17, "kind": "mc", "area": "", "q": "정관, 직원운영규정 및 재무운영규정에 관한 사항\n이다. 다음 [보기] 의 내용 중 옳은 것은 몇 개인가?\n[보기]\n가. 지사회장은 적십자사에 경험이 있고, 사회적\n으로 덕망이 있는 인사를 지사명예고문으로\n회장의 승인을 얻어 위촉할 수 있다.\n나. 세출예산중 경비의 성질상 연도내에 그 지출을\n끝내지 못할 것이 예측될 때에는 회장의 승인을\n얻어 다음 연도에 이월하여 사용할 수 있다\n다. 대한적십자사의 채권을 면제하거나 그 효력을\n변경하고자 할 경우에는 금액에 관계없이 회장의\n승인을 거쳐 시행하여야 한다.\n라. 기관장급 직원이 국외출장을 하고자 할 때에는\n사전에 회장의 승인을 얻어야 한다.\n㉦ 0개\n1개\n2개\n㉦ 3개", "a": "①", "ex": ""}, {"id": "2025-18", "grp": "2025", "no": 18, "kind": "mc", "area": "", "q": "직원운영규정 및 인사관리시행규칙에 관한 사항이다.\n다음 [보기] 에 대한 설명 중 가장 적절하지 않은\n것은?(단, 제시된 내용 이외의 다른 변수는 없다고\n가정 함)\n[보기]\n00혈액원 '직원 A(남, 임상병리사 5급)가 2025.\n3. 31. 같은 혈액원에 근무하는 직원 B(여, 임상병리사\n6급)에게 국가인권위원회법」에 해당되는 성희롱을\n한 사실'이 00혈액원 인사위원회에서 확인되었다.\n이에 00혈액원장은 직원 A에 대한 징계의결을\n관할 징계위원회에 요구하려고 한다.\n㉦ 직원 A에 대한 징계의결 요구는 2035. 4. 1. 이후\n에는 할 수 없다.\n관할 징계위원회는 직원 A에 대해 최고 '파면'\n처분에서부터 최저 '감봉'처분을 징계의결 할 수\n있다.\n㉦ 직원 A가 '정직 3월' 처분을 받는 경우, 징계처분의\n집행이 종료된 날로부터 2년 동안 승진 및 호봉\n승급을 할 수 없다.\n㉦ 관할 징계위원회의 위원장은 혈액관리본부 기획\n관리국장이며, 위원장을 제외한 위원 중 2인 이상을\n여성으로 구성하여야 한다.", "a": "②", "ex": ""}, {"id": "2025-19", "grp": "2025", "no": 19, "kind": "mc", "area": "", "q": "직원운영규정 및 인사관리시행규칙에 관한 사항이다.\n다음 [보기] 의 내용 중 옳은 것은 몇 개인가?\n[보기]\n가. A기관은 직원의 신규채용 임용고시 공고를 원서\n접수 종료일로부터 15일 이전에 인터넷 공고를\n하였다.\n나. B기관 징계위원회는 부득이한 사유가 있어 30일\n이내에 의결이 어려워 징계요구권자인 기관장의\n승인을 받아 징계의결 기간을 30일 연장하였다.\n다. C기관은 면접시험 시행일로부터 7일 이내에\n최종합격자 발표를 공고하였다.\n라. D기관의 임용권자는 인사의 공정성을 유지하기\n위해 5급 승진후보자를 대상으로 자체 필기\n시험을 시행하였다.\n㉦ 1개\n2개\n3개\n㉦ 4개", "a": "③", "ex": ""}, {"id": "2025-20", "grp": "2025", "no": 20, "kind": "mc", "area": "", "q": "직원운영규정에 관한 사항이다. 다음 중 가장 적절\n하지 않은 것은?\n㉦ 직무와 관련되는 국제기구 또는 외국기관, 국가\n기관에 임시로 고용될 때의 휴직기간은 2년 이내로\n하되, 부득이한 경우 회장의 승인을 받아 연장할\n수 있다.\n가족돌봄휴가는 무급으로 하며 일단위로 사용할\n수 있고, 가족돌봄휴직 기간에 포함된다.\n㉦ 자녀가 2명이 있는 직원이 「영유아보육법」에 따른\n어린이집, 「유아교육법」에 따른 유치원 및 「초 • 중등\n교육법」 제2조 각 호의 학교에서 공식적으로 주최\n하는 행사, 교사와의 상담에 참여하기 위해 연간\n3일의 범위에서 자녀돌봄휴가를 받을 수 있다.\n㉦ 출산휴가의 사용은 직원의 배우자가 출산할 날부터\n120일 이내에 하여야 하며, 3회 분할 사용이 가능\n하다.", "a": "①", "ex": ""}, {"id": "2025-21", "grp": "2025", "no": 21, "kind": "mc", "area": "", "q": "정관, 직원운영규정 및 인사관리시행규칙에 관한\n사항이다. 다음 [보기] (가)~(라)의 기간이 짧은\n것부터 순서대로 나열된 것을 고르시오.\n[보기]\n직원이 국내 출장용무를 마치고 귀사한 때에는\n( 가 ) 이내에 기관장 또는 소속기관장에게\n결과보고서를 제출하여야 한다.\n직원이 신임 또는 전임발령을 받았을 때에는\n( 나 ) 이내에 부임하여야 한다.\n기록말소심사위원회는 부득이한 사유가 없을\n경우 심의•의결을 요구받은 날로부터 ( 다 )\n이내에 심의•의결하여야 한다.\n법령과 정관 및 중앙위원회 의결에 따른 적십자사의\n공고는 인터넷 홈페이지(www.redcross.or.kr)에\n( 라 ) 이상 게시하여야 한다.\n㉦ 가-나-다-라\n가-나-라-다\n나-가-다-라\n㉦ 나-가-라-다", "a": "①", "ex": ""}, {"id": "2025-22", "grp": "2025", "no": 22, "kind": "mc", "area": "", "q": "조직법, 직원운영규정, 감사운영규정 및 인사관리\n시행규칙에 관한 사항이다. 다음 중 口에 들어갈\n단어가 다른 것은?\n㉦ 적십자사는 매 회계연도의 사업계획 및 예산안을\n작성하여 운영위원회의 심의와 중앙위원회의 의결\n및 전국대의원총회의 승인을 받아 해당 회계연도가\n시작되기 口 전에 보건복지부장관에게 제출하\n여야 한다.\n이의신청을 받은 특별징계위원회가 설치되어 있는\n기관의 장은 이의신청서를 접수 하였을 때에는\n지체없이 이를 심사결정하여 口 이내에 본인\n및 해당 기관장에게 통고하여야 한다.\n감사대상기관의 장은 감사결과 처분요구를 받은\n날부터 口 이내에 필요한 시정 등 조치를 취하고,\n처분요구에 대한 조치결과를 회장에게 보고하여야\n한다.\n㉦ 사무총장은 연수운영위원회를 통해 연간 교육\n훈련의 계획을 수립하고, 인재개발원장은 피교육자,\n교과목, 기간, 시기 등을 선정하여 口 전에\n기관장 및 소속기관장에게 통보하여야 한다.", "a": "②", "ex": ""}, {"id": "2025-23", "grp": "2025", "no": 23, "kind": "mc", "area": "", "q": "정관, 직원운영규정, 직원보수운영규정 및 감사운영\n규정에 관한 사항이다. 다음 중 옳고 그름의 표시\n(0, X)가 맞게 나열된 것을 고르시오.\n개 천재지변 또는 돌발사태로 인하여 전국대의원\n총회를 소집하지 못하여 임기 만료된 중앙위원을\n선출하지 못하였을 때에는 해당 중앙위원의\n임기는 다음 전국대의원총회 때까지 연장된다.\n나. 강등된 자가 사무인계 또는 잔무처리로 인하여\n특명을 받아 근무할 경우에는 그 기간에 대하여\n종전과 동일한 보수를 일할 계산하여 지급한다.\n다 해면된 직원에 대하여 사무인계 또는 잔무처리상\n필요한 경우에는 소속기관장은 15일을 한도로\n계속 근무하게 할 수 있다.\n라. 감사결과 성실한 직무수행 과정에서 발생한\n경과실이나 적극적인 민원처리 과정에서 발생한\n경미한 착오 등으로 인한 결과에 대해서는\n불이익한 처분을 요구하지 않거나 감경할 수\n있다.\n㉦ 가(0)\n가(X)\n가(0)\n다(X)\n나(X)\n라(X)\n라(X)", "a": "①", "ex": ""}, {"id": "2025-24", "grp": "2025", "no": 24, "kind": "mc", "area": "", "q": "직원운영규정에 관한 사항이다. 다음 직원들의 대화\n중 가장 적절하지 이야기를 하는 직원은 누구인가?\nA. 너희 그 얘기 들었어? 총무팀 최과장님이 작년\n부터 고민 끝에 올해 초등학교 입학한 아들\n양육 때문에 이번 7월 1일자로 육아휴직을 신청\n하셨데. 대체인력 채용이 계속 안 돼서 휴직\n허용이 안 되는 건 아닌지 최과장님이 걱정이\n많던데, 그렇더라도 육아휴직은 허용해야 하는\n건데 괜한 걱정을 하고 계신 것 같아.\nB: 7월 1일이면 스위스 제네바에 있는 국제적십자사\n연맹에 6개월간 파견 가 있는 박과장님이 복귀\n하시는 날이잖아. 그런데 박과장님은 내년 말까\n지는 사무총장님이 지정하는 기관에 근무하셔야\n하니까, 우리 지사로 복귀하지 못할 수도 있겠다.\nC: 사무처장님도 내년 6월 말이면 정년퇴직이니까,\n올해 10월 1일부터는 공로연수를 시작하시겠다.\n올해 하반기는 지사 분위기가 좀 어수선하겠네.\nD: 그래도 이번 시무직 공개채용을 통해 4월 1일자에\n들어온 신입직원 덕분에 최근 지사 분위기가 더\n활기차진 것 같아. 지사에 정규직 신입직원이\n입사한 건 정말 오랜만이네. 6월 말까지는 수습\n기간이니까 무사히 임용될 수 있게 우리가 잘\n도와주자.\nOA C ㉦ D", "a": "③", "ex": ""}, {"id": "2025-25", "grp": "2025", "no": 25, "kind": "mc", "area": "", "q": "인사관리시행규칙에 관한 사항이다. 다음 ㉮~㉵\n중 옳지 않은 것은 몇 개인가?\n임원이나 위원으로 선출 또는 인준된 자에게는\n필요한 경우에 ㉮~을 발급할 수 있다.\n임용권자는 정규직원으로 임용되거나 승진될\n때에는 전보될 때에는 ㉰~을\n해당 직원에게 수여한다. 이 경우 소속기관의\n장이 대리 수여할 수 있으며, 4급 과장 이하\n직원 및 기능직원의 전보 임용에 있어서는 ㉱\n발령통지서의 교부로써 ㉲위용장의 수여에 갈음\n할 수 있다.\n직원 및 고용원에 대한 ㉳위뗰장 또는 ㉴발령\n통지서는 해당 임용권자가 이를 교부한다. 다만,\n필요한 경우에는 기관장 또는 소속기관장으로\n하여금 전달 교부하게 할 수도 있다.\n직•용원이 퇴직하였을 때에는 기관장 또는 소속\n기관장은 ㉵위장장을 회 수하여야 한다.\n㉦ 2개 3개 4개 ㉦ 5개", "a": "③", "ex": ""}, {"id": "2025-26", "grp": "2025", "no": 26, "kind": "mc", "area": "", "q": "인사관리시행규칙에 관한 사항이다. 口안에 들어갈\n단어로 옳지 않은 것은?\n제4조(임원의 의원 입후보) 적십자가 지닌 고도의\n공익성과 중립성을 고려하여 회장, 부회장, 지사\n회장, 지사부회장은 口, 口, 口, 口, 口에\n입후보 등록(예비후보자 등록 포함)을 할 때에는\n사전에 그 직을 사임하여야 한다.\n제26조(직원 및 고용원의 입후보) 직원 및 고용원은\n口, 口, 口, 口, 口에 입후보 등록(예비\n후보자 등록 포함)을 할 때에는 본 시행규칙 제4조를\n준용한다.\n㉦ 대통령\n지방자치단체의 장\n국회의원\n㉦ 교육의 원", "a": "①", "ex": ""}, {"id": "2025-27", "grp": "2025", "no": 27, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. 다음 중 가장\n적절하지 않은 것은?\n[별표 제2호의2] 직원업무수당기준표 (단위: 원)\n\n| 업무구분 | 지급대상 | 지급액 |\n| :--- | :--- | :--- |\n| 기술 | 기술원, 운전원, 생산원 | 기사 80,000<br>산업기사 75,000<br>기능사 70,000<br>운전1종 대형 80,000 |\n| 기능 | 사무보조원, 생산원, 기능원, 간호조무사, 장례지도사 | 기능사 60,000<br>운전1종 대형미만 70,000<br>간호조무사 60,000<br>장례지도사 60,000 |\n| 고용 | 고용원 | 60,000 |\n\n① 기술(기능)분야의 기능장, 기술사 자격보유자에 대한 업무수당은 해당 업무종사자에 한하여 최고한도액에서 20,000원을 추가 지급할 수 있다.\n② 해당 업무종사자로서 자격 미보유자는 해당업무의 최저지급액을 적용한다.\n③ 사무보조원의 경우 근무하는 기관에 상관없이 업무수당은 60,000원을 지급한다.\n④ 기관장이 필요하다고 인정하여 기술(기능)자격을 보유한 일반직원이 법정 필수기술(기능)업무를 겸직하게 하였을 때에는 해당수당을 지급할 수 있다.", "a": "③", "ex": ""}, {"id": "2025-28", "grp": "2025", "no": 28, "kind": "mc", "area": "", "q": "재무운영규정에 관한 사항이다. 다음 중 가장 적절\n하지 않은 것은?\n㉦ 인재개발원의 금전출납의 원인이 되는 모든 결재\n서류에는 총무팀장이 전자서명으로 확인하여야 한다.\n혈액관리본부 구매자산팀장은 혈액관리본부의 물품을\n출납 보관하여야 한다.\n㉦ 의료원 경영지원팀장이 그 보관에 속하는 물품을\n훼손하였을 경우, 선량한 관리자로써의 주의를 태만\n하게하지 아니한 증명을 못하였을 때에는 변상의\n책임을 져야 한다.\n㉦ 혈장분획센터 물류팀장은 재정보증 없이는 물품\n출납업무를 담당할 수 없다.", "a": "②", "ex": ""}, {"id": "2025-29", "grp": "2025", "no": 29, "kind": "mc", "area": "", "q": "여비운영규정에 관한 사항이다. 다음 (보기] 의 설명\n중 옳지 않은 것은 몇 개인가?\n[보기]\n가. 근무지 또는 출장지 외의 곳에 거주하거나\n체재하는 임쯰원이 그 거주지 또는 체재지\n로부터 목적지까지 직접 여행하는 경우 지급\n여비는 근무지 또는 출장지로부터 목적지\n까지의 여비를 초과하지 못한다.\n나. 직원이 부임의 명을 받아 근무지가 변경되어\n새로운 근무지로 여행하는 때에는 새로운 직에\n해당하는 여비를 부임지에서 지급할 수 있다.\n다. 기관 소재지 이전에 따라 거주지를 이전하는\n직원이 이전비를 지급받고자 하면 기관 이전이\n완료된 날부터 기산하여 6개월 이내에 새 근무\n기관에 신청하여야 한다.\n라. 출장자가 출장 중 질병으로 출장일수를 초과\n하였을 경우 의사의 진단서를 제출하면 소속\n기관장은 해당 일비 및 숙박비를 지급할 수\n있다.\n㉦ 0개\n1개\n2개\n㉦ 3개", "a": "②", "ex": ""}, {"id": "2025-30", "grp": "2025", "no": 30, "kind": "mc", "area": "", "q": "감사운영규정에 관한 사항이다. 다음 중 가장 적절\n한 것은?\n㉦ 일상감사는 주요 업무 집행 결과에 대해 그 업무의\n적법성따당성 등을 점검찖사하는 감사이다.\n종합감사의 주기는 3년으로 하되, 상급기관에서\n3년 이내에 감사를 실시하였거나 해당 연도 실시\n계획이 있는 기관은 감사를 생략할 수 있다.\n㉦ 감사반장은 합법성과 합목적성의 이념 하에 관계\n법령 또는 정관, 제규정, 지침 등을 숙지하고,\n객관적 사실에 근거하여 감사를 실시하여야 한다.\n㉦ 감사부서의 장은 감사결과에 대한 이의신청을 검토\n하여 이의신청이 요건을 갖추지 못하였을 때에는\n별도의 심의위원회를 통해 심의절차를 거쳐야 한다", "a": "③", "ex": ""}, {"id": "2025-31", "grp": "2025", "no": 31, "kind": "mc", "area": "", "q": "직원보수운영규정에 관한 사항이다. 다음 밑줄 친\n㉮~㉲ 중 옳지 않은 것은 몇 개인가?\n2025년 4월 1일자로 입사하신 신입직원 여러분,\n반갑습니다. 저는 총무팀 급여업무 담당자\n홍길동입니다. 지금부터 우리사 보수체계에\n대해 안내드리겠습니다. 우리사는 직원보수\n운영규정에 따라 매달 봉급과 상여수당을\n비롯한 각종 수당을 지급하고 있습니다. 오늘\n5월 20일은 실적평가급을 지급하여 드리는\n날인데, ㉮아쉽게도 여러분은 이번 실적평가급\n지급대상에서는 제외됩니다. 그래도 ㉯다가\n오는 7월에는 여러분도 하계상여금 지급대상이\n된_수_있습니다 여러분의 경우는 입사일로부터\n계속근로연수가 1년 미만인 직원으로, ㉰이미\n2일의 연차휴가를 부여받아- 사용하실 수 있\n습니다 참, 여러분 중에서 김대한님이 지난\n4월 13일에 결혼하셨다고 들었습니다. ㉱가족\n수당은 그 지급사유가 발생한 날이 속하는 달\n부터 소멸한 날이 속하는 달분까지 지급하므로,\n김대한님은 오늘 안내가 끝난 후 배우자분에\n대한 부양가족신고서를 제출해 주시면 ㉲4월\n분부터 매달 4만원의 가족수당을 지급하여\n트괴껮습니다 경청 해 주셔서 감사합니 다.\n㉦ 1개 2개 3개 ㉦ 4개\n\n\n[32~33] 직원운영규정, 직원보수운영규정 및 인사관리\n시행규칙에 관한 사항이다. 다음을 보고 질문에\n답하시오.(단, 제시된 내용 이외의 승진이나 승급에\n영향을 주는 다른 변수는 없다고 가정함)\n직원\n2023. 1. 1.\n기술3급\n2024. 1. 1.\n기술2급\n2024. 4. 1.\n견책\n(직장이탈금지 위밴\n2024. 10. 1.\n2024. 12. 31.\n배 우자동반휴직", "a": "②", "ex": ""}, {"id": "2025-32", "grp": "2025", "no": 32, "kind": "mc", "area": "", "q": "[32~33] 직원운영규정, 직원보수운영규정 및 인사관리시행규칙에 관한 사항이다. 다음을 보고 질문에 답하시오. (단, 제시된 내용 이외의 승진이나 승급에 영향을 주는 다른 변수는 없다고 가정함)\n\n| 구분 | 직원 A | 직원 B | 직원 C |\n| :--- | :--- | :--- | :--- |\n| **입사** | 2022. 10. 1. (7급) | 2023. 1. 1. (기술3급) | 2022. 12. 1. (7급) |\n| **승진** | 2024. 1. 1. (6급) | 2024. 1. 1. (기술2급) | 2024. 1. 1. (6급) |\n| **징계처분 및 직위해제 (사유)** | 2024. 4. 1. 감봉 6월 (직무 태만) | 2024. 4. 1. 견책 (직장이탈금지 위반) | 2024. 9. 1. 직위해제 3개월 (근무태도 불성실) |\n| **휴직** | - | 2024. 10. 1. ~ 2024. 12. 31. (배우자동반휴직) | 2024. 12. 1. ~ 2025. 2. 28. (가족돌봄휴직) |\n\n32. 2025년 5월 23일을 기준으로 상기 직원들의 차기 승급일 및 승진일에 관한 설명으로 가장 적절하지 않은 것은?\n\n① 차기 승진일은 B가 C보다 늦다.\n② 차기 승진일은 C가 A보다 빠르다.\n③ 차기 승급일은 B가 A보다 빠르다.\n④ 차기 승급일은 A가 C보다 늦다.", "a": "④", "ex": ""}, {"id": "2025-33", "grp": "2025", "no": 33, "kind": "sa", "area": "직원운영규정 및 보수운영규정 (차기 승급일 계산)", "q": "33. 2025년 5월 23일을 기준으로 [32번 보기]의 직원 A의 차기 승급일은 언제인가? □에 알맞은 숫자를 순서대로 쓰시오. (날짜표기 방법 예시: 2025년 05월 23일)\n\n㉮(□□□□)년 ㉯(□□)월 ㉰(□□)일", "a": "㉮ 2026, ㉯ 04, ㉰ 01", "ex": ""}, {"id": "2025-34", "grp": "2025", "no": 34, "kind": "sa", "area": "정관 (지사상임위원 및 지사대의원 정원 산출)", "q": "34. 정관에 관한 사항이다. □에 알맞은 숫자를 쓰시오. (단, 제시된 내용 이외의 사항은 고려하지 않으며, 지사회장을 제외한 인원수를 산출할 것)\n\n> 행정구역 개편으로 신설된 ○○○도에 지사를 새로이 설치하고 지사 의결기관을 구성하려고 한다. > ○○○도의 시·군·구의 지역수는 6개 지역이라고 할 때 새롭게 설치되는 대한적십자사 ○○○도지사의 > 지사상임위원과 지사대의원 인원수의 합은 ㉮(□□)명이다.", "a": "㉮ 50", "ex": "<b>해설<\/b>:<br>• 지사상임위원: 지사회장 1명 + 위원 17명 = 18명 (회장 제외 시 17명)<br>• 지사대의원: 회장 1명 + 시군구 대표(지역당 대의원) 등 정관 기준에 따른 총 정원 산출<br>• 회장 제외 합산 = <b>50명<\/b>"}, {"id": "2025-35", "grp": "2025", "no": 35, "kind": "sa", "area": "직원운영규정 (제51조 당연퇴직 사유)", "q": "직원운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n제51조(당연퇴직) 직원은 다음 각 호의 어느 하나에\n해당될 때에는 당연퇴직된다.\n1. 제20조 각 호의 어느 하나에 해당되는 경우.\n다만, 제20조제2호와 제5호는 다음 각 목에\n해당될 경우에 한한다.\n가. 제20조제2호는 파산선고를 받은 사람으로서\n「채무자 회생 및 파산에 관한 법률」 에 따라\n신청기한 내에 면책신청을 하지 아니하였거나\n㉮(□□□□□) 결정 또는 면책 취소가 확정\n된 경우\n나. 제20조제5호는 「형법」 제129조부터 제132조\n까지, 「성폭력범죄의 처벌 등에 관한 특례법」\n제2조, 「정보통신망 이용촉진 및 정보보호\n등에 관한 법률」 제74조제1항제2호 • 제3호,\n「스토킹범죄의 처벌 등에 관한 법률」 제2조\n제2호, 「아동 • 청소년의 성보호에 관한 법률」\n제2조제2호 및 직무와 관련하여 「형법」\n제3石조 또는 제표56조에 규정된 죄를 범한\n사람으로서 금고 이상의 형의 ㉯(□□□□)\n(을)를 받은 경우\n2. 정년에 도달한 경우", "a": "㉮ 면책불허가, ㉯ 선고유예", "ex": "<b>근거 조항 (직원운영규정 제51조 당연퇴직)<\/b>:<br>• 제1호 가목: 파산선고를 받은 사람으로서 면책신청을 하지 않았거나 <b>㉮ 면책불허가<\/b> 결정 확정 시<br>• 제1호 나목: 횡령/배임 및 성범죄 등 특정 범죄로 금고 이상의 형의 <b>㉯ 선고유예<\/b>를 받은 경우"}, {"id": "2025-36", "grp": "2025", "no": 36, "kind": "sa", "area": "직원운영규정 (출산휴가 및 미숙아/다태아 휴가일수)", "q": "직원운영규정에 관한 사항이다. □에 들어갈 숫자를\n순서대로 쓰시오.\n임산부에게는 출산일을 전후하여 90일( 「고용\n노동부령」 으로 정하는 미숙아를 출산한 경우\n에는 ㉮(□□□)일, 한 번에 둘\n이상 자녀를\n임신한 경우에는 ㉯(□□□)일)의 휴가를 허가\n하여야 한다. 다만 출산 후에 45일(한 번에 둘\n이상 자녀를 임신한 경우에는 60일) 이상이 보장\n되도록 하여야 하며, 휴가 중 최초 60일(한 번에\n둘 이상 자녀를 임신한 경우에는 ㉰(□□)일)은\n유급으로 한다.", "a": "㉮ 100, ㉯ 120, ㉰ 75", "ex": "<b>근거 조항 (직원운영규정 임산부 보호)<\/b>:<br>• 미숙아 출산 시: <b>㉮ 100일<\/b><br>• 한 번에 둘 이상 자녀(다태아) 임신 시: <b>㉯ 120일<\/b>, 유급 휴가 <b>㉰ 75일<\/b>"}, {"id": "2025-37", "grp": "2025", "no": 37, "kind": "sa", "area": "직원운영규정 (제45조 공가 - 장기기증 휴가일수)", "q": "직원운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n제45조(휴가의 종류) 직원의 휴가는 연차유급휴가,\n병가, 공가, 생리휴가, 출산전후휴가, 유산•사산\n휴가 및 경조휴가 등으로 구분하며 각 기관의\n장은 직무수행 상 특별한 지장이 없는 한 직원의\n청원에 의하여 이를 허가할 수 있다.\n1.~4. (생략)\n5. 공 가\n직원이 다음 사유로 근무하지 못하는\n경우에는\n필요로 하는 기간을 공가로 한다.\n가.~마. (생략)\n바. 장기\n기증할 때\n(1) 신장•간장•골수 등의 기증 전 ㉮(□□ □□□)\n(2) 신장•간장•골수 등의 기증을 위한 입원 및\n수술(말초혈조혈모세포 채취 포함)시 진단서\n상의 ㉯(□□□)\n(3) 신장•간장•골수 등을 기증한 후 기증자의\n사후관리를 위한 ㉮(□□ □□□)\n사.~아. (생략)\n6=13. (생략)", "a": "㉮ 신체 검진일, ㉯ 요양일", "ex": "<b>근거 조항 (직원운영규정 제45조 공가)<\/b>:<br>• 기증 전: <b>㉮ 신체 검진일<\/b><br>• 기증을 위한 입원 및 수술: 진단서 상의 <b>㉯ 요양일<\/b><br>• 기증 후 사후관리: <b>㉮ 신체 검진일<\/b>"}, {"id": "2025-38", "grp": "2025", "no": 38, "kind": "sa", "area": "재무운영규정 (지출원인행위, 과년도지출, 수입대체경비)", "q": "재무운영규정에 관한 사항이다. □에 들어갈 단어를\n순서대로 쓰시오.\n제31조(지출원인행위) ㉦~9 (생략)\n㉦각 기관장 및 재무원은 계약 및 ㉮(□□□)\n(을)를 제외한 각 부서의 일상경비에 한하여\n관련 부서장과 그 차하위 직원에게 위임하여\n지출원인행위를 담당하게 할 수 있다.\n제34조(과년도지출) 과년도에 속하는 채무 확정액\n으로써 지출하지 아니한 경비는 현년도 세출\n예산에서 지출하여야 하며 그 경비 소속년도의\n매 항 금액중 ㉯(□□)(으)로 된 금액을 초과\n하지 못한다.\n제51조(㉰(□□□□□□)) ㉦지출이 직접 수입을\n수반하는 경비(이하 “㉰(□□□□□□)”라 함)에\n있어서는 각 기관의 장은 그 수입이 확보되는\n범위 내에서 직접 지출할 수 있다. 다만, 수입이\n예산을 초과하거나 초과할 것이 예상되는 경우\n에는 그 초과수입을 해당 초과수입에 직접 관련\n되는 경비로 초과지출 할 수 있다.\n9~㉦ (생략)", "a": "㉮ 물건비, ㉯ 불용, ㉰ 수입대체경비", "ex": "<b>근거 조항 (재무운영규정)<\/b>:<br>• 제31조: 계약 및 <b>㉮ 물건비<\/b>를 제외한 각 부서의 일상경비<br>• 제34조: 소속년도의 매 항 금액 중 <b>㉯ 불용<\/b>으로 된 금액을 초과하지 못함<br>• 제51조: 지출이 직접 수입을 수반하는 경비 = <b>㉰ 수입대체경비<\/b>"}, {"id": "2025-39", "grp": "2025", "no": 39, "kind": "sa", "area": "국제인도법 핵심규칙 (전쟁의 수단과 방법 규제)", "q": "국제인도법의 핵심규칙에 관한 사항이다. □에\n들어갈 단어를 순서대로 쓰시오.\n충돌 당사자는 전쟁 ㉮(□□)(와)과 수단을 무제한\n적으로 선택할 수 있는 권리를 갖지 않는다. 무차별\n적인 전쟁 무기 또는 ㉮(□□)의 사용은 과도한\n㉯(□□) 또는 불필요한 ㉰(□□)(을)를 야기할 수\n있기 때문에 금지된다.", "a": "㉮ 방법, ㉯ 상해, ㉰ 고통", "ex": "<b>근거 (IHL 핵심원칙)<\/b>: 전쟁의 <b>㉮ 방법<\/b>과 수단을 무제한 선택할 수 없음. 과도한 <b>㉯ 상해<\/b> 또는 불필요한 <b>㉰ 고통<\/b>을 야기하는 무기/수단 금지."}, {"id": "2025-40", "grp": "2025", "no": 40, "kind": "sa", "area": "국제인도법 및 인권법 (보호 목적과 기본 가치)", "q": "국제인도법과 국제인권법에 관한 사항이다. □에\n들어갈 단어를 순서대로 쓰시오.\n국제인도법과 국제인권법은 일부 동일한 목표를\n공유하며 서로를 보완하는 국제법 체계이다. 국제\n인도법과 인권법은 비록 그 관점은 다르나 모두\n개인의 ㉮(□□), ㉯(□□), ㉰(□□□)(을)를 보호\n하고자 한다.\n※ 그동안 수고 많으셨습니다.", "a": "㉮ 생명, ㉯ 건강, ㉰ 존엄성", "ex": "<b>근거 (IHL과 인권법)<\/b>: 인간 개인의 <b>㉮ 생명<\/b>, <b>㉯ 건강<\/b>, <b>㉰ 존엄성<\/b>을 보호하고자 함."}, {"id": "2026-01", "grp": "2026", "no": 1, "kind": "mc", "area": "", "q": "조직법에관한사항이다. 다음중□에들어갈\n단어가다른것은?\n\n① □는개인, 사업자, 법인또는단체등을대상\n으로회원모집및회비모금활동을할수있다.\n\n② 국가와지방자치단체는적십자사의업무수행에\n관하여□의요청이있는경우협조할수있다.\n\n③ 법률고문은□의모든법률문제에관하여조언을\n하거나자문에응한다.\n\n④ □에사무총장1명을두며, 사무총장은회장의\n명을받아적십자사의사무를관장하고소속직원을\n지휘·감독한다.", "a": "④", "ex": "<b>해설<\/b>:<br>• ①, ②, ③의 □는 모두 '대한적십자사'(또는 '적십자사')임.<br>• ④번: 대한적십자사 조직법 제19조제2항에 따라 '사무처'에 사무총장 1명을 둠."}, {"id": "2026-02", "grp": "2026", "no": 2, "kind": "mc", "area": "", "q": "조직법및정관에관한사항이다. 다음중임원이\n될수있는사람은?\n\n① 김인도: 파산선고를받은지2년이지났으나아직\n복권되지않았다.\n\n② 이공평: 금고이상의형의집행유예를선고받고\n2년째유예기간중에있다.\n\n③ 박중립: 대한적십자사조직법이아닌다른법률에\n따라자격이2년째정지되어있다.\n\n④ 최독립: 금고이상의실형을선고받고그집행이\n종료된날부터2년이지났다.", "a": "④", "ex": ""}, {"id": "2026-03", "grp": "2026", "no": 3, "kind": "mc", "area": "", "q": "조직법및정관에관한사항이다. 다음【보기】의\n설명중옳지않은것은몇개인가?\n【보기】\n가. 보건복지부장관은중앙위원회의의결이현저히\n부당하다고인정할때에는그시정을요구할\n수있다.\n나. 적십자사가사업목적에필요하여, 가액이7억원인\n400평의기본재산토지를담보로제공하고자할\n때에는보건복지부장관의승인을받아야한다.\n다. 지사조직위원회에서상임위원의선거가끝나면\n조직위원장은\n회의록을\n첨부하여\n지사회장의\n인준을받아야한다.\n라. 부회장은중앙위원회에서선출한후대통령의\n인준을받지않아도된다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개", "a": "②", "ex": ""}, {"id": "2026-04", "grp": "2026", "no": 4, "kind": "mc", "area": "", "q": "정관에관한사항이다. 다음중운영규정으로정하도록\n정관에명시되지않은것은?\n\n① 임원및고문의처우에관한사항\n\n② 지사관하\n시·군·구에\n설치할\n수\n있는\n지부의\n운영에관한사항\n\n③ 각종사업을원활히수행하기위한사업분야별\n자문위원회설치에필요한사항\n\n④ 적십자사의재무사무및그에관련되는사항", "a": "③", "ex": ""}, {"id": "2026-05", "grp": "2026", "no": 5, "kind": "mc", "area": "", "q": "조직법에관한사항이다. 다음중사업계획의제출\n등에\n관한\n절차에\n대한\n설명으로\n가장\n적절한\n것은?\n\n① \n국가나\n지방자치단체로부터\n자금이나\n사업비를\n전혀보조받지않는사업계획이라도보건복지부\n장관에게제출하는절차를생략할수없다.\n\n② 의결기관의심의및의결, 승인절차를거친후\n국회및보건복지부장관에게사업계획및예산안을\n제출해야한다.\n\n③ 사업계획의변경이필요한경우에는운영위원회의\n심의와중앙위원회의의결을받아즉시변경하고\n보건복지부장관에게제출한다.\n\n④ 결산보고서는회계연도종료후6개월이내에공인\n회계사의감사를받아회계감사보고서를첨부하여\n제출하여야한다.", "a": "①", "ex": ""}, {"id": "2026-06", "grp": "2026", "no": 6, "kind": "mc", "area": "", "q": "다음은직원운영규정및직원보수운영규정에관한\n사항이다. 다음【보기】를읽고, 가장적절하지않은\n것을고르시오.\n【보기】\n· 김인도직원은2025년4월1일에전일제정규\n직원으로입사하였다.\n· 김인도직원은2025년4월1일부터2025년12월\n31일까지개근하였다.\n· 김인도직원은2025년12월15일부터19일까지\n5일의연차유급휴가를사용하였다.\n· 김인도직원의2026년1월통상임금은209만원\n이다.\n※상기명시된내용외최저임금기준등은고려하지않음\n\n① 2025년12월1일기준으로김인도직원에게부여된\n연차유급휴가일수는8일이다.\n\n② 2026년1월15일에김인도직원에게지급되는\n연가보상비는24만원이다.\n\n③ 김인도직원이3년이상계속근로하는경우매년\n80% 이상출근시15일이상의연차유급휴가를\n받을수있다.\n\n④ 2026년도에김인도직원은최대10일까지는시간\n단위로, 잔여일수는4시간단위로연차유급휴가를\n사용할수있다.", "a": "②", "ex": ""}, {"id": "2026-07", "grp": "2026", "no": 7, "kind": "mc", "area": "", "q": "직원운영규정\n중\n임용권위임에\n관한\n사항이다.\n다음【보기】의발령내역에서㉮∼㉲중옳은것은\n몇개인가? (임용권을전행하지않음을전제로함)\n【보기】\n· A혈액원소속B직원(사무직팀원) 발령내역\n발령일자\n발령명\n소속\n임용권자\n(승급:발령권자)\n2010. 1. 1.\n신규채용\nA혈액원총무팀\n2023. 1. 1.\n전보\nA혈액원\n헌혈지원팀\n㉮A혈액원장\n2025. 4. 1.\n정기승급\n㉯A혈액원장\n2025. 7. 1.\n승진(4급)\n㉰사무총장\n2025.10. 1.\n육아휴직\n㉱A혈액원장\n2025.12. 1.\n복직\n2026. 1. 1.\n파견\nA혈액원\n헌혈지원팀\n(파견소속: 본사\n감사실감사팀)\n㉲사무총장\n2026. 4. 1.\n정기승급\n\n① 2개\n\n② 3개\n\n③ 4개\n\n④ 5개", "a": "②", "ex": ""}, {"id": "2026-08", "grp": "2026", "no": 8, "kind": "mc", "area": "", "q": "직원운영규정, 직원보수운영규정및인사관리시행\n규칙에관한사항이다. 다음【보기】를읽고, 가∼라의\n설명중옳은것은몇개인지고르시오.\n【보기】\n봉급사정표\n(2026. 5. 1.자신규임용정규직의무직신입A직원)\n성명\nA\n임용직급\n의사(의무직)\n최종출신학교\nOO대학교학위\n학사\n경\n력\n평\n정\n경력구분\n재\n직\n기\n간\n환산비율\n○○보훈공단\n2008. 1. 1. -\n2008.12.31.\n1년\n㉠\n군경력\n(육군병장)\n2009. 3. 1. -\n2011. 2.28.\n2년\n㉡\n△△병원(의무직)\n2020. 4. 1. -\n2026. 3.31.\n6년\n㉢\n계\n비고\n의사면허취득일(2019. 2.23.)\n※상기명시된내용외고려하지않음\n가. A직원의초임급은의무직원9호봉으로한다.\n나. ㉠에들어갈값은50%이다.\n다. ㉡에들어갈값은100%이다.\n라. ㉢에들어갈값은100%이다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개", "a": "③", "ex": ""}, {"id": "2026-09", "grp": "2026", "no": 9, "kind": "mc", "area": "", "q": "직원운영규정및인사관리시행규칙에관한사항이다.\n다음【보기】를읽고, 가∼라의설명중옳지않은\n것은몇개인지고르시오.\n【보기】\n· A혈액원B팀장(관리사4급)은2025년10월1일에\n20호봉으로정기승급을하였다.\n· A혈액원B팀장은2025년10월27일에적십자\n회원유공장을수상하였다.\n· A혈액원B팀장은2026년1월음주운전한사실로\n인해2026년3월1일자로감봉6월처분을받았다.\n※상기명시된내용외징계위원회의관할권조정등은\n고려하지않음\n가. B팀장의징계사건을심의·의결하기위한혈액\n관리본부보통징계위원회는혈액관리본부장을\n위원장으로하고, 위원장이지명하는내부위원\n2인, 외부위원4인으로구성한다.\n나. 본\n징계사건을\n심의·의결한\n징계위원회는\nB팀장이적십자회원유공장을수상한사실이\n있으므로그징계를감경할수있었다.\n다. B팀장이2026년3월1일자로감봉6월처분을\n받은이후첫승급일자는2028년4월1일이다.\n라. B팀장의징계처분에대한이의신청은본사\n특별징계위원회에서심의·의결한다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개", "a": "③", "ex": ""}, {"id": "2026-10", "grp": "2026", "no": 10, "kind": "mc", "area": "", "q": "직원운영규정에관한사항이다. 징계의사유및\n절차에대한설명으로가장적절한것은? (단, 모든\n징계사유는2026년이후발생하였음)\n\n① A혈액원보통징계위원회는공금50만원을횡령한\n직원김인도에게300만원의징계부가금을부담\n하도록의결하였다.\n\n② 직원김인도가정직처분을받은경우1개월이상\n6개월이하의기간동안보수및수당을지급하지\n않는다.\n\n③ 직원이공평이감봉처분을받은경우처분기간\n중직원으로서의신분을유지하나직무에종사하지\n못한다.\n\n④ 직원이공평의징계사유가금품의제공에해당하는\n경우에그사유가발생한날로부터5년을경과한\n때에는징계의결요구를할수없다.", "a": "④", "ex": ""}, {"id": "2026-11", "grp": "2026", "no": 11, "kind": "mc", "area": "", "q": "직원운영규정중휴가에관한사항이다. 다음설명\n중가장적절한것은?\n\n① 직원의휴가는직원의청원에의하며, 각기관의\n장은항상이를허가해야한다.\n\n② 각기관의장이일단허가한휴가는어떤경우에도\n허가를취소할수없다.\n\n③ 집무불능에의한병가일수가30일이상계속되는\n경우, 병가기간중의공휴일은휴가일수에산입한다.\n\n④ 2026년5월22일혼인신고를한직원이5월24일\n결혼식을한경우, 6월22일부터6월26일까지\n신혼여행을위해5일간경조휴가를신청한다면\n이를허가할수있다.", "a": "③", "ex": ""}, {"id": "2026-12", "grp": "2026", "no": 12, "kind": "mc", "area": "", "q": "인사관리시행규칙에관한사항이다. 직원의평정\n및승진에대한설명으로가장적절한것은?\n\n① 기술직원의근무성적을평정하는경우평정자는\n35점을최고점으로평정한다.\n\n② 4급승진전형고시의서류전형배점은총250점이며,\n면접시험배점은50점으로총점은300점이다.\n\n③ 다면평가는4급이상의일반직원및전문직원만을\n대상으로실시한다.\n\n④ 육아휴직으로근무성적평정대상기간중실제근무\n기간이2개월미만인직원의경우에는근무성적\n평정을실시하지않는다.", "a": "④", "ex": ""}, {"id": "2026-13", "grp": "2026", "no": 13, "kind": "mc", "area": "", "q": "인사관리시행규칙에관한사항이다. 다음【보기】의\n직원중승진평점가·감점요소의합이높은순서\n대로나열한것은? (단, 가·감점요소는현재모두\n유효한사항이며다른조건은고려하지않음)\n【보기】\n· 직원A : 기초단체장표창, 주의1회, 청렴마일리지\n우수평가최대가점해당자\n· 직원B : 회장표창, 경고1회\n· 직원C : 장관표창, 주의2회\n· 직원D : 사무총장표창, 경고1회, 시말서1회,\n광역권간전보최대가점해당자\n\n① 직원A-직원B-직원D-직원C\n\n② 직원A-직원D-직원B-직원C\n\n③ 직원D-직원A-직원B-직원C\n\n④ 직원D-직원A-직원C-직원B", "a": "③", "ex": ""}, {"id": "2026-14", "grp": "2026", "no": 14, "kind": "mc", "area": "", "q": "직원보수운영규정에관한사항이다. 다음중2026년\n5월분봉급전액을지급받을수있는경우로가장\n적절하지않은것은?\n\n① 10년간근속한김인도직원이2026년5월22일까지\n근무한후금고형을받아면직되는경우\n\n② 5년간근무한이공평직원이병역법에의한의무\n수행을위해2026년5월15일자로휴직한경우\n\n③ 2022년1월1일자로입사한박중립직원이업무로\n사망하여2026년5월14일자로면직된경우\n\n④ 9년간근속한최독립직원이2026년5월1일자로\n인력종합수급과(인력풀과)로배치된경우", "a": "①", "ex": ""}, {"id": "2026-15", "grp": "2026", "no": 15, "kind": "mc", "area": "", "q": "직원운영규정, 직원보수운영규정및인사관리시행\n규칙에관한사항이다. 다음【보기】를읽고, 가장\n적절하지않은것을고르시오.\n【보기】\n· 직원인사기본사항\n성\n명\n김인도\n직\n위\n제조관리부장\n직\n종\n의무직\n생년월일\n1966.12.31.\n직\n급\n의\n사\n입사일자\n2007. 4. 1.\n···\n···\n···\n···\n※상기명시된내용외고려하지않음\n\n① 김인도직원은2026년6월1일부터공로연수를\n할수있다.\n\n② 김인도직원은2026년3월1일부터임금피크제\n단축근로시간을사용할수있다.\n\n③ 직제가폐직되어김인도직원이2026년12월31일\n전에자진하여퇴직한경우에는예산의범위안에서\n수당을지급받을수있다.\n\n④ 김인도직원이2026년12월31일전에자진하여\n퇴직하는경우, 2025년도의근무로인하여발생한\n휴가일수\n중\n2026년도에\n미사용한\n휴가일수에\n대하여퇴직일로부터14일이내에연가보상비를\n지급한다.", "a": "②", "ex": ""}, {"id": "2026-16", "grp": "2026", "no": 16, "kind": "mc", "area": "", "q": "직원보수운영규정에관한사항이다. 다음【보기】\n중통상임금에해당하는것은모두몇개인가?\n【보기】\n가. 직무상위험을고려하여지급하는수당\n나. 기술직, 기능직및고용원으로15년이상근속한\n직원에게지급하는수당\n다. 관리직직원에대하여계급, 직무의곤란성과\n책임의정도에따라지급하는수당\n라. 직원및고용원으로서부양가족이있는자에\n대하여지급하는수당\n마. 보건기관의원활한인력수급을위하여의사및\n약사와혈장분획센터의품질․제조부서책임자\n및병원의간호사(7급)에게지급하는수당\n바. 정기·하계·명절상여의연간지급액을합산하여\n12개월로나눈금액\n사. 실적평가급최소지급률지급분\n\n① 4개\n\n② 5개\n\n③ 6개\n\n④ 7개", "a": "②", "ex": ""}, {"id": "2026-17", "grp": "2026", "no": 17, "kind": "mc", "area": "", "q": "직원보수운영규정에관한사항이다.【보기】를읽고,\n다음중옳고그름의표시(O, X)가맞게나열된것을\n고르시오.\n【보기】\n2026년\n1월\n1일자로\n혈장분획센터(충북\n음성군\n소재)에신규임용된정규직신입직원A의직원\n인사기록및2026년4월급여지급명세서는다음과\n같다.\n· 혈장분획센터직원A 직원인사기록\n· 직종(직급·계급) : 사무직(간사7급)\n· 부서·담당업무: 총무팀인사담당\n· 학력정보: 대학원(석사) 2026년2월25일졸업\n· 군경력: 해당사항없음\n· 입사전경력: 해당사항없음\n· 가족사항: 해당없음\n· 원생활근거지(연고지) : 제주서귀포시안덕면\n※상기명시된내용외고려하지않음\n· 2026년4월급여지급명세서\n지급내역\n금\n액\n봉급\n㉠\n업무수당\n㉡\n직급보조비\n㉢\n위험수당\n0원\n정기상여금\n㉣\n※일반직원및전문직원봉급표(일부발췌)\n(2026. 4. 1.기준, 단위:원)\n호봉\n계급\n1\n2\n3\n4\n7급\n1,683,000\n1,707,000\n1,733,000\n1,759,000\n가. ㉠에들어갈봉급은1,707,000원이다.\n나. ㉡에들어갈업무수당은80,000원이다.\n다. ㉢에들어갈직급보조비는85,000원이다.\n라. ㉣에들어갈정기상여금은936,000원이다.\n\n① 가(X) 나(X) 다(O) 라(X)\n\n② 가(X) 나(O) 다(X) 라(X)\n\n③ 가(O) 나(X) 다(X) 라(O)\n\n④ 가(O) 나(O) 다(O) 라(O)", "a": "①", "ex": ""}, {"id": "2026-18", "grp": "2026", "no": 18, "kind": "mc", "area": "", "q": "재무운영규정에관한사항이다. 다음【보기】를읽고,\n세입과세출의회계연도소속구분에관한가∼마의\n설명중옳은것을모두고른것은?\n【보기】\n가. 회비수입의제비용은그사업이속하는연도\n또는전년도\n나. 보수, 여비, 수수료등은그지급을하여야할\n사실이발생한날이속하는연도\n다. 부동산\n및\n동산의\n매각대금, 임대료\n등은\n그것을수입하기로된일자가속하는연도\n라. 공사제조비, 물건구입대가, 운임, 보조비등으\n로서상대방의행위가완료된후지급하는것은\n그지급이확정된일자가속하는연도\n마. 예금및유가증권의이자는그이자를수입\n하기로약정된일자가속하는연도\n\n① 가, 다, 라\n\n② 가, 나, 라, 마\n\n③ 나, 다, 라, 마\n\n④ 가, 나, 다, 라, 마", "a": "④", "ex": ""}, {"id": "2026-19", "grp": "2026", "no": 19, "kind": "mc", "area": "", "q": "재무운영규정에\n관한\n사항이다.\n다음【보기】의\n설명중옳은것은모두몇개인가?\n【보기】\n가. 각기관의장은예산이정한각정책사업의\n금액을본사의승인없이전용할수있다.\n나. 소속기관장은전용한금액을집행후그사유와\n실정을명시하여해당기관장에게보고함으로써\n각항의금액을전용할수있다.\n다. 예산성립후에생긴사유로예산에변경을가할\n필요가\n있을\n때는추가경정예산을\n편성해야\n하며전용과는달리심의·의결·승인절차가요구\n된다.\n라. 예산집행상필요에의하여중앙위원회의의결을\n얻었을때에는예산이정한각장은상호이용\n할수있다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개", "a": "②", "ex": ""}, {"id": "2026-20", "grp": "2026", "no": 20, "kind": "mc", "area": "", "q": "재무운영규정에관한사항이다. 다음【보기】에관한\n설명으로가장적절하지않은것은?\n【보기】\n재난구호,\n평시구호,\n특수구호,\n국제구호\n또는\n구호장비등의구호사업개량을목적으로적립\n하는금액\n\n① 위적립금을사용하고자할때에는본사운영\n위원회의사전승인을받아야한다.\n\n② 지사에서사업비가총3억원인구호사업을위해\n사용할경우본사의승인을받아우선사용하고\n매년도결산시운영위원회에보고하여야한다.\n\n③ 구호사업을위한사업비등에충당하기위하여\n세출예산에계상할수있다.\n\n④ 위적립금이용에있어회장은기관의재정상태를\n평가하여기관상호간에일정기간자금을이용할\n수있다.", "a": "①", "ex": ""}, {"id": "2026-21", "grp": "2026", "no": 21, "kind": "mc", "area": "", "q": "여비운영규정에관한사항이다. 여비계산및지급\n원칙에관한다음의설명중가장적절한것은?\n\n① 근무지가대전광역시에소재하고거주지가부산\n광역시인직원이거주지로부터서울병원으로고속\n철도를이용하여출장을가는경우, 부산광역시에서\n서울특별시까지의여비를지급한다.\n\n② 여행일수가7일이내인출장중인직원이이동\n중에신분변동이발생하면사유발생후최초\n목적지에도달한날이후에는변동된신분을기\n준으로구분하여계산한다.\n\n③ 국내여비의결제는기관법인카드를사용하는것을\n원칙으로하며, 운임과숙박비는출장지의구분없이\n항상실제법인카드로사용한실비전액을지급\n한다.\n\n④ 여비는통상의경로와방법에의하여계산하며,\n사무형편상부득이한경우조정하여지급할수\n있다.", "a": "④", "ex": ""}, {"id": "2026-22", "grp": "2026", "no": 22, "kind": "mc", "area": "", "q": "감사운영규정에관한사항이다. 다음밑줄친㉮∼㉳\n중옳지않은것은몇개인가?\n감사부서의장인박중립감사실장은㉮2026년1월5일\n2026년도연간감사계획을수립하였다. 박중립실장은\n연간감사계획에따라2026년2월9일부터2월13일까지\nA지사종합감사를시작으로2026년도의감사활동을\n개시하도록계획하고, ㉯1월19일A지사에감사대상과\n감사범위, 감사반편성등의사항을구두로통보하\n였다.\n2024년종합감사결과우수기관으로선정된A지사의\n종합감사는2년만에실시하는것으로, A지사의조직,\n인사, 예산등업무전반의타당성등을점검하는\n동시에, ㉰A지사회계관계직원김인도과장의비위\n행위에\n대한\n제보내용의\n사실관계를\n확인하고자\n종합감사주기가도래하기전에특별히감사를실시\n할필요가있었다.\n㉱박중립실장은A지사의종합감사를위한감사반\n편성시, 감사실직원4명과본사총무팀직원1명을\n임의로편성하였으며, 감사실이공평팀장을감사\n반장으로지정하였다. 박중립실장이A지사에감사\n실시를구두로통보하였기에, ㉲이공평팀장은감사\n실시당일감사명령서를A지사회장에게제시하지\n않았다.\nA지사\n종합감사결과김인도과장의비위행위는\n사실로확인되었다. 이에㉳박중립실장은A지사\n회장에게김인도과장의징계및변상조치를요구하\n였다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개", "a": "②", "ex": ""}, {"id": "2026-23", "grp": "2026", "no": 23, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 국가가 인도주의적 근거로 충돌 당사자에 무력 개입할 권리를 인정한다.\n\n② 국제적 또는 비국제적 성격에 상관없이 특별히 무력충돌 상황에서 적용되며, ‘전쟁법’ 및 ‘무력충돌법’과 동의어로 사용될 수 있다.\n\n③ 무력충돌 희생자를 보호하고 지원하며, 전쟁의 수단과 방법을 제한하는데 목적이 있다.\n\n④ 마르텐스 조항은 일반적으로 국제인도법에서 명시적으로 금지하지 않았다고 해서 자동적으로 허용되는 것은 아니라고 해석된다.", "a": "①", "ex": "<b>해설<\/b>:<br>• <b>① (적절하지 않음)<\/b>: 국가가 무력을 행사할 수 있는 조건과 권리를 규율하는 것은 개전법(Jus ad Bellum, 유엔 헌장 제2조 4항·제51조)이고, 국제인도법은 교전법(Jus in Bello)으로서 개전법과 완전히 독립적으로 작동한다. (근거: IHL Q&amp;A Q02, 원문 p.8~p.10)<br>• ②: 국제인도법은 무력충돌의 국제적·비국제적 성격에 상관없이 적용되며, 실무상 ‘전쟁법(Law of War)’ 또는 ‘무력충돌법(LOAC)’으로도 불린다. (근거: IHL Q&amp;A Q01, 원문 p.4~p.7)<br>• ③: 국제인도법의 핵심 목적은 무력충돌 희생자의 보호·지원과 전쟁의 수단·방법 제한이다. (근거: IHL Q&amp;A Q01, 원문 p.4~p.7)<br>• ④: 마르텐스 조항의 해석 — <b>근거 미확인<\/b> (시험 범위 자료에 해당 문장이 없음)."}, {"id": "2026-24", "grp": "2026", "no": 24, "kind": "mc", "area": "", "q": "국제인도법에 따른 국제적 무력충돌과 비국제적 무력충돌에 관한 사항이다. 다음 중 가장 적절한 것은?\n\n① 국제적 무력충돌에는 1949년 4개 제네바협약과 1977년 제1추가의정서만 적용된다.\n\n② 1977년 제2추가의정서는 비국가 무장단체 간의 무력 충돌에는 적용되지 않는다.\n\n③ 비국제적 무력충돌 시 충돌당사국은 비국가 무장단체 구성원의 행위에 대하여 국내법에 따라 기소할 수 없다.\n\n④ 비국제적 무력충돌에 관한 정의는 1977년 제2추가의정서가 1949년 4개 제네바협약 공통 제3조보다 넓은 의미를 가진다.", "a": "②", "ex": "<b>해설<\/b>:<br>• <b>② (적절)<\/b>: 1977년 제2추가의정서는 체약국 영토 내에서 정부군과 영토 통제력을 가진 반군 간의 충돌에만 적용되고, 무장단체 상호 간의 충돌에는 적용되지 않는다(이 경우 공통 제3조가 적용된다). (근거: IHL Q&amp;A Q05, 원문 p.18~p.21)<br>• ①: 국제적 무력충돌에는 제네바 4개 협약과 제1추가의정서 외에 관습국제인도법도 적용되므로 ‘~만 적용된다’는 틀렸다. (근거: IHL Q&amp;A Q04·Q05, 원문 p.14~p.21)<br>• ③: 비국제적 무력충돌에서 체포된 반군 구성원에게는 조약상 전쟁포로 지위가 자동 부여되지 않으므로 국내법상 반란죄 등으로 처벌·기소할 수 있다. (근거: IHL Q&amp;A Q10, 원문 p.42~p.45)<br>• ④: 제2추가의정서는 공통 제3조보다 적용 문턱(Threshold)이 높아 적용 범위가 더 좁다. (근거: IHL Q&amp;A Q05, 원문 p.18~p.21)"}, {"id": "2026-25", "grp": "2026", "no": 25, "kind": "mc", "area": "", "q": "국제인도법 조약에 관한 사항이다. 다음【보기】중 채택 연도가 오래된 순서대로 나열한 것은?\n\n【보기】  \n가. 아동권리협약  \n나. 집속탄 금지 협약  \n다. 국제형사재판소에 관한 로마규정  \n라. 대인지뢰 사용, 비축, 생산, 이전 금지 및 폐기에 대한 협약  \n마. 무력충돌 시 문화재 보호에 관한 1954년 헤이그협약에 대한 제2의정서\n\n① 가 - 마 - 나 - 다 - 라\n\n② 라 - 다 - 마 - 가 - 나\n\n③ 가 - 라 - 다 - 마 - 나\n\n④ 라 - 다 - 가 - 나 - 마", "a": "③", "ex": "<b>해설 조약 채택 연도<\/b>:<br>• 가. 아동권리협약: <b>1989년<\/b><br>• 라. 대인지뢰 금지 협약(오타와 협약): <b>1997년<\/b><br>• 다. 국제형사재판소 로마규정: <b>1998년<\/b><br>• 마. 1954 헤이그협약 제2의정서: <b>1999년<\/b><br>• 나. 집속탄 금지 협약: <b>2008년<\/b><br>→ 오래된 순서는 가 - 라 - 다 - 마 - 나 이므로 정답은 ③.<br>(근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` 조약 채택 연도표 / IHL Q&amp;A Q12, 원문 p.50~p.54)"}, {"id": "2026-26", "grp": "2026", "no": 26, "kind": "mc", "area": "", "q": "국제인도법에 관한 사항이다. 다음【보기】중 적대행위를 규정한 규칙에 관한 내용으로 옳지 않은 것은 몇 개인가?\n\n【보기】  \n가. 1977년 제1추가의정서에 명시적 근거가 있으며, 국제적 및 비국제적 무력 충돌에 대한 관습국제법에도 존재한다.  \n나. 특정재래식무기 협약 제4의정서는 영구적 실명을 유발하기 위해 특별히 고안된 레이저 무기의 사용 및 이전을 금지한다.  \n다. 무차별 공격의 금지는 구별의 원칙에서 파생되었다.  \n라. 군사 목표물은 가능한 한 민간인 대중 및 민간 물자 주변에 위치해서는 안되며, 군사 작전 수행 시 기타 필요한 모든 사전 경고 조치가 취해져야 한다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개", "a": "①", "ex": "<b>해설<\/b>: 가~라 4개 보기가 모두 옳으므로 옳지 않은 것은 <b>0개<\/b>(정답 ①).<br>• 가 (옳음): 적대행위 규율 규칙은 제1추가의정서(제48·51·57조)에 명시적 근거가 있고, 관습국제인도법은 국제적·비국제적 무력충돌 모두에 대해 구별·비례성 등 대다수 규칙이 동일하게 적용된다고 본다. (근거: IHL Q&amp;A Q04, 원문 p.14~p.17 / Q11, 원문 p.46~p.49)<br>• 나 (옳음): CCW 제4의정서(1995년 채택)는 영구 실명 레이저 무기의 사용 및 이전을 전면 금지한다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• 다 (옳음): 무차별적 효과를 갖는 공격의 금지는 구별의 원칙에서 파생된다. (근거: IHL Q&amp;A Q11·Q12, 원문 p.46~p.54)<br>• 라 (옳음): 방어 측 예방조치로 민간인·민간 시설을 군사목표물 근처로부터 이동시켜야 하고, 상황이 허용하는 한 민간인 주민에게 유효한 사전 경고를 발령해야 한다. (근거: IHL Q&amp;A Q11, 원문 p.46~p.49)"}, {"id": "2026-27", "grp": "2026", "no": 27, "kind": "mc", "area": "", "q": "국제인도법에서 규제하는 전쟁의 수단과 방법에 관한 사항이다. 다음【보기】의 설명 중 옳지 않은 것은 몇 개인가?\n\n【보기】  \n가. 국제사법재판소는 국가 존립을 위협하는 극단적인 상황에서조차 핵무기 사용이 적법한지 여부에 대해서는 결정을 내리지 못했다.  \n나. 국제사회는 제2차 세계대전 이후 화학무기와 생물학무기의 사용을 금지하기 시작했다.  \n다. 특정재래식무기 협약 제2의정서는 네이팜탄의 사용을 규제한다.  \n라. 특정재래식무기 협약 제1의정서는 엑스레이로 인간의 몸에서 탐지 불가능한 파편으로 상해를 입히는 것을 주요 효과로 하는 모든 무기의 사용을 금지한다.\n\n① 0개\n\n② 1개\n\n③ 2개\n\n④ 3개", "a": "③", "ex": "<b>해설<\/b>: 옳지 않은 설명은 나, 다 <b>2개<\/b>(정답 ③).<br>• 가 (옳음): 국제사법재판소(ICJ)는 1996년 핵무기 사용의 적법성에 관한 권고적 의견에서 국가 존립이 걸린 극단적 자위 상황에 대해서는 결론을 내리지 않았다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• <b>나 (옳지 않음)<\/b>: 화학무기·생물무기의 전시 사용 금지는 제2차 세계대전 <b>이전<\/b>인 1925년 제네바 가스 의정서에서 시작되었다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• <b>다 (옳지 않음)<\/b>: CCW 제2의정서는 지뢰·부비트랩 및 기타 장치의 사용을 제한하며, 네이팜탄 등 소이무기 규제는 제3의정서이다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)<br>• 라 (옳음): CCW 제1의정서는 엑스선으로 탐지되지 않는 파편 무기를 금지한다. (근거: IHL Q&amp;A Q12, 원문 p.50~p.54)"}, {"id": "2026-28", "grp": "2026", "no": 28, "kind": "mc", "area": "", "q": "국제인도법 이행과 관련한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 이익보호국은 적국에서 충돌 당사자와 그 국민의 이익을 보호하기 위해 임명된 중립국이며, 국제기구는 이익보호국을 대신할 수 없다.\n\n② 국가는 평시와 무력충돌 시 모두 국제인도법이 완전히 준수되도록 보장하기 위하여 예방, 감시, 억제 등 법적·실무적 조치를 취할 의무가 있다.\n\n③ 국제인도주의사실조사위원회는 제네바 제협약과 제1추가의정서의 중대한 위반 혐의에 대해 심문할 수 있으며, 공식 권한은 국제적 무력충돌 상황에만 적용된다.\n\n④ 국가는 국제인도법이 준수되도록 보장하기 위한 예방적 조치로 군 내 법률자문관을 임명한다.", "a": "①", "ex": "<b>해설<\/b>:<br>• <b>① (적절하지 않음)<\/b>: 이익보호국은 조약 준수를 감시하기 위해 지정된 중립국이지만, 현실적으로 지정이 어려울 경우 <b>ICRC가 그 역할을 대행(Substitute)<\/b>한다. 따라서 국제기구가 대신할 수 없다는 서술은 틀렸다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87)<br>• ②: 체약국은 공통 제1조의 ‘존중 및 존중 보장의 의무’를 지며, 평시에도 보급·교육 등 이행 의무를 부담한다. (근거: IHL Q&amp;A Q08, 원문 p.31~p.34 / Q19, 원문 p.84~p.87)<br>• ③: 국제인도조사위원회(IHFFC)는 제1추가의정서 제90조에 의해 설립된 상설 공식 사실조사 기구로 중대한 위반 혐의의 사실관계를 조사한다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87) 공식 권한이 국제적 무력충돌에 한정되는지에 관한 서술은 <b>근거 미확인<\/b>이나, 정답표는 본 선지를 적절한 것으로 처리하였다.<br>• ④: 사전 예방 조치로 군 사령관에게 법률고문(법률자문관)을 배치한다. (근거: IHL Q&amp;A Q19, 원문 p.84~p.87)"}, {"id": "2026-29", "grp": "2026", "no": 29, "kind": "mc", "area": "", "q": "국제적십자운동대표자회의에관한사항이다. 다음\n중가장적절하지않은것은?\n\n① 각국적십자사의3분의1, ICRC, IFRC 또는상치\n위원회의요청이있을경우개최된다.\n\n② 가까운장래에승인받을것으로예상되는적십자사를\n옵서버로참가시킬수있다.\n\n③ 출석하여투표하는구성원과반수의찬성을얻어\n앙리뒤낭메달규정을개정할수있다.\n\n④ 각국적십자사, ICRC 및IFRC의대표단으로구성된다.", "a": "③", "ex": "<b>해설<\/b>: 규약 제14조 제4항에 따라 대표자회의에서 앙리뒤낭 메달 규정을 개정하려면 출석하여 투표하는 구성원 <b>3분의 2 이상<\/b>의 찬성을 얻어야 함(과반수 찬성 X)."}, {"id": "2026-30", "grp": "2026", "no": 30, "kind": "mc", "area": "", "q": "국제인도법과 국제인권법에 관한 사항이다. 다음【보기】의 설명 중 옳은 것은 몇 개인가?\n\n【보기】  \n가. 국제적 무력 충돌을 규율하는 국제인도법의 역외 적용은 논란의 대상이 되지 않으나, 무력사용에 관한 인권 규범의 역외 적용에 대한 인권 판례법은 아직 확립되지 않았다.  \n나. 국제인도법은 전투원과 민간인을 구분하는 반면, 국제인권법은 피보호자의 범주를 명시하고 있지 않다.  \n다. 국제인도법은 무력충돌 상황에서만 적용된다. 반면, 국제인권법은 국가의 존립을 위협하는 공적인 위기 상황 시 정부의 특정 의무를 해제시킬 수 있으나, 생명권, 고문의 금지 등 일부 인권 의무는 해제될 수 없다.  \n라. 국제인도법은 무력충돌 당사자인 국가와 비국가 무장단체를 모두 구속하나, 국제인권법은 국가만 구속한다. 다만, 국가처럼 행동할 수 있는 권한이 있는 비국가 무장단체의 경우 인권에 대한 책임이 인정될 수 있다.  \n마. 국제인도법은 적대행위 시 민간인 및 민간 물자에 대한 모든 폭력 행위 및 무차별적인 공격을 금지하나, 국제인권법은 충돌 당사자들 간의 적대행위가 아닌 법집행 시 무력 사용 방식을 규제한다.\n\n① 2개\n\n② 3개\n\n③ 4개\n\n④ 5개", "a": "④", "ex": "<b>해설<\/b>: 【보기】는 가~마 <b>5개<\/b>이고 5개 모두 옳으므로 정답은 ④(5개)이다.<br>• 나 (옳음): 국제인도법은 전투원과 민간인을 엄격히 구별하나, 국제인권법은 피보호자 범주를 별도로 구분하지 않고 모든 인간을 대상으로 한다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 다 (옳음): 국제인도법은 오직 무력충돌 상황에서만 적용되고, 국제인권법은 국가비상사태 시 일부 권리의 유예가 허용되지만 생명권·고문 금지 등 비이탈 권리는 해제될 수 없다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 라 (옳음): 국제인도법은 국가·비국가 무장단체·개인을 모두 구속하고, 국제인권법은 원칙적으로 국가가 부담하되 예외적으로 비국가 무장단체의 인권 책임이 인정될 수 있다. (근거: IHL Q&amp;A Q08, 원문 p.31~p.34 / Q09, 원문 p.35~p.41)<br>• 마 (옳음): 국제인도법은 적대행위를 규제하고, 국제인권법은 법집행(치안유지) 차원의 무력 사용 방식을 규제한다. (근거: IHL Q&amp;A Q09, 원문 p.35~p.41)<br>• 가: 역외 적용에 관한 인권 판례법의 확립 여부는 <b>근거 미확인<\/b>이나, 정답표는 본 보기를 옳은 설명으로 처리하였다."}, {"id": "2026-31", "grp": "2026", "no": 31, "kind": "mc", "area": "", "q": "국제인도법의 포로의 대우에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 1949년 제네바 제3협약에 근거해 보호되어야 하며, 포로의 억류는 처벌이 아니라 이들이 앞으로 충돌에 가담하는 것을 막기 위한 수단이다.\n\n② 교전 당사국은 권한 내의 모든 포로에 대하여 중앙심인국에 통보하고 이들의 신원과 관련된 수집 가능한 모든 정보를 제공해야 한다.\n\n③ 구금 당국은 전쟁범죄를 범한 포로를 기소할 수 있다.\n\n④ 적극적인 적대행위가 종료된 후 포로는 지체 없이 석방되어 본국으로 송환되어야 한다.", "a": "②", "ex": "<b>해설<\/b>:<br>• <b>② (적절하지 않음)<\/b>: 교전 당사국이 직접 통보하는 상대는 중앙심인국(중앙추적국, CTA)이 아니다. 체약국은 제네바 제3협약 제122조에 따라 자국 내에 <b>국내정보국(NIB)<\/b>을 의무적으로 설치하고, 국내정보국이 포로의 명부와 정보를 수집하여 전달한다. <b>중앙추적국(중앙심인국, CTA)<\/b>은 ICRC가 관장하며 중립국에 설치된다. (근거: IHL Q&amp;A Q14, 원문 p.59~p.63)<br>• ①: 포로의 억류는 처벌이 아니라 적대행위 재가담을 방지하기 위한 예방적·행정적 격리 조치이다. (근거: IHL Q&amp;A Q07, 원문 p.26~p.30 / Q10, 원문 p.42~p.45)<br>• ③: 체약국은 중대한 위반을 저지른 혐의자를 자국 법원에서 기소하거나 관련국으로 인도해야 할 의무를 부담한다(인도 또는 기소). (근거: IHL Q&amp;A Q21, 원문 p.93~p.96)<br>• ④: 유효한 적대행위가 종료되면 포로는 지체 없이 석방·본국 송환되어야 한다. (근거: IHL Q&amp;A Q10, 원문 p.42~p.45)"}, {"id": "2026-32", "grp": "2026", "no": 32, "kind": "mc", "area": "", "q": "국제인도법의 문화재 보호에 관한 사항이다. 다음 중 가장 적절하지 않은 것은?\n\n① 1954년 문화재보호에 대한 헤이그협약은 청색과 흰색의 방패로 재산을 표시할 것을 장려하였다.\n\n② 1907년 헤이그협약과 1977년 제1추가의정서 및 제2추가의정서에 법적 근거가 있다.\n\n③ 1954년 헤이그협약에 대한 제2의정서는 긴급한 군사적 필요가 있더라도 인류의 문화적 또는 정신적 유산의 일부를 구성하는 문화재에 대한 공격을 금지한다.\n\n④ 점령국은 피점령지로부터의 문화재 불법 유출을 방지하고 불법 유출된 문화재를 피점령지의 권한 있는 기관에 반환해야 한다.", "a": "③", "ex": "<b>해설<\/b>:<br>• <b>③ (적절하지 않음)<\/b>: 1999년 채택된 1954 헤이그협약 제2의정서는 문화재 보호를 강화하면서 <b>군사적 필요 예외를 엄격화<\/b>한 것이지 예외를 완전히 배제한 것이 아니다. 따라서 긴급한 군사적 필요가 있는 경우에도 언제나 공격이 금지된다는 서술은 틀렸다. (근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` — ‘1999년 1954 헤이그협약 제2의정서: 문화재 보호 강화, 군사적 필요 예외 엄격화’)<br>• ①: 1954년 헤이그 문화재보호협약은 청색과 흰색의 방패(푸른 방패, Blue Shield) 표장을 사용한다. (근거: IHL Q&amp;A Q17, 원문 p.72~p.79)<br>• ②: 1907년 헤이그협약 및 1977년 제1·제2추가의정서상의 문화재 보호 근거 조문은 <b>근거 미확인<\/b> (시험 범위 자료에 조문 명시가 없음).<br>• ④: 점령지 문화재의 불법 유출 방지 및 반환 의무는 <b>근거 미확인<\/b> (시험 범위 자료에 해당 문장이 없음)."}, {"id": "2026-34", "grp": "2026", "no": 34, "kind": "sa", "area": "감사운영규정 (감사인력의 지원)", "q": "감사운영규정에관한사항이다. □에들어갈단어를\n순서대로쓰시오.\n제10조(감사인력의\n지원)\n감사인력이\n부족하거나\n감사내용이고도의전문지식\n또는실무경험이\n필요하다고\n인정되는\n경우에는\n㉮(□□□),\n㉯(□□)\n및\n㉰(□□)\n기타\n사항을\n참작하여\n해당감사사항에대한감사를효율적으로수행\n할수있는직원및외부전문가를활용할수\n있다.\n제11조(중앙위원회) ①(생략)\n②중앙위원회는회장을포함한28명의위원으로\n구성하며, 위원은다음각호의사람이된다.\n1. 전국대의원총회에서선출하는사람19명\n2.\n㉮(□□□□□)장관,\n교육부장관,\n외교부장관,\n통일부장관,\n㉯(□□□)장관,\n국방부장관,\n행정\n안전부장관, 보건복지부장관\n③∼④(생략)", "a": "㉮ 전문성, ㉯ 경력, ㉰ 자질", "ex": ""}, {"id": "2026-35", "grp": "2026", "no": 35, "kind": "sa", "area": "직원운영규정 (제척 및 기피)", "q": "직원운영규정에관한사항이다. □에들어갈단어를\n순서대로쓰시오.\n제61조의2(제척및기피) ①징계위원회의위원이\n다음각호의어느하나에해당하는경우에는\n해당징계등사건의심의‧의결에서제척되어야\n한다.\n1. 징계등혐의자와㉮(□□□□)에있거나있었던\n경우\n2. 징계등혐의자의직근상급자이거나징계사유가\n㉯(□□)한기간동안직근상급자였던경우\n3. 해당징계등사건의사유와㉰(□□)(이)가있는\n경우\n②～⑤(생략)", "a": "㉮ 친족 관계, ㉯ 발생, ㉰ 관계", "ex": ""}, {"id": "2026-36", "grp": "2026", "no": 36, "kind": "sa", "area": "직원보수운영규정 (보수 계산 및 감액)", "q": "직원보수운영규정에관한사항이다. □에들어갈\n단어를순서대로쓰시오.\n제41조(규정개정시보수의계산)「직원보수운영\n규정」개정으로인하여새로이지급할보수는\n개정운영규정의㉮(□□□)부터이를계산한다.\n제43조(보수등의감액지급) ①직원의㉯(□□)에\n있어1회㉰(□□)(은)는일평균임금의2분의1,\n총액이월평균임금의10분의1을초과하지\n못한다.\n②～⑤(생략)", "a": "㉮ 시행일, ㉯ 감급, ㉰ 감액", "ex": ""}, {"id": "2026-37", "grp": "2026", "no": 37, "kind": "sa", "area": "조직법 및 재무운영규정 (예산 및 결산 기한)", "q": "다음은적십자사의사업계획, 예산및결산절차에\n관한설명이다. 조직법및재무운영규정의관련\n규정에부합하도록□에알맞은숫자를순서대로\n쓰시오. (단, 정부의회계연도는1월1일부터12월\n31일까지로한다.)\n· 적십자사가작성한2027년도사업계획및예산\n안의보건복지부장관제출기한은㉮(□□□□)년\n◍◍월◍◍일이다.\n· 2026년도세입세출결산의운영위원회의심의와\n중앙위원회의의결기한은◍◍◍◍년㉯(□□)월\n◍◍일이다.\n· 각기관의장이작성한2026년도세입세출의결산\n보고안,\n계속비결산보고서의본사제출기한은\n◍◍◍◍년◍◍월㉰(□□)일이다.", "a": "㉮ 2026, ㉯ 03, ㉰ 10", "ex": ""}, {"id": "2026-38", "grp": "2026", "no": 38, "kind": "sa", "area": "인사관리시행규칙 (징계 감경 불가 사유)", "q": "인사관리시행규칙에관한사항이다. □에들어갈\n단어를순서대로쓰시오.\n제24조의4(징계양정의기준) ①∼②(생략)\n③제2항에도불구하고징계사유가다음각호의\n어느하나에해당하는경우에는해당징계를감경\n할수없다.\n1. ｢직원운영규정｣제57조의2제1항어느하나에\n해당하는비위\n1의2. ｢직원운영규정｣제57조의2제1항의어느하나에\n해당하는비위를신고하지않거나고발하지\n않은행위\n2. ｢성폭력범죄의처벌등에관한특례법｣에따른\n성폭력범죄\n3. ｢성매매알선등행위의처벌에관한법률｣에\n따른성매매\n4. ｢㉮(□□□□□□□)｣에따른성희롱\n5.∼10. (생략)\n11. 직무상비밀또는㉯(□□□□□)(을)를이용한\n부당행위\n12. 우월적지위등을이용하여다른직원등에게\n신체적․정신적고통을주는등의부당행위", "a": "㉮ 양성평등기본법, ㉯ 미공개정보", "ex": ""}, {"id": "2026-39", "grp": "2026", "no": 39, "kind": "sa", "area": "국제인도법 (보편적 관할권, ICTY, ICTR)", "q": "국제인도법에 관한 사항이다. □에 들어갈 단어를 순서대로 쓰시오.\n\n· ㉮(□□□ □□□)은(는) 다른 국가에서 국제 범죄를 저지른 사람을 한 국가의 법원에서 기소할 수 있도록 하는 국내법에 대한 국제법적 기반이 된다.  \n· 국제형사재판소 이전에 ㉯(□□□) 국제형사재판소(ICTY)와 ㉰(□□□) 국제형사재판소(ICTR)는 1993년과 1994년 이들 국가의 내전 시 전쟁범죄를 범했다는 혐의를 받는 사람들을 재판하기 위해 유엔안보리가 설치하였다.", "a": "㉮ 보편적 관할권, ㉯ 구유고, ㉰ 르완다", "ex": "<b>해설<\/b>:<br>• ㉮ <b>보편적 관할권<\/b> `(□□□ □□□)`: 범죄 발생지나 피의자·피해자의 국적과 무관하게 모든 국가가 전쟁범죄자를 처벌할 수 있는 사법 관할권. (근거: IHL Q&amp;A Q21, 원문 p.93~p.96)<br>• ㉯ <b>구유고<\/b> `(□□□)`: 1993년 유엔 안보리가 설치한 구유고 국제형사재판소(ICTY).<br>• ㉰ <b>르완다<\/b> `(□□□)`: 1994년 유엔 안보리가 설치한 르완다 국제형사재판소(ICTR).<br>(근거: `docs/02_인도법_마스터/05_IHL_조약연도_및_이론마스터.md` 조약 채택 연도표)"}, {"id": "2026-40", "grp": "2026", "no": 40, "kind": "sa", "area": "국제적십자운동 규약 (전문 평화 선언)", "q": "국제적십자운동\n규약에\n관한\n사항이다.\n□에\n들어갈단어를순서대로쓰시오.\n· 국제적십자운동은국제적십자운동의인도주의\n활동과적십자이념보급을통해단순히전쟁이\n없는상태가아닌모든나라와사람들간의\n역동적인협력, 사람들의욕구에부응하기위한\n자유와㉮(□□), ㉯(□□□), 평등, ㉰(□□),\n그리고공평하고평등한자원의분배에기초한\n협력인항구적평화를증진시킨다는것을선언\n한다.\n※ 그동안수고많으셨습니다.", "a": "㉮ 독립, ㉯ 자주권, ㉰ 인권", "ex": ""}, {"id": "st1-김배성-1", "grp": "st1", "no": 1, "kind": "ox", "area": "김배성", "q": "(OX) 적십자사의 사업계획 및 예산은 운영위원회 심의, 중앙위원회 의결, 전국대의원총회 승인을 거쳐 회계연도 시작 1개월 전까지 보건복지부장관에게 제출하면 된다.", "a": "O", "ex": "조직법 제21조①"}, {"id": "st1-김배성-2", "grp": "st1", "no": 2, "kind": "ox", "area": "김배성", "q": "(OX) 천재지변이나 그 밖의 돌발적인 사태로 중앙위원회 위원을 선출하지 못한 경우에는 전임 중앙위원의 임기가 차기 중앙위원회가 구성될 때까지 연장된다.", "a": "X", "ex": "정관 제7조③ — 중앙위원회가 아니라 <b>다음 전국대의원총회 때까지<\/b> 연장."}, {"id": "st1-김배성-3", "grp": "st1", "no": 3, "kind": "ox", "area": "김배성", "q": "(OX) 특수업무를 담당하게 하기 위하여 회장은 임원 중에서 중앙위원회의 승인을 얻어 상근하게 할 수 있다.", "a": "X", "ex": "정관 제17조④ — 중앙위원회가 아니라 <b>운영위원회<\/b>의 승인."}, {"id": "st1-김배성-4", "grp": "st1", "no": 4, "kind": "ox", "area": "김배성", "q": "(OX) 지사 상임위원회는 지사회장과 18명의 위원으로 구성되며, 상임위원의 임기는 3년이고 한 차례 중임할 수 있으므로 최대 가능한 재임기간은 6년이다.", "a": "X", "ex": "정관 제28조② — 3년 + 중임 3년 + 지사대의원총회 의결에 따른 연장 3년 = <b>최대 9년<\/b>."}, {"id": "st1-김배성-5", "grp": "st1", "no": 5, "kind": "ox", "area": "김배성", "q": "(OX) 적십자사를 해산하는 경우 채무를 변제하고도 잔여재산이 있을 때에 그 재산은 중앙위원회 의결을 거쳐 전국대의원총회 승인 이후 보건복지부장관의 인가를 받는다.", "a": "X", "ex": "정관 제50조③ — 잔여재산 처분에는 <b>전국대의원총회 승인이 필요 없음<\/b>(중앙위 의결 + 복지부장관 인가). 총회 승인은 해산 자체(제50조②)에 필요."}, {"id": "st1-김배성-6", "grp": "st1", "no": 6, "kind": "mc", "area": "김배성", "q": "다음 중 정관상 지사 관련 설명으로 가장 옳은 것은?\n① 지사대의원총회는 지사 상임위원회에서 선출한 사람 10명과 명예지사회장·지사회장이 협의하여 선출한 사람 10명으로 구성한다.\n② 지사대의원총회는 지사상임위원회의 위원을 선출 또는 보선하고, 지사 사업에 대한 보고를 받는다.\n③ 지사운영위원회는 지사회장을 포함하여 7명으로 구성하되, 위원 6명은 지사 대의원총회가 그 대의원 중에서 선출한다.\n④ 지사 임원은 지사회장 1명, 지사부회장 4명 이내, 재정감독 1명 및 법률고문 1명으로 구성된다.", "a": "②", "ex": "정관 제27조②. ① 시·군·구의 장이 선출한 1명(6개 지역 이하면 2명)도 포함 / ③ 상임위원회가 호선하는 6명(제29조②) / ④ 법률고문은 임원이 아님(제30조①)."}, {"id": "st1-김배성-7", "grp": "st1", "no": 7, "kind": "mc", "area": "김배성", "q": "다음 중 조직법 및 정관의 내용 중 옳은 것의 개수는?\nㄱ. 국가나 지방자치단체는 적십자사의 사업 목적을 달성하기 위하여 필요할 때에는 「국유재산법」 및 「공유재산 및 물품관리법」의 규정에도 불구하고 국유·공유 재산을 적십자사에 무상으로 대부해야 한다.\nㄴ. 적십자사는 매 회계연도 경과 후 3개월 이내에 세입·세출결산서에 공인회계사 또는 회계법인 회계감사 보고서를 첨부하여 운영위원회의 심의와 중앙위원회의 의결을 거친 후 국회 및 보건복지부장관에게 제출하여야 한다.\nㄷ. 해산 및 잔여재산의 처분에 관한 의결 또는 승인은 재적위원 또는 재적대의원 3분의 1이상의 출석으로 개의하고, 출석위원 또는 출석대의원 4분의 3이상의 찬성으로 의결 또는 인가한다.\nㄹ. 사무처에 사무총장 1명을 두며, 사무총장은 회장의 명을 받아 적십자사의 사업을 총괄하고 소속 직원들을 지휘·감독한다.\nㅁ. 부회장은 회장을 보좌하며, 회장이 부득이한 사유로 직무를 수행할 수 없을때에는 차기 운영위원회에 소집된 임원 순서에 따라 그 직무를 대행한다.\n① 1개  ② 2개  ③ 3개  ④ 4개  ⑤ 5개", "a": "①", "ex": "옳은 것은 ㄴ뿐(조직법 제21조③). ㄱ 무상으로 <b>대부할 수 있다<\/b>(제23조) / ㄷ <b>3분의 2<\/b> 이상 출석(정관 제50조④) / ㄹ 사무를 <b>관장<\/b>(제19조②) / ㅁ <b>회장이 미리 지명한 순위<\/b>(제17조②)."}, {"id": "st1-신희훈-1", "grp": "st1", "no": 1, "kind": "ox", "area": "신희훈", "q": "(OX) 회장이 부득이한 사유로 직무를 수행할 수 없을 때에는 부회장 중 연장자의 순으로 회장의 직무를 대행한다.", "a": "X", "ex": "조직법 제17조②, 정관 제21조 — <b>회장이 미리 지명한 순위<\/b>에 따라 대행."}, {"id": "st1-신희훈-2", "grp": "st1", "no": 2, "kind": "ox", "area": "신희훈", "q": "(OX) 법령과 정관 및 중앙위원회 의결에 따른 적십자사의 공고는 회장이 필요하다고 인정하는 경우에 전국을 대상으로 발간되는 일간신문에 게재할 수 있다.", "a": "O", "ex": "정관 제47조① (원칙: 인터넷 홈페이지 14일 이상 게시)"}, {"id": "st1-신희훈-3", "grp": "st1", "no": 3, "kind": "ox", "area": "신희훈", "q": "(OX) 적십자사의 등기에 관하여는 「민법」 중 사단법인의 등기에 관한 규정을 준용한다.", "a": "O", "ex": "조직법 제3조"}, {"id": "st1-신희훈-4", "grp": "st1", "no": 4, "kind": "ox", "area": "신희훈", "q": "(OX) 적십자사 해산에 관한 의결 또는 승인은 출석위원 또는 출석대의원 3분의 2 이상의 찬성으로 의결 또는 승인하여야 한다.", "a": "X", "ex": "정관 제50조④ — <b>재적 3분의 2 이상 출석 + 출석 4분의 3 이상 찬성<\/b>."}, {"id": "st1-신희훈-5", "grp": "st1", "no": 5, "kind": "ox", "area": "신희훈", "q": "(OX) 운영위원회는 매년 1회 이상 회장이 소집하며, 위원 3분의 1 이상이 회의의 소집을 요구한 때에는 회장은 이를 소집하여야 한다.", "a": "X", "ex": "조직법 제12조④, 정관 제12조 — 운영위원회는 <b>필요한 때에 회장이 소집<\/b>."}, {"id": "st1-신희훈-6", "grp": "st1", "no": 6, "kind": "mc", "area": "신희훈", "q": "다음 괄호 안에 들어갈 숫자의 총합으로 옳은 것은?\nㄱ. 전국대의원총회는 회장과 (144)명의 대의원으로 구성한다.\nㄴ. 중앙위원회는 회장과 전국대의원총회에서 선출하는 사람 19명, 국무위원 (8)명으로 구성한다.\nㄷ. 운영위원회는 회장과 중앙위원회가 그 위원 중에서 호선하는 사람 (4)명, 행정안전부장관 및 보건복지부장관 2명으로 구성한다.\nㄹ. 적십자사의 임원으로 회장 1명, 부회장 (2)명 및 재정감독 1명을 두고, 고문으로 법률고문 1명을 둔다.\n① 156  ② 157  ③ 158  ④ 159", "a": "③", "ex": "144+8+4+2 = 158. 대의원 144 = 대통령 8 + 국회 12 + 시·도지사 2×17 + 지사 선출 6×15 (정관 제4조, 시·도·지사 수는 개편에 따라 달라질 수 있음)."}, {"id": "st1-신희훈-7", "grp": "st1", "no": 7, "kind": "mc", "area": "신희훈", "q": "다음 중 중앙위원회 심의, 의결사항으로 옳지 않은 것은?\n① 적십자사의 해산 및 잔여재산 처분에 관한 사항\n② 지사 및 사업기관의 설치·폐지에 관한 사항\n③ 사업계획 및 예산에 관한 사항\n④ 중앙위원회 위원의 선출에 관한 사항", "a": "④", "ex": "정관 제8조 — 중앙위원회 위원은 <b>전국대의원총회<\/b>가 선출(제5조1호)."}, {"id": "st1-최강락-1", "grp": "st1", "no": 1, "kind": "ox", "area": "최강락", "q": "(OX) 적십자사로부터 그 사용승인을 받지 아니한 자가 사업용으로 적십자 표장을 사용한 경우 500만원 이하의 과태료를 부과한다.", "a": "X", "ex": "조직법 제25조·제28조 — 표장 무단 사용은 <b>1천만원 이하의 벌금<\/b>. (과태료 500만원은 유사명칭, 제26조·제29조)"}, {"id": "st1-최강락-2", "grp": "st1"
