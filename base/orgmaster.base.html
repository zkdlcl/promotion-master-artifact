<title>승진고시 마스터</title>
<style>
:root{
  --bg:#f6f4f1; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e5e1db;
  --red:#c8102e; --red-d:#9d0c24; --red-bg:#fdeceb;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#b45309; --warn-bg:#fdf1de;
  --blank:#ffe0dd; --blank-line:#c8102e;

}
@media (prefers-color-scheme: dark){

    --bg:#16171a; --card:#1f2125; --ink:#e6e6e6; --mute:#9aa0a6; --line:#33363c;

    --blank:#4a2528; --blank-line:#ff6b6b; --amend:#7c828a;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#1f2125; --ink:#e6e6e6; --mute:#9aa0a6; --line:#33363c;
  --red:#ff6b6b; --red-d:#ff8787; --red-bg:#3a2123;
  --ok:#5fd694; --ok-bg:#1d3326; --warn:#f2b45c; --warn-bg:#3a2e1a;
  --blank:#4a2528; --blank-line:#ff6b6b; --amend:#7c828a;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",sans-serif;font-size:16px}

.hd h1{font-size:1.1rem;margin:0;color:var(--red);flex:1;white-space:nowrap}

  padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:16px}
section.pane{display:none}
section.pane.on{display:block}
h2{font-size:1.25rem;margin:1.2em 0 .5em}
h3{font-size:1.05rem;margin:1.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.mute{color:var(--mute)}
.small{font-size:.85rem}
button.b-red,button.b-line{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--red)}
button.b-red{background:var(--red);color:#fff}
button.b-line{background:var(--card);color:var(--red)}
button.b-red:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number]{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.82rem;cursor:pointer;color:var(--ink);font:inherit;font-size:.82rem}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);transition:width .3s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.5rem;color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:.45em;width:18px;height:18px;accent-color:var(--red)}
.check.done span{color:var(--mute);text-decoration:line-through}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--red-bg);color:var(--red);margin-right:4px;vertical-align:middle}
.badge.t{background:var(--warn-bg);color:var(--warn)}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:.92rem}
/* 회독 */
.toolbar{position:sticky;top:96px;z-index:30;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch-h{margin:1.8em 0 .6em;padding:12px 14px 10px;border-radius:12px;background:var(--red);color:#fff}
.ch-h .ch-no{font-size:.8rem;font-weight:800;letter-spacing:.1em;opacity:.85}
.ch-h .ch-tt{font-size:1.35rem;font-weight:800;line-height:1.25}
.ch-h .ch-meta{font-size:.78rem;opacity:.92;margin-top:4px}
.ch-h .ch-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
.ch-h .ch-bar i{display:block;height:100%;background:#fff}
.sc-h{margin:1.3em 0 .45em;padding:6px 10px;border-left:5px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sc-h .sc-no{font-weight:800;color:var(--red);font-size:.85rem}
.sc-h .sc-tt{font-weight:800;font-size:1.05rem}
.sc-h .sc-meta{margin-left:auto;font-size:.75rem;color:var(--mute)}
#r-crumb{position:sticky;top:var(--hh,96px);z-index:25;background:var(--card);border:1px solid var(--red);border-radius:8px;padding:5px 10px;font-size:.84rem;font-weight:700;color:var(--red);margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap{margin:1.6em 0 .4em;padding:6px 12px;background:var(--red);color:#fff;border-radius:8px;font-weight:800}
.sec{margin:1em 0 .2em;font-weight:800;color:var(--red)}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.art.read{border-left:5px solid var(--ok)}
.art-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.art-h .no{font-weight:800;font-size:1.02rem}
.art-h .tt{color:var(--mute);font-size:.95rem}
.art-h .sp{flex:1}
.ln{padding-left:0}
.ln.it{padding-left:1.4em;text-indent:-1.1em;margin-left:0}
.ln.it2{padding-left:2.7em;text-indent:-1.2em}
.ln.it3{padding-left:4em;text-indent:-1.5em}
.art .tw{margin:6px 0}
.exrow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .dd{font-weight:800;color:var(--red);min-width:5.2em;font-variant-numeric:tabular-nums}
.exrow.past .dd{color:var(--mute)}
.exrow .nm{font-weight:700}
.amend{color:var(--amend);font-size:.75rem;margin-left:2px}
.rc{font:inherit;font-size:.8rem;font-weight:700;border-radius:99px;padding:2px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.rc.has{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.b{border-radius:3px;padding:0 2px}
body[data-rd="1"] .b.b1:not(.rev), body[data-rd="2"] .b:not(.rev), body[data-rd="3"] .b:not(.rev){
  color:transparent;background:var(--blank);border-bottom:2px solid var(--blank-line);cursor:pointer;user-select:none}
body[data-rd="1"] .b.b1.rev, body[data-rd="2"] .b.rev, body[data-rd="3"] .b.rev{background:var(--ok-bg);color:var(--ok);cursor:pointer}
/* 검색 */
.fsc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fsc button{font:inherit;font-size:.85rem;font-weight:700;border-radius:99px;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.fsc button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.fr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.fr .ft{font-weight:800}.fr .fs{font-size:.92rem;margin-top:4px;white-space:pre-wrap;word-break:break-all}
.fr mark{background:var(--blank);color:inherit;border-radius:3px;padding:0 1px}
.fr .row{margin-top:8px}

.chctx{font-size:1.08rem;line-height:1.9;margin:8px 0}
.chin{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);box-sizing:border-box}
.chin:focus{outline:none;border-color:var(--red)}

.q{font-size:1.2rem;font-weight:700;margin:6px 0 12px}
.ans{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:1.05rem;font-weight:600}

.res{font-weight:800;margin-top:6px}
.res.ok{color:var(--ok)} .res.no{color:var(--red)}
.hide{display:none!important}

th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}

.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto}

.hd{flex-wrap:nowrap;gap:8px;padding:8px 12px 0}

.dday{white-space:nowrap;font-size:.85rem}

.toolbar select{min-height:44px;flex:1 1 45%;min-width:0}

"t": "📊 운영규정 표 6·8·10·11·12번을 모두 가린 채 복원", "min": 30}, {"tag": "기출", "t": "직원 운영규정 6~7장 해당 <b>기출문항<\/b>을 원문 없이 풀기 (있으면)", "min": 40}, {"tag": "오답", "t": "틀린 문항은 원문에서 조문을 찾아 형광 표시 + 해당 카드 다시 풀기", "min": 25}, {"tag": "복습", "t": "🧠 카드 17~19번 주제 '전체 무작위' 40장 — 처음 정답률과 비교", "min": 30}, {"tag": "질문", "t": "💬 Claude에게 '징계 시나리오형 문제' 출제·채점 요청", "min": 20}], "tip": "징계 문제는 '이 직원의 징계는 어느 위원회가, 누가 처분하나'처럼 시나리오로 나옵니다. 관할 표를 눈에 익히세요."}, {"date": "2026-10-22", "label": "10/22(목)", "title": "최종 점검 · 운영규정 6~7장 (D-DAY)", "goals": [{"tag": "점검", "t": "🧠 '아직 약한 카드'만 반복 — 17~19번 주제 마스터 80% 목표", "min": 40}, {"tag": "회독", "t": "회독 탭 ② 가리기 모드로 <b>틀린 조문만 3회독<\/b>", "min": 40}, {"tag": "복원", "t": "숫자 표 백지 복원 만점 도전 (기간·정족수·위원회 구성)", "min": 20}, {"tag": "정리", "t": "🔬 실험실에서 학습법별 정답률 확인 → 다음 과목 계획에 반영", "min": 10}], "tip": "오늘로 조직법·정관·직원 운영규정 전체가 한 바퀴 끝납니다. 다음 과목 일정을 이 페이지 위쪽 시험 일정에 추가하세요."}], "articles": [{"law": "조직법", "type": "h", "lv": 1, "text": "제1장 총칙"}, {"law": "조직법", "type": "a", "no": "1", "title": "목적", "topics": [10], "html": "<div class=\"ln\">이 법은 대한적십자사의 조직과 그 업무에 관한 대강의 사항을 정하여 제네바협약의 정신과 국제적십자운동 기본원칙에 따른 적십자사업의 원활한 수행을 도모함으로써 적십자의 이상(理想)인 인도주의를 실현하고 세계평화와 인류의 복지에 공헌함을 목적으로 한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "2", "title": "법인격", "topics": [10], "html": "<div class=\"ln\">대한적십자사(이하 “적십자사”라 한다)는 법인으로 한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "3", "title": "등기", "topics": [10], "html": "<div class=\"ln\">적십자사의 등기에 관하여는 「민법」 중 사단법인의 등기에 관한 규정을 준용한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "4", "title": "사무소", "topics": [6, 7], "html": "<div class=\"ln\">① 적십자사의 주된 사무소의 소재지는 정관으로 정한다.<\/div><div class=\"ln\">② 적십자사는 정관으로 정하는 바에 따라 필요한 곳에 지사를 둘 수 있다.<\/div>"}, {"law": "조직법", "type": "a", "no": "5", "title": "정관", "topics": [2, 7], "html": "<div class=\"ln\">① 적십자사의 정관에는 다음 각 호의 사항이 포함되어야 한다.<\/div><div class=\"ln it\">1. 목적<\/div><div class=\"ln it\">2. 명칭<\/div><div class=\"ln it\">3. 주된 사무소의 소재지 및 지사 설치에 관한 사항<\/div><div class=\"ln it\">4. 제9조에 따른 전국대의원총회, 중앙위원회 및 운영위원회에 관한 사항<\/div><div class=\"ln it\">5. 임원에 관한 사항<\/div><div class=\"ln it\">6. 내부 조직에 관한 사항<\/div><div class=\"ln it\">7. 회원의 종류 및 회비에 관한 사항<\/div><div class=\"ln it\">8. 재산 및 회계에 관한 사항<\/div><div class=\"ln it\">9. 업무 및 그 집행에 관한 사항<\/div><div class=\"ln it\">10. 공고의 방법에 관한 사항<\/div><div class=\"ln it\">11. 정관의 변경에 관한 사항<\/div><div class=\"ln it\">12. 그 밖에 적십자사의 운영에 필요한 사항<\/div><div class=\"ln\">② 적십자사는 정관을 변경하려면 <span class=\"b b1\">보건복지부장관<\/span>의 <span class=\"b b2\">인가<\/span>를 받아야 한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "6", "title": "회원", "topics": [5], "html": "<div class=\"ln\">① 대한민국에 거주하는 사람은 성별, 국적, 종교 또는 정치적 신념과 관계없이 적십자사의 회원이 될 수 있다.<\/div><div class=\"ln\">② 대한민국의 법률에 따라 설립된 법인 또는 단체는 적십자사의 회원이 될 수 있다.<span class=\"amend\">&lt;신설 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">③ 적십자사의 회원은 회비를 납부하는 자로 한다.<span class=\"amend\">&lt;신설 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">④ 적십자사는 개인, 사업자, 법인 또는 단체 등을 대상으로 회원모집 및 회비모금 활동을 할 수 있다.<span class=\"amend\">&lt;신설 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">⑤ 회원은 정관으로 정하는 바에 따라 회원으로서의 권리와 의무를 가진다.<span class=\"amend\">&lt;개정 2015. 12. 29.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "7", "title": "사업", "topics": [10], "html": "<div class=\"ln\">적십자사는 제1조의 목적을 달성하기 위하여 다음 각 호의 사업을 수행한다.<\/div><div class=\"ln it\">1. 제네바협약의 정신에 따른 전시포로 및 무력충돌희생자 구호사업<\/div><div class=\"ln it\">2. 전시(戰時)에 군 의료보조기관으로서의 전상자 치료 및 구호사업<\/div><div class=\"ln it\">3. 수재(水災), 화재, 기근(饑饉), 악성 감염병 등 중대한 재난을 당한 사람에 대한 구호사업<\/div><div class=\"ln it\">4. 의료사업(간호사업 및 혈액사업을 포함한다), 응급구호사업, 자원봉사사업, 이산가족 재회사업, 청소년적십자사업, 관련 교육사업, 그 밖에 국민 보건 및 사회복지에 관한 사업<\/div><div class=\"ln it\">5. 적십자 이념 및 국제인도법의 보급사업<\/div><div class=\"ln it\">6. 적십자사의 사업 수행을 위한 국제협력사업<\/div><div class=\"ln it\">7. 그 밖에 제1호부터 제6호까지의 사업에 부대되는 사업<\/div>"}, {"law": "조직법", "type": "a", "no": "8", "title": "국가와 지방자치단체에 대한 자료제공 요청 등", "topics": [10], "html": "<div class=\"ln\">① 적십자사는 국가와 지방자치단체에 대하여 적십자사의 운영과 제6조제4항의 적십자사 회원모집 및 회비모금, 이에 따른 기부금 영수증 발급을 위하여 필요한 자료의 제공을 요청할 수 있다. <span class=\"amend\">&lt;개정 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">② 제1항에 따른 필요한 자료의 구체적인 범위는 대통령령으로 정한다.<span class=\"amend\">&lt;신설 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">③ 제1항 및 제2항에 따라 자료제공을 요청받은 국가와 지방자치단체는 특별한 사유가 없으면 그 자료를 제공하여야 한다.<span class=\"amend\">&lt;신설 2015. 12. 29.&gt;<\/span><\/div><div class=\"ln\">④ 국가와 지방자치단체는 적십자사의 업무 수행에 관하여 적십자사의 요청이 있는 경우 협조할 수 있다.<span class=\"amend\">&lt;개정 2015. 12. 29.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "h", "lv": 1, "text": "제2장 의결기관"}, {"law": "조직법", "type": "a", "no": "9", "title": "의결기관의 종류", "topics": [], "html": "<div class=\"ln\">적십자사에 다음 각 호의 <span class=\"b b2\">의결<\/span>기관을 둔다.<\/div><div class=\"ln it\">1. 전국대의원총회<\/div><div class=\"ln it\">2. 중앙위원회<\/div><div class=\"ln it\">3. 운영위원회<\/div>"}, {"law": "조직법", "type": "a", "no": "10", "title": "전국대의원총회", "topics": [5], "html": "<div class=\"ln\">① 적십자사에 다음 각 호의 사항을 관장하기 위하여 전국대의원총회를 둔다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln it\">1. 제11조에 따른 중앙위원회 위원의 선출<\/div><div class=\"ln it\">2. 사업계획 및 예산에 관한 사항의 <span class=\"b b2\">승인<\/span><\/div><div class=\"ln it\">3. 회장이 회의에 부치는 중요 사항의 <span class=\"b b2\">심의<\/span><\/div><div class=\"ln\">② 전국대의원총회는 회장과 적십자사의 회원 중 다음 각 호에 따라 위촉되거나 선출된 대의원으로 구성한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln it\">1. <span class=\"b b1\">대통령<\/span>이 위촉하는 사람 <span class=\"b b1\">8명<\/span><\/div><div class=\"ln it\">2. <span class=\"b b1\">국회<\/span>에서 위촉하는 사람 <span class=\"b b1\">12명<\/span><\/div><div class=\"ln it\">3. 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사 또는 특별자치도지사가 위촉하는 사람 각 <span class=\"b b1\">2명<\/span><\/div><div class=\"ln it\">4. 정관으로 정하는 바에 따라 특별시ㆍ광역시ㆍ특별자치시ㆍ도 또는 특별자치도의 적십자사 지사에서 선출하는 사람 각 <span class=\"b b1\">6명<\/span><\/div><div class=\"ln\">③ 대의원의 임기는 <span class=\"b b1\">3년<\/span>으로 한다.<\/div><div class=\"ln\">④ 전국대의원총회는 매년 <span class=\"b b1\">1회 이상<\/span> 정관으로 정하는 바에 따라 회장이 소집한다. 다만, 대의원 <span class=\"b b1\">3분의 1<\/span> 이상이 회의의 소집을 요구할 때에는 회장은 회의를 소집하여야 한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "11", "title": "중앙위원회", "topics": [1], "html": "<div class=\"ln\">① 적십자사에 다음 각 호의 사항을 <span class=\"b b2\">심의<\/span>ㆍ<span class=\"b b2\">의결<\/span>하기 위하여 중앙위원회를 둔다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln it\">1. 정관의 변경에 관한 사항<\/div><div class=\"ln it\">2. 제12조에 따른 운영위원회 위원의 선출에 관한 사항<\/div><div class=\"ln it\">3. 임원의 선출에 관한 사항<\/div><div class=\"ln it\">4. 회원 모집 및 회비 수납에 관한 사항<\/div><div class=\"ln it\">5. 적십자사의 기구(機構)에 관한 사항<\/div><div class=\"ln it\">6. 사업계획 및 예산에 관한 사항<\/div><div class=\"ln it\">7. 사업 실적 및 결산에 관한 사항<\/div><div class=\"ln it\">8. 부동산의 취득ㆍ처분 및 자금의 차입(借入)에 관한 사항<\/div><div class=\"ln it\">9. 그 밖에 회장이 회의에 부치는 사항<\/div><div class=\"ln\">② 중앙위원회는 회장을 포함한 <span class=\"b b1\">28명<\/span>의 위원으로 구성하며, 위원은 다음 각 호의 사람이 된다.<span class=\"amend\">&lt;개정 2013. 3. 23., 2014. 11. 19., 2016. 12. 2., 2017. 7. 26., 2025. 10. 1.&gt;<\/span><\/div><div class=\"ln it\">1. 전국대의원총회에서 선출하는 사람 <span class=\"b b1\">19명<\/span><\/div><div class=\"ln it\">2. <span class=\"b b1\">재정경제부장관<\/span>, <span class=\"b b1\">교육부장관<\/span>, <span class=\"b b1\">외교부장관<\/span>, <span class=\"b b1\">통일부장관<\/span>, <span class=\"b b1\">법무부장관<\/span>, <span class=\"b b1\">국방부장관<\/span>, <span class=\"b b1\">행정안전부장관<\/span>, <span class=\"b b1\">보건복지부장관<\/span><\/div><div class=\"ln\">③ 제2항제1호에 따른 위원의 임기는 <span class=\"b b1\">3년<\/span>으로 한다.<\/div><div class=\"ln\">④ 중앙위원회는 매년 <span class=\"b b1\">1회 이상<\/span> 정관으로 정하는 바에 따라 회장이 소집한다. 다만, 위원 <span class=\"b b1\">3분의 1<\/span> 이상이 회의의 소집을 요구할 때에는 회장은 회의를 소집하여야 한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "12", "title": "운영위원회", "topics": [8], "html": "<div class=\"ln\">① 적십자사에 다음 각 호의 업무를 처리하기 위하여 운영위원회를 둔다.<\/div><div class=\"ln it\">1. 중앙위원회가 위임한 사항과 긴급한 사항이어서 중앙위원회의 <span class=\"b b2\">의결<\/span>을 거치기 어려운 사항의 <span class=\"b b2\">심의<\/span>ㆍ<span class=\"b b2\">의결<\/span><\/div><div class=\"ln it\">2. 중앙위원회의 <span class=\"b b2\">심의<\/span>ㆍ<span class=\"b b2\">의결<\/span> 사항 중 사업계획 및 예산에 관한 사항과 사업 실적 및 결산에 관한 사항의 <span class=\"b b2\">사전 심의<\/span><\/div><div class=\"ln\">② 운영위원회는 회장을 포함한 <span class=\"b b1\">7명<\/span>의 위원으로 구성하되, 위원은 중앙위원회가 그 위원 중에서 <span class=\"b b2\">호선<\/span>(互選)하는 사람 <span class=\"b b1\">4명<\/span>과 <span class=\"b b1\">행정안전부장관<\/span> 및 <span class=\"b b1\">보건복지부장관<\/span>으로 한다.<span class=\"amend\">&lt;개정 2013. 3. 23., 2014. 11. 19., 2016. 12. 2., 2017. 7. 26.&gt;<\/span><\/div><div class=\"ln\">③ 운영위원회에서 <span class=\"b b2\">의결<\/span>된 사항은 중앙위원회에 보고하여야 한다.<\/div><div class=\"ln\">④ 운영위원회는 회장이 소집한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "13", "title": "의결정족수 등", "topics": [1], "html": "<div class=\"ln\">① 회장은 전국대의원총회ㆍ중앙위원회 및 운영위원회의 의장이 되며 그 사무를 총괄한다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">② 전국대의원총회ㆍ중앙위원회 및 운영위원회의 회의는 재적대의원 또는 재적위원 <span class=\"b b1\">과반수<\/span>의 출석으로 개의(開議)하고, 출석대의원 또는 출석위원 <span class=\"b b1\">과반수<\/span>의 찬성으로 <span class=\"b b2\">의결<\/span>한다.<\/div>"}, {"law": "조직법", "type": "h", "lv": 1, "text": "제3장 집행기관"}, {"law": "조직법", "type": "a", "no": "14", "title": "명예회장 및 명예부회장", "topics": [10, 3], "html": "<div class=\"ln\">① 적십자사에 <span class=\"b b1\">명예회장<\/span>과 <span class=\"b b1\">명예부회장<\/span> 각 <span class=\"b b1\">1명<\/span>을 둔다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">② <span class=\"b b1\">명예회장<\/span>은 <span class=\"b b1\">대통령<\/span>이 되고 <span class=\"b b1\">명예부회장<\/span>은 <span class=\"b b1\">국무총리<\/span>가 된다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "15", "title": "임원 및 고문", "topics": [3], "html": "<div class=\"ln\">① 적십자사의 임원으로 회장 <span class=\"b b1\">1명<\/span>, 부회장 <span class=\"b b1\">2명<\/span> 및 재정감독 <span class=\"b b1\">1명<\/span>을 두고, 고문으로 법률고문 <span class=\"b b1\">1명<\/span>을 둔다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">② 임원과 고문은 정관으로 정하는 바에 따라 상근(常勤) 또는 비상근으로 한다.<\/div><div class=\"ln\">③ 임원과 고문은 중앙위원회에서 선출한다. 다만, 회장은 중앙위원회에서 선출한 후 <span class=\"b b1\">대통령<\/span>의 <span class=\"b b2\">인준<\/span>을 받아야 한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "16", "title": "임원 및 고문의 임기", "topics": [3], "html": "<div class=\"ln\">회장의 임기는 <span class=\"b b1\">3년<\/span>으로 하고, 다른 임원 및 고문의 임기는 <span class=\"b b1\">2년<\/span>으로 하되, 한 차례만 중임(重任)할 수 있다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "17", "title": "임원 및 고문의 직무", "topics": [3], "html": "<div class=\"ln\">① 회장은 적십자사를 대표하고 적십자사의 업무를 총괄한다. <span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">② 부회장은 회장을 보좌하며, 회장이 부득이한 사유로 직무를 수행할 수 없을 때에는 회장이 미리 지명한 순위에 따라 그 직무를 대행한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">③ 재정감독은 적십자사의 재정 운영에 관하여 감독하며 그에 관한 의견을 중앙위원회에 제출한다.<\/div><div class=\"ln\">④ 법률고문은 적십자사의 모든 법률문제에 관하여 조언을 하거나 자문에 응한다.<\/div><div class=\"ln\">⑤ 임원과 고문은 전국대의원총회ㆍ중앙위원회 및 운영위원회의 회의에 출석하여 의견을 진술할 수 있다.<\/div>"}, {"law": "조직법", "type": "a", "no": "18", "title": "임원의 결격사유", "topics": [3], "html": "<div class=\"ln\">다음 각 호의 어느 하나에 해당하는 사람은 적십자사의 임원이 될 수 없다. <span class=\"amend\">&lt;개정 2015. 12. 29., 2024. 10. 22.&gt;<\/span><\/div><div class=\"ln it\">1. 피성년후견인 또는 피한정후견인<\/div><div class=\"ln it\">2. 파산선고를 받고 복권되지 아니한 사람<\/div><div class=\"ln it\">3. 금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 <span class=\"b b1\">2년<\/span>이 지나지 아니한 사람<\/div><div class=\"ln it\">3의2. 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람<\/div><div class=\"ln it\">4. 법원의 판결이나 다른 법률에 따라 자격이 상실되거나 정지된 사람<\/div>"}, {"law": "조직법", "type": "a", "no": "19", "title": "사무처", "topics": [10], "html": "<div class=\"ln\">① 적십자사의 사무를 처리하기 위하여 사무처를 둔다.<\/div><div class=\"ln\">② 사무처에 사무총장 <span class=\"b b1\">1명<\/span>을 두며, 사무총장은 회장의 명을 받아 적십자사의 사무를 관장하고 소속 직원을 지휘ㆍ감독한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div><div class=\"ln\">③ 사무총장은 회장이 임명하되, 중앙위원회의 <span class=\"b b2\">승인<\/span>을 받아야 한다.<span class=\"amend\">&lt;개정 2016. 12. 2.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "h", "lv": 1, "text": "제4장 재정"}, {"law": "조직법", "type": "a", "no": "20", "title": "회계연도", "topics": [4], "html": "<div class=\"ln\">적십자사의 회계연도는 정부의 회계연도에 따른다.<\/div>"}, {"law": "조직법", "type": "a", "no": "21", "title": "사업계획의 제출 등", "topics": [4], "html": "<div class=\"ln\">① 적십자사는 매 회계연도의 사업계획 및 예산안을 작성하여 운영위원회의 <span class=\"b b2\">심의<\/span>와 중앙위원회의 <span class=\"b b2\">의결<\/span> 및 전국대의원총회의 <span class=\"b b2\">승인<\/span>을 받아 해당 회계연도가 시작되기 <span class=\"b b1\">1개월<\/span> 전에 <span class=\"b b1\">보건복지부장관<\/span>에게 제출하여야 한다. 이를 변경하려는 경우에도 또한 같다.<\/div><div class=\"ln\">② 적십자사는 제1항에도 불구하고 국가나 지방자치단체로부터 자금(국가나 지방자치단체가 관리하는 기금을 포함한다)이나 사업비의 전부 또는 일부를 보조받거나 융자받아 시행하는 사업의 경우에는 그 사업계획에 관하여 사업을 관장하는 주무부장관 또는 지방자치단체의 장의 <span class=\"b b2\">승인<\/span>을 받아야 한다. 이를 변경하려는 경우에도 또한 같다.<\/div><div class=\"ln\">③ 적십자사는 매 회계연도 경과 후 <span class=\"b b1\">3개월 이내<\/span>에 세입ㆍ세출결산서에 「공인회계사법」 제7조에 따라 등록한 공인회계사 또는 같은 법 제24조에 따라 등록한 회계법인의 회계감사 보고서를 첨부하여 운영위원회의 <span class=\"b b2\">심의<\/span>와 중앙위원회의 <span class=\"b b2\">의결<\/span>을 거친 후 <span class=\"b b1\">국회<\/span> 및 <span class=\"b b1\">보건복지부장관<\/span>에게 제출하여야 한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "22", "title": "사업 재원의 조성", "topics": [4], "html": "<div class=\"ln\">① 적십자사의 운영 및 사업에 사용되는 경비는 회비, 국가 또는 지방자치단체의 보조금, 수익사업으로 인한 수익금, 그 밖의 수입금으로 충당한다.<\/div><div class=\"ln\">② 국가와 지방자치단체는 적십자사가 「공공보건의료에 관한 법률」 제7조제1항 각 호에 따른 보건의료를 수행하는 경우에는 시설장비 확충 등 이에 사용되는 경비의 일부를 보조할 수 있다.<\/div>"}, {"law": "조직법", "type": "a", "no": "22의2", "title": "기본재산의 취득 등", "topics": [2], "html": "<div class=\"ln\">적십자사는 정관으로 정하는 기본재산을 취득ㆍ매매ㆍ증여ㆍ교환 또는 임대하거나 이를 담보로 제공하려면 <span class=\"b b1\">보건복지부장관<\/span>의 <span class=\"b b2\">인가<\/span>를 받아야 한다.<\/div>"}, {"law": "조직법", "type": "a", "no": "23", "title": "국유ㆍ공유 재산의 무상대부", "topics": [10], "html": "<div class=\"ln\">국가나 지방자치단체는 적십자사의 사업 목적을 달성하기 위하여 필요할 때에는 「국유재산법」 및 「공유재산 및 물품 관리법」의 규정에도  불구하고 국유ㆍ공유 재산을 적십자사에 무상(無償)으로 대부할 수 있다.<\/div>"}, {"law": "조직법", "type": "h", "lv": 1, "text": "제5장 보칙"}, {"law": "조직법", "type": "a", "no": "24", "title": "수익사업", "topics": [4], "html": "<div class=\"ln\">적십자사는 다음 각 호의 수익사업을 할 수 있다.<\/div><div class=\"ln it\">1. 적십자병원의 운영사업<\/div><div class=\"ln it\">2. 적십자에 관한 교육ㆍ홍보 및 출판 사업<\/div><div class=\"ln it\">3. 자산의 임대사업<\/div><div class=\"ln it\">4. 그 밖에 제7조에 따른 사업 수행에 지장이 없는 범위에서 정관으로 정하는 사업<\/div>"}, {"law": "조직법", "type": "a", "no": "25", "title": "적십자 표장 등의 사용금지", "topics": [10], "html": "<div class=\"ln\">적십자사, 군 의료기관 또는 적십자사로부터 그 사용<span class=\"b b2\">승인<\/span>을 받은 자가 아닌 자는 사업용이나 선전용으로 흰색 바탕에 붉은 희랍식 십자(希臘式 十字)를 표시한 적십자 표장(標章) 또는 이와 유사한 표장을 사용하여서는 아니 된다.<\/div>"}, {"law": "조직법", "type": "a", "no": "26", "title": "유사명칭의 사용금지", "topics": [10], "html": "<div class=\"ln\">적십자사, 군 의료기관 또는 적십자사로부터 그 사용<span class=\"b b2\">승인<\/span>을 받은 자가 아닌 자는 적십자, 제네바적십자 또는 이와 유사한 명칭을 사용하여서는 아니 된다.<\/div>"}, {"law": "조직법", "type": "a", "no": "27", "title": "감독 등", "topics": [2], "html": "<div class=\"ln\">① <span class=\"b b1\">보건복지부장관<\/span>은 적십자사의 사업 목적 달성을 위하여 필요한 감독을 할 수 있다.<\/div><div class=\"ln\">② <span class=\"b b1\">보건복지부장관<\/span>은 적십자사나 그 <span class=\"b b2\">의결<\/span>기관의 집행 또는 <span class=\"b b2\">의결<\/span>이 위법하거나 현저히 부당하다고 인정할 때에는 그 시정을 요구할 수 있다.<\/div>"}, {"law": "조직법", "type": "h", "lv": 1, "text": "제6장 벌칙"}, {"law": "조직법", "type": "a", "no": "28", "title": "벌칙", "topics": [10], "html": "<div class=\"ln\">제25조를 위반한 자는 <span class=\"b b1\">1천만원 이하<\/span>의 벌금에 처한다. <span class=\"amend\">&lt;개정 2020. 12. 29.&gt;<\/span><\/div>"}, {"law": "조직법", "type": "a", "no": "29", "title": "과태료", "topics": [2, 10], "html": "<div class=\"ln\">① 제26조를 위반한 자에게는 500만원 이하의 과태료를 부과한다. <span class=\"amend\">&lt;개정 2020. 12. 29.&gt;<\/span><\/div><div class=\"ln\">② 제1항에 따른 과태료는 대통령령으로 정하는 바에 따라 <span class=\"b b1\">보건복지부장관<\/span>이 부과ㆍ징수한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제1장 총칙"}, {"law": "정관", "type": "a", "no": "1", "title": "목적", "topics": [10], "html": "<div class=\"ln\">본 사는 대한적십자사 조직법에 의해 조직된 법인으로 제네바협약의 정신과 다음 각 호의 국제적십자운동기본원칙에 입각한 적십자사업의 원활한 수행을 도모함으로써 적십자 이념인 인도주의를 실현하고 세계평화와 인류의 복지에 공헌함을 목적으로 한다.<\/div><div class=\"ln it\">1. <b>인도<\/b> 전쟁터에서 부상자를 차별 없이 도우려는 열망에서 탄생한 국제적십자운동은 국제적, 국내적 역량을 발휘하여 어디서든지 인간의 고통을 덜어주고 예방하기 위해 노력한다. 적십자운동의 목적은 생명과 건강을 보호하며 인간의 존엄성을 존중하고 보장하는데 있다. 이러한 적십자운동은 모든 사람들 간의 이해, 우정, 협력 및 항구적 평화를 증진시킨다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">2. <b>공평<\/b> 국제적십자운동은 국적, 인종, 종교적 신념, 계급 또는 정치적 입장이 다르다고 차별하지 않는다. 오직 개개인의 절박한 필요에 따라 고통을 덜어주고 가장 위급한 재난부터 우선적으로 해결하도록 노력한다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">3. <b>중립<\/b> 적십자운동은 지속적으로 모든 사람의 신뢰를 받기 위해 적대행위가 있을 때 어느 편에도 가담하지 않고 어떤 경우에도 정치적, 인종적, 종교적 또는 이념적 성격을 띤 논쟁에 개입하지 않는다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">4. <b>독립<\/b> 적십자운동은 독립적이다. 각국 적십자사는 정부의 인도주의 사업에 대한 보조자로서 국내 법규를 준수하지만 어느 때든지 적십자 원칙에 따라 행동할 수 있도록 항상 자율성을 유지해야 한다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">5. <b>자발적 봉사<\/b> 적십자운동은 자발적 구호운동으로서 어떤 이익도 추구하지 않는다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">6. <b>단일<\/b> 한 나라에는 하나의 적십자사만 존재할 수 있다. 적십자사는 모든 사람에게 개방되어야 하며, 그 나라 영토 전역에서 인도주의 사업을 수행해야 한다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div><div class=\"ln it\">7. <b>보편<\/b> 국제적십자운동은 각 나라의 적십자사들이 동등한 지위와 책임과 의무를 가지고 서로 돕는 범세계적인 운동이다.<span class=\"amend\">&lt;개정 2007.4.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "2", "title": "명칭", "topics": [10], "html": "<div class=\"ln\">①본 사는 대한적십자사(이하 “적십자사”라 한다)라 칭한다.<\/div><div class=\"ln\">②본사의 영문표기는 THE REPUBLIC OF KOREA NATIONAL RED CROSS로 하고 약칭은 KOREAN RED CROSS 또는 KNRC로 한다.<span class=\"amend\">&lt;개정 1997.12.19&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "3", "title": "주된 사무소의 소재지", "topics": [7], "html": "<div class=\"ln\">적십자사의 주된 사무소는 강원특별자치도 원주시에 둔다.<span class=\"amend\">&lt;개정 2019.1.1.,2023.6.11.&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "3의2", "title": "분사무소의 소재지", "topics": [7], "html": "<div class=\"ln\">적십자사는 지사, 인재개발원, 혈액관리본부, 병원 등 별표와 같이 분사무소를 둘 수 있다.<span class=\"amend\">&lt;신설 2018.3.29, 개정 2022.4.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제2장 의결기관"}, {"law": "정관", "type": "h", "lv": 2, "text": "제1절 전국대의원총회"}, {"law": "정관", "type": "a", "no": "4", "title": "구성", "topics": [5], "html": "<div class=\"ln\">①전국대의원총회는 회장과 회원 중 다음 각 호의 규정에 의하여 위촉되거나 선출된 대의원으로 구성한다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">1. <span class=\"b b1\">대통령<\/span>이 위촉하는 사람 <span class=\"b b1\">8명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">2. <span class=\"b b1\">국회<\/span>에서 위촉하는 사람 <span class=\"b b1\">12명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 서울특별시장, 광역시장, 특별자치시장, 도지사 또는 특별자치도지사(이하 “시·도지사”라 한다)가 위촉하는 사람 각 <span class=\"b b1\">2명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 적십자사 지사에서 선출하는 사람 각 <span class=\"b b1\">6명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">②대의원의 임기는 <span class=\"b b1\">3년<\/span>으로 한다. 다만, 대의원 중 사임, 사망 또는 기타 이유로 결원이 생겼을 때에는 <span class=\"b b1\">대통령<\/span>이 위촉한 대의원은 <span class=\"b b1\">대통령<\/span>이, <span class=\"b b1\">국회<\/span>에서 위촉한 대의원은 <span class=\"b b1\">국회<\/span>가, 시·도지사가 위촉한 대의원은 해당 시·도지사가, 적십자사 지사에서 선출한 대의원은 해당 지사에서 보선한다.<span class=\"amend\">&lt;개정 1999.4.8., 2025.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "5", "title": "기능", "topics": [5], "html": "<div class=\"ln\">전국대의원총회는 다음 각 호의 사항을 처리한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 중앙위원회 위원의 선출<\/div><div class=\"ln it\">2. 사업계획 및 예산에 관한 사항의 <span class=\"b b2\">승인<\/span><\/div><div class=\"ln it\">3. 회장이 회의에 부치는 중요사항의 <span class=\"b b2\">심의<\/span><span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">4. 전국대의원총회가 특히 필요하다고 인정하는 정책사항의 <span class=\"b b2\">심의<\/span><\/div><div class=\"ln it\">5. 적십자사의 해산에 관한 사항 <span class=\"b b2\">승인<\/span><span class=\"amend\">&lt;신설 2024.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "6", "title": "소집", "topics": [5], "html": "<div class=\"ln\">전국대의원총회는 매년 <span class=\"b b1\">1회이상<\/span> 회장이 소집한다. 다만, <span class=\"b b1\">3분의 1<\/span>이상이 회의의 소집을 요구한 때에는 회장이 지체없이 이를 소집하여야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제2절 중앙위원회"}, {"law": "정관", "type": "a", "no": "7", "title": "구성", "topics": [1], "html": "<div class=\"ln\">①중앙위원회는 회장과 다음 각 호의 위원으로 구성한다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">1. 전국대의원총회에서 선출한 사람 <span class=\"b b1\">19명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">2. <span class=\"b b1\">재정경제부장관<\/span>, <span class=\"b b1\">교육부장관<\/span>, <span class=\"b b1\">통일부장관<\/span>, <span class=\"b b1\">외교부장관<\/span>, <span class=\"b b1\">법무부장관<\/span>, <span class=\"b b1\">국방부장관<\/span>, <span class=\"b b1\">행정안전부장관<\/span>, <span class=\"b b1\">보건복지부장관<\/span><span class=\"amend\">&lt;개정 2008.4.22, 2010.4.1, 2013.4.17, 2015.4.3, 2017.9.22, 2026.4.1&gt;<\/span><\/div><div class=\"ln\">②제1항 제1호의 규정에 의한 위원의 임기는 <span class=\"b b1\">3년<\/span>으로 한다.<span class=\"amend\">&lt;개정 1999.4.8&gt;<\/span><\/div><div class=\"ln\">③천재지변 또는 돌발사태로 인하여 전국대의원총회를 소집하지 못하여 임기 만료된 중앙위원을 선출하지 못하였을 때에는 해당 중앙위원의 임기는 다음 전국대의원총회때까지 연장된다.<span class=\"amend\">&lt;개정 2025.1.1.&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "8", "title": "기능", "topics": [1], "html": "<div class=\"ln\">중앙위원회는 다음 각 호의 사항을 <span class=\"b b2\">심의<\/span>·<span class=\"b b2\">의결<\/span>한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 정관의 변경에 관한 사항<\/div><div class=\"ln it\">2. 법 제12조의 규정에 의한 운영위원회의 위원 선출에 관한 사항<\/div><div class=\"ln it\">3. 임원 및 법률고문 선출에 관한 사항<\/div><div class=\"ln it\">4. 회원의 모집 및 회비수납에 관한 사항<\/div><div class=\"ln it\">5. 지사, 사업기관의 설치 및 폐지에 관한 사항<\/div><div class=\"ln it\">6. 본사의 기구에 관한 사항<\/div><div class=\"ln it\">7. 사업계획 및 예산에 관한 사항<\/div><div class=\"ln it\">8. 사업실적 및 결산에 관한 사항<\/div><div class=\"ln it\">9. 부동산의 취득, 처분 및 자금의 차입에 관한 사항<\/div><div class=\"ln it\">10. 전국대의원총회가 건의한 정책에 관한 사항<\/div><div class=\"ln it\">11. 적십자사의 해산 및 잔여재산 처분에 관한 사항<span class=\"amend\">&lt;신설 2024.1.1&gt;<\/span><\/div><div class=\"ln it\">12. 그 밖에 회장이 회의에 부치는 사항<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "9", "title": "소집", "topics": [1], "html": "<div class=\"ln\">①중앙위원회는 매년 <span class=\"b b1\">1회이상<\/span> 회장이 소집한다. 다만, 위원 <span class=\"b b1\">3분의 1<\/span>이상이 회의의 소집을 요구한 때에는 회장은 이를 소집하여야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②중앙위원회를 소집하고자 하는 때에는 회의개최 <span class=\"b b1\">7일<\/span>전에 각 위원에게 문서로 통지하여야 한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제3절 운영위원회"}, {"law": "정관", "type": "a", "no": "10", "title": "구성", "topics": [8], "html": "<div class=\"ln\">운영위원회는 회장과 다음 각 호의 위원으로 구성한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">1. 중앙위원회가 그 위원 중에서 <span class=\"b b2\">호선<\/span>하는 사람 <span class=\"b b1\">4명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">2. <span class=\"b b1\">행정안전부장관<\/span> 및 <span class=\"b b1\">보건복지부장관<\/span><span class=\"amend\">&lt;개정 2008.4.22, 2010.4.1, 2013.4.17, 2015.4.3, 2017.9.22&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "11", "title": "기능", "topics": [8], "html": "<div class=\"ln\">운영위원회는 다음 각 호의 사항을 <span class=\"b b2\">심의<\/span> 또는 <span class=\"b b2\">의결<\/span>하고 그 결과를 중앙위원회에 보고한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 중앙위원회가 위임한 사항<\/div><div class=\"ln it\">2. 긴급을 요하여 중앙위원회의 <span class=\"b b2\">의결<\/span>을 거치기 어려운 사항<\/div><div class=\"ln it\">3. 운영규정의 제정 또는 개정<\/div><div class=\"ln it\">4. 사업계획 및 예산과 사업실적 및 결산의 <span class=\"b b2\">사전 심의<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "12", "title": "소집", "topics": [8], "html": "<div class=\"ln\">운영위원회는 필요한 때에 회장이 이를 소집한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제4절 의결기관 운영"}, {"law": "정관", "type": "a", "no": "13", "title": "의장", "topics": [], "html": "<div class=\"ln\">회장은 전국대의원총회, 중앙위원회 및 운영위원회의 의장이 된다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "14", "title": "의결정족수", "topics": [1], "html": "<div class=\"ln\">전국대의원총회, 중앙위원회 및 운영위원회 회의는 재적 대의원 또는 위원 <span class=\"b b1\">과반수<\/span>의 출석으로 개의하고 출석대의원 또는 출석위원 <span class=\"b b1\">과반수<\/span>의 찬성으로 <span class=\"b b2\">의결<\/span>한다.<\/div>"}, {"law": "정관", "type": "a", "no": "14의2", "title": "서면의결", "topics": [8], "html": "<div class=\"ln\">회장은 전국대의원총회, 중앙위원회 및 운영위원회의 관장 사항 중 긴급히 처리해야 할 사항이나 경미한 사항에 대하여 <span class=\"b b2\">서면의결<\/span>을 시행할 수 있으며, <span class=\"b b2\">서면의결<\/span> 결과는 차기 회의에 보고하여야 한다.<span class=\"amend\">&lt;신설 2013.1.1, 개정 2017.1.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제3장 집행기관"}, {"law": "정관", "type": "h", "lv": 2, "text": "제1절 명예직"}, {"law": "정관", "type": "a", "no": "15", "title": "명예직", "topics": [10, 3], "html": "<div class=\"ln\">대한적십자사조직법(이하“법”이라 한다) 제14조에 의하여 <span class=\"b b1\">명예회장<\/span>은 <span class=\"b b1\">대통령<\/span>이 되고 <span class=\"b b1\">명예부회장<\/span>은 <span class=\"b b1\">국무총리<\/span>가 된다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "16", "title": "명예고문", "topics": [8, 3], "html": "<div class=\"ln\">회장은 적십자사업에 경험이 있고 사회적으로 덕망이 있는 인사를 명예고문으로 중앙위원회 <span class=\"b b2\">승인<\/span>을 받아 위촉할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제2절 임원 및 고문"}, {"law": "정관", "type": "a", "no": "17", "title": "임원 및 고문", "topics": [3], "html": "<div class=\"ln\">①적십자사의 임원으로 회장 <span class=\"b b1\">1명<\/span>, 부회장 <span class=\"b b1\">2명<\/span> 및 재정감독 <span class=\"b b1\">1명<\/span>을 두고, 고문으로 법률고문 <span class=\"b b1\">1명<\/span>을 둔다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②임원 및 고문은 중앙위원회가 선출한다. 다만, 회장은 중앙위원회가 선출한 후 <span class=\"b b1\">대통령<\/span>의 <span class=\"b b2\">인준<\/span>을 받아야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③임원 및 고문은 비상근을 원칙으로 하되 필요에 따라 상근할 수 있다.<\/div><div class=\"ln\">④특수업무를 담당하게 하기 위하여 회장은 임원 중에서 운영위원회의 <span class=\"b b2\">승인<\/span>을 얻어 상근하게 할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">⑤임원 및 고문은 전국대의원총회, 중앙위원회 및 운영위원회의 회의에 출석하여 의견을 진술할 수 있다.<\/div><div class=\"ln\">⑥상근 임원 및 고문의 보수에 관한 사항은 중앙위원회에서 정한다. 단, 비상근 임원 및 고문은 보수를 지급하지 아니하며, 예산의 범위 내에서 업무수행에 필요한 수당 및 여비를 지급할 수 있다.<span class=\"amend\">&lt;신설 2022.4.1&gt;<\/span><\/div><div class=\"ln\">⑦임원 및 고문의 처우에 관한 사항은 운영규정으로 정한다.<span class=\"amend\">&lt;신설 2019.1.1, 개정 2022.4.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "18", "title": "임원 및 고문의 임기", "topics": [3], "html": "<div class=\"ln\">회장의 임기는 <span class=\"b b1\">3년<\/span>으로 하고, 부회장 및 재정감독, 법률고문의 임기는 <span class=\"b b1\">2년<\/span>으로 하되, 한 차례만 중임할 수 있다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "19", "title": "임원 및 고문의 결격사유", "topics": [3], "html": "<div class=\"ln\">다음 각 호의 어느 하나에 해당하는 사람은 적십자사의 임원 및 고문이 될 수 없다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 피성년후견인 또는 피한정후견인<span class=\"amend\">&lt;개정 2013.1.1, 2016.4.11&gt;<\/span><\/div><div class=\"ln it\">2. 파산선고를 받고 복권되지 아니한 사람<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">3. 금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 <span class=\"b b1\">2년<\/span>이 지나지 아니한 사람<span class=\"amend\">&lt;개정 2025.1.1.&gt;<\/span><\/div><div class=\"ln it\">3의2. 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 법원의 판결이나 다른 법률에 따라 자격이 상실되거나 정지된 사람<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제3절 임원 및 고문의 직무"}, {"law": "정관", "type": "a", "no": "20", "title": "회장", "topics": [3], "html": "<div class=\"ln\">①회장은 적십자사를 대표하고 적십자사의 업무를 총괄한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②회장은 적십자사 운영에 필요한 시행규칙을 정관 및 운영규정의 위임에 따라 제정 시행한다<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "21", "title": "부회장", "topics": [3], "html": "<div class=\"ln\">부회장은 회장이 지정하는 업무에 대하여 회장을 보좌하며 회장이 부득이한 사유로 직무를 수행할 수 없을 때에는 회장이 미리 지명한 순위에 따라 그 직무를 대행한다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "22", "title": "재정감독", "topics": [3], "html": "<div class=\"ln\">재정감독은 적십자사의 재정운영에 관하여 감독하며 그 의견을 중앙위원회 또는 운영위원회에 제출한다.<\/div>"}, {"law": "정관", "type": "a", "no": "23", "title": "법률고문", "topics": [3], "html": "<div class=\"ln\">법률고문은 적십자사의 모든 법률문제에 관하여 조언을 하거나 자문에 응하며 전국대의원총회, 중앙위원회, 운영위원회에 출석하여 의견을 진술할 수 있다.<\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제4절 내부조직"}, {"law": "정관", "type": "a", "no": "24", "title": "사무처", "topics": [10, 7], "html": "<div class=\"ln\">①적십자사의 사무를 집행하기 위하여 사무처를 둔다.<\/div><div class=\"ln\">②사무처에 사무총장 <span class=\"b b1\">1명<\/span>을 두며 사무총장은 회장의 명을 받아 적십자사의 사무를 관장하며 소속직원을 지휘·감독한다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③사무총장은 회장이 임명하며 중앙위원회의 <span class=\"b b2\">승인<\/span>을 얻어야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">④사무총장은 정관에 정한 각종 회의의 사무를 담당한다.<\/div><div class=\"ln\">⑤적십자사의 사무를 집행하기 위하여 직원 및 고용원을 두며, 이에 따른 정원, 직원의 근무, 보수 등에 관하여는 이를 운영규정으로 정한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제5절 지사"}, {"law": "정관", "type": "a", "no": "25", "title": "지사 설치", "topics": [6, 7], "html": "<div class=\"ln\">①중앙위원회의 결의에 의하여 서울특별시, 광역시, 특별자치시, 도 또는 특별자치도에는 그 행정구역을 관할구역으로 하는 지사를 둔다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">②지사의 명칭에는 서울특별시, 광역시, 특별자치시, 도 또는 특별자치도명을 그 앞에 붙인다. 단 두 개 이상의 광역자치단체를 통합 관할하는 지사의 명칭에는 해당 지역명을 모두 병기한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">③지사사무소는 서울특별시, 광역시, 특별자치시, 도 또는 특별자치도청 소재지에 둔다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">④지사관하 시·군·구에 지부를 설치할 수 있으며, 그 운영에 관한 사항은 운영규정으로 정한다.<\/div>"}, {"law": "정관", "type": "a", "no": "26", "title": "조직", "topics": [6], "html": "<div class=\"ln\">①지사를 설치하고자 할 때에는 회장은 관할시·도지사를 조직위원장으로 위촉하고 그 관하 행정청의 장(시·군·구)이 추천하는 각 <span class=\"b b1\">2명<\/span>의 조직위원으로서 지사조직위원회를 구성하여 상임위원의 선거와 지사 조직에 필요한 조치를 행하게 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②상임위원의 선거가 끝나면 조직위원장은 소정의 회의록을 첨부하여 회장의 <span class=\"b b2\">인준<\/span>을 받아야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③최초 상임위원회의 의장은 조직위원장이 된다.<\/div><div class=\"ln\">④제2항의 <span class=\"b b2\">인준<\/span>이 완료되면 조직위원회의 임무는 끝난다.<\/div>"}, {"law": "정관", "type": "a", "no": "27", "title": "지사대의원총회", "topics": [6], "html": "<div class=\"ln\">①지사대의원총회는 적십자 회원 중에서 선출한 다음 각 호의 대의원으로 구성한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 지사 상임위원회에서 선출한 사람 <span class=\"b b1\">10명<\/span><span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln it\">2. 명예지사회장과 지사회장이 협의하여 선출한 사람 <span class=\"b b1\">10명<\/span><span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">3. 시·군·구의 장이 선출한 사람 <span class=\"b b1\">1명<\/span>(단, 시군구의 지역수가 6개 지역 이하일 경우에는 2인)<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">②지사대의원총회는 지사상임위원회의 위원을 선출 또는 보선하고, 지사 사업에 대한 보고를 받는다.<\/div><div class=\"ln\">③지사대의원의 임기는 <span class=\"b b1\">3년<\/span>으로 한다.<span class=\"amend\">&lt;개정 1999.4.8&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "28", "title": "상임위원회", "topics": [6], "html": "<div class=\"ln\">①상임위원회는 지사회장과 <span class=\"b b1\">18명<\/span>의 위원으로 구성한다.<span class=\"amend\">&lt;개정 2011.1.1, 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②상임위원의 임기는 <span class=\"b b1\">3년<\/span>으로 하며 한 차례만 중임할 수 있다. 다만, 지사대의원총회는 그 <span class=\"b b2\">의결<\/span>에 따라 중임한 상임위원의 임기를 한 차례에 한하여 연장할 수 있다.<span class=\"amend\">&lt;신설 2011.1.1, 개정 2013.1.1&gt;<\/span><\/div><div class=\"ln\">③상임위원회는 지사임원과 법률고문을 선출하며 지사사업과 업무에 관하여 <span class=\"b b2\">심의<\/span>한다.<span class=\"amend\">&lt;개정 2011.1.1&gt;<\/span><\/div><div class=\"ln\">④지사상임위원회는 법 제10조 제2항의 제4호에 정한 전국대의원을 선출한다.<span class=\"amend\">&lt;개정 2011.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "29", "title": "지사운영위원회", "topics": [6], "html": "<div class=\"ln\">①지사에는 상임위원회가 위임한 사항 또는 긴급을 요하여 상임위원회의 <span class=\"b b2\">심의<\/span>를 거치기 어려운 사항을 <span class=\"b b2\">심의<\/span>하기 위하여 지사운영위원회를 둔다.<\/div><div class=\"ln\">②지사운영위원회는 지사회장을 포함하여 <span class=\"b b1\">7명<\/span>으로 구성하되 위원은 상임위원회가 그 위원 중에서 <span class=\"b b2\">호선<\/span>하는 사람 <span class=\"b b1\">6명<\/span>으로 한다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③지사운영위원회에서 <span class=\"b b2\">심의<\/span>한 사항은 그 결과를 상임위원회에 보고하여야 한다.<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "30", "title": "지사임원 및 고문", "topics": [6], "html": "<div class=\"ln\">①지사에는 임원으로 지사회장 <span class=\"b b1\">1명<\/span>, 지사부회장 <span class=\"b b1\">4명 이내<\/span>, 재정감독 <span class=\"b b1\">1명<\/span>을 두고 고문으로 법률고문 <span class=\"b b1\">1명<\/span>을 둔다.<span class=\"amend\">&lt;개정 2012.4.6, 2013.1.1, 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②지사회장은 상임위원회에서 선출한 후 회장의 <span class=\"b b2\">인준<\/span>을 받아야 한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">③지사회장의 임기는 <span class=\"b b1\">3년<\/span>으로 하고 다른 임원 및 고문의 임기는 <span class=\"b b1\">2년<\/span>으로 하되, 한 차례만 중임할 수 있다.<span class=\"amend\">&lt;개정 2013.1.1, 2017.4.15, 2017.6.3, 2019.4.1&gt;<\/span><\/div><div class=\"ln\">④지사회장은 각종 회의를 소집하며 그 의장이 된다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">⑤지사의 임원 및 고문은 비상근함을 원칙으로 한다.<\/div><div class=\"ln\">⑥회장은 지사회장 선출절차에 관한 세부사항을 별도로 정하여 시행할 수 있다.<span class=\"amend\">&lt;신설 2016.4.11, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "31", "title": "지사 명예직", "topics": [6], "html": "<div class=\"ln\">①지사회장은 관할 시·도지사를 명예지사회장으로, 그 관하 행정청의 장(시·군·구)을 명예지부회장으로 추대한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②지사회장은 적십자사에 경험이 있고, 사회적으로 덕망있는 인사를 지사명예고문으로 상임위원회의 <span class=\"b b2\">승인<\/span>을 얻어 위촉할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "32", "title": "운영", "topics": [6, 7], "html": "<div class=\"ln\">①지사대의원총회, 지사상임위원회, 지사운영위원회의 회의는 재적인원의 <span class=\"b b1\">과반수<\/span> 출석으로 개의하고 출석인원의 <span class=\"b b1\">과반수<\/span> 찬성으로 결의한다.<\/div><div class=\"ln\">②지사운영에 관한 기타 사항은 본사 운영위원회가 이를 운영규정으로 정한다.<\/div><div class=\"ln\">③지사 사무를 집행하기 위하여 지사에 사무국을 두고 이의 운영에 필요한 사항은 회장이 시행규칙으로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제6절 사업기관 및 자문기구"}, {"law": "정관", "type": "a", "no": "33", "title": "사업기관 등", "topics": [7], "html": "<div class=\"ln\">적십자사 사업수행에 따른 사업기관 등의 설치 및 운영에 관한 사항은 운영규정 또는 시행규칙으로 정한다.<span class=\"amend\">&lt;개정 2017.6.3. 2018.3.29&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "33의2", "title": "전문위원회", "topics": [], "html": "<div class=\"ln\">적십자사는 혈액사업, 청소년적십자사업 및 남북적십자교류사업 등의 효율적 수행을 위하여 필요시 관계인사 및 임·직원으로 전문위원회를 구성할 수 있다.<span class=\"amend\">&lt;신설 1998.4.8&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "34", "title": "자문기구", "topics": [], "html": "<div class=\"ln\">적십자사는 각종 사업을 원활히 수행하기 위하여 사업분야별로 자문위원회를 설치·운영할 수 있으며, 그 설치에 필요한 사항은 회장이 이를 시행규칙으로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "34의2", "title": "친선대사의 위촉", "topics": [], "html": "<div class=\"ln\">회장은 적십자 인도주의 이념보급 및 국내외적 홍보활동을 위하여 필요한 경우에 친선대사를 위촉할 수 있다.<span class=\"amend\">&lt;신설 1999.4.8, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제4장 회원의 종류 및 회비"}, {"law": "정관", "type": "h", "lv": 2, "text": "제1절 회원"}, {"law": "정관", "type": "a", "no": "35", "title": "자격", "topics": [5], "html": "<div class=\"ln\">①대한민국에 거주하는 사람은 성별, 국적, 종교 또는 정치적 신념과 관계없이 적십자사의 회원이 될 수 있다.<\/div><div class=\"ln\">②대한민국의 법률에 따라 설립된 법인 또는 단체는 적십자사의 회원이 될 수 있다.<span class=\"amend\">&lt;신설 2016.4.11&gt;<\/span><\/div><div class=\"ln\">③회원의 종류는 일반회원, 후원회원, 특별회원, 유공회원으로 한다.<span class=\"amend\">&lt;개정 2016.4.11&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "36", "title": "회원의 권리와 의무", "topics": [5], "html": "<div class=\"ln\">①회원은 적십자사의 임원, 중앙위원 및 전국대의원 총회의 대의원으로 선임될 수 있다.<\/div><div class=\"ln\">②회원은 적십자사에 대하여 업무수행과 관련한 의견을 대의원을 통하여 보고받거나 제의할 수 있다.<\/div><div class=\"ln\">③회원은 회비를 납부하여야 한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 2, "text": "제2절 회비"}, {"law": "정관", "type": "a", "no": "37", "title": "회비", "topics": [5], "html": "<div class=\"ln\">회원의 종류별 회비액과 모금 목표액, 수납방법, 수납시기 등은 중앙위원회에서 이를 매년 정한다.<\/div>"}, {"law": "정관", "type": "a", "no": "38", "title": "국가 및 지방자치단체의 협조", "topics": [5], "html": "<div class=\"ln\">적십자사는 법 제8조 규정에 의하여 적십자회비수납 및 업무수행에 관하여 국가 또는 지방자치단체에 협조를 요청할 수 있다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제5장 재산 및 회계"}, {"law": "정관", "type": "a", "no": "39", "title": "회계연도", "topics": [4], "html": "<div class=\"ln\">적십자사의 회계연도는 정부의 회계연도에 의한다.<\/div>"}, {"law": "정관", "type": "a", "no": "40", "title": "회계", "topics": [4, 7], "html": "<div class=\"ln\">적십자사의 회계는 일반회계와 특별회계로 구분할 수 있으며 이에 관하여는 운영위원회가 이를 운영규정으로 정한다.<\/div>"}, {"law": "정관", "type": "a", "no": "41", "title": "사업재원조성", "topics": [4], "html": "<div class=\"ln\">①적십자사의 운영 및 사업에 소요되는 경비는 회비, 국가 또는 지방자치단체의 보조금, 수익사업으로 인한 수익금, 기타 수입금으로 충당한다.<\/div><div class=\"ln\">②적십자사는 다음 각호의 수익사업을 할 수 있다.<\/div><div class=\"ln it\">1. 적십자교육·홍보 및 출판사업<span class=\"amend\">&lt;신설 1999.4.8&gt;<\/span><\/div><div class=\"ln it\">2. 자산의 임대사업<span class=\"amend\">&lt;신설 1999.4.8&gt;<\/span><\/div><div class=\"ln it\">3. 그밖에 법 제7조의 규정에 의한 사업수행에 지장이 없는 범위 안에서의 수익사업<span class=\"amend\">&lt;신설 1999.4.8, 개정 2013.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "42", "title": "국·공유재산의 무상대부", "topics": [], "html": "<div class=\"ln\">①적십자사는 사업목적 달성을 위하여 필요한 때에는 법 제23조 규정에 의거 국유재산을 무상으로 대부 요청할 수 있다.<\/div><div class=\"ln\">②삭제&lt;2002.12.2&gt;<\/div>"}, {"law": "정관", "type": "a", "no": "43", "title": "기본재산의 취득 및 처분", "topics": [2], "html": "<div class=\"ln\">적십자사가 사업목적에 필요한 토지 및 사옥의 취득, 양도, 교환 또는 담보로 제공하고자 할 때에는 <span class=\"b b1\">보건복지부장관<\/span>의 <span class=\"b b2\">인가<\/span>를 받아야 한다. 다만, <span class=\"b b1\">200평 미만<\/span>의 건물, <span class=\"b b1\">400평 미만<\/span>의 토지로서 가액이 <span class=\"b b1\">7억원 미만<\/span>의 기본재산일 경우에는 그러하지 아니하다.<span class=\"amend\">&lt;개정 2008.4.22, 2010.4.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "44", "title": "재무사무", "topics": [7], "html": "<div class=\"ln\">적십자사의 재무사무 및 그에 관련되는 사항에 대하여는 운영규정과 시행규칙으로 정한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제6장 업무 및 집행"}, {"law": "정관", "type": "a", "no": "45", "title": "업무", "topics": [10], "html": "<div class=\"ln\">적십자사는 사업목적 달성을 위하여 다음의 업무를 수행한다.<\/div><div class=\"ln it\">1. 적십자 제협약에 의한 전시포로 및 희생자 구호사업과 군의료보조기관으로서의 전상자 치료사업<\/div><div class=\"ln it\">2. 천재지변, 비상재해, 화재, 질병 등으로 재난을 당한 이재민에 대한 구호사업<\/div><div class=\"ln it\">3. 전쟁 또는 돌발사태로 인한 외국난민의 수용보호사업<\/div><div class=\"ln it\">4. 병원, 이동진료소, 응급의료정보센터운영 등의 의료사업<\/div><div class=\"ln it\">5. 국민헌혈운동추진, 혈액원운영 등 혈액사업<\/div><div class=\"ln it\">6. 응급처치법, 수상안전, 산악안전 및 환경보호 등 각종 안전사업<\/div><div class=\"ln it\">7. 보건지식, 가정보건, 언어치료, 무료진료 등 지역보건사업<\/div><div class=\"ln it\">8. 청소년적십자활동 및 교육사업<\/div><div class=\"ln it\">9. 각종 자원봉사조직운영 및 사회봉사활동<\/div><div class=\"ln it\">10. 종합봉사회관, 민·군병원봉사실 등 각종 복지시설 운영<\/div><div class=\"ln it\">11. 적십자 이념 및 국제인도법 보급<\/div><div class=\"ln it\">12. 국제적십자기구 및 자매적십자사 등과의 상호협력과 지원<\/div><div class=\"ln it\">13. 남북적십자교류사업과 남북적십자회담운영 및 이산가족 재회알선<span class=\"amend\">&lt;개정 1997.12.19&gt;<\/span><\/div><div class=\"ln it\">14. 원폭피해자․사할린동포지원사업<span class=\"amend\">&lt;신설 1999.4.8, 개정 2021.4.8&gt;<\/span><\/div><div class=\"ln it\">15. 적십자 사업수행기금을 목적으로 한 수익사업<\/div><div class=\"ln it\">16. 중앙위원회에서 <span class=\"b b2\">의결<\/span>되었거나 국가 또는 지방자치단체로부터 위임받은 사업<\/div><div class=\"ln it\">17. 그 밖에 제1호부터 제16호까지의 업무에 관련되어 필요하다고 인정되는 사업<span class=\"amend\">&lt;개정 2013.1.1&gt;<\/span><\/div>"}, {"law": "정관", "type": "a", "no": "46", "title": "집행", "topics": [10], "html": "<div class=\"ln\">제45조의 적십자사업은 적십자사 임원, 위원, 자문위원, 봉사회원, 직원, 고용원 등에 의하여 집행된다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제7장 공고의 방법"}, {"law": "정관", "type": "a", "no": "47", "title": "공고", "topics": [4], "html": "<div class=\"ln\">①법령과 정관 및 중앙위원회 <span class=\"b b2\">의결<\/span>에 따른 적십자사의 공고는 인터넷 홈페이지(www.redcross.or.kr)에 <span class=\"b b1\">14일 이상<\/span> 게시하여야 한다. 다만, 대한적십자사 회장이 필요하다고 인정하는 경우에는 전국을 대상으로 발간‧보급되는 일간신문에 게재할 수 있다.<span class=\"amend\">&lt;개정 2024.1.1.&gt;<\/span><\/div><div class=\"ln\">②적십자사는 연간 기부금 모금액 및 활용실적을 매년 사업연도 종료일로부터 <span class=\"b b1\">4개월 이내<\/span>에 인터넷 홈페이지에 공개하여야 한다.<span class=\"amend\">&lt;신설 2024.1.1.&gt;<\/span><\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제8장 정관의 변경"}, {"law": "정관", "type": "a", "no": "48", "title": "정관의 변경", "topics": [1], "html": "<div class=\"ln\">적십자사의 정관을 변경하고자 할 때에는 중앙위원 <span class=\"b b1\">과반수<\/span>의 출석과 출석위원 <span class=\"b b1\">3분의 2<\/span> 이상의 찬성으로 중앙위원회의 <span class=\"b b2\">의결<\/span>을 거쳐야 한다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제9장 적십자표장"}, {"law": "정관", "type": "a", "no": "49", "title": "적십자표장", "topics": [10, 7], "html": "<div class=\"ln\">적십자표장 사용은 <span class=\"b b1\">1991년<\/span> 11월 국제적십자대표자회의에서 채택된 “적십자표장 사용규칙”에 따른다.<\/div>"}, {"law": "정관", "type": "h", "lv": 1, "text": "제10장 해산 [본장신설 2024.1.1]"}, {"law": "정관", "type": "a", "no": "50", "title": "해산", "topics": [1, 9], "html": "<div class=\"ln\">①적십자사는 다음의 이유로 해산한다.<\/div><div class=\"ln it\">1. 「대한적십자사 조직법」이 폐지되었을 때<\/div><div class=\"ln it\">2. 제네바협약과 국제적십자운동기본원칙에 따라 사업을 수행할 수 없을 때<\/div><div class=\"ln\">②적십자사의 해산은 중앙위원회 <span class=\"b b2\">의결<\/span>과 전국대의원총회의 <span class=\"b b2\">승인<\/span>을 거쳐야 한다.<\/div><div class=\"ln\">③적십자사를 해산하는 경우 채무를 변제하고도 잔여재산이 있을 때에 그 재산은 중앙위원회의 <span class=\"b b2\">의결<\/span>을 거쳐 <span class=\"b b1\">보건복지부장관<\/span>의 <span class=\"b b2\">인가<\/span>를 받아 국가 또는 지방자치단체에 귀속하거나, 유사한 설립목적을 가진 공익법인에 기부할 수 있다.<\/div><div class=\"ln\">④해산 및 잔여재산의 처분에 관한 <span class=\"b b2\">의결<\/span> 또는 <span class=\"b b2\">승인<\/span>은 재적위원 또는 재적대의원 <span class=\"b b1\">3분의 2<\/span> 이상의 출석으로 개의하고, 출석위원 또는 출석대의원 <span class=\"b b1\">4분의 3<\/span> 이상의 찬성으로 <span class=\"b b2\">의결<\/span> 또는 <span class=\"b b2\">승인<\/span>하여야 한다.<\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제1장 총칙"}, {"law": "운영규정", "type": "a", "no": "1", "title": "목적", "topics": [11], "html": "<div class=\"ln\">본 운영규정은 대한적십자사직원(이하 “직원”이라 한다)에 적용할 인사행정의 기준을 확립하여 그 공정한 운영을 기함과 동시에 직원으로 하여금 사 전체의 봉사자로서 최대의 능률을 발휘하게 함을 목적으로 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "2", "title": "적용범위", "topics": [11], "html": "<div class=\"ln\">본 운영규정은 본사 및 지사의 각 위원과 임원에게 적용하지 아니한다. 다만 제10조의4의 규정에 의한 계약직원에게는 달리 정하지 아니하는 한 본 운영규정을 준용한다.<span class=\"amend\">&lt;개정 1995.1.1, 2002.11.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "3", "title": "직원의 분류", "topics": [11], "html": "<div class=\"ln\">직원의 직렬과 직종의 구분은 별표 제1호와 같이 한다. <span class=\"amend\">&lt;개정 1994.1.7. 2002.11.1, 2009.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "5", "title": "정의", "topics": [11], "html": "<div class=\"ln\">본 운영규정에서 사용되는 용어의 정의는 다음과 같다.<\/div><div class=\"ln it\">1. “직위”란 <span class=\"b b1\">1인<\/span>의 직원에 부여할 수 있는 직무와 책임을 말한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">2. “보직”이란 직원에게 직위를 부여함을 말한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">3. “강임”이란 동일한 직종 내에서 하위의 계급에 <span class=\"b b2\">임명<\/span>하는 것을 말한다.<span class=\"amend\">&lt;개정 2002.11.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">4. “전보”란 동일한 직종 및 계급 내에서 직무의 책임도가 유사한 보직으로의 변경을 말한다.<span class=\"amend\">&lt;개정 2002.11.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">5. “임용”이란 신규채용, 승진, 전직, 전보, 겸임, 파견, 강임, 휴직, 직위해제, 정직, 강등, 복직, 면직, 해임 및 파면을 말한다.<span class=\"amend\">&lt;개정 2002.11.1, 2015.1.1., 2017.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">7. “전직”이란 직종을 달리하는 <span class=\"b b2\">임명<\/span>을 말한다.<span class=\"amend\">&lt;개정 1994.1.7. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">8. “복직”이란 휴직, 직위해제 및 정직 중이거나 강등으로 직무에 종사하지 못하는 직원을 직위에 복귀시키는 것을 말한다.<span class=\"amend\">&lt;개정 1996.4.1., 2015.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">9. “퇴직”이란 본 운영규정 제20조의 규정에 의한 결격사유의 발생 또는 정년에 의하여 면직되거나 직원의 원에 의하는 경우 기타 이직하는 것을 말한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">10. “직렬”이란 직무의 성질이 유사하고 그 책임과 곤란성의 정도가 상이한 직종의 군을 말한다.<span class=\"amend\">&lt;신설 2002.11.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">11. “직종”이란 동일한 직렬 내에서의 담당분야가 동일 또는 유사한 직무의 군을 말한다.<span class=\"amend\">&lt;신설 2002.11.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">12. “<span class=\"b b1\">기관장<\/span>”이란 각 지사회장, 의료원장, 본사 직할<span class=\"b b1\">기관장<\/span> 및 혈액관리본부장을 말한다.<span class=\"amend\">&lt;개정 2002.4.1, 2005.4.1, 2010.9.1., 2021.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">13. “<span class=\"b b1\">소속기관장<\/span>”이란 지사 및 혈액관리본부 소속기관의 장, 병원장을 말한다.<span class=\"amend\">&lt;개정 2002.4.1, 2005.4.1., 2021.7.1 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">14. “계약직원”이란 계약형태와 관계없이 기간의 정함이 있는 직원을 말한다.<span class=\"amend\">&lt;신설 2007.11.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">15. “무기계약직원”이란 계약직원으로 <span class=\"b b1\">2년<\/span>을 초과 근무하여 「기간제 및 단시간근로자 보호 등에 관한 법률」의 규정에 의거하여 기간의 정함이 없는 근로자로 간주되어 임용절차를 거쳐 임용된 직원 또는 무기계약직원 신규채용(전환채용 포함) 절차를 거쳐 임용된 직원을 말한다.<span class=\"amend\">&lt;신설 2007.11.1 개정 2022.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">16. “시간선택제직원”이란 주 <span class=\"b b1\">40시간<\/span>, <span class=\"b b1\">1일<\/span> <span class=\"b b1\">8시간<\/span>인 통상근로자의 근무시간보다 짧게 근무하는 직원을 말한다.<span class=\"amend\">&lt;신설 2014.4.1. 개정 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">17. “채용형 인턴직원”이란 공개경쟁을 거쳐 선발되어 일정기간 근무 후 평가를 통해 정규직 직원으로 전환할 수 있는 인턴직원을 말한다.<span class=\"amend\">&lt;신설 2014.4.1. 개정 2025.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "6", "title": "보고와 감사", "topics": [11], "html": "<div class=\"ln\">본 운영규정의 공정한 운영을 위하여 <span class=\"b b1\">사무총장<\/span>은 관하 각 기관에 대하여 인사에 관한 기록의 보고를 받을 수 있으며 사무감사를 행할 수 있다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "7", "title": "인사위원회", "topics": [11], "html": "<div class=\"ln\">직원 및 고용원의 효율적인 인사관리와 고충심사 처리를 위하여 각 기관 및 소속기관에 인사위원회를 구성하며 이 운영에 대한 사항은 <span class=\"b b1\">회장<\/span>이 시행규칙으로 이를 따로 정한다.<span class=\"amend\">&lt;개정 2002.4.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "7의2", "title": "인사처리", "topics": [11], "html": "<div class=\"ln\">인사사무처리에 대한 세부사항은 <span class=\"b b1\">회장<\/span>이 시행규칙으로 따로 정한다.<span class=\"amend\">&lt;개정 2017.6.3., 2025.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "h", "lv": 1, "text": "제2장 전형과 고시"}, {"law": "운영규정", "type": "a", "no": "8", "title": "임용의 원칙", "topics": [12], "html": "<div class=\"ln\">직원의 임용은 <span class=\"b b1\">임용권자<\/span>가 전형성적 또는 고시성적, 근무성적, 기타 능력의 실증에 의하여 행한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "9", "title": "결원보충", "topics": [12], "html": "<div class=\"ln\"><span class=\"b b1\">임용권자<\/span> 및 임용<span class=\"b b2\">제청<\/span>권자는 해당 기관의 결원을 신규채용, 승진, 강임 또는 전보의 방법에 의하여 보충 실시한다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10", "title": "신규채용", "topics": [12], "html": "<div class=\"ln\">①직원의 채용은 공개경쟁에 의한 서류심사 및 면접시험에 의하되 직종에 따라 직무능력검사, 필기시험 또는 실기시험 등 필요한 평가를 추가할 수 있다.<span class=\"amend\">&lt;개정 2002.11.1&gt;<\/span><\/div><div class=\"ln\">③ 다만, 법령 등에 규정된 경우 특별채용 할 수 있다.<span class=\"amend\">&lt;신설 2024.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의2", "title": "전직", "topics": [12], "html": "<div class=\"ln\">①직원을 전직임용하고자 할 때에는 전직시험을 거쳐야 하며 전직시험은 서류심사, 필기시험 및 면접시험에 의하되 필요에 따라 실기시험 등을 추가 할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 직원은 시험의 일부 또는 전부를 면제할 수 있다. <span class=\"amend\">&lt;개정 1994.1.7, 2002.11.1., 2017.1.1., 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 기술직원, 기능직원, 고용원으로 재직 중 간호사, 의료기사 면허증을 취득한 자를 해당 직종에 전직임용코자 할 때<span class=\"amend\">&lt;신설 2002.11.1&gt;<\/span><\/div><div class=\"ln\">②전직임용과 관련된 세부절차는 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;신설 2002.11.1, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의3", "title": "연령제한", "topics": [12], "html": "<div class=\"ln\">①직원의 채용연령은 원칙적으로 제한할 수 없다. 다만, 인력수급 상황 및 직무의 성격에 비추어 연령제한이 불가피한 경우 <span class=\"b b1\">회장<\/span>은 채용연령을 제한할 수 있으며, 이를 위해 필요한 사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2000.10.23, 2009.4.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의4", "title": "계약직원", "topics": [12], "html": "<div class=\"ln\">①<span class=\"b b1\">기관장<\/span>과 <span class=\"b b1\">소속기관장<\/span>은 예산과 정원의 범위 내에서 채용계약에 의하여 계약직원을 채용할 수 있다.<span class=\"amend\">&lt;신설 1995.1.1&gt;<\/span><\/div><div class=\"ln\">②계약직원의 채용기간은 <span class=\"b b1\">2년 이내<\/span>로 하며 제56조에 규정을 적용받지 않는다. 다만, 「기간제 및 단시간근로자 보호 등에 관한 법률」 제4조제1항 각 호의 어느 하나에 해당하는 경우에는 기간을 연장하여 사용할 수 있다.<span class=\"amend\">&lt;개정 1996.4.1, 2007.11.1., 2019.1.1., 2025.1.1&gt;<\/span><\/div><div class=\"ln\">③일반·특정직·전문직 팀(과)장급 이상 직원을 계약직으로 채용할 때에는 <span class=\"b b1\">회장<\/span>의 <span class=\"b b2\">승인<\/span>을 받아야 한다. 다만, 특정직 및 전문직 중 약무직 채용에 필요한 사항은 <span class=\"b b1\">회장<\/span>이 따로 정한다.<span class=\"amend\">&lt;개정 2003.4.1, 2004.4.1, 2005.4.1, 2006.1.1, 2008.7.1. 2010.9.1, 2017.6.3., 2019.1.1., 2024.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의5", "title": "개방형 직위", "topics": [12], "html": "<div class=\"ln\">①<span class=\"b b1\">회장<\/span>은 본사 및 혈액관리본부, 의료원의 특정 업무에 대하여는 이를 개방형 직위로 정하여 내부 직원이나 또는 외부에서 적격자를 임용할 수 있다. 다만, 개방형 직위 임용자는 본사 전체 부서장 중 2직위와 팀장 중 3직위를 초과할 수 없고, 혈액관리본부는 혈액관리본부장 직위와 부서장 1직위를 개방형직위로 하며, 의료원은 의료원장 직위와 팀장 1직위를 개방형직위로 할 수 있다.<span class=\"amend\">&lt;신설 2004.4.1, 개정 2005.4.1, 2008.7.1, 2010.9.1, 2011.12.1, 2012.12.1, 2017.6.3, 2019.1.1., 2021.7.1., 2024.1.1&gt;<\/span><\/div><div class=\"ln\">②제1항의 규정에 의한 개방형 직위에 대하여는 직위별로 직무의 내용·특성 등을 고려하여 직무수행요건을 설정하고 그 요건을 갖춘 자를 임용하여야 한다.<span class=\"amend\">&lt;신설 2004.4.1&gt;<\/span><\/div><div class=\"ln\">③개방형직위에 의해 임용되는 자가 외부전문가일 경우 이를 계약직원으로 하며, 개방형 계약직원의 임용기간은 제10조의4 제2항의 규정에도 불구하고 별도 규칙에서 정한 바에 따른다.<span class=\"amend\">&lt;신설 2004.4.1&gt;<\/span><\/div><div class=\"ln\">④개방형직위의 운영 등에 관하여 필요한 사항은 <span class=\"b b1\">회장<\/span>이 별도로 정한다.<span class=\"amend\">&lt;신설 2004.4.1, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의6", "title": "무기계약직원", "topics": [12], "html": "<div class=\"ln\">①<span class=\"b b1\">기관장<\/span>과 <span class=\"b b1\">소속기관장<\/span>은 계약직원으로 <span class=\"b b1\">2년<\/span>을 초과 근무하여 「기간제 및 단시간근로자 보호 등에 관한 법률」의 규정에 의거하여 기간의 정함이 없는 근로자로 간주되는 계약직원을 무기계약직원으로 임용할 수 있다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln\">②무기계약직원의 임용절차 및 자격 등에 관하여 필요한 사항은 <span class=\"b b1\">회장<\/span>이 별도로 정한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2007.11.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의7", "title": "시간선택제직원", "topics": [12], "html": "<div class=\"ln\"><span class=\"b b1\">기관장<\/span>과 <span class=\"b b1\">소속기관장<\/span>은 유연근무의 일환으로 필요할 경우 전일제 정규직원을 시간선택제직원으로 전환하거나 시간선택제직원을 신규채용할 수 있다.<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2014.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "10의8", "title": "경력직원", "topics": [12], "html": "<div class=\"ln\"><span class=\"b b1\">회장<\/span>은 다음 각 호의 경력직원을 <span class=\"b b1\">3급<\/span> 내지 <span class=\"b b1\">6급<\/span>으로 채용할 수 있다.<\/div><div class=\"ln it\">1. 「기간제 및 단시간근로자 보호 등에 관한 법률 시행령」 별표 2에서 정한 전문자격 소지자<\/div><div class=\"ln it\">2. 해당분야 박사학위 소지자<\/div><div class=\"ln it\">3. 해당분야 경력이 있는 자<\/div><div class=\"ln\"><span class=\"amend\">[본조신설 2019.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "11", "title": "승진", "topics": [13], "html": "<div class=\"ln\">①승진임용은 근무성적평정, 경력평정 기타 능력의 실증에 의한다. 다만, <span class=\"b b1\">1급<\/span> 내지 <span class=\"b b1\">3급<\/span> 직원에의 승진임용에 있어서는 능력과 경력 등을 고려하여 임용하며, <span class=\"b b1\">4급<\/span>직원에의 승진임용은 승진고시를 거쳐야 하며, <span class=\"b b1\">5급이하<\/span> 직원의 승진임용에 있어서는 필요하다고 인정할 때에는 승진고시를 병용할 수 있다.<span class=\"amend\">&lt;개정 1994.1.7&gt;<\/span><\/div><div class=\"ln\">②<span class=\"b b1\">5급<\/span>직원으로서 해당 계급에 <span class=\"b b1\">15년이상<\/span> 근무하고 근무성적이 우수한 자는 승진고시 또는 전형을 거치지 아니하고 <span class=\"b b1\">4급<\/span>으로 근속승진하게 할 수 있다. 다만, 이 경우 그 다음 계급으로만 승진할 수 있다.<span class=\"amend\">&lt;개정 2022.4.1., 2023.1.1., 2025.1.1&gt;<\/span><\/div><div class=\"ln\">④<span class=\"b b1\">회장<\/span>은 사 발전에 지대한 공로가 있는 직원에 대하여 특별승진하게 할 수 있다.<span class=\"amend\">&lt;신설 2005.4.1, 개정 2017.6.3., 2023.1.1.&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "11의2", "title": "승진소요 최저연수", "topics": [13], "html": "<div class=\"ln\">①직원이 승진함에 있어서는 다음 각 호의 기간을 해당 계급에 재직하여야 한다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. <span class=\"b b1\">2급<\/span>: <span class=\"b b1\">3년이상<\/span><span class=\"amend\">&lt;개정 1998.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 3∼<span class=\"b b1\">4급<\/span>: <span class=\"b b1\">5년이상<\/span><span class=\"amend\">&lt;개정 1998.4.1, 2010.9.1, 2018.1.1&gt;<\/span><\/div><div class=\"ln it\">3. <span class=\"b b1\">5급<\/span>: <span class=\"b b1\">4년이상<\/span><span class=\"amend\">&lt;신설 2018.1.1&gt;<\/span><\/div><div class=\"ln it\">4. <span class=\"b b1\">6급<\/span>: <span class=\"b b1\">3년이상<\/span><span class=\"amend\">&lt;개정 2010.9.1, 2013.4.1, 2018.1.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">5. <span class=\"b b1\">7급<\/span>: <span class=\"b b1\">1년이상<\/span><span class=\"amend\">&lt;개정 1994.1.7, 2010.9.1, 2018.1.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">6. 기술직원(기술<span class=\"b b1\">2급<\/span>): <span class=\"b b1\">6년이상<\/span><span class=\"amend\">&lt;신설 1995.1.1, 개정 2015.1.1, 2018.1.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln it\">7. 기술직원(기술<span class=\"b b1\">3급<\/span>): <span class=\"b b1\">1년이상<\/span><span class=\"amend\">&lt;신설 2015.1.1, 개정 2018.1.1, 2022.1.1&gt;<\/span><\/div><div class=\"ln\">②제1항의 기간에는 휴직, 직위해제, 징계 처분기간 및 제12조의 규정에 의한 승진 임용의 제한기간을 포함하지 아니한다. 다만, 업무상 질병 또는 부상으로 인한 휴직, 법률의 규정에 의한 의무 수행을 위한 휴직 및「직원 운영규정」제54조 제7호 가목에 따른 육아휴직(자녀 <span class=\"b b1\">1명<\/span>에 대한 총 육아휴직 기간이 <span class=\"b b1\">1년<\/span>을 넘는 경우에는 최초 <span class=\"b b1\">1년<\/span>을 포함하고, 셋째 자녀부터는 전체 육아휴직 기간을 포함) 및 나목에 따른 육아휴직, 가족돌봄휴직, 제53조 제2항 제1호에 따른 휴직은 그 휴직기간을 승진소요 최저연수에 포함한다.<span class=\"amend\">&lt;개정 1996.4.1, 2012.8.20, 2013.4.1., 2018.1.1., 2025.1.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">③강임 또는 강등된 자가 원계급으로 다시 승진된 경우에는 강임 또는 강등 전의 기간을 승진소요 최저연수에 산입한다.<span class=\"amend\">&lt;2015.1.1., 2025.4.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "12", "title": "승진제한", "topics": [13], "html": "<div class=\"ln\">①징계<span class=\"b b2\">의결<\/span>요구, 징계처분, 직위해제, 휴직기간 중이거나 징계처분에 따른 승진제한기간이 경과하지 않은 직원은 승진할 수 없다. 다만, 육아휴직, 가족돌봄휴직, 제53조 제2항 제1호에 따른 휴직중인 직원은 제외한다.<span class=\"amend\">&lt;신설 1998.4.1, 개정 2002.11.1, 2009.1.1, 2012.8.20, 2018.1.1&gt;<\/span><\/div><div class=\"ln\">②징계처분을 받은 직원은 징계처분의 집행이 종료된 날로부터 다음의 기간(금품 및 향응수수, 공금의 횡령‧유용, 「성폭력범죄의 처벌등에 관한 특례법」에 따른 성폭력범죄, 「성매매알선등 행위의 처벌에 관한 법률」에 따른 성매매, 「양성평등기본법」에 따른 성희롱, 채용비위,「임직원 행동강령 및 행위기준」 제23조에 의한 부당행위로 인한 징계처분의 경우에는 각각 <span class=\"b b1\">6개월<\/span>을 가산한 기간) 동안 승진 및 호봉 승급을 할 수 없다. 다만, 「직원 운영규정」 제65조의2의 규정에 의거한 징계 등 처분기록이 말소된 경우에는 다음의 기간을 승진 및 승급기간에 각각 산입(가산기간 포함)한다.<span class=\"amend\">&lt;개정 2000.1.18, 2008.4.1, 2015.1.1, 2018.4.1, 2020.1.1, 2020.6.1., 2022.1.1., 2025.1.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln\">강등 <span class=\"b b1\">18개월<\/span>   정직 <span class=\"b b1\">18개월<\/span>   감봉 <span class=\"b b1\">12개월<\/span>   견책 <span class=\"b b1\">6개월<\/span><\/div><div class=\"ln\">③직위해제처분을 받은 자가 직위해제 처분 또는 직위해제처분의 사유가 된 사건이 제65조의2 제3항에 따라 처분기록이 말소된 경우에는 해당 직위해제 기간을 승진 및 승급기간에 각각 산입한다.<span class=\"amend\">&lt;신설 2023.4.1.&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "13", "title": "고시실시의 원칙", "topics": [12], "html": "<div class=\"ln\">직원의 임용을 위한 고시는 공고에 의한 일반공개로 하고 각 계급 및 직무의 종류별로 구분하여 실시함을 원칙으로 한다.<\/div>"}, {"law": "운영규정", "type": "a", "no": "14", "title": "고시의 방법", "topics": [12], "html": "<div class=\"ln\">①고시는 필기시험, 실기시험, 면접, 서류심사 및 신체검사의 방법으로 하며 그 시행에 관한 사항은 <span class=\"b b1\">회장<\/span>이 시행규칙으로 따로 정한다.<span class=\"amend\">&lt;개정 1993.1.1., 2017.6.3., 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "15", "title": "전형ㆍ고시위원", "topics": [12], "html": "<div class=\"ln\">전형 또는 고시에 관한 면접, 출제, 채점 기타 필요한 사항을 담당하게 하기 위하여 다음과 같이 전형, 고시위원을 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한다.<\/div><div class=\"ln it\">1. 일반직 <span class=\"b b1\">2급 이상<\/span> 직원 및 부장급 이상 특정·전문직원은 <span class=\"b b1\">사무총장<\/span>이 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한 자<span class=\"amend\">&lt;개정 1997.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 일반직 <span class=\"b b1\">3급<\/span> 내지 <span class=\"b b1\">7급<\/span> 직원 및 팀(과)장급 특정·전문직원은 해당 <span class=\"b b1\">기관장<\/span>이 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한 자. 다만, <span class=\"b b1\">4급<\/span> 승진전형고시의 필기시험 출제 및 채점위원과 본사직원은 <span class=\"b b1\">사무총장<\/span>이 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한 자<span class=\"amend\">&lt;개정 1997.4.1., 2010.9.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">3. 팀(과)장급 미만 특정·전문직원과 기술직원 및 기능직원은 <span class=\"b b1\">소속기관장<\/span>이 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한 자. 다만, 본사는 <span class=\"b b1\">사무총장<\/span>, 지사 및 직할기관은 <span class=\"b b1\">기관장<\/span>이 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>한 자<span class=\"amend\">&lt;개정 1998.4.1, 2010.9.1&gt;<\/span><\/div><div class=\"ln it\">4. 직원신규채용 시 문제출제는 외부전문가 <span class=\"b b2\">위촉<\/span> 또는 전문업체에 위탁하여 행함을 원칙으로 하며, 면접위원 <span class=\"b b2\">임명<\/span> 또는 <span class=\"b b2\">위촉<\/span>은 외부위원을 포함한다. <span class=\"amend\">&lt;개정 2015.1.1, 2020.6.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "16", "title": "합격자 결정", "topics": [12], "html": "<div class=\"ln\">합격자 결정은 최고득점자 순으로 한다. 다만, 매과목 <span class=\"b b1\">40%<\/span> 전과목 평균 <span class=\"b b1\">60% 미만<\/span>의 득점자는 합격되지 못한다.<span class=\"amend\">&lt;개정 1995.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "18", "title": "임용권자", "topics": [11], "html": "<div class=\"ln\">직원의 임용은 <span class=\"b b1\">회장<\/span>이 다음 구분에 의하여 행한다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">[본조개정 1994.1.7] (단서 삭제)<\/div><div class=\"ln it\">2. 본사 부서장 및 직할<span class=\"b b1\">기관장<\/span>, 혈액관리본부장 및 혈액관리본부 실·국장, 지사 사무처장, 의료원장, 병원사업본부장, 병원관리부원장, <span class=\"b b1\">소속기관장<\/span>(혈액원 부원장 포함), 그 외 <span class=\"b b1\">1급<\/span> 직원은 <span class=\"b b1\">사무총장<\/span>의 <span class=\"b b2\">제청<\/span>으로 <span class=\"b b1\">회장<\/span>이 임용한다. 다만, 해당 <span class=\"b b1\">기관장<\/span>은 <span class=\"b b1\">사무총장<\/span>에게 임용대상자를 <span class=\"b b2\">추천<\/span>할 수 있으며, 병원장은 의료원장의 <span class=\"b b2\">제청<\/span>으로 <span class=\"b b1\">회장<\/span>이 임용한다.<span class=\"amend\">&lt;개정 2001.10.23, 2004.11.1, 2005.4.1, 2006.1.1, 2006.4.1., 2008.10.10, 2015.4.1, 2016.1.1, 2017.6.3., 2021.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">3. <span class=\"b b1\">회장<\/span>이 임용권의 일부를 <span class=\"b b1\">사무총장<\/span>, <span class=\"b b1\">기관장<\/span> 및 <span class=\"b b1\">소속기관장<\/span>에게 위임할 수 있다.<span class=\"amend\">&lt;개정 2005.4.1, 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "18의2", "title": "임용권위임", "topics": [11], "html": "<div class=\"ln\">①<span class=\"b b1\">회장<\/span>은 제18조 제3호에 의거하여 임용권의 일부를 다음 각 호와 같이 위임한다.<span class=\"amend\">&lt;신설 1998.4.1, 개정 2000.1.18, 2017.6.3&gt;<\/span><\/div><div class=\"ln it\">1. 기관장급(<span class=\"b b1\">소속기관장<\/span> 포함)을 제외한 일반·전문직 <span class=\"b b1\">2급<\/span> 내지 <span class=\"b b1\">3급<\/span>직원의 임용권은 <span class=\"b b1\">사무총장<\/span>이 행사하며 혈액관리본부 및 혈액관리본부 소속기관은 혈액관리본부장의 <span class=\"b b2\">제청<\/span>으로 <span class=\"b b1\">사무총장<\/span>이 행사하며, 의료원 및 각 병원은 의료원장의 <span class=\"b b2\">제청<\/span>으로 <span class=\"b b1\">사무총장<\/span>이 행사한다. 다만 기관내 전보권은 해당 <span class=\"b b1\">기관장<\/span>(본사의 경우 <span class=\"b b1\">사무총장<\/span>)이 행사한다.<span class=\"amend\">&lt;개정 2006.4.1, 2016.1.1., 2021.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 특정직원, <span class=\"b b1\">4급 이하<\/span> 일반직원 및 전문직원, 기술직원, 기능직원, 고용원에 대한 임용권은 해당 <span class=\"b b1\">기관장<\/span>(본사는 <span class=\"b b1\">사무총장<\/span>)이 행사한다.<span class=\"amend\">&lt;개정 2002.4.1, 2005.4.1, 2006.4.1, 2008.7.1, 2010.9.1., 2016.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">3. 제1호 및 제2호의 규정에도 불구하고 혈액관리본부장 및 의료원장은 일반직 <span class=\"b b1\">2급<\/span> 내지 <span class=\"b b1\">4급<\/span> 팀장급 직원의 기관내 전보는 사전에 <span class=\"b b1\">사무총장<\/span>과 <span class=\"b b2\">협의<\/span>하여야 한다.<span class=\"amend\">&lt;개정 2002.4.1, 2005.4.1, 2006.4.1, 2008.7.1, 2010.9.1, 2016.1.1, 2021.7.1&gt;<\/span><\/div><div class=\"ln it\">4. 제2호의 규정에도 불구하고 혈액관리본부 소속기관, 의료원 소속기관 팀장급 미만 <span class=\"b b1\">4급 이하<\/span> 일반직원의 소속기관내 전보권과 팀장급 미만 <span class=\"b b1\">4급 이하<\/span> 전문직원, 팀장급 미만 특정직원, 기술직원, 기능직원, 고용원의 임용권은 <span class=\"b b1\">소속기관장<\/span>이 행사한다.<span class=\"amend\">&lt;개정 2006.1.1, 2016.1.1, 2021.7.1&gt;<\/span><\/div><div class=\"ln it\">5. 제2호의 규정에도 불구하고 <span class=\"b b1\">4급<\/span> 일반직원의 책임보직으로의 임용은 <span class=\"b b1\">사무총장<\/span>이 행사하되, 해당 <span class=\"b b1\">기관장<\/span>은 <span class=\"b b1\">사무총장<\/span>에게 임용대상자를 <span class=\"b b2\">추천<\/span>할 수 있으며, 혈액관리본부 및 혈액관리본부 소속기관, 의료원 및 의료원 소속기관 <span class=\"b b1\">4급<\/span> 전문직원의 책임보직으로의 임용은 혈액관리본부장 및 의료원장이 행사하되, <span class=\"b b1\">소속기관장<\/span>은 혈액관리본부장 및 의료원장에게 임용대상자를 <span class=\"b b2\">추천<\/span>할 수 있다.<span class=\"amend\">&lt;개정 2002.1.1, 2002.4.1, 2005.4.1, 2008.7.1, 2010.9.1, 2016.1.1., 2021.7.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">6. 제18조제2호 및 제18조의2 제1호 내지 제4호의 규정에도 불구하고 해당직원의 정기승급에 대한 발령은 다음과 같이 시행한다.<span class=\"amend\">&lt;개정 2002.4.1, 2005.4.1, 2006.1.1, 2008.7.1, 2010.9.1, 2016.1.1&gt;<\/span><\/div><div class=\"ln it2\">가. <span class=\"b b1\">사무총장<\/span>: 혈액관리본부장, 의료원장, 직할<span class=\"b b1\">기관장<\/span>, 본사 직원 및 본사 파견직원<span class=\"amend\">&lt;개정 2021.7.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln it2\">나. 지사회장: 해당 기관 직원<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">다. 의료원장: 해당 기관 <span class=\"b b1\">소속기관장<\/span> 및 직원<span class=\"amend\">&lt;개정 2021.7.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">라. 의료원 <span class=\"b b1\">소속기관장<\/span>: 해당 소속기관 직원<span class=\"amend\">&lt;신설 2021.7.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">마. 혈액관리본부장: 해당 기관 <span class=\"b b1\">소속기관장<\/span> 및 직원과 혈액관리본부 파견직원<span class=\"amend\">&lt;개정 2025.1.1., 2026.1.1.&gt;<\/span><\/div><div class=\"ln it2\">바. 혈액관리본부 <span class=\"b b1\">소속기관장<\/span>: 해당 소속기관 직원<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">사. 인재개발원장: 해당 기관 직원<span class=\"amend\">&lt;개정 2023.1.1. 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">7. 제2호 내지 제5호의 규정에도 불구하고 정원의 조정, 순환보직 또는 기관간의 상호 인사교류등 인사운영상 필요한 경우에는 <span class=\"b b1\">사무총장<\/span>이 임용권을 행사한다. 다만, 필요시 해당 <span class=\"b b1\">기관장<\/span>간 합의를 거쳐 전보를 요청한 <span class=\"b b1\">기관장<\/span>이 해당직원의 기관간 전보권을 행사할 수 있다.<span class=\"amend\">&lt;개정 2006.1.1., 2016.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln it\">8. <span class=\"b b1\">회장<\/span>은 제18조제3호의 위임규정에도 불구하고 그 임용내용이 위법하거나 현저히 부당하다고 인정될 때에는 그 시정을 지시할 수 있다.<span class=\"amend\">&lt;개정 2017.6.3&gt;<\/span><\/div><div class=\"ln\">②<span class=\"b b1\">회장<\/span>은 제1항의 위임규정에도 불구하고 기관간의 인사교류 등 인사운영상 필요한 경우에는 임용권을 전행할 수 있다.<span class=\"amend\">&lt;신설 2000.1.18, 개정 2017.6.3&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "18의3", "title": "별정직", "topics": [11], "html": "<div class=\"ln\">별정직원은 <span class=\"b b1\">회장<\/span> 취임 후 <span class=\"b b1\">1개월 이내<\/span>에 재신임을 득하지 못하면 퇴임하여야 한다.<span class=\"amend\">&lt;개정 1998.4.1., 2017.6.3., 2025.1.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "19", "title": "경력산출", "topics": [11], "html": "<div class=\"ln\">①본 운영규정 제10조, 제10조의8 제3호, 제18조 및 제18조의2에 의해 신규임용된 자는 별표 제3호 내지 제5호의 기준에 해당하는 자격 또는 경력을 가진 자라야 한다.<span class=\"amend\">&lt;개정 2002.11.1, 2011.12.1, 2019.1.1&gt;<\/span><\/div><div class=\"ln\">②전항의 경력산출기준은 별표 제6호와 같다.<span class=\"amend\">&lt;개정 2002.11.1&gt;<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "20", "title": "결격사유", "topics": [13], "html": "<div class=\"ln\">다음 각 호의 어느 하나에 해당하는 자는 직원에 임용될 수 없다.<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">1. 피성년후견인과 피한정후견인<span class=\"amend\">&lt;개정 2015.4.1&gt;<\/span><\/div><div class=\"ln it\">2. 파산자로서 복권되지 아니한 자<\/div><div class=\"ln it\">3. 금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 <span class=\"b b1\">5년<\/span>이 지나지 아니한 자<span class=\"amend\">&lt;개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">4. 금고이상의 형을 받고 그 집행유예의 기간이 완료된 날로부터 <span class=\"b b1\">2년<\/span>을 경과하지 아니한 자<\/div><div class=\"ln it\">5. 금고이상의 형의 선고유예를 받은 경우에 그 선고유예기간중에 있는 자<\/div><div class=\"ln it\">6. 법원의 판결 또는 다른 법률에 의하여 자격이 상실 또는 정지된 자<\/div><div class=\"ln it\">7. 징계에 의하여 파면의 처분을 받은 때로부터 <span class=\"b b1\">5년<\/span>을 경과하지 아니한 자<\/div><div class=\"ln it\">8. 징계에 의하여 해임의 처분을 받은 때로부터 <span class=\"b b1\">3년<\/span>을 경과하지 아니한 자<\/div><div class=\"ln it\">9. ｢부패방지 및 국민권익위원회의 설치와 운영에 관한 법률｣ 제82조에 따른 비위 면직자 등의 취업제한 적용을 받는 자<span class=\"amend\">&lt;신설 2018.1.1&gt;<\/span><\/div><div class=\"ln it\">10. 공공기관에서 채용비위로 면직 또는 채용취소된 때부터 <span class=\"b b1\">5년<\/span>이 지나지 아니한 자<span class=\"amend\">&lt;신설 2019.1.1, 개정 2020.4.1&gt;<\/span><\/div><div class=\"ln it\">11. 다음 각 목의 어느 하나에 해당하는 죄를 범한 사람으로서 <span class=\"b b1\">100만원 이상<\/span>의 벌금형을 선고받고 그 형이 확정된 후 <span class=\"b b1\">3년<\/span>이 지나지 아니한 자<span class=\"amend\">&lt;신설 2019.4.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">가. 「성폭력범죄의 처벌 등에 관한 특례법」 제2조에 따른 성폭력범죄<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">나. 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제74조제1항제2호 및 제3호에 규정된 죄<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">다. 「스토킹범죄의 처벌 등에 관한 법률」 제2조제2호에 따른 스토킹범죄<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln it\">12. 미성년자에 대한 다음 각 목의 어느 하나에 해당되는 죄를 저질러 파면․해임되거나 형 또는 치료감호를 선고받아 그 형 또는 치료감호가 확정된 자(집행유예를 선고받은 후 그 집행유예기간이 경과한 자를 포함한다) <span class=\"amend\">&lt;신설 2020.6.1. 개정 2025.1.1&gt;<\/span><\/div><div class=\"ln it2\">가. 「성폭력범죄의 처벌 등에 관한 특례법」제2조에 따른 성폭력범죄 <span class=\"amend\">&lt;신설 2020.6.1&gt;<\/span><\/div><div class=\"ln it2\">나. 「아동․청소년의 성보호에 관한 법률」제2조제2호에 따른 아동․청소년 대상 성범죄 <span class=\"amend\">&lt;신설 2020.6.1.&gt;<\/span><\/div><div class=\"ln it\">13. 직무와 관련하여 「형법」 제355조 및 제356조에 규정된 죄를 범한 자로서 <span class=\"b b1\">300만원 이상<\/span>의 벌금형을 선고받고 그 형이 확정된 후 <span class=\"b b1\">2년<\/span>이 지나지 아니한 자<span class=\"amend\">&lt;신설 2025.1.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[본조개정 1996.4.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "21", "title": "거짓기재", "topics": [13], "html": "<div class=\"ln\">학력 또는 경력에 관하여 거짓 기타 부정한 방법에 의하여 <span class=\"b b2\">임명<\/span>된 자는 그 사실이 발견된 즉시로 파면한다.<span class=\"amend\">&lt;개정 2025.1.1.&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[제목개정 2025.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "23", "title": "임용전수습기간", "topics": [12], "html": "<div class=\"ln\">①직원을 신규 임용하고자 할 때에는 <span class=\"b b1\">3개월<\/span>간 수습직원으로 근무하게 하여야 한다. 다만, 제10조의5에 따른 개방형 직위는 예외로 할 수 있다.<\/div><div class=\"ln\">② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 수습기간 없이 임용한다.<\/div><div class=\"ln it\">1. 제3조 특정직원의 의무직<\/div><div class=\"ln it\">2. 제5조 제17호의 채용형 인턴직원<\/div><div class=\"ln it\">3. 제10조의4에 따른 계약직원<\/div><div class=\"ln it\">4. 제10조의6에 따른 무기계약직원<\/div><div class=\"ln\"><span class=\"amend\">[본조개정 2019.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "23의2", "title": "직원기본연수 신규임용자과정", "topics": [12], "html": "<div class=\"ln\">①<span class=\"b b1\">임용권자<\/span>는 수습직원이 수습기간내에 신규임용자과정을 수료하게 하여야 한다. 다만, 수습기간내에 신규임용자과정을 수료하지 못한 자는 임용 후 <span class=\"b b1\">9개월 이내<\/span> 반드시 이를 수료하게 하여야 한다. 다만, 동일직종으로 재입사하거나 정규직으로 전환된 직원 중 신규임용자과정을 수료한 경우에는 재수료하지 않는다. <span class=\"amend\">&lt;개정 1996.1.1, 2004.1.15, 2019.1.1, 2020.1.1., 2022.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">②의무직원은 기본연수 중 관리자 심화과정(II)를 반드시 수료하여야 한다.<span class=\"amend\">&lt;신설 2019.1.1, 개정  2022.4.1., 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\">③<span class=\"b b1\">임용권자<\/span>는 일반직원 및 전문직원으로 전직 임용된 직원에 대하여 전직 임용 후 <span class=\"b b1\">1년 이내<\/span>에 해당 직렬 직원을 대상으로 실시하는 신규임용자과정을 새로이 수료하게 하여야 한다.<span class=\"amend\">&lt;신설 2004.1.15, 개정 2013.12.1, 2019.1.1., 2022.4.1. 2025.1.1. 2025.4.1&gt;<\/span><\/div><div class=\"ln\"><span class=\"amend\">[제목개정 2025.1.1]<\/span><\/div>"}, {"law": "운영규정", "type": "a", "no": "23의3", "title": "임용제한", "topics": [12], "html": "<div class=\"ln\">①<span class=\"b b1\">임용권자<\/span>는 수습직원이 수습기간동안 신규임용자과정을 정당한 사유없
