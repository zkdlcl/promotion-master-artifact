 임·위원 인사기록부】 임원이나 위원이 ( ? ) 또는 인준되었을 때에는 임·위원 인사기록부를 작성 비치하여야 한다. 다만, 지사의 임·위원 인사기록부는 본사에 인준을 요청할 때에 이를 첨부하여야 한다.","a":"선출","src":"인사관리시행규칙 제3조","art":"인사관리시행규칙:3","alt":[]},{"id":"ne2f4236a","t":21,"q":"【인사관리시행규칙 제4조 임원의 의원 입후보】 적십자가 지닌 고도의 공익성과 중립성을 고려하여 ( ? ), 부회장, 지사회장, 지사부회장은 국회의원, 지방자치단체의 장, 지방자치단체의 의원, 교육감, 교육의원에 입후보 등록(예비후보자 등록 포함)을 할 때에는 사전에 그 직을 사임하여야 한다.","a":"회장","src":"인사관리시행규칙 제4조","art":"인사관리시행규칙:4","alt":[]},{"id":"n079e0c0c","t":21,"q":"【인사관리시행규칙 제5조 고시공고】 ①직·용원의 신규채용 임용고시 공고는 원서접수 종료일로부터 ( ? )에 인터넷 공고 방법으로 채용인원, 응시자격, 전형별 합격자 결정 방법, 제출서류, 고시과목, 원서접수기간, 장소, 고시일자 및 장소와 합격자발표 일자, 부정합격자 합격취소 내용을 포함하여 표시 공고하여야 한다. 단, 필요시 신문게재 등 기타 방법을 병행하여 공고할 수 있다.","a":"15일 이전","src":"인사관리시행규칙 제5조","art":"인사관리시행규칙:5","alt":["15","15일"]},{"id":"n2d4aef2d","t":21,"q":"【인사관리시행규칙 제5조 고시공고】 ②제1항에도 불구하고 법령에 따라 긴급하게 채용해야 하는 경우나 그 밖에 ( ? )이 필요하다고 인정하는 경우에는 공고기간을 단축할 수 있으며, 그 세부사항은 별도 지침으로 정한다.","a":"회장","src":"인사관리시행규칙 제5조","art":"인사관리시행규칙:5","alt":[]},{"id":"n0364da03","t":21,"q":"【인사관리시행규칙 제9조 최종합격자 발표】 최종합격자 발표는 면접시험 시행일로부터 ( ? )에 공고 또는 개별통지로 행함을 원칙으로 한다.","a":"10일 이내","src":"인사관리시행규칙 제9조","art":"인사관리시행규칙:9","alt":["10","10일"]},{"id":"n04fe9f0c","t":21,"q":"【인사관리시행규칙 제12조 서류심사】 ①( ? ) 제청에는 전조에 규정된 서류 중 미비서류가 있거나 불비한 점이 있을 경우에는 제청권자에게 그 내용을 통보하고 서류의 반송 또는 보완을 지시하여야 한다.","a":"임명","src":"인사관리시행규칙 제12조","art":"인사관리시행규칙:12","alt":[]},{"id":"nbe405d0d","t":21,"q":"【인사관리시행규칙 제12조 서류심사】 ②( ? ) 과장 이하의 임명에 있어서도 전항과 같이 하여야 한다.","a":"4급","src":"인사관리시행규칙 제12조","art":"인사관리시행규칙:12","alt":["4"]},{"id":"nae931628","t":21,"q":"【인사관리시행규칙 제14조 임명보고】 ②( ? ) 또는 소속기관장이 직원 및 고용원을 새로 임명하였을 때에는 정현원대비표, 고시(전형)성적표, 봉급사정표를 첨부한 임명보고서를 회장에게 제출하여야 한다. 다만, 봉급사정표는 임용전 수습기간이 없는 직원에 대한 신규임명에 한하여 제출한다.","a":"기관장","src":"인사관리시행규칙 제14조","art":"인사관리시행규칙:14","alt":[]},{"id":"n25bc1271","t":21,"q":"【인사관리시행규칙 제16조 인사기록부】 ①직원의 인사기록은 인사기록부에 의거, 본사 인사담당부서의 장은 직원의 인사사항은 전산(인사프로그램)으로 입력·유지·관리하여야 하며, ( ? )과 소속기관장은 인사기록사항을 확인 관리하고 영구보존하여야 한다.","a":"기관장","src":"인사관리시행규칙 제16조","art":"인사관리시행규칙:16","alt":[]},{"id":"n13638299","t":21,"q":"【인사관리시행규칙 제17조 기관외 전보】 ②팀(과)장급 미만 ( ? ) 일반직원, 팀(과)장급 이하 특정직원 및 전문직원, 기술직원 및 기능직원의 기관외 전보는 기관장간의 합의를 거쳐 전보 임용을 희망하는 기관으로 기관장이 각각 발령한다. 다만, 소속기관 직원을 기관외로 전보임용하고자 할 때 에는 소속기관장은 기관장에게 기관외 전보를 제청한다.","a":"4급이하","src":"인사관리시행규칙 제17조","art":"인사관리시행규칙:17","alt":["4","4급"]},{"id":"ndb820b5c","t":21,"q":"【인사관리시행규칙 제17조 기관외 전보】 ④전보는 정기와 수시로 구분하여 실시하되 정기전보는 매년 ( ? )(1월, 7월) 시행하며, 수시전보는 인사교류가 필요한 경우 시행한다.","a":"2회","src":"인사관리시행규칙 제17조","art":"인사관리시행규칙:17","alt":["2"]},{"id":"n36cb56e5","t":21,"q":"【인사관리시행규칙 제19조 임명장 또는 임용장】 ①임용권자는 정규직원으로 임용되거나 승진될 때에는 임명장을, 전보될 때에는 임용장을 해당 직원에게 수여한다. 이경우 소속기관의 장이 대리 수여할 수 있으며, ( ? ) 과장 이하 직원 및 기능직원의 전보 임용에 있어서는 발령통지서의 교부로써 임용장의 수여에 갈음할 수 있다.","a":"4급","src":"인사관리시행규칙 제19조","art":"인사관리시행규칙:19","alt":["4"]},{"id":"n0e3e573f","t":21,"q":"【인사관리시행규칙 제20조 사령장 교부】 직원 및 고용원에 대한 임명장 또는 발령통지서는 해당 임용권자가 이를 교부한다. 다만, 필요한 경우에는 ( ? ) 또는 소속기관장으로 하여금 전달 교부하게 할 수도 있다.","a":"기관장","src":"인사관리시행규칙 제20조","art":"인사관리시행규칙:20","alt":[]},{"id":"n7e2ea95d","t":21,"q":"【인사관리시행규칙 제24조의2 징계의결 기한 및 의결서 작성】 ①징계위원회는 징계의결의 요구를 받은 날로부터 ( ? )에 의결을 하여야 한다. 단, 부득이한 사유가 있는 때에는 해당 징계위원회의 의결로 30일에 한하여 그 기간을 연장할 수 있다.","a":"30일 이내","src":"인사관리시행규칙 제24조의2","art":"인사관리시행규칙:24의2","alt":["30","30일"]},{"id":"n89649007","t":21,"q":"【인사관리시행규칙 제24조의2 징계의결 기한 및 의결서 작성】 ③( ? )가 징계를 감경 또는 가중하여 의결하였을 때에는 징계의결서의 이유란에 그 사실을 구체적으로 밝혀야 한다.","a":"징계위원회","src":"인사관리시행규칙 제24조의2","art":"인사관리시행규칙:24의2","alt":[]},{"id":"nf936aafa","t":21,"q":"【인사관리시행규칙 제24조의3 징계의결의 통보 및 보고】 ( ? )가 징계의결을 한 때에는 지체없이 징계의결서 사본을 첨부하여 징계의결요구자, 징계처분권자에게 이를 통보하고 회장에게 보고하여야 한다.","a":"징계위원회","src":"인사관리시행규칙 제24조의3","art":"인사관리시행규칙:24의3","alt":[]},{"id":"n709a02a7","t":21,"q":"【인사관리시행규칙 제24조의4 징계양정의 기준】 ① 「직원 운영규정」 제63조의2의 규정에 의거한 징계양정은 징계혐의자의 비위의 유형, 비위의 정도 및 과실의 경중과 평소의 소행, 근무성적, 공적, 개전의 정 기타 정상 등을 참작하여 별표 제5호 내지 제5호의6의 징계양정기준에 따라 징계사건을 ( ? )하여야 한다.","a":"의결","src":"인사관리시행규칙 제24조의4","art":"인사관리시행규칙:24의4","alt":[]},{"id":"ndbeef89c","t":21,"q":"【인사관리시행규칙 제24조의4 징계양정의 기준】 ②징계위원회는 징계의결이 요구된 사람이 다음 각 호의 어느 하나에 해당하는 … 3. ｢직원 운영규정｣ 제28조에 따라 포상 또는 ( ? ) 표창(공적에 대한 표창만 해당한다.)을 받은 공적","a":"회장","src":"인사관리시행규칙 제24조의4","art":"인사관리시행규칙:24의4","alt":[]},{"id":"n8d4fd3e9","t":21,"q":"【인사관리시행규칙 제25조 징계의 집행】 ①징계처분권자는 징계의결서를 받은 날로부터 ( ? )에 이를 집행하고 그 결과를 회장에게 보고하여야 한다.","a":"15일이내","src":"인사관리시행규칙 제25조","art":"인사관리시행규칙:25","alt":["15","15일"]},{"id":"n6ac29cf9","t":21,"q":"【인사관리시행규칙 제25조 징계의 집행】 ②징계처분권자는 제1항의 규정에 의하여 징계의결을 집행할 때에는 지체없이 징계처분사유설명서를 징계의결서 사본과 첨부하여 교부하여야 한다. 다만, 파면, ( ? ), 강등의 경우에는 임용권자가 이를 교부한다.","a":"해임","src":"인사관리시행규칙 제25조","art":"인사관리시행규칙:25","alt":[]},{"id":"n71513af4","t":21,"q":"【인사관리시행규칙 제25조의3 징계등 처분기록의 말소】 ①「직원 운영규정」 제65조의2 제1항 내지 제3항의 규정에 의거한 징계등 처분기록의 말소는 해당 직·용원 및 무기계약직원이 소속한 ( ? ) 또는 소속기관장이 행한다. 다만, 본사는 사무총장이 행한다.","a":"기관장","src":"인사관리시행규칙 제25조의3","art":"인사관리시행규칙:25의3","alt":[]},{"id":"nf4cadc3a","t":21,"q":"【인사관리시행규칙 제25조의3 징계등 처분기록의 말소】 ②전항에 의한 말소권자는 말소사유 발생일전 ( ? )에 ‘징계등처분기록말소계획(신청)서’를 작성, 말소사유 해당일에 말소조치하여야 한다. 다만, 「직원 운영규정」 제65조의2 제3항에 따라 법원판결 및 행정소송 등으로 징계 또는 직위해제가 무효‧취소로 확정된 때에는 원 처분일자로 말소한다.","a":"7일 이내","src":"인사관리시행규칙 제25조의3","art":"인사관리시행규칙:25의3","alt":["7","7일"]},{"id":"n96f04c7c","t":21,"q":"【인사관리시행규칙 제25조의3 징계등 처분기록의 말소】 ④제1항의 규정에 의거한 말소권자는 해당 직·용원 및 무기계약직원이 말소사유에 해당하는 때에는 징계등 처분기록을 말소하고 그 결과를 ( ? )에 회장에게 보고하여야 한다.","a":"30일 이내","src":"인사관리시행규칙 제25조의3","art":"인사관리시행규칙:25의3","alt":["30","30일"]},{"id":"n33b0ce34","t":21,"q":"【인사관리시행규칙 제25조의4 기록말소심사위원회 운영 등】 ①회장은 기록말소가 필요하다고 인정하는 경우 기록말소 심사위원회(이하 ‘위원회’라 한다)를 구성하고 말소일자 및 대상, 범위 등을 정하여 회의개최 ( ? ) 전에 위원회에 심의·의결을 요구하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 때에는 기록말소의 대상에서 제외한다.","a":"7일","src":"인사관리시행규칙 제25조의4","art":"인사관리시행규칙:25의4","alt":["7"]},{"id":"n7169578a","t":21,"q":"【인사관리시행규칙 제25조의4 기록말소심사위원회 운영 등】 ②위원회는 심의·의결을 요구받은 날로부터 ( ? )에 심의·의결하여야 한다. 단, 부득이한 사유가 있는 때에는 해당 위원회의 의결로 10일에 한하여 그 기간을 연장할 수 있다.","a":"10일 이내","src":"인사관리시행규칙 제25조의4","art":"인사관리시행규칙:25의4","alt":["10","10일"]},{"id":"n27c15f30","t":21,"q":"【인사관리시행규칙 제25조의4 기록말소심사위원회 운영 등】 ④말소권자는 전항의 규정에 의거한 말소조치 후 ( ? )에 해당 직·용원 및 무기계약직원에 대하여 ‘징계등처분기록말소통지서’로 말소사실을 통보하여야 한다.","a":"14일 이내","src":"인사관리시행규칙 제25조의4","art":"인사관리시행규칙:25의4","alt":["14","14일"]},{"id":"nfe047994","t":21,"q":"【인사관리시행규칙 제26조 직원 및 고용원의 입후보】 직원 및 고용원은 ( ? )의원, 지방자치단체의 장, 지방자치단체의 의원, 교육감, 교육의원에 입후보 등록(예비후보자 등록 포함)을 할 때에는 본 시행규칙 제4조를 준용한다.","a":"국회","src":"인사관리시행규칙 제26조","art":"인사관리시행규칙:26","alt":[]},{"id":"nf398f8b4","t":21,"q":"【인사관리시행규칙 제28조의4 공로연수】 ①정년퇴직을 할 직원은 퇴직예정일 이전으로 기산하여 ( ? ) 근무자는 9개월, 20년 이상 30년 미만 근무자는 8개월, 10년 이상 20년 미만 근무자는 7개월간의 공로연수를 할 수 있다. 다만, 회장은 「직원 운영규정」 제18조제2호의 직원에 대하여는 공로연수 기간을 9개월 이내로 조정하여 시행할 수 있다.","a":"30년 이상","src":"인사관리시행규칙 제28조의4","art":"인사관리시행규칙:28의4","alt":["30","30년"]},{"id":"n2cc99883","t":21,"q":"【인사관리시행규칙 제29조 승진, 승급의 사정】 승진 또는 승급은 근무성적평정서에 의하여 이를 사정하고 총평점의 ( ? )인 경우에 한하여 이를 인정하여야 한다.","a":"60%이상","src":"인사관리시행규칙 제29조","art":"인사관리시행규칙:29","alt":["60","60%"]},{"id":"n81684aae","t":21,"q":"【인사관리시행규칙 제31조 평정시기 등】 ①근무평정은 특별한 사유로 인하여 실시하는 것을 제외하고는 ( ? )과 10월 연2회 평정한다.","a":"4월","src":"인사관리시행규칙 제31조","art":"인사관리시행규칙:31","alt":["4"]},{"id":"nca48e03a","t":21,"q":"【인사관리시행규칙 제31조 평정시기 등】 ②휴직, 휴가, 정직, 기타 사유로 공정한 평정을 할 수 없다고 인정되는 직원은 평정시기를 변경할 수 있으며, 휴직, 직위해제 또는 신규채용 등의 사유로 근무성적평정 대상기간 중 실제 근무기간이 ( ? )인 경우에는 해당 근무성적평정을 실시하지 아니한다.","a":"2개월 미만","src":"인사관리시행규칙 제31조","art":"인사관리시행규칙:31","alt":["2","2개월"]},{"id":"n568fec77","t":21,"q":"【인사관리시행규칙 제32조 평정자와 확인자】 평정은 4급 팀(과)장급 이상 직원과 ( ? ) 직원으로 구분하되 평정자와 확인자는 별표 제4호에 의한다.","a":"4급이하","src":"인사관리시행규칙 제32조","art":"인사관리시행규칙:32","alt":["4","4급"]},{"id":"ndef6ff18","t":21,"q":"【인사관리시행규칙 제33조 근무성적의 평정점】 ①( ? ) 팀(과)장급 이상 직원의 근무성적의 총평점은 45점을 만점으로 하고 평정자와 확인자는 각각 22.5점을 최고점으로 채점한다.","a":"4급 이상","src":"인사관리시행규칙 제33조","art":"인사관리시행규칙:33","alt":["4","4급"]},{"id":"n2bc0ffe4","t":21,"q":"【인사관리시행규칙 제33조 근무성적의 평정점】 ②( ? ) 직원 및 기술직원, 기능직원의 근무성적의 총평점은 35점을 만점으로 하고 평정자와 확인자는 각각 17.5점을 최고점으로 채점한다.","a":"4급 이하","src":"인사관리시행규칙 제33조","art":"인사관리시행규칙:33","alt":["4","4급"]},{"id":"nb1593feb","t":21,"q":"【인사관리시행규칙 제33조 근무성적의 평정점】 ④사무총장은 ( ? ) 팀(과)장급 이상 직원의 근무성적평정을 재사정할 수 있다.","a":"4급","src":"인사관리시행규칙 제33조","art":"인사관리시행규칙:33","alt":["4"]},{"id":"n9ad97304","t":21,"q":"【인사관리시행규칙 제34조 다면평가】 ①( ? )의 일반직원, 전문직원 및 특정직원을 대상으로 다면평가를 실시한다.","a":"4급이상","src":"인사관리시행규칙 제34조","art":"인사관리시행규칙:34","alt":["4","4급"]},{"id":"nabbda164","t":21,"q":"【인사관리시행규칙 제34조 다면평가】 ②다면평가는 특별한 사유로 인하여 실시하는 것을 제외하고는 ( ? )과 10월 연2회 평가한다.","a":"4월","src":"인사관리시행규칙 제34조","art":"인사관리시행규칙:34","alt":["4"]},{"id":"n7e10fc2e","t":21,"q":"【인사관리시행규칙 제37조 교육훈련】 ②사무총장은 연수운영위원회를 통해 연간 교육훈련의 계획을 수립하고, 인재개발원장은 피교육자, 교과목, 기간, 시기 등을 선정하여 ( ? ) 전에 기관장 및 소속기관장에게 통보하여야 한다.","a":"1개월","src":"인사관리시행규칙 제37조","art":"인사관리시행규칙:37","alt":["1"]},{"id":"n58786820","t":21,"q":"【인사관리시행규칙 제41조 승진심사】 ①일반․전문직 ( ? ) 내지 3급직원에 해당하는 직원으로서의 승진은 사무총장 또는 사무총장이 위임한 직원을 위원장으로 하고 본사 부서장, 해당 지사 사무처장, 혈액관리본부장 및 혈액관리본부 국장, 의료원장 및 병원사업본부장, 병원장, 혈액원장(부원장 포함) 중 10인 이내로 구성한 승진심사위원회에서 심사하여야 한다.","a":"2급","src":"인사관리시행규칙 제41조","art":"인사관리시행규칙:41","alt":["2"]},{"id":"n3f792a71","t":21,"q":"【인사관리시행규칙 제41조 승진심사】 ②「직원 운영규정」 제18조의2 제2호(2-3급 제외), 제3호에 해당하는 직원으로의 승진은 해당 임용권자 또는 임용권자가 위임한 직원이 위원장이 되고 ( ? )의 위원으로 승진심사위원회를 구성 심사하여야 한다.","a":"7인이내","src":"인사관리시행규칙 제41조","art":"인사관리시행규칙:41","alt":["7","7인"]},{"id":"n9d2566cf","t":21,"q":"【인사관리시행규칙 제41조의2 승진시기】 ①일반·전문직 ( ? ) 내지 3급 직원에 해당하는 직원으로의 승진은 1월1일자로 시행한다.","a":"2급","src":"인사관리시행규칙 제41조의2","art":"인사관리시행규칙:41의2","alt":["2"]},{"id":"n38748f25","t":21,"q":"【인사관리시행규칙 제41조의2 승진시기】 ②「직원 운영규정」 제18조의2제1항제2호(2,3급 제외) 및 제3호에 해당하는 직원으로의 승진은 ( ? )1일자와 7월1일자로 연2회 시행한다. 다만, 4급 직원으로의 승진의 경우에는 7월1일자로 시행한다.,","a":"1월","src":"인사관리시행규칙 제41조의2","art":"인사관리시행규칙:41의2","alt":["1"]},{"id":"n92b87d86","t":21,"q":"【인사관리시행규칙 제41조의2 승진시기】 ③본조의 승진과 관련한 승진심사는 승진일자 ( ? )에 실시하여야 한다.","a":"1월 이내","src":"인사관리시행규칙 제41조의2","art":"인사관리시행규칙:41의2","alt":["1","1월"]},{"id":"nafed443e","t":21,"q":"【인사관리시행규칙 제42조 승진 평점기준】 ①고시에 의하지 아니하는 직원의 승진평점은 총점 ( ? )으로 하고 근무성적평정점 45점, 경력평정점 40점, 교육훈련평정점 15점을 최고점으로 한다.","a":"100점","src":"인사관리시행규칙 제42조","art":"인사관리시행규칙:42","alt":["100"]},{"id":"n2f8454cf","t":21,"q":"【인사관리시행규칙 제42조 승진 평점기준】 ②제1항의 최고점 이외에 가점 또는 감점은 최고 ( ? )로 하며 가점의 합산으로 인하여 100점을 초과하는 경우, 해당 직원의 승진평점은 100점으로 한다.","a":"5점이내","src":"인사관리시행규칙 제42조","art":"인사관리시행규칙:42","alt":["5","5점"]},{"id":"nd2e564d2","t":21,"q":"【인사관리시행규칙 제43조 가점 및 감점 산정기준】 ①직원의 승진평점 산정 시 다음 각 호의 해당 점수를 가점으로 평정한다. 1. 대통령 표창, 훈장, 포상: ( ? )","a":"5점","src":"인사관리시행규칙 제43조","art":"인사관리시행규칙:43","alt":["5"]},{"id":"n884747a0","t":21,"q":"【인사관리시행규칙 제43조 가점 및 감점 산정기준】 ①직원의 승진평점 산정 시 다음 각 호의 해당 점수를 가점으로 평정한다. 2. 국무총리, 회장 표창: ( ? )","a":"3점","src":"인사관리시행규칙 제43조","art":"인사관리시행규칙:43","alt":["3"]},{"id":"n84037d7d","t":21,"q":"【인사관리시행규칙 제43조 가점 및 감점 산정기준】 ①직원의 승진평점 산정 시 다음 각 호의 해당 점수를 가점으로 평정한다. 3. 장관급이상 표창: ( ? )","a":"2점","src":"인사관리시행규칙 제43조","art":"인사관리시행규칙:43","alt":["2"]},{"id":"n46bf1096","t":21,"q":"【인사관리시행규칙 제44조 승진대상자】 ③전항의 규정에 의한 승진심사 청구기한은 다음 각 호에 의한다. 1. 고시에 의한 승진대상자는 승진일 기준 ( ? ) 전까지로 한다.","a":"60일","src":"인사관리시행규칙 제44조","art":"인사관리시행규칙:44","alt":["60"]},{"id":"n53f702b1","t":21,"q":"【인사관리시행규칙 제44조 승진대상자】 ③전항의 규정에 의한 승진심사 청구기한은 다음 각 호에 의한다. 2. 고시에 의하지 아니하는 승진대상자는 승진일 기준 ( ? ) 전까지로 한다.","a":"30일","src":"인사관리시행규칙 제44조","art":"인사관리시행규칙:44","alt":["30"]},{"id":"n02a33062","t":21,"q":"【인사관리시행규칙 제45조 승진, 전형고시방법】 승진전형고시는 다음과 같이 구분 실시한다. 1. ( ? )승진, 전형고시는 서류전형 필기시험 및 면접시험으로 구분 실시하며 최종합격자 결정은 기관별 정원의 범위내에서 종합성적 순위에 의한다. 다만, 시험은 본사가 주관한다.","a":"4급","src":"인사관리시행규칙 제45조","art":"인사관리시행규칙:45","alt":["4"]},{"id":"n65b80c9b","t":21,"q":"【인사관리시행규칙 제45조 승진, 전형고시방법】 승진전형고시는 다음과 같이 구분 실시한다. 2. ( ? ), 3급, 5급, 6급과 기술직원 기술1급 및 기술2급로의 승진은 서류전형에 의하여 실시하는 것을 원칙으로 하며 임용권자가 필요하다고 인정하는 경우 필기 또는 면접시험을 병과할 수 있다.","a":"2급","src":"인사관리시행규칙 제45조","art":"인사관리시행규칙:45","alt":["2"]},{"id":"n9005873a","t":21,"q":"【인사관리시행규칙 제48조 직근상급자 의견서】 ①승진대상직원의 직근상급자(팀장급 이상)는 해당 직원의 근무태도 및 업무수행 능력에 대한 평가를 행한 후 ( ? ) 또는 소속기관장에게 의견서를 필히 제출하여야 한다.","a":"기관장","src":"인사관리시행규칙 제48조","art":"인사관리시행규칙:48","alt":[]},{"id":"n030fe2d1","t":21,"q":"【인사관리시행규칙 제48조 직근상급자 의견서】 ②기관장 또는 소속기관장은 2·( ? ) 직원으로의 승진대상 직원 명부를 작성하여 지사는 사무처장, 혈액관리본부는 혈액관리본부장, 혈액원은 원장, 의료원은 의료원장, 병원은 관리부원장 등 직근 상급자의 의견서를 첨부하여 승진고시일 15일 이전에 해당 승진심사위원회에 제출하여야 한다.","a":"3급","src":"인사관리시행규칙 제48조","art":"인사관리시행규칙:48","alt":["3"]},{"id":"nffe9d4bb","t":21,"q":"【인사관리시행규칙 제54조 요양보상】 요양보상은 시설 또는 지역상 부득이한 사정으로 그 소관 적십자의료기관에서 치료를 받을 수 없는 경우에는 소속기관의 ( ? )을 얻어 소관 외 적십자의료기관 또는 타의료기관에서 요양 또는 치료를 받되 그 소요실비는 해당 직원이 소속한 기관에서 이를 부담하여야 한다.","a":"승인","src":"인사관리시행규칙 제54조","art":"인사관리시행규칙:54","alt":[]},{"id":"n3859038b","t":22,"q":"【보수운영규정 제3조 용어의 정의】 이 운영규정에서 사용되는 용어의 정의는 다음과 같다. 9. “평균임금”이란 이를 산정하여야 할 사유가 발생한 날 이전 ( ? )간에 그 직원에게 지급된 임금총액을 그 기간의 총 일수로 나눈 금액을 말한다. 다만, 하계‧명절상여금, 실적평가급 및 연가보상비에 대하여는 산정일 이전 1년간 지급받은 총액을 12개월로 나누어 평균임금 산정기초에 산입한다.","a":"3개월","src":"보수운영규정 제3조","art":"보수운영규정:3","alt":["3"]},{"id":"na4d2c2f3","t":22,"q":"【보수운영규정 제3조 용어의 정의】 11. “상여수당 월할금액”이란 정기·하계·명절상여의 연간 지급액을 합산하여 ( ? )로 나눈 금액을 말한다.","a":"12개월","src":"보수운영규정 제3조","art":"보수운영규정:3","alt":["12"]},{"id":"n41bfa5b3","t":22,"q":"【보수운영규정 제7조 연봉제 실시】 ①( ? )은 직원의 보수지급에 있어 「직원 운영규정」 제24조(보수의 한계)의 규정에도 불구하고 직원의 능력과 성과도에 따라 연봉급으로 지급하게 할 수 있다.","a":"회장","src":"보수운영규정 제7조","art":"보수운영규정:7","alt":[]},{"id":"nb8f4568e","t":22,"q":"【보수운영규정 제8조 초임급】 ①신규임용 시 초임급은 「직원 운영규정」에 따라 급별로 경력연수를 환산하고 해당 연수에 따른 호봉으로 정함을 원칙으로 하되 경력직원을 제외하고는 ( ? )을 초과할 수 없다. 다만, 필요에 따라 회장은 3호봉 이내로 증감할 수 있다.","a":"10호봉","src":"보수운영규정 제8조","art":"보수운영규정:8","alt":["10"]},{"id":"na1ed461a","t":22,"q":"【보수운영규정 제10조 퇴직직원 재임명 시의 초임급】 원에 의하여 퇴직한 직원이 ( ? )에 동일계급으로 재임명되는 경우에는 퇴직당시에 받던 호봉으로 획정한다.","a":"2년 이내","src":"보수운영규정 제10조","art":"보수운영규정:10","alt":["2","2년"]},{"id":"n67422667","t":22,"q":"【보수운영규정 제11조의2 상여수당 / 정기상여금】 ①직원에게는 매월 ( ? )(지급기준일)에 정기상여금을 지급할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 자에 대하여는 이를 지급하지 아니한다.","a":"20일","src":"보수운영규정 제11조의2","art":"보수운영규정:11의2","alt":["20"]},{"id":"n5248475d","t":22,"q":"【보수운영규정 제11조의2 상여수당 / 정기상여금】 ②정기상여금은 지급기준일 현재 지급기준액의 ( ? )로 계산된 금액으로 한다. 다만, 정기상여금 지급기준일 현재 직위해제, 강등, 정직 및 휴직으로 보수가 감액지급되는 자에게는 감액된 금액을 지급기준액으로 한다.","a":"50%","src":"보수운영규정 제11조의2","art":"보수운영규정:11의2","alt":["50"]},{"id":"n120e11fd","t":22,"q":"【보수운영규정 제11조의2 상여수당 / 정기상여금】 ③지급기준일 현재 해당 월 근무일수가 ( ? )인 자 및 퇴직한 자에게는 지급하지 아니한다.","a":"15일 미만","src":"보수운영규정 제11조의2","art":"보수운영규정:11의2","alt":["15","15일"]},{"id":"n83b6175e","t":22,"q":"【보수운영규정 제12조 상여수당 / 하계·명절상여금】 ①직원에게는 매년 ( ? ) 20일에 하계상여금을, 추석 이전 15일 이내와 설날 이전 15일 이내에 각각 명절상여금을 지급할 수 있다. 다만, 해당 월에 신규채용된 자와 인력종합수급과(인력풀과)로 배치된 자에 대하여는 이를 지급하지 아니한다.","a":"7월","src":"보수운영규정 제12조","art":"보수운영규정:12","alt":["7"]},{"id":"n589bcd65","t":22,"q":"【보수운영규정 제12조 상여수당 / 하계·명절상여금】 ②하계‧명절상여금은 지급기준일 현재 지급기준액의 ( ? )로 계산한 금액으로 한다.","a":"50%","src":"보수운영규정 제12조","art":"보수운영규정:12","alt":["50"]},{"id":"n0895f734","t":22,"q":"【보수운영규정 제13조 상여수당 / 실적평가급】 ①매 회계연도의 각 기관의 근무 및 업무실적 등을 고려한 각 기관의 실적평가급 지급률을 산정하여 다음 연도 ( ? )에 지급할 수 있으며, 실적평가급 지급기준 및 시기는 회장이 별도로 정한다.","a":"5월 이전","src":"보수운영규정 제13조","art":"보수운영규정:13","alt":["5","5월"]},{"id":"n5cd059c0","t":22,"q":"【보수운영규정 제13조 상여수당 / 실적평가급】 ②실적평가급은 평가대상 연도 말(12월 31일) 지급기준액을 기준으로 다음과 같이 계산한 금액으로 하되, 평가대상 연도의 봉급지급일수가 ( ? )인 자와 인력종합수급과(인력풀과)로 배치된 자 및 「직원 운영규정」 제57조 제5항에 따른 중징계자와 「인사관리 시행규칙」 제24조의4 제3항에 따른 징계자에 대하여는 이를 지급하지 아니한다. 다만, 근무일수가 15일 이상…","a":"15일 미만","src":"보수운영규정 제13조","art":"보수운영규정:13","alt":["15","15일"]},{"id":"n4cf9b432","t":22,"q":"【보수운영규정 제13조 상여수당 / 실적평가급】 ⑤지급일을 기준으로 전년도 12월 ( ? )부터 지급일 전일까지 퇴직하는 자에 대하여는 본조 제2항의 기준으로 지급하되, 지급률은 전년도 12월 31일 현재 본인이 속한 기관의 전년도 지급률에 따라 지급한다. 단, 전년도 12월 31일부터 지급일까지의 기간동안 파면 또는 해임된 자는 지급하지 아니한다.","a":"31일 이후","src":"보수운영규정 제13조","art":"보수운영규정:13","alt":["31","31일"]},{"id":"n12566b7e","t":22,"q":"【보수운영규정 제15조 가계보전수당 / 가족수당】 ①직원 및 고용원으로서 부양가족이 있는 자에 대하여는 별표 제6호에 의한 가족수당을 지급하되, 부양가족의 수는 ( ? )로 한다. 다만, 자녀의 경우에는 부양가족의 수가 4인을 초과하더라도 가족수당을 지급한다.","a":"4인 이내","src":"보수운영규정 제15조","art":"보수운영규정:15","alt":["4","4인"]},{"id":"n41800f25","t":22,"q":"【보수운영규정 제15조 가계보전수당 / 가족수당】 ②제1항에서 부양가족이란 부양의무를 가진 직원 및 고용원과 주민등록표상 세대… 2. 본인 및 배우자의 60세(여성인 경우에는 55세)이상의 직계존속 및 ( ? )의 직계존속 중 장애상태의 정도가 심한 자","a":"60세 미만","src":"보수운영규정 제15조","art":"보수운영규정:15","alt":["60","60세"]},{"id":"n617007ac","t":22,"q":"【보수운영규정 제15조 가계보전수당 / 가족수당】 ②제1항에서 부양가족이란 부양의무를 가진 직원 및 고용원과 주민등록표상 세대… 3. ( ? )의 직계비속 및 20세 이상의 직계비속 중 장애상태의 정도가 심한 자","a":"20세 미만","src":"보수운영규정 제15조","art":"보수운영규정:15","alt":["20","20세"]},{"id":"n196ce1c2","t":22,"q":"【보수운영규정 제17조 특수근무수당 / 특별근무수당】 ②연장근무, 야간근무, 휴일근무에 대하여는 각각 통상임금의 ( ? )의 5할을 가산하여 지급한다.","a":"209분의 1","src":"보수운영규정 제17조","art":"보수운영규정:17","alt":["1/209"]},{"id":"nb43c63dd","t":22,"q":"【보수운영규정 제21조 전산업무수당】 ②전산업무를 담당하는 직원이란 본사 및 혈액관리본부의 전산업무를 전담하는 부서에 근무하거나 기관장 또는 소속기관장이 정하는 ( ? )으로서 전산프로그램의 개발, 업무분석, 기기운용 및 전산자료관리를 전담하는 직원을 말한다. 다만, 전직이나 담당업무의 변동 등으로 인하여 실제 전산업무를 담당하지 아니하는 경우에는 전산업무수당을 지급할 수 없다.","a":"1인","src":"보수운영규정 제21조","art":"보수운영규정:21","alt":["1"]},{"id":"n24cd1720","t":22,"q":"【보수운영규정 제21조 전산업무수당】 …2항에서 정하고 있는 업무를 수행할 만한 자격이나 경력을 증명할 수 있거나, 전직 이전에 지급받던 업무수당액보다 새로이 지급받는 전산수당액이 적을 경우에는 전산업무수당 기준표에 따라 해당 ( ? ) 또는 소속기관장이 합리적으로 조정하여 지급할 수 있다.","a":"기관장","src":"보수운영규정 제21조","art":"보수운영규정:21","alt":[]},{"id":"n5f94bde7","t":22,"q":"【보수운영규정 제24조 장기근속수당】 ②장기근속수당을 위한 근속연수는 매월 ( ? )을 기준으로 계산한다. 다만, 근속연수 산정에서 제외되는 기간은 이 규정 제37조의 규정에 따른다.","a":"1일","src":"보수운영규정 제24조","art":"보수운영규정:24","alt":["1"]},{"id":"naa975e75","t":22,"q":"【보수운영규정 제25조의2 생리휴가 공제】 「직원 운영규정」 제45조제6호의 규정에 의한 생리휴가를 사용한 경우에는 해당 월 통상임금의 ( ? )을 다음 달 급여지급 시에 공제한다.","a":"209분의 8","src":"보수운영규정 제25조의2","art":"보수운영규정:25의2","alt":["8/209"]},{"id":"nc031181b","t":22,"q":"【보수운영규정 제26조 연가보상비】 ①( ? ) 31일 현재 1년 1개월 이상 근무하고 봉급이 지급된 직원에 대하여는 매년 1월 15일에 연가보상비를 지급한다.","a":"12월","src":"보수운영규정 제26조","art":"보수운영규정:26","alt":["12"]},{"id":"nfce78577","t":22,"q":"【보수운영규정 제26조 연가보상비】 ③연도 중 퇴직하는 자에 대하여는 퇴직 전년도의 근무로 인하여 퇴직연도에 발생한 휴가일수 중 미사용한 휴가일수에 대하여 연가보상비를 퇴직한 날로부터 ( ? )에 지급한다. 다만, 근무기간이 만 1년 미만인 퇴직자는 1개월 개근 시마다 발생한 1일의 연차휴가발생일수 중 미사용일수에 대하여, 만 1년 이상 2년차 퇴직자는 발생일수에서 총 근무기간 동안 사용한 휴가일수를 제외한 미사용일수에 대하여 각각 이를 지급한다.","a":"14일 이내","src":"보수운영규정 제26조","art":"보수운영규정:26","alt":["14","14일"]},{"id":"n9d5d68a2","t":22,"q":"【보수운영규정 제31조 인사교류수당】 인사발령에 의해 가족과 생계를 달리하여 원거리로 전보되는 기관장급 직원에게는 월 ( ? ), 기관장급 이외의 직원에게는 월 200,000원의 인사교류수당을 지급할 수 있으며, 지급에 관한 세부사항은 회장이 별도 지침으로 정한다.","a":"300,000원","src":"보수운영규정 제31조","art":"보수운영규정:31","alt":["300000"]},{"id":"nc2ab1aca","t":22,"q":"【보수운영규정 제33조 처우개선비】 기술직, 기능직 및 고용원으로 ( ? ) 근속한 직원에 대하여 매월 50,000원의 처우개선비를 지급한다.","a":"15년 이상","src":"보수운영규정 제33조","art":"보수운영규정:33","alt":["15","15년"]},{"id":"nd5207d61","t":22,"q":"【보수운영규정 제36조 승급기간】 ①직원의 매호 승급기간은 ( ? )으로 한다.","a":"1년","src":"보수운영규정 제36조","art":"보수운영규정:36","alt":["1"]},{"id":"n93e92edc","t":22,"q":"【보수운영규정 제36조 승급기간】 ②제1항의 규정에도 불구하고 다음 각 호에 해당될 경우에는 그 기간동안 승급… 1. 근무성적이 총평점의 ( ? )인 경우: 12개월","a":"60%미만","src":"보수운영규정 제36조","art":"보수운영규정:36","alt":["60","60%"]},{"id":"nbaa9d1ad","t":22,"q":"【보수운영규정 제36조 승급기간】 ②제1항의 규정에도 불구하고 다음 각 호에 해당될 경우에는 그 기간동안 승급… 2. 기본연수를 수료하지 못한 경우: ( ? )","a":"6개월","src":"보수운영규정 제36조","art":"보수운영규정:36","alt":["6"]},{"id":"nbcce488e","t":22,"q":"【보수운영규정 제38조 승급일】 승급일은 매년 ( ? ) 1일, 4월 1일, 7월 1일, 10월 1일로 시행한다.","a":"1월","src":"보수운영규정 제38조","art":"보수운영규정:38","alt":["1"]},{"id":"n5957e3c0","t":22,"q":"【보수운영규정 제42조 보수계산】 ②다음 각 호의 어느 하나에 해당하는 경우에는 제1항의 규정에도 불구하고 면… 1. ( ? ) 근속한 직원이 월 중 15일 이상을 근무한 후 면직되는 경우. 다만, 금고 이상의 형을 받거나 파면 또는 해임에 의하여 면직되는 경우는 제외한다.","a":"5년 이상","src":"보수운영규정 제42조","art":"보수운영규정:42","alt":["5","5년"]},{"id":"n5526d9b6","t":22,"q":"【보수운영규정 제42조 보수계산】 ②다음 각 호의 어느 하나에 해당하는 경우에는 제1항의 규정에도 불구하고 면… 2. ( ? ) 근무한 직원이 병역법이나 그 밖의 법률의 규정에 의한 의무 수행을 위해 휴직한 경우","a":"2년 이상","src":"보수운영규정 제42조","art":"보수운영규정:42","alt":["2","2년"]},{"id":"naf17d3ae","t":22,"q":"【보수운영규정 제42조 보수계산】 ②다음 각 호의 어느 하나에 해당하는 경우에는 제1항의 규정에도 불구하고 면… 3. 직원이 재직 중 업무로 사망하거나 업무상 질병 또는 부상으로 재직 중 사망하여 면직된 경우. 다만, 그 달 ( ? )자로 면직되는 경우는 제외한다.","a":"1일","src":"보수운영규정 제42조","art":"보수운영규정:42","alt":["1"]},{"id":"n96c70960","t":22,"q":"【보수운영규정 제43조 보수 등의 감액지급】 ① 직원의 감급에 있어 ( ? ) 감액은 일 평균임금의 2분의 1, 총액이 월 평균 임금의 10분의 1을 초과하지 못한다.","a":"1회","src":"보수운영규정 제43조","art":"보수운영규정:43","alt":["1"]},{"id":"n1d7e04fe","t":22,"q":"【보수운영규정 제45조 국외출장중의 보수】 사무로 국외에 출장하는 직원의 출장기간이 ( ? )을 초과하는 경우에는 사무총장은 그 보수월액을 감액지급할 수 있다.","a":"6개월","src":"보수운영규정 제45조","art":"보수운영규정:45","alt":["6"]},{"id":"n309af0d4","t":22,"q":"【보수운영규정 제47조 휴직기간 중의 보수】 ①신체‧정신상의 장애로 인한 장기 요양… 1. 휴직 기간이 ( ? )인 경우 : 보수의 7할","a":"1년 이하","src":"보수운영규정 제47조","art":"보수운영규정:47","alt":["1","1년"]},{"id":"nfcb7f1fa","t":22,"q":"【보수운영규정 제47조 휴직기간 중의 보수】 ①신체‧정신상의 장애로 인한 장기 요양… 2. 휴직 기간이 ( ? ) 2년 이하인 경우 : 보수의 5할","a":"1년 초과","src":"보수운영규정 제47조","art":"보수운영규정:47","alt":["1","1년"]},{"id":"n1bc0f65e","t":22,"q":"【보수운영규정 제49조 퇴직금】 ①직원이 퇴직 또는 사망하였을 때에는 계속근로연수 1년에 대하여 ( ? )분의 평균임금을 퇴직금으로 지급한다. 다만, 근로연수가 1년 미만인 경우에는 그러하지 아니한다.","a":"30일","src":"보수운영규정 제49조","art":"보수운영규정:49","alt":["30"]},{"id":"n024c7158","t":22,"q":"【보수운영규정 제50조 퇴직금 중간정산】 ③제1항에 따라 퇴직금을 미리 정산하여 지급하는 경우 직원이 퇴직한 후 ( ? )이 되는 날까지 관련 증명 서류를 보존하여야 한다.","a":"5년","src":"보수운영규정 제50조","art":"보수운영규정:50","alt":["5"]},{"id":"n081a8f31","t":22,"q":"【보수운영규정 제53조 수당지급의 특례】 ( ? )은 해당 기관과 소속기관의 경영개선을 위하여 필요한 경우에는 각 기관의 재정상태를 고려하여 예산의 범위 안에서 상여수당을 조정하여 지급할 수 있다.","a":"기관장","src":"보수운영규정 제53조","art":"보수운영규정:53","alt":[]},{"id":"n53aaa208","t":22,"q":"【보수운영규정 제55조 적용시기】 「직원 운영규정」 제56조에 따른 정년기준일의 만 ( ? ) 전부터 임금피크 대상자로 전환하고 임금피크 대상자로 확정한다. 단, 의무직원은 임금피크 대상에서 제외한다.","a":"2년","src":"보수운영규정 제55조","art":"보수운영규정:55","alt":["2"]},{"id":"n9b24754a","t":22,"q":"【보수운영규정 제56조의2 근로시간 단축】 임금피크제 연차별(2년간) 조정지급률에 비례하여 근로시간 단축을 실시하며, 단축된 근로시간은 적치하여 사용한다. 다만, 적치할 수 있는 근로시간은 최대 ( ? )로 한다.","a":"3개월","src":"보수운영규정 제56조의2","art":"보수운영규정:56의2","alt":["3"]},{"id":"ne28a4bd1","t":23,"q":"【재무규정 제3조 세출재원의 근거】 대한적십자사의 세출은 차입금 이외의 세입으로써 그 재원으로 하여야 한다. 다만, 부득이한 경우에는 ( ? )의 의결을 얻은 금액범위에서 차입금으로 충당할 수 있다.","a":"중앙위원회","src":"재무규정 제3조","art":"재무규정:3","alt":[]},{"id":"n034d683d","t":23,"q":"【재무규정 제5조 채권등의  효력변경 승인】 대한적십자사의 채권을 면제하거나 그 효력을 변경하고자 할 경우에는 ( ? )의 승인을 거쳐 시행하여야 한다. 단, 다음 각 호에 해당하는 사항은 각 기관의 장이 처리할 수 있다.","a":"중앙위원회","src":"재무규정 제5조","art":"재무규정:5","alt":[]},{"id":"n79220aca","t":23,"q":"【재무규정 제7조 출납기간과 회계연도 소속 구분】 ①1회계연도에 속하는 세입세출의 출납에 관한 사무는 익년도 ( ? ) 31일까지 완결하여야 한다. 다만, 회비수입은 회계연도 개시전에도 수납할 수 있다.","a":"1월","src":"재무규정 제7조","art":"재무규정:7","alt":["1"]},{"id":"nef9c6516","t":23,"q":"【재무규정 제12조 예산안 편성 및 승인】 ⑤예산안은 매년도 ( ? ) 31일까지 편성하여야 한다. 다만, 회장은 필요한 경우 예산 안 확정기한(11월 30일)의 범위 내에서 편성시기를 조정할 수 있다.","a":"10월","src":"재무규정 제12조","art":"재무규정:12","alt":["10"]},{"id":"nbbc24394","t":23,"q":"【재무규정 제12조 예산안 편성 및 승인】 ⑥예산안의 확정은 매년도 ( ? ) 30일까지 운영위원회의 심의와 중앙위원회의 의결을 거쳐 전국대의원 총회의 승인을 받아야 한다.","a":"11월","src":"재무규정 제12조","art":"재무규정:12","alt":["11"]},{"id":"n9374b741","t":23,"q":"【재무규정 제13조 예산안 첨부서류】 ( ? ), 중앙위원회, 전국대의원총회에 제출하는 예산안에는 다음의 서류를 첨부하여야 한다.","a":"운영위원회","src":"재무규정 제13조","art":"재무규정:13","alt":[]},{"id":"n962d5411","t":23,"q":"【재무규정 제15조 계속비】 ①완성에 수년을 요하는 공사나 제조 및 연구개발사업은 경비의 총액과 연부액을 정하여 미리 ( ? )의 결의를 얻은 범위내에서 수년도에 걸쳐서 지출할 수 있다.","a":"중앙위원회","src":"재무규정 제15조","art":"재무규정:15","alt":[]},{"id":"n4ef00692","t":23,"q":"【재무규정 제15조 계속비】 ②지출할 수 있는 연한은 해당 회계연도로부터 ( ? )로 한다.","a":"5년 이내","src":"재무규정 제15조","art":"재무규정:15","alt":["5","5년"]},{"id":"n7efac6bf","t":23,"q":"【재무규정 제17조의3 적립금의 사용】 적립금을 사용하고자 할 때에는 본사 운영위원회의 사전 승인을 받아야 한다. 다만, 구호사업비축적립금과 ( ? )의 시설개량적립금의 경우 각 기관은 본사의 승인을 받아 우선 사용하고 매년도 결산 시 운영위원회에 보고하여야 한다.","a":"3억원 미만","src":"재무규정 제17조의3","art":"재무규정:17의3","alt":["3","3억원"]},{"id":"n7552df90","t":23,"q":"【재무규정 제17조의4 고유목적사업준비금】 「법인세법」 제29조에 규정한 고유목적사업준비금을 설정하고, 예산에 편성하여 사용함을 원칙으로 한다. 다만, 부득이한 경우 해당 ( ? )의 승인을 받아 사용할 수 있다.","a":"기관장","src":"재무규정 제17조의4","art":"재무규정:17의4","alt":[]},{"id":"n40302eaf","t":23,"q":"【재무규정 제17조의5 자금의 이용】 적립금, 기타 보유자금(보건기관 포함)의 이용에 있어 ( ? )은 기관의 재정상태를 평가하여 기관 상호간에 일정기간 자금을 이용할 수 있다.","a":"회장","src":"재무규정 제17조의5","art":"재무규정:17의5","alt":[]},{"id":"n5d620d47","t":23,"q":"【재무규정 제17조의6 사업발전준비금】 ①대한적십자사 사업의 지속성을 확보하고 적십자회비에 의존하는 이외의 사업을 수행하기 위하여 각 회계의 사업발전준비금을 설정하고 예산에 편성하여 사용함을 원칙으로 한다. 다만, 부득이한 경우 해당 ( ? )의 승인을 받아 사용할 수 있다.","a":"기관장","src":"재무규정 제17조의6","art":"재무규정:17의6","alt":[]},{"id":"n593983ec","t":23,"q":"【재무규정 제17조의6 사업발전준비금】 ②사업발전준비금의 재원은 매 회계연도의 적십자회비수입예산을 초과하여 수납된 일반회비 및 특별회비 중에서 교부금을 제외한 금액과 금융기관 예탁이자, 기타 ( ? )이 기금편입을 지정한 금액과 예산에 편성된 사업발전준비금편입액으로 한다.","a":"회장","src":"재무규정 제17조의6","art":"재무규정:17의6","alt":[]},{"id":"n124fb519","t":23,"q":"【재무규정 제18조 지정기부금품】 회계 연도 중에 외부로부터 사업을 지정하는 기부가 있을 때에는 ( ? )은 이를 집행하고 결산 시 운영위원회에 보고하여야 한다. 다만, 지사의 경우 결산 시 지사운영위원회에 이를 보고 하는 것으로 갈음한다.","a":"기관장","src":"재무규정 제18조","art":"재무규정:18","alt":[]},{"id":"n46006a1b","t":23,"q":"【재무규정 제18조의2 국고보조사업 지원금】 예산성립후 국고보조사업 지원금 증감으로 인한 예산의 변경은 관련 사업비 예산을 ( ? )이 조정 집행하고 결산 시 운영위원회에 보고하여야 한다.","a":"기관장","src":"재무규정 제18조의2","art":"재무규정:18의2","alt":[]},{"id":"n08305aef","t":23,"q":"【재무규정 제19조 세출예산의 이월】 ①세출예산중 경비의 성질상 연도내에 그 지출을 끝내지 못할 것이 예측될 때에는 그 취지를 세입세출예산에 명시하여 ( ? )의 승인을 얻어 다음 연도에 이월하여 사용할 수 있다.","a":"중앙위원회","src":"재무규정 제19조","art":"재무규정:19","alt":[]},{"id":"nbb7a9278","t":23,"q":"【재무규정 제20조 추가경정예산안】 ①예산성립후에 생긴 사유로 인하여 이미 성립된 예산에 변경을 가할 필요가 있을 때에는 추가경정예산안을 편성하고 그 사유와 실정을 명시한 서류를 첨부하여 ( ? )의 심의와 중앙위원회의 의결 및 전국대의원총회의 승인을 얻어야 한다.","a":"운영위원회","src":"재무규정 제20조","art":"재무규정:20","alt":[]},{"id":"n8ae6f240","t":23,"q":"【재무규정 제21조 예산의 목적외 사용금지】 ①세출예산이 정한 목적 이외에 경비를 사용하거나 예산이 정한 각 기관간·각 장은 상호 이용할 수 없다. 다만, 예산집행상 필요에 의하여 ( ? )의 의결을 얻었을 때에는 이용할 수 있다.","a":"중앙위원회","src":"재무규정 제21조","art":"재무규정:21","alt":[]},{"id":"n1a256cf1","t":23,"q":"【재무규정 제23조 예비비의 사용】 ①각 기관의 장은 제16조에 의한 예비비의 사용을 필요로 할 경우에는 그 사유, 금액과 추산의 기초를 명백히 한 명세서를 작성하여 해당 ( ? )의 승인을 얻어야 한다.","a":"기관장","src":"재무규정 제23조","art":"재무규정:23","alt":[]},{"id":"ne395217d","t":23,"q":"【재무규정 제25조 결산보고서 등의 작성 및 제출】 각 기관의 장은 매 회계연도 그 소관에 속하는 세입세출의 결산보고안, 계속비 결산보고서 등을 작성하여 ( ? ) 10일까지 본사에 제출하여야 한다.","a":"2월","src":"재무규정 제25조","art":"재무규정:25","alt":["2"]},{"id":"na580940b","t":23,"q":"【재무규정 제26조 세입세출결산의 작성】 ①세입세출의 결산은 ( ? ) 30일까지 운영위원회의 심의와 중앙위원회의 의결을 얻어야 한다.","a":"3월","src":"재무규정 제26조","art":"재무규정:26","alt":["3"]},{"id":"nf724b5f2","t":23,"q":"【재무규정 제26조 세입세출결산의 작성】 ③( ? ) 및 중앙위원회에 제출하는 세입세출 결산에는 세입세출결산보고서, 잉여금(결손금)처분계산서, 적립금보고서, 재무상태표, 사업실적보고서 및 부속서류를 첨부하여야 한다.","a":"운영위원회","src":"재무규정 제26조","art":"재무규정:26","alt":[]},{"id":"n8dd29f4b","t":23,"q":"【재무규정 제28조 세입의 총괄과 관리】 ②본사는 ( ? ), 지사는 사무처장, 혈액관리본부는 혈액관리본부장, 의료원은 의료원장, 본사 직할기관과 지사, 의료원 소속기관 및 혈액관리본부 소속기관은 기관의 장이 수입에 관한 사무를 관리한다. 다만, 지사회장은 지사 및 그 소속기관의 수입사무를 감독한다.","a":"사무총장","src":"재무규정 제28조","art":"재무규정:28","alt":[]},{"id":"nec46819a","t":23,"q":"【재무규정 제30조 지출의 총괄과 관리】 ②본사는 ( ? ), 지사는 사무처장, 혈액관리본부는 혈액관리본부장, 의료원은 의료원장, 본사 직할기관과 지사, 의료원 소속기관 및 혈액관리본부 소속기관은 기관의 장이 지출에 관한 사무를 관리한다. 다만, 지사회장은 지사 및 그 소속기관의 지출사무를 감독한다.","a":"사무총장","src":"재무규정 제30조","art":"재무규정:30","alt":[]},{"id":"n6328a8c6","t":23,"q":"【재무규정 제31조 지출원인행위】 ③각 ( ? ) 및 재무원은 계약 및 물건비를 제외한 각 부서의 일상경비에 한하여 관련 부서장과 그 차하위 직원에게 위임하여 지출원인행위를 담당하게 할 수 있다.","a":"기관장","src":"재무규정 제31조","art":"재무규정:31","alt":[]},{"id":"nfa4fd9a3","t":23,"q":"【재무규정 제40조 검사】 ③전조의 규정에 의한 감독의 직무와 제1항의 규정에 의한 검사의 직무는 겸할 수 없다. 다만, ( ? )이 정하는 경우에는 그러하지 아니하다.","a":"회장","src":"재무규정 제40조","art":"재무규정:40","alt":[]},{"id":"nef082247","t":23,"q":"【재무규정 제47조 출납절차】 ①금전을 수입할 때에는 소관업무를 담당하는 부서의 수입결의서를 제출받아 재무원의 ( ? )을 받고 입금전표 또는 입금전표집계표에 의해 수입처리 한다. 단, 관련 전산시스템과 연동하여 자동전표 처리되는 수입에 대하여는 수입결의서를 생략 할 수 있다.","a":"승인","src":"재무규정 제47조","art":"재무규정:47","alt":[]},{"id":"na02c0a9c","t":23,"q":"【재무규정 제51조 수입대체경비】 ②각 기관의 장은 전항의 규정에 의하여 예산을 초과하여 지출하고자 할 때에는 그 사유 및 금액을 명백히 하여 해당 ( ? )의 승인을 얻어야 한다.","a":"기관장","src":"재무규정 제51조","art":"재무규정:51","alt":[]},{"id":"ncac367b9","t":23,"q":"【재무규정 제51조의2 재해보상처리】 ①사업수행 중 발생한 사고피해자에 대한 보상금 지급을 위하여 보상충당부채 계정을 설정하며 ( ? )이 이를 집행하고 그 결과를 회장에게 보고한다.","a":"기관장","src":"재무규정 제51조의2","art":"재무규정:51의2","alt":[]},{"id":"ndc32c2ee","t":23,"q":"【재무규정 제52조 재무감사】 ①( ? )은 본사, 지사 및 관하 각 기관의 재무사무의 정확한 처리와 능률적인 개선지도를 위하여 재무사무 전반의 감사를 하여야 한다.","a":"회장","src":"재무규정 제52조","art":"재무규정:52","alt":[]},{"id":"n74f25385","t":23,"q":"【재무규정 제58조 특별기금의 설치】 ①사업운영상 필요할 때에는 ( ? )의 승인을 얻어 특별기금을 설치 운영할 수 있다.","a":"중앙위원회","src":"재무규정 제58조","art":"재무규정:58","alt":[]},{"id":"n56e600b1","t":23,"q":"【재무규정 제58조 특별기금의 설치】 ②회장은 재정운영상 필요한 경우에 각 기금을 전용할 수 있다. 다만, 특정목적을 지정한 기부금으로 조성된 금액은 전용대상에서 제외되며 전용규모는 기금의 ( ? )를 초과할 수 없고, 전용한 경우에는 차기 운영위원회에 보고하여야 한다.","a":"50%","src":"재무규정 제58조","art":"재무규정:58","alt":["50"]},{"id":"ncdaef92e","t":24,"q":"【여비규정 제6조 여비의 구분 계산】 여행도중 계급 또는 출장여비 계산에 변동사유가 발생하였을 경우에는 그 사유발생일을 기준으로 계산한다. 다만, 해당 직원 및 고용원이 이동중에 있는 경우에는 그 사유가 발생한 후 최초의 목적지에 도달한 날을 기준으로 구분하여 계산하며, 여행 여일이 ( ? )일 경우는 예외로 한다.","a":"7일 이내","src":"여비규정 제6조","art":"여비규정:6","alt":["7","7일"]},{"id":"n25f43150","t":24,"q":"【여비규정 제8조 여비의 결제와 정산 등】 ②국내 여행자 및 국외 여행자는 여행을 마친 날의 다음 날부터 기산하여 ( ? )일 이내에, 운임과 숙박비의 세부 사용내용을 확인할 수 있는 증거서류를 갖추어 회계 관계 직원에게 운임과 숙박비의 정산을 신청하여야 한다. 다만, 국외 여행자의 운임과 숙박비 정산 신청기한은 별도 지침이 정하는 바에 따라 연장할 수 있다.","a":"2주","src":"여비규정 제8조","art":"여비규정:8","alt":["2"]},{"id":"n494663fc","t":24,"q":"【여비규정 제16조 근무지내 출장】 ①근무지내 출장의 경우에는 ( ? ) 6시간 이상 계속 출장할 때에 한하여 별표 제3호에 정한 일비와 식비를 지급할 수 있다. 다만, 근무지내 출장의 경우에 식비는 정액의 100분의 50을 초과할 수 없다.","a":"1일","src":"여비규정 제16조","art":"여비규정:16","alt":["1"]},{"id":"nac96779e","t":24,"q":"【여비규정 제17조 이전비 및 가족여비】 ③가족여비는 부임의 명을 받은 당시의 가족 ( ? ) 다음 각 호의 구분에 따른 금액을 지급할 수 있다.","a":"1인마다","src":"여비규정 제17조","art":"여비규정:17","alt":["1","1인"]},{"id":"n420486d6","t":24,"q":"【여비규정 제17조 이전비 및 가족여비】 ③가족여비는 부임의 명을 받은 당시의 가족 1인마다 다음 각 호의 구분에 따… 2. 일비와 식비 : 본인에 상당한 금액의 ( ? ), 12세미만의 가족에게는 3분의 1에 상당한 금액","a":"3분의2","src":"여비규정 제17조","art":"여비규정:17","alt":["2/3"]},{"id":"n05ec7504","t":24,"q":"【여비규정 제18조 이전비의 지급 및 부담】 ②국내‧외 이전비를 지급 받고자 하는 직원은 전보 또는 파견명령을 받은 날 또는 기관이전이 완료된 날의 다음날부터 기산하여 ( ? )에 거주지의 변경 및 이사화물의 운송명세(이동구간, 이동거리, 운송비 등을 말한다)를 확인할 수 있는 증빙서류를 갖추어 새 근무기관에 이전비의 지급을 신청하여야 한다. 이 경우 전 근무기관과 새 근무기관이 협의하여 전 근무…","a":"6개월 이내","src":"여비규정 제18조","art":"여비규정:18","alt":["6","6개월"]},{"id":"n996b1ebb","t":24,"q":"【여비규정 제19조 가족여비의 지급 및 부담】 ①국내 가족여비를 지급받으려는 직원은 이전한 날의 다음 날부터 기산하여 ( ? )에 거주지의 변경 및 운임과 숙박비의 사용명세 등을 확인할 수 있는 증거서류를 갖추어 새 근무기관에 신청한다.","a":"6개월 이내","src":"여비규정 제19조","art":"여비규정:19","alt":["6","6개월"]},{"id":"n89769623","t":24,"q":"【여비규정 제19조 가족여비의 지급 및 부담】 ②국외 가족여비는 소속 기관에 신청하고, 직원의 자녀가 신체 및 정신상의 장애로 인해 독립적인 생계유지가 불가능한 경우를 제외하고는 취업으로 생활비를 벌고 있는 자녀나 만 ( ? )의 자녀에 대해서는 가족여비를 지급하지 아니한다.","a":"26세 이상","src":"여비규정 제19조","art":"여비규정:19","alt":["26","26세"]},{"id":"n062bd10c","t":24,"q":"【여비규정 제21조 출장중 상병】 출장자가 출장중 질병 기타 부득이한 사유로 출장일수를 초과하였을 경우에는 ( ? ) 또는 소속기관장은 해당 일비 및 숙박비를 지급할 수 있다. 다만, 의사의 진단서 또는 사유서를 제출하여야 한다.","a":"기관장","src":"여비규정 제21조","art":"여비규정:21","alt":[]},{"id":"n5feae15a","t":24,"q":"【여비규정 제22조 여비의 조정】 ①임원의 수행 또는 외빈안내 기타 특별한 사정으로 인하여 이 규정에서 정하는 여비로 충당하기 어렵다고 ( ? ) 또는 소속기관장이 인정할 때에는 그 초과분을 실비로 지급할 수 있다.","a":"기관장","src":"여비규정 제22조","art":"여비규정:22","alt":[]},{"id":"n367bdcf9","t":24,"q":"【여비규정 제22조 여비의 조정】 ②상급자를 포함한 ( ? )의 직원이 같은 목적으로 동행하여 출장하는 경우에 출장 목적 수행상 부득이하다고 인정되는 때에는 운임(국외여비를 제외한다), 숙박비 및 식비에 한하여 상급자와 동행에 필요한 별표 제1호의 차상급 여비를 지급할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 예외로 한다.","a":"2인 이상","src":"여비규정 제22조","art":"여비규정:22","alt":["2","2인"]},{"id":"n81c713b7","t":24,"q":"【여비규정 제25조 가산징수 등】 기관장 또는 소속기관장은 직원이 거짓이나 그 밖의 부정한 방법으로 여비를 받았을 때는 부정 수령액의 ( ? )에 해당하는 금액을 가산하여 징수한다.","a":"5배","src":"여비규정 제25조","art":"여비규정:25","alt":["5"]},{"id":"n3850d75d","t":25,"q":"【감사운영규정 제2조 정의】 이 운영규정에 사용되는 용어의 뜻은 다음과 같다. 2. “감사반”이란 해당 감사업무를 원활히 수행하기 위하여 ( ? )으로 임의 편성된 반을 말한다.","a":"2인 이상","src":"감사운영규정 제2조","art":"감사운영규정:2","alt":["2","2인"]},{"id":"n2eabcdd5","t":25,"q":"【감사운영규정 제2조 정의】 이 운영규정에 사용되는 용어의 뜻은 다음과 같다. 6. “관련기관의 장”이란 감사결과 처분요구를 받은 ( ? ) 또는 해당기관장을 말한다.","a":"사무총장","src":"감사운영규정 제2조","art":"감사운영규정:2","alt":[]},{"id":"ncb6687c2","t":25,"q":"【감사운영규정 제7조 종합감사의 주기 등】 ①종합감사의 주기는 ( ? )으로 하되, 감사 대상기관 임직원의 부정․비위 등으로 특별히 감사를 실시할 필요가 있는 때에는 감사를 앞당겨 실시 할 수 있다.","a":"3년","src":"감사운영규정 제7조","art":"감사운영규정:7","alt":["3"]},{"id":"n6533d18e","t":25,"q":"【감사운영규정 제12조 감사담당자의 권한】 ③( ? )은 정당한 사유 없이 이 규정에 따른 감사를 거부 또는 기피하거나 자료 제출요구에 따르지 아니한 직원에 대하여 징계를 요구할 수 있다.","a":"회장","src":"감사운영규정 제12조","art":"감사운영규정:12","alt":[]},{"id":"nb2736d0e","t":25,"q":"【감사운영규정 제13조 연간감사계획의 수립】 ②감사부서의 장은 제1항의 연간감사계획을 매년도 감사개시일 ( ? )까지 수립하고 회장의 결재를 받아 실시하여야한다. 이를 변경하고자 할 경우에도 동일한 절차에 의한다.","a":"15일 이전","src":"감사운영규정 제13조","art":"감사운영규정:13","alt":["15","15일"]},{"id":"n8d706d16","t":25,"q":"【감사운영규정 제15조 감사실시 통보 및 협조】 ①감사부서의 장은 감사대상・범위・기간 및 감사반 편성 등에 관한 사항을 감사실시 ( ? ) 전까지 감사대상기관에 구두 또는 별지 제1호 서식(감사실시통보서)으로 서면 통보하여야 한다. 다만, 감사목적상 특별한 사유가 있는 경우에는 그러하지 아니하다.","a":"14일","src":"감사운영규정 제15조","art":"감사운영규정:15","alt":["14"]},{"id":"n0ec4bce2","t":25,"q":"【감사운영규정 제17조 감사결과 보고 및 통보】 ①감사부서의 장은 제6조에 따른 감사를 실시하였을 경우에는 감사결과를 ( ? )에게 보고하고, 그 결과를 감사대상기관의 장에게 통보하여야 한다. 다만, 감사결과 처분조치 내용이 경미한 사항으로 판단되는 경우에는 이를 생략할 수 있다.","a":"회장","src":"감사운영규정 제17조","art":"감사운영규정:17","alt":[]},{"id":"n938b58f5","t":25,"q":"【감사운영규정 제18조 연간감사보고서】 감사부서의 장은 매 회계연도 경과 후 ( ? )에 직전년도 감사결과를 종합한 연간감사보고서를 작성하여 회장에게 보고하여야 한다.","a":"2개월 이내","src":"감사운영규정 제18조","art":"감사운영규정:18","alt":["2","2개월"]},{"id":"n00cc05eb","t":25,"q":"【감사운영규정 제19조 감사결과 처분요구】 ①( ? )은 감사결과 위법부당하거나 개선이 필요하다고 인정되는 사항이 있는 경우에는 이를 감사대상기관의 장 및 관련 기관의 장에게 다음 각 호의 요구를 할 수 있다.","a":"회장","src":"감사운영규정 제19조","art":"감사운영규정:19","alt":[]},{"id":"n0c89d637","t":25,"q":"【감사운영규정 제20조 처분요구에 대한 조치】 감사대상기관의 장 및 관련기관의 장은 제19조에 따른 처분요구를 받은 날부터 ( ? )에 필요한 시정 등 조치를 취하고, 처분요구에 대한 조치결과를 회장에게 보고하여야 한다.","a":"1개월 이내","src":"감사운영규정 제20조","art":"감사운영규정:20","alt":["1","1개월"]},{"id":"nee2b842a","t":25,"q":"【감사운영규정 제21조 이의신청】 ①감사결과를 통보받은 감사대상 기관의 장 및 제19조제1항제2호 및 제3호에 의거 처분대상에 해당하는 직원은 처분요구에 이의가 있을 때에는 처분요구를 받은 날로부터 ( ? )에 이의신청을 할 수 있다. 다만, 변상명령에 대한 불복에 관하여는 「회계관계직원 등의 책임에 관한 법률」 제6조제3항 내지 제5항에 따른다.","a":"15일 이내","src":"감사운영규정 제21조","art":"감사운영규정:21","alt":["15","15일"]},{"id":"n557ada1f","t":25,"q":"【감사운영규정 제21조 이의신청】 ③감사부서의 장은 제1항에 따른 이의신청을 검토하여 이의신청이 요건을 갖추지 못하였을 때에는 각하하고, 요건을 갖춘 이의신청에 대하여는 별도의 ( ? )를 통해 심의절차를 거쳐야 한다.","a":"심의위원회","src":"감사운영규정 제21조","art":"감사운영규정:21","alt":[]},{"id":"n67b38277","t":26,"q":"【국제인도법 머릿글 1) 머릿글】 “육전에 있어서의 군대의 부상자의 상태 개선”을 위한 최초의 제네바협약은 ( ? ) 채택되었으며 국제인도법(INTERNATIONAL HUMANITARIAN LAW, IHL)의 출발점이 되었다. 그 후 많은 조약이 그 뒤를 이었으며, 이들 조약은 모두 인간의 생명과 존엄을 보호하기 위해 마땅히 존중되어야 할 한계 내에서 전쟁이 수행되어야 한다는 기본 원칙을 골자로 하고 있다.","a":"1864년","src":"국제인도법 머릿글 1)","art":"국제인도법:머릿글 1)","alt":["1864"]},{"id":"n9ad41295","t":26,"q":"【국제인도법 머릿글 1) 머릿글】 전쟁의 성격은 ( ? ) 전 최초의 제네바협약이 채택된 이래 몰라볼 정도로 변했다. 최근 들어 무력충돌은 국가 사이에서가 아니라 국가 내에서 발생하고 있다. 오늘날 전쟁의 수단과 방법은 우리 선대들은 상상조차 하지 못했을 정도록 정교해졌다. 일례로 드론과 같은 무인 무기의 사용을 들 수 있다. 따라서 다음과 같은 의문이 드는 것도 당연하다. 과연 국제인도법은 이러한 변화에 부응하고 있는가?","a":"150년","src":"국제인도법 머릿글 1)","art":"국제인도법:머릿글 1)","alt":["150"]},{"id":"nf6a33279","t":26,"q":"【국제인도법 제1장 2) 용어의 정의】 ‘국제인도법’, ‘무력충돌법(LAW OF ARMED CONFLICT)' 및 ’전쟁법(LAW OF WAR)'은 ( ? )어로 사용될 수 있다.","a":"동의","src":"국제인도법 제1장 2)","art":"국제인도법:제1장 2)","alt":[]},{"id":"nf42f6627","t":26,"q":"【국제인도법 제1장 3) 제네바법과 헤이그법】 제네바법과 헤이그법은 이들이 처음으로 성문화된 도시에서 이름을 따왔다. 두 법을 하나로 묶는 제네바 제협약의 추가의정서가 ( ? ) 6월 8일 채택됨에 따라, 그 구분은 이제 역사적 및 학문적 의미만을 지니게 되었다.","a":"1977년","src":"국제인도법 제1장 3)","art":"국제인도법:제1장 3)","alt":["1977"]},{"id":"nb4c48cc6","t":26,"q":"【국제인도법 제1장 3) 제네바법과 헤이그법】 제네바법과 헤이그법은 이들이 처음으로 성문화된 도시에서 이름을 따왔다. 두 … 3. 제네바 제협약 : ( ? ) 발표된 4개의 제네바협약을 통틀어 칭하는 용어","a":"1949년","src":"국제인도법 제1장 3)","art":"국제인도법:제1장 3)","alt":["1949"]},{"id":"n9003900b","t":26,"q":"【국제인도법 제2장 1) 개요】 ( ? ) 유엔헌장에 명시된 국가 간 무력 사용 금지와 예외사항(정당방위 및 유엔이 승인한 무력 사용)이 주요 구성 요소이다.","a":"1945년","src":"국제인도법 제2장 1)","art":"국제인도법:제2장 1)","alt":["1945"]},{"id":"nab7c66bc","t":26,"q":"【국제인도법 제2장 1) 개요】 교전법/전시법(JUS IN BELLO)은 무력충돌에 가담하는 당사자의 행동을 구속한다. 국제인도법은 교전법/전시법과 ( ? )어이며 가능한 한 많이 무력충돌의 희생자를 보호하고 지원함으로써 무력충돌로 인한 고통을 최소화하는데 그 목적이 있다.","a":"동의","src":"국제인도법 제2장 1)","art":"국제인도법:제2장 1)","alt":[]},{"id":"n675bf52b","t":26,"q":"【국제인도법 제2장 2) 전쟁 금지에 대하여】 제( ? ) 세계대전이 종식되기 전까지 무력 사용은 불법 행위로 간주되지 않았고, 분쟁 해결을 위한 방법으로 용인되었다.","a":"1차","src":"국제인도법 제2장 2)","art":"국제인도법:제2장 2)","alt":["1"]},{"id":"n0e0462cb","t":26,"q":"【국제인도법 제2장 2) 전쟁 금지에 대하여】 ( ? ) 국제연맹규약(THE COVENANT OF THE LEAGUE OF NATIONS)과 1928년 파리조약(켈로그-브리앙 조약)은 전쟁을 불법으로 규정하고자 했다.","a":"1919년","src":"국제인도법 제2장 2)","art":"국제인도법:제2장 2)","alt":["1919"]},{"id":"n8d324968","t":26,"q":"【국제인도법 제2장 3) 국제인도법과 ‘보호책임’】 세계보호책임센터(GLOBAL CENTRE FOR THE RESPONSIBILITY TO PROTECT)는 ( ? ) 설립되었으며, ‘보호책임(RESPONSIBILITY TO PROTECT, R2P)’이라는 개념을 발전시키고 증진하는 데 있어 핵심적인 역할을 해왔다.","a":"2008년","src":"국제인도법 제2장 3)","art":"국제인도법:제2장 3)","alt":["2008"]},{"id":"ne369912f","t":26,"q":"【국제인도법 제2장 3) 국제인도법과 ‘보호책임’】 “보호책임은 국제사회가 집단살해 및 기타 형태의 잔악한 인권유린에 직면하여 반드시 행동할 수 있도록 하기 위한 원칙이다. 유엔총회 시 열린 ( ? ) 유엔 세계정상회의에서 국가 정상들은 보통 약자 “R2P\"로 표기하는 보호책임 원칙을 채택했다.","a":"2005년","src":"국제인도법 제2장 3)","art":"국제인도법:제2장 3)","alt":["2005"]},{"id":"nf9f2d3d9","t":26,"q":"【국제인도법 제3장 1) 개요】 고대부터 전쟁의 폐해로부터 개인을 지키고자 하는 노력(아래 박스 참고)은 계속되어 왔다. 하지만 ( ? )기 후반에 들어서야 무력충돌 피해자의 권리와 보호 등 전쟁을 규제하는 국제 조약이 등장했다.","a":"19세","src":"국제인도법 제3장 1)","art":"국제인도법:제3장 1)","alt":["19"]},{"id":"n58985e66","t":26,"q":"【국제인도법 제3장 2) 앙리 뒤낭의 말】 뒤낭 : 예를 들어 각기 다른 국적을 가진 전쟁 군주들이 특별히 만날 때처럼 … 이런 종류의 회의를 활용해 협약에서 ( ? )했기에 성격상 위반할 수 없는 국제적 원칙을 정하면 좋지 않겠는가?","a":"승인","src":"국제인도법 제3장 2)","art":"국제인도법:제3장 2)","alt":[]},{"id":"n26d8cf82","t":26,"q":"【국제인도법 제3장 3) 현대 국제인도법의 창시자는 누구인가?】 ( ? ) 이탈리아를 여행하던 뒤낭은 솔페리노 전투 후의 참담한 광경을 목격했다. 제네바로 돌아온 그는 자신의 경험을 ‘솔페리노의 회상’이라는 제목의 책으로 엮어 1862년 출간하게 되었다. 전쟁 경험이 있었던 뒤푸르 장군은 최초의 제네바협약이 채택된 1864년 외교회의의 의장을 맡음으로써 즉시 뒤낭의 이상을 적극적으로 지지하였다.","a":"1859년","src":"국제인도법 제3장 3)","art":"국제인도법:제3장 3)","alt":["1859"]},{"id":"nb7bc74fe","t":26,"q":"【국제인도법 제3장 3) 현대 국제인도법의 창시자는 누구인가?】 ( ? ) 귀스타브 므와니에, 루이 아삐아, 데오도르 모노아, 앙리 뒤낭, 기욤 앙리 뒤푸르는 '5인 위원회'라는 군 부상자 구호를 위한 국제위원회를 설립했다.","a":"1863년","src":"국제인도법 제3장 3)","art":"국제인도법:제3장 3)","alt":["1863"]},{"id":"nc98c0a8e","t":26,"q":"【국제인도법 제3장 4) 현대 국제인도법은 어떻게 탄생하게 되었나?】 ( ? ) 5인의 ICRC 설립자의 촉구에 스위스 정부는 외교회의를 소집했고, 16개국이 참석하여 육전에 있어서의 군대 부상자의 상태 개선에 관한 협약을 채택했다.","a":"1864년","src":"국제인도법 제3장 4)","art":"국제인도법:제3장 4)","alt":["1864"]},{"id":"n12434adb","t":26,"q":"【국제인도법 제3장 6) 성문화 이전의 국제인도법】 ( ? ) 적십자의 설립이나 1864년 최초의 제네바협약의 채택이 현재 우리가 알고 있는 국제인도법의 출발점이라고 생각한다면 그것은 잘못된 것이다. 자체 규칙을 보유하지 않은 사회란 없듯이 애매하든 명료하든 적대행위, 그리고 개전과 종전을 규율하는 규칙이 없는 전쟁은 사실상 없었다.","a":"1863년","src":"국제인도법 제3장 6)","art":"국제인도법:제3장 6)","alt":["1863"]},{"id":"nf886f2b8","t":26,"q":"【국제인도법 제3장 9) 그 외 기타】 마하브라타, 성경, 코란 등 여러 고문서에는 적을 존중하라는 내용의 규칙이 담겨있다. 일례로 아랍 민족의 스페인 지배가 정점에 달했던 ( ? )기 말에 쓰인 비가옛(VIGAYET)에도 전쟁 규칙으로 합당한 내용이 포함되어 있다.","a":"13세","src":"국제인도법 제3장 9)","art":"국제인도법:제3장 9)","alt":["13"]},{"id":"n09a68ca2","t":26,"q":"【국제인도법 제3장 10) 리버규칙(LIEBER CODE)】 전쟁의 시작에서부터 현대 국제인도법이 등장하기까지 적대행위를 규제하는 교전국 간 협정, 행동 강령, 규약 및 기타 문서가 ( ? ) 넘게 기록되어 있다. 여기에는 1863년 4월 발효된 리버규칙도 있다.","a":"500건","src":"국제인도법 제3장 10)","art":"국제인도법:제3장 10)","alt":["500"]},{"id":"n103c6c52","t":26,"q":"【국제인도법 제3장 10) 리버규칙(LIEBER CODE)】 리버규칙은 기존의 전쟁법 및 관습을 성문화하려는 첫 번째 시도라는 점에서 중요하다. 하지만 리버규칙보다 ( ? ) 후 채택된 최초의 제네바협약과 달리 미국 내전 중 북부 연방군에게만 적용되도록 하려는 것이었기 때문에 조약의 지위는 갖지 못했다.","a":"1년","src":"국제인도법 제3장 10)","art":"국제인도법:제3장 10)","alt":["1"]},{"id":"ndcb511b6","t":26,"q":"【국제인도법 제4장 1) 개요】 현대 국제인도법은 ( ? ) 최초의 제네바협약으로 탄생했다. 국제인도법은 무기 기술의 발달과 무력충돌의 성격 변화로 인해 점차 커져가는 인도적 지원의 필요를 충족시키기 위해 단계적으로 진화해왔다. 하지만 이러한 진화는 이를 절실히 필요로 하는 사건이 발생 한 후에나 도입되는 경우가 대부분이었다.","a":"1864년","src":"국제인도법 제4장 1)","art":"국제인도법:제4장 1)","alt":["1864"]},{"id":"n12f6ac2c","t":26,"q":"【국제인도법 제4장 3) 연혁 - 설명】 제( ? ) 세계대전(1914-1918) 동안 기존에 있었던 방법을 포함하여 다양한 전쟁 방법이 전례 없는 규모로 사용되었다. 독가스가 사용됐고 공습이 최초로 행해졌으며 수십만 명이 포로로 잡혔다. 1925년과 1929년 조약은 이러한 상황 전개에 따라 채택되었다.","a":"1차","src":"국제인도법 제4장 3)","art":"국제인도법:제4장 3)","alt":["1"]},{"id":"n9fc779fe","t":26,"q":"【국제인도법 제4장 3) 연혁 - 설명】 제1차 세계대전에서는 민간인과 군인 사망자 수 비율이 1:10이었으나 제( ? ) 세계대전(1939-1945)에서는 민간인과 군인 사망자의 수가 같았다. 1949년 국제사회는 이와 같은 충격적인 사상률, 더욱 정확히는 전쟁이 민간인에게 미치는 끔찍한 영향에 대응해 당시 발효 중이던 협약을 개정하고 새로이 민간인 보호를 위한 네 번째 제네바협약을 채택했다.","a":"2차","src":"국제인도법 제4장 3)","art":"국제인도법:제4장 3)","alt":["2"]},{"id":"n9fbe5bdf","t":26,"q":"【국제인도법 제4장 4) 관습국제인도법】 국제인도법은 주로 조약 채택과 관습법 형성을 통해 국가들이 발전시킨다. 관습… ○ 관습 : 제( ? )에서 분석한 규칙들에 대한 기본 관례를 담고 있다. ICRC가 영국적십자사와 협력하여 정기적으로 보정하고 있다. 근거 자료는 전 세계에서 활동 중인 ICRC 대표단과 국가별 적십자사 및 적신월사가 수집하고 케임브리지 대학의 라우터파하트 국제법센터의 연구원들이 취합한다.","a":"1부","src":"국제인도법 제4장 4)","art":"국제인도법:제4장 4)","alt":["1"]},{"id":"n5d9da713","t":26,"q":"【국제인도법 제6장 1) 1949년 제네바협약의 기원】 육전에 있어서의 군대 부상자의 상태 개선을 위한 제네바협약은 ( ? )에 채택되었으며 1906년과 1929년에 개정 및 발전되었다. 포로의 대우에 관한 협약 또한 1929년 채택되었다. 1934년에 도쿄에서 개최된 제15회 국제적십자회의는 ICRC가 작성한 초안을 바탕으로 한 교전 당사자의 영토 또는 교전자가 점령한 영역에서의 적국 민간인 보호에 대한 국제 협약문을 승인했다.","a":"1864년","src":"국제인도법 제6장 1)","art":"국제인도법:제6장 1)","alt":["1864"]},{"id":"n7756acf1","t":26,"q":"【국제인도법 제6장 1) 1949년 제네바협약의 기원】 그러나 각국 정부가 협약 채택을 결정하기 위한 외교회의의 소집을 거부함에 따라 협약문에 대한 그 어떤 조치도 취해지지 않았으며, 결국 도쿄 초안에 포함되어 있던 조항은 제( ? ) 세계대전 동안에는 적용되지 않았다. 제2차 세계대전이 끝난 1949년이 되어서야 국가들이 국제인도법의 초석이 되는 4개의 제네바협약을 채택했다.","a":"2차","src":"국제인도법 제6장 1)","art":"국제인도법:제6장 1)","alt":["2"]},{"id":"n69608c41","t":26,"q":"【국제인도법 제6장 2) 1977년 추가의정서의 기원】 ( ? ) 제네바 제협약은 국제인도법 발전에 있어 큰 진전이었다. 그러나 식민지 해방 후 냉전 동안 내전 및 민족해방전쟁의 발생 빈도가 크게 증가함에 따라 여기에도 적용 가능한 규칙이 필요해졌다. 더욱이 적대행위에 대한 조약규칙은 …","a":"1949년","src":"국제인도법 제6장 2)","art":"국제인도법:제6장 2)","alt":["1949"]},{"id":"n8bad37cf","t":26,"q":"【국제인도법 제6장 2) 1977년 추가의정서의 기원】 ( ? ) 제네바 제협약에 대한 세 번째 추가의정서가 채택되었다. 의정서는 적수정이라고 알려진 흰색 바탕에 세워 놓은 붉은 사각형 형태로 된 추가 표장을 인정하고 있다. 새 표장은 적십자 및 적신월을 대체하는 것이 아니라 사용 가능…","a":"2005년","src":"국제인도법 제6장 2)","art":"국제인도법:제6장 2)","alt":["2005"]},{"id":"n643db6b5","t":26,"q":"【국제인도법 제6장 3) 제네바 제협약과 추가의정서의 내용】 제1추가의정서는 국제적 무력충돌 시 ( ? ) 제네바협약이 제공하는 보호를 보완한다. 예를 들어 부상자, 병자, 조난자 및 민간인 의무요원을 보호한다. 또한 실종자를 수색하고 민간인에게 인도적 지원을 제공할 의무에 대한 규칙을 포함하고 있다. 법적 지위에 상관없이 모든 사람에게 기본적인 사항을 보장한다. 또한 제1추가의정서는 민간인 주민을 적대행위의 폐해로부터 보호하기 위한 여러 규정을 성문화했다.","a":"4개","src":"국제인도법 제6장 3)","art":"국제인도법:제6장 3)","alt":["4"]},{"id":"nb51ea85e","t":26,"q":"【국제인도법 제7장 7) 특별한 보호를 요하는 여성과 아동】 아동은 이들이 필요로 하는 보살핌과 지원을 받아야 한다. ( ? ) 아동이 적대행위에 직접 가담하는 것을 방지하고 무력충돌로 인해 고아가 되었거나 가족과 떨어지게 된 경우 자력으로 살아가게 방치되지 않도록 활용 가능한 모든 조치를 취해야 한다.","a":"15세 미만","src":"국제인도법 제7장 7)","art":"국제인도법:제7장 7)","alt":["15","15세"]},{"id":"nbe37893a","t":26,"q":"【국제인도법 제7장 7) 특별한 보호를 요하는 여성과 아동】 그들의 부양, 종교생활 및 교육은 어느 경우에나 용이해야 한다. 자유를 박탈당한 아동은 가족 단위 수용시설을 제외하고 성인과 분리된 숙소에 수용해야 한다. 또한 범행 당시 나이가 ( ? )인 자에 대해서는 사형이 집행되어서는 안 된다.","a":"18세 미만","src":"국제인도법 제7장 7)","art":"국제인도법:제7장 7)","alt":["18","18세"]},{"id":"n244bfa31","t":26,"q":"【국제인도법 제8장 2) 국가와 그 의무】 제네바협약과 추가의정서와 같은 국제 조약의 당사자가 될 수 있는 주체는 국가로 한정된다. ( ? ) 11월 기준, 195개 국가가 제네바 제협약의 당사자가 됐고 제네바 제협약이 거의 모든 국가에서 보편적으로 비준되었다는 사실은 그 중요성을 잘 보여주고 있다.","a":"2013년","src":"국제인도법 제8장 2)","art":"국제인도법:제8장 2)","alt":["2013"]},{"id":"nd4165960","t":26,"q":"【국제인도법 제8장 2) 국가와 그 의무】 ( ? ) 3월 기준, 173개국이 제1추가의정서의 당사자가 됐고, 제2추가의정서는 167개국, 제3추가의정서는 66개국이 당사자가 되었다.","a":"2014년","src":"국제인도법 제8장 2)","art":"국제인도법:제8장 2)","alt":["2014"]},{"id":"nfda56c56","t":26,"q":"【국제인도법 제8장 6) 평화유지 활동】 평화유지 활동의 목적은 정전 및 분계선이 지켜지도록 보장하고 군대 철수 협정을 체결하는 것이다. 지난 몇 년간 평화유지 활동의 범위가 확대되어 선거 감독, 인도적 구호물품 전달, 국가화해 과정 지원 제공 등 다른 활동도 포함하게 되었다. 평화유지군의 구성원은 자기방어를 위해서만 무력을 사용할 수 있다. 평화유지 활동은 관련 당사자의 ( ? )가 있어야 수행할 수 있다.","a":"동의","src":"국제인도법 제8장 6)","art":"국제인도법:제8장 6)","alt":[]},{"id":"nc1b5f3de","t":26,"q":"【국제인도법 제8장 7) 평화집행 활동】 유엔헌장 제7장에 따르며, 관련국의 요청을 받거나 유엔안보리의 ( ? )이 있을 시, 유엔군 또는 개별 국가, 다수의 국가, 또는 지역 기구가 수행한다. 평화집행군은 전투 임무를 부여받기 때문에 임무수행을 위하여 강제적인 수단을 사용할 수 있다. 이때 관련 당사자의 동의는 필요하지 않다.","a":"승인","src":"국제인도법 제8장 7)","art":"국제인도법:제8장 7)","alt":[]},{"id":"n865c8712","t":26,"q":"【국제인도법 제9장 3) 국제인도법의 기원】 국제인도법의 기원은 아주 오래되었으나, ICRC의 설립자인 앙리 뒤낭의 영향을 받아서 ( ? )기 후반에 들어서 성문화되었다.","a":"19세","src":"국제인도법 제9장 3)","art":"국제인도법:제9장 3)","alt":["19"]},{"id":"neacbfde7","t":26,"q":"【국제인도법 제9장 3) 국제인도법의 기원】 … 최근에 만들어진 법체계이다. 그 기원은 특정 계몽운동(예 : 1776년 미국의 독립선언, 1789년 프랑스의 인간과 시민에 관한 권리 선언)의 사상에 영향을 받은 국가인권선언에 있다. 제( ? ) 세계대전 후에야 유엔의 후원 하에 국제법의 일부로 인권법이 등장하게 되었다. 1948년 세계인권선언은 국제적 수준에서 구속력을 갖지 않는 유엔 총회 결의안에서 인권법을 최초로 정의했다. 1966년이 되어서야 이 선언이 보…","a":"2차","src":"국제인도법 제9장 3)","art":"국제인도법:제9장 3)","alt":["2"]},{"id":"n87dce0ef","t":26,"q":"【국제인도법 제9장 9) 국제인도법과 인권법의 상호 작용】 ( ? ) 핵무기 위협 및 사용의 적법성에 대한 권고적 의견에서 무력충돌 상황에서의 인권 적용에 대해 처음으로 언급하면서, 국제사법재판소는 시민적 및 정치적 권리에 대한 국제규약에서 명시하는 보호는 전시에도 중단되지 않으며 원칙적으…","a":"1996년","src":"국제인도법 제9장 9)","art":"국제인도법:제9장 9)","alt":["1996"]},{"id":"nc85251ef","t":26,"q":"【국제인도법 제10장 3) 국제적 무력충돌 시 민간인 피억류자】 절차상 안전장치와 관련해 민간인 피억류자는 억류 사유를 통지받고 가능한 신속히 적절한 법원 또는 행정기관에서 결정을 재심사 받을 수 있어야 하며, 억류 결정이 유지될 경우 정기적으로 그리고 최소한 연 ( ? )씩 재심사 받을 수 있어야 한다.","a":"2회","src":"국제인도법 제10장 3)","art":"국제인도법:제10장 3)","alt":["2"]},{"id":"n3cacbcd3","t":26,"q":"【국제인도법 제11장 6) 적대행위에 대한 직접 가담】 …행위에 직접 가담했을 때와 가담하는 기간을 제외하고는 공격으로부터 보호받는다. 이것이 실제로 의미하는 바를 분명하게 하고자 ICRC는 전문가 회의를 여러 차례 갖고 관련 논의를 진행했다. ( ? ) ICRC는 관련 논의를 바탕으로 ‘적대행위 직접 가담에 대한 국제인도법 해석 지침'을 출간했다. 이 해석 지침은 민간인이 무력충돌 당사자들 사이에서 적대행위의 일환으로 특정 행동을 했을 경우 그는 적대행위에 직접 가담한 …","a":"2009년","src":"국제인도법 제11장 6)","art":"국제인도법:제11장 6)","alt":["2009"]},{"id":"nd6443f8e","t":26,"q":"【국제인도법 제11장 6) 적대행위에 대한 직접 가담】 민간인은 적대행위에 직접 가담했을 때와 가담하는 기간을 제외하고는 공격으로부… 1. 행동이 특정한 위해 수준에 도달해야 한다. 이는 행동이 교전 당사자의 군사작전 또는 군사력에 악영향을 줄 수 있는 경우를 의미한다. 또한 민간인을 살상하거나, ( ? )의 전투력을 상실시키거나, 민간 물자를 파괴하는 행동도 포함된다.","a":"전원","src":"국제인도법 제11장 6)","art":"국제인도법:제11장 6)","alt":[]},{"id":"nfe327388","t":26,"q":"【국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5) 기타 재래식 무기】 ( ? ) 과도한 상해 또는 무차별적 효과를 초래할 수 있는 특정재래식무기의 사용금지 또는 제한에 관한 협약(CCW) 또한 특정 무기를 금지하거나 제한하고 있다.","a":"1980년","src":"국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5)","art":"국제인도법:국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5)","alt":["1980"]},{"id":"n1fa1d6be","t":26,"q":"【국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5) 기타 재래식 무기】 • 특정재래식무기 협약 제2의정서는 지뢰(대인지뢰와 대차량지뢰 모두), 부비트랩 및 기타 유사한 장치의 사용을 금지하거나 제한한다. 이 의정서는 ( ? ) 개정되어 새로운 규정이 추가되었다.","a":"1996년","src":"국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5)","art":"국제인도법:국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 5)","alt":["1996"]},{"id":"n50049003","t":26,"q":"【국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 6) 화학무기와 생물학무기】 국제사회는 제( ? ) 세계대전 이후 화학무기와 생물학무기의 사용을 금지했다.(질식성, 독성 또는 기타 가스 및 세균학적 전쟁 수단의 전시 사용 금지에 관한 1925년 의정서)이들 무기의 사용 외에도 1972년(생물무기협약)과 1993년(화학무…","a":"1차","src":"국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 6)","art":"국제인도법:국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 6)","alt":["1"]},{"id":"n860e9169","t":26,"q":"【국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7) 핵무기】 핵무기 사용을 포괄적으로 또는 보편적으로 금지하는 경우는 없다. ( ? ) 핵무기비확산조약은 기본적으로 핵무기의 확산을 방지하고 핵군축 달성을 돕는 것을 목적으로 한다.","a":"1968년","src":"국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7)","art":"국제인도법:국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7)","alt":["1968"]},{"id":"nc5531661","t":26,"q":"【국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7) 핵무기】 그러나 ( ? ) 국제사법재판소는 권고적 의견에서 핵무기에 국제인도법이 적용되며, 특히 구별의 원칙과 불필요한 고통 유발 금지 원칙이 적용된다고 밝혔다. 이러한 관련 규칙을 핵무기에 적용함에 있어 국제사법재판소는 “핵무기의 위협 또는 사용…","a":"1996년","src":"국제인도법 국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7)","art":"국제인도법:국제인도법은 전쟁의 수단과 방법을 어떻게 규제하고 있나? 7)","alt":["1996"]},{"id":"nd0b63315","t":26,"q":"【국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 1) 개요】 적십자, 적신월, 적사자태양, 적수정 표장은 국제적으로 ( ? )된 표지로서, 무력충돌 시 국제인도법에 따라 부상자와 병자에게 제공되는 중립적이고 공평한 원조와 보호를 시각적으로 표현한 것이다. 이들 표장은 두 가지 기능을 한다. 첫째, 무력충돌 시 의무요원, 의무부대 및 의무 수송수단…","a":"승인","src":"국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 1)","art":"국제인도법:표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 1)","alt":[]},{"id":"n8aed32ca","t":26,"q":"【국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 2) 보호 장치로서의 사용】 표장은 기본적으로 지상, 해상, 공중에서 의무부대가 보호 장치로서 사용하기 위한 것이다. 게다가 관련 공기관의 명시적 ( ? ) 및 그 통제 하에 무력충돌 시 부상자, 병자 및 조난자의 치료와 간호를 담당하는 민간 의무요원, 병원과 기타 민간 의무대 및 수송수단 또한 보호 표장을 사용할 수 있다. 표장은 무력충돌 시 특정 사람 및 물자에 대한 보호…","a":"허가","src":"국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 2)","art":"국제인도법:표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 2)","alt":[]},{"id":"n62a654a4","t":26,"q":"【국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 4) 표장의 남용】 • 부적절한 사용 - 권한 없는 개인이나 단체(상업적 기업, 의료 시설 또는 약국, 비정부기구 혹은 개인 등)가 표장을 사용하는 경우, 또한 국제인도법 규칙에 따라 표장 사용을 ( ? )받은 사람이 이를 사용하지 못한 경우도 부적절한 사용에 해당함","a":"허가","src":"국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 4)","art":"국제인도법:표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 4)","alt":[]},{"id":"nd462c273","t":26,"q":"【국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 6) 표장 / 1. 적십자, 적신월, 적사자태양】 ( ? ) 제3추가의정서에서 추가 승인된 식별표장은 적수정(그림 2)이다. 적수정 표장은 제네바 제협약에 정의된 다른 표장들과 동일한 조건에서 사용되고 같은 목적을 수행하며, 적십자나 적신월의 표시를 원치 않는 국가에 대안을 제공한다.","a":"2005년","src":"국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 6)","art":"국제인도법:표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 6)","alt":["2005"]},{"id":"n202355e2","t":26,"q":"【국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 8) 표장 / 3. 적십자, 적신월 그리고 적십자와 적신월을 나란히 사용한 경우】 …두 가지 조건을 충족하는 다른 표장은 다윗의 붉은 방패(RED SHIELD OF DAVID)가 유일하다. 이 표장은 이스라엘의 적십자사 마겐 다비드 아돔(MAGEN DAVID ADOM)이 ( ? )대부터 사용해 왔다.(그림 4)","a":"1930년","src":"국제인도법 표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 8)","art":"국제인도법:표장의 사용 및 보호와 관련된 국제인도법 조항에는 무엇이 있나? 8)","alt":["1930"]},{"id":"n03eca7b3","t":26,"q":"【국제인도법 제14장 6) 국제인도법은 강제실종을 어떻게 다루고 있나?】 “국가 요원 혹은 국가의 ( ? ), 지원 또는 묵인 하에 행동하는 개인이나 단체에 의한 체포, 구금, 납치 또는 기타 형태의 자유의 박탈을 말하며, 이후, 자유의 박탈을 인정하기를 거부하거나 실종자의 생사 또는 행방을 은폐하여 실종자가 법의 보호를 받지 못하게 됨”","a":"승인","src":"국제인도법 제14장 6)","art":"국제인도법:제14장 6)","alt":[]},{"id":"n1d9fcbf0","t":26,"q":"【국제인도법 제14장 8) 중앙심인국】 …인 피억류자에 대해서는 제4제네바협약 제140조 참조) 중앙포로정보국은 ICRC에서 관장하며, 비포로, 민간인, 난민 등 다른 부류의 사람을 포함하는 정보국의 모든 활동을 반영하기 위하여 ( ? ) 중앙심인국으로 개명되었다.","a":"1960년","src":"국제인도법 제14장 8)","art":"국제인도법:제14장 8)","alt":["1960"]},{"id":"n7d0fa8f4","t":26,"q":"【국제인도법 제15장 1) 개요】 국제법에 따라 국가는 자신의 지배하에 있는 민간인 및 민간인 대중의 기본적인 필요가 충족되도록 보장할 ( ? )적인 책임을 부담한다. 그러나 국가가 책임을 이행할 수 없거나 그러할 의향이 없는 경우 국제인도법은 관련 국가의 동의하에 인도주의 기관과 같은 다른 주체가 구호 활동을 하는 것을 허용한다. 임무수행을 위해 인도주의 기관들은 피해자에게 신속하고 제한 없이 접근할 수 있어야 할 것이다.","a":"1차","src":"국제인도법 제15장 1)","art":"국제인도법:제15장 1)","alt":["1"]},{"id":"naf30f450","t":26,"q":"【국제인도법 제15장 1) 개요】 인도주의 지원에 관한 법체계는 제네바 제협약과 ( ? ) 추가의정서뿐만 아니라 관습국제인도법에서도 찾아볼 수 있다. 인도적 접근 및 지원에 대한 국제인도법 규칙은 첫째로 민간인 대중이 공급받지 못하는 경우 구호활동이 승인될 수 있으며 점령 상황에서는 반드시 허가되어야 한다고 규…","a":"1977년","src":"국제인도법 제15장 1)","art":"국제인도법:제15장 1)","alt":["1977"]},{"id":"nc37b38a6","t":26,"q":"【국제인도법 제15장 2) 구호 활동을 수행할 의무】 • 비국제적 무력충돌 시에도 위의 규칙이 동일하게 적용된다. 그러나 비국가 무장단체가 지배하는 영토의 민간인을 위한 구호일 경우 영토 국가의 ( ? )가 필요한지에 대해서는 논의의 여지가 있다.","a":"동의","src":"국제인도법 제15장 2)","art":"국제인도법:제15장 2)","alt":[]},{"id":"nb227d699","t":26,"q":"【국제인도법 제15장 4) 국제인도법과 ‘인도적 근거로 개입할 수 있는 권리’】 ( ? )에 발간된 ICRC의 관습법에 대한 연구서에서 인도적 지원 제공에 대한 규칙을 다음과 같이 확인했다. 이들 규칙은 국제적 및 비국제적 무력충돌에 모두 적용된다.","a":"2005년","src":"국제인도법 제15장 4)","art":"국제인도법:제15장 4)","alt":["2005"]},{"id":"n7b582a1f","t":26,"q":"【국제인도법 제15장 4) 국제인도법과 ‘인도적 근거로 개입할 수 있는 권리’】 • 충돌 당사자는 ( ? )받은 인도적 구호요원에게 임무 수행에 필요한 이동의 자유를 보장해야 한다. 긴급한 군사상 필요가 있을 경우에만 요원들의 이동이 임시적으로 제한될 수 있다.","a":"허가","src":"국제인도법 제15장 4)","art":"국제인도법:제15장 4)","alt":[]},{"id":"n99187acb","t":26,"q":"【국제인도법 제16장 2) 보편적인 조약】 그러나 국내 실향민이 필요한 보호를 구체적으로 다루는 보편적인 조약은 없다. ( ? ) 12월 발효된 아프리카 국내 실향민의 보호 및 지원에 관한 협약(캄팔라협약)은 국내 실향민의 보호 및 지원 문제를 다룬 최초의 국제협약이다. 국내 실향민은 국내법, 인권법, 그리고 무력충돌 중인 국가에 있는 경우 국제인도…","a":"2012년","src":"국제인도법 제16장 2)","art":"국제인도법:제16장 2)","alt":["2012"]},{"id":"n27dd6b8c","t":26,"q":"【국제인도법 제16장 4) 난민이란?】 ( ? ) 의정서로 개정된 난민의 지위에 관한 협약 제 1조는 ‘난민’을 “인종, 종교, 국적, 특정 사회집단의 구성원 신분 또는 정치적 의견을 이유로 박해를 받을 수 있는 합리적인 근거가 있는 공포로 인하여, 자신의 국적국 밖에 …","a":"1967년","src":"국제인도법 제16장 4)","art":"국제인도법:제16장 4)","alt":["1967"]},{"id":"n880fc6c0","t":26,"q":"【국제인도법 제17장 2-3) 국제인도법과의 관계】 …수단의 특별한 보호는 부상자 및 병자가 간호 받을 수 있도록 보장하기 위해 제공되는 보호의 부수적인 형태이다. 의무부대 및 의무수송수단에 대한 국제인도법의 보호는 오랜 역사를 갖고 있다. ( ? ) 제네바협약 또는 1899년과 1907년 헤이그협약에서 그 내용을 찾을 수 있다. 군의무부대 및 의무수송수단, 민간 병원 및 기타 의무수송수단에 대해서는 제1제네바협약과 제4제네바협약에서는 더욱 자세히 서술되었다. 1977…","a":"1864년","src":"국제인도법 제17장 2-3)","art":"국제인도법:제17장 2-3)","alt":["1864"]},{"id":"nb884b07a","t":26,"q":"【국제인도법 제17장 2-4) 존중과 보호】 …된 경우 보호받을 수 없으며, 공격 대상이 될 수 있다. 하지만 이들을 공격하기 전에 사전 경고가 있어야 하고, 적절할 때마다 상당한 시한을 설정해야 한다. 경고가 무시된 경우에만 공격이 ( ? )될 수 있다. 적에게 위해가 되는 행위의 예에는 건강한 전투원을 피신시키거나 무기 또는 탄약을 저장하기 위해, 혹은 군감시 초소 또는 군사 행동에 대한 방패로 의무부대를 사용하는 경우가 포함된다. 그러나 군사 목표물에 대한…","a":"허가","src":"국제인도법 제17장 2-4)","art":"국제인도법:제17장 2-4)","alt":[]},{"id":"n6d468278","t":26,"q":"【국제인도법 제17장 3-3) 국제인도법과의 관계】 문화재를 특별히 보호하기 위한 법적 근거는 ( ? ) 헤이그협약, 1954년 무력충돌 시 문화재 보호를 위한 협약 및 그 의정서, 1977년 추가의정서에서 확인할 수 있다. 또한 문화재를 존중하고 보호할 의무는 국제적 및 비국제적 무력충돌을 관장하는 관습법에도 존재한다.","a":"1907년","src":"국제인도법 제17장 3-3)","art":"국제인도법:제17장 3-3)","alt":["1907"]},{"id":"n52bf17c0","t":26,"q":"【국제인도법 제17장 3-4) 존중과 보호】 • ( ? ) 문화재보호에 대한 헤이그협약은 첫째, 청색과 흰색의 방패(옆 그림)로 재산을 표시할 것을 장려함으로써 인류 문화유산에 있어 매우 큰 중요성을 갖는 것으로 여겨지는 재산에 대한 보호를 강화하려 했다.","a":"1954년","src":"국제인도법 제17장 3-4)","art":"국제인도법:제17장 3-4)","alt":["1954"]},{"id":"n448266fe","t":26,"q":"【국제인도법 제17장 3-4) 존중과 보호】 제2의정서는 이에 더하여 이러한 필요성 여부는 특정 수준의 지휘체계에서 수립되고 공격 시 상황이 ( ? )되는 한 유효한 사전 경고가 내려지도록 규정하고 있다. 제1추가의정서 제53조 제1항 및 제2추가의정서 제16조는 여기서 더 나아가 긴급한 군사적 필요가 있더라도 예외사항을 두지 않는다. 이들 조문은 제한된 범위의 매우 중…","a":"허가","src":"국제인도법 제17장 3-4)","art":"국제인도법:제17장 3-4)","alt":[]},{"id":"n23cada51","t":26,"q":"【국제인도법 제17장 4-3) 국제인도법과의 관계】 마지막으로 ( ? ) 환경 변경 기술의 군사적 또는 기타 적대적 사용의 금지에 관한 협약(Environmental Modification, ENMOD)은 무력충돌 시 환경을 한층 더 보호하고 있다. ENMOD는 다른 당사국을 파괴, 피해 또는…","a":"1976년","src":"국제인도법 제17장 4-3)","art":"국제인도법:제17장 4-3)","alt":["1976"]},{"id":"nab8f6b3d","t":26,"q":"【국제인도법 제18장 2) 소위 ‘테러와의 전쟁’은 무엇인가?】 …국제인도법에 비추어 이것이 수사적 기교인지 법적 의미에서 세계적 무력충돌을 의미하는지 검토할 필요성이 있다. ICRC는 이용 가능한 사실에 기초하여, 현재 세계전이 벌어지고 있다는 견해에 ( ? )하지 않는다. 흔히 ‘테러와의 전쟁’이라고 불리는 폭력 상황의 법적 분류에 대해서는 사례별 접근 방식을 취하고 있다. 간단히 말해서 폭력의 수준이 국제적이든 비국제적이든지 무력충돌 수준에 육박하는 경우 국제인도법을 적용할 …","a":"동의","src":"국제인도법 제18장 2)","art":"국제인도법:제18장 2)","alt":[]},{"id":"na8f7552f","t":26,"q":"【국제인도법 제18장 2) 소위 ‘테러와의 전쟁’은 무엇인가?】 예를 들어 2001년 ( ? ) 11일 미국에 대한 공격 이후 시작된 테러리즘에 대한 투쟁 중 어떤 부분들은 국제인도법에서 정의하는 무력충돌에 해당된다. 일례로 미국 주도의 연합군이 아프가니스탄에서 2001년 10월 시작한 전쟁을 들 수 있다. 제네바 …","a":"9월","src":"국제인도법 제18장 2)","art":"국제인도법:제18장 2)","alt":["9"]},{"id":"n5c787f9b","t":26,"q":"【국제인도법 제19장 1) 개요】 국제인도법의 이행, 즉 규칙을 행동으로 옮길 책임은 제( ? )적으로 제네바제협약과 그 추가의정서의 당사국들에게 있다. 모든 상황에서 국가는 제협약을 존중하고 존중되도록 해야 한다는 4개 제네바협약의 공통 제 1조에 이러한 책임이 명시되어 있다.","a":"1차","src":"국제인도법 제19장 1)","art":"국제인도법:제19장 1)","alt":["1"]},{"id":"ne60e94d4","t":26,"q":"【국제인도법 제19장 4) 2. 분쟁 기간 동안 국제인도법 준수를 감시하기 위한 조치 및 장치】 • 이익보호국 또는 그 대리 - 이익보호국은 적국에서 충돌 당사자와 그 국민의 이익을 보호하기 위해 ( ? )된 중립국이다. 이익보호국의 역할은 피해자를 원조하기 위한 구호 및 보호 활동을 수행하고 국제인도법 준수를 감독(예 : 포로 또는 민간인 피억류자 방문)하는 것이다. ‘공정과 효율성을 전적으로 보장’하는 국제기구는 이익보호국을 대신할 수 있다.","a":"임명","src":"국제인도법 제19장 4)","art":"국제인도법:제19장 4)","alt":[]},{"id":"n3698532e","t":26,"q":"【국제인도법 제19장 4) 2. 분쟁 기간 동안 국제인도법 준수를 감시하기 위한 조치 및 장치】 • 국제인도주의사실조사위원회 - 제( ? )추가의정서의 제90조에 따라 설립된 본 위원회는 제네바 제협약 또는 제1추가의정서의 중대한 위반 혐의 또는 기타 심각한 위반에 대하여 심문하고 위원회의 주선을 통하여 제네바 제협약에 대한 존중 회복을 촉진할 수 있다. 위원회의 공식 권한은 국제적 무력충돌 상황에만 적용되나, 위원회는 당사자들이 동의할 시에는 비국제적 무력충돌과 관련된 조사를 수행할 의향을 표명한 바 있다.","a":"1차","src":"국제인도법 제19장 4)","art":"국제인도법:제19장 4)","alt":["1"]},{"id":"n8cb03ee0","t":26,"q":"【국제인도법 제20장 2) ICRC의 임무】 ( ? )에 설립된 ICRC는 제네바협약과 국제적십자운동의 기원이기도 하다. ICRC는 무력충돌 및 기타 폭력 사태 발생 시 국제적십자운동의 구성원들이 수행하는 국제 활동을 지휘하고 조정한다.“","a":"1863년","src":"국제인도법 제20장 2)","art":"국제인도법:제20장 2)","alt":["1863"]},{"id":"nd3176631","t":26,"q":"【국제인도법 제20장 7) 국제인도법에 대한 존중 감시 및 교전 당사자에 의무 상기】 ( ? ) 제네바협약과 이에 대한 추가의정서에 따라서 ICRC는 무력충돌 시 이행할 특별한 임무를 부담한다. 국제적 무력충돌 시 ICRC는 포로와 민간인 피억류자의 대우 및 구금 조건이 국제인도법에 부합하도록 보장하기 위해 이들을 …","a":"4개","src":"국제인도법 제20장 7)","art":"국제인도법:제20장 7)","alt":["4"]},{"id":"n340f7180","t":26,"q":"【국제인도법 제20장 8) 국제인도법의 발전】 …논의와 수정을 거친 후 최종 채택되었다. ICRC는 또한 새로운 규칙에 합의할 가능성 또는 국제인도법 강화 가능성을 확인하기 위해 국가 및 기타 이해당사자와 협의를 진행한다. 예를 들어 제( ? ) 국제적십자 전체회의 및 제1결의안 “무력충돌 피해자에 대한 법적 보호 강화” 채택 후 ICRC는 구금 분야에서 국제인도법을 강화하고 국제인도법 준수를 강화하기 위해 국가들과 협의했다. (질문 10과 19참조)","a":"31차","src":"국제인도법 제20장 8)","art":"국제인도법:제20장 8)","alt":["31"]},{"id":"n3da59bd5","t":26,"q":"【국제인도법 제21장 1) 개요】 전쟁범죄는 국제적 또는 비국제적 무력충돌 시 범해지는 심각한 국제인도법 위반이다. 전쟁범죄의 정의 및 목록은 제( ? ) 세계대전 이후 뉘른베르크에 설치된 국제군사재판소의 규정, 제네바 제협약과 추가의정서, 舊 유고 국제형사재판소와 르완다 국제형사재판소의 규정 및 판례법, 국제형사재판소의 로마규정 및 기타 국제적 또는 ‘혼합’ 재판소 등에서 찾을 수 있다.","a":"2차","src":"국제인도법 제21장 1)","art":"국제인도법:제21장 1)","alt":["2"]},{"id":"n5e6333dc","t":26,"q":"【국제인도법 제21장 5) 국제재판소의 역할은 무엇인가?】 로마규정에 따라 국가들이 설립한 국제형사재판소(International Criminal Court, ICC)는 ( ? ) 7월 1일 출범했다. 재판소 설립은 전쟁범죄, 집단살해, 인도에 반한 죄 및 침략범죄가 처벌되지 않는 상황을 종식시키기 위한 국제사회의 투쟁을 통해서 얻는 중대한 성과를 상징한다. 물론 전범 용의자 기소에 대한 제1차적 …","a":"2002년","src":"국제인도법 제21장 5)","art":"국제인도법:제21장 5)","alt":["2002"]},{"id":"n594fb1bc","t":26,"q":"【국제인도법 제21장 5) 국제재판소의 역할은 무엇인가?】 국제형사재판소 이전에 舊 유고 국제형사재판소(ICTY)와 르완다 국제형사재판소(ICTR)는 ( ? )과 1994년 이들 국가의 내전 시 전쟁범죄를 범했다는 혐의를 받는 사람들을 재판하기 위해 유엔안보리가 설치하였다. 2010년 12월 22일 안보리가 설치한 전범재판소잔여업무처리기구(Mechanism for Internat…","a":"1993년","src":"국제인도법 제21장 5)","art":"국제인도법:제21장 5)","alt":["1993"]},{"id":"n549a3dd6","t":27,"q":"【국제적십자규약 제1조 정의】 1. 국제적십자운동(이하 “적십자운동”이라 한다)은 제4조에 따라 ( ? ) 받은 적십자사 또는 적신월사(이하 “각국 적십자사”라 한다), 국제적십자위원회(이하 “ICRC”라 한다) 및 국제적십자사연맹(이하 “IFRC”라 한다)으로 구성된다.","a":"승인","src":"국제적십자규약 제1조","art":"국제적십자규약:1","alt":[]},{"id":"n207ab946","t":27,"q":"【국제적십자규약 제1조 정의】 3. 적십자운동 구성기관들은 ( ? ) 7월 27일자 또는 1949년 8월 12일자 제네바협약 체약국들과 국제적십자회의에서 회동한다.","a":"1929년","src":"국제적십자규약 제1조","art":"국제적십자규약:1","alt":["1929"]},{"id":"ne6e40453","t":27,"q":"【국제적십자규약 제2조 제네바협약 체약국】 3. 국가, 특히 자국 영토 내 적십자사 설립을 ( ? )한 국가는 가능한 한 적십자운동 구성기관들의 활동을 지원하여야 한다. 동 구성기관들도 마찬가지로 각자의 규정에 따라 가능한 한 체약국의 인도주의 활동을 지원한다.","a":"승인","src":"국제적십자규약 제2조","art":"국제적십자규약:2","alt":[]},{"id":"n32bbfc28","t":27,"q":"【국제적십자규약 제3조 각국 적십자사 및 적신월사】 3-d. 적십자운동 구성기관 간의 국제 지원은 제5조와 제6조에 규정되어 있는 바와 같이 조정되어야 한다. 그러나 지원을 받는 적십자사는 상황에 따라 ICRC 또는 IFRC의 ( ? )를 전제로 국내에서 조정 역할을 수행할 수 있다.","a":"동의","src":"국제적십자규약 제3조","art":"국제적십자규약:3","alt":[]},{"id":"n3cc6c6c5","t":27,"q":"【국제적십자규약 제5조 국제적십자위원회 (ICRC)】 1. ICRC는 ( ? ) 제네바에서 설립되었으며, 제네바협약과 국제적십자회의의 정식 승인을 받은 그 자체의 지위를 보유한 독립적인 인도주의 기구이다. ICRC는 스위스 국민 중에서 ICRC 위원들을 호선한다.","a":"1863년","src":"국제적십자규약 제5조","art":"국제적십자규약:5","alt":["1863"]},{"id":"n4a2c5727","t":27,"q":"【국제적십자규약 제5조 국제적십자위원회 (ICRC)】 h) 국제적십자회의가 부여하는 임무를 수행한다. 3. ICRC는 특히 중립적이고 독립적인 기구이며 중재자로서, 그 역할에 속하는 모든 인도주의적 조치를 취할 수 있으며, 검토를 요하는 모든 문제를 ( ? )할 수 있다.","a":"심의","src":"국제적십자규약 제5조","art":"국제적십자규약:5","alt":[]},{"id":"n161ed395","t":27,"q":"【국제적십자규약 제9조 국제적십자회의 - 구성】 2. 각 대표단은 ( ? )의 투표권을 행사하는 동등한 권리를 가진다.","a":"1개","src":"국제적십자규약 제9조","art":"국제적십자규약:9","alt":["1"]},{"id":"nc8fb4499","t":27,"q":"【국제적십자규약 제10조 국제적십자회의 - 기능】 c) 상치위원회, ICRC 또는 IFRC가 국제적십자회의에 제출한 제18조 … 4. 국제적십자회의는 제17조 제1항 a)에 언급된 상치위원회 위원을 개인의 자질과 지역 안배를 고려하여 개인 자격으로 ( ? )한다.","a":"선출","src":"국제적십자규약 제10조","art":"국제적십자규약:10","alt":[]},{"id":"n46fc88ef","t":27,"q":"【국제적십자규약 제10조 국제적십자회의 - 기능】 c) 상치위원회, ICRC 또는 IFRC가 국제적십자회의에 제출한 제18조 … 7. 국제적십자회의는 필요한 경우 출석하여 투표하는 구성원 ( ? )의 찬성을 얻어 절차 및 메달 수여와 같은 문제와 관련된 규정을 제정할 수 있다.","a":"3분의 2 이상","src":"국제적십자규약 제10조","art":"국제적십자규약:10","alt":["2/3","3분의 2"]},{"id":"ne1e80912","t":27,"q":"【국제적십자규약 제11조 국제적십자회의 - 절차】 1. 국제적십자회의는 별도의 결정이 없는 한 매 ( ? ) 개최된다. 국제적십자회의는 제18조 제1항 a)에 규정되어 있는 바와 같이 최근의 국제적십자회의나 상치위원회가 그 목적을 위하여 부여한 임무에 따라 회의개최를 희망하는 적십자사의 중앙기구, ICRC 또는 IFRC가 소집한다. 일반적으로 국제적십자회의에서 적십자사, ICRC 또는 IFRC가 차기 회의의 주최를 희망할 경우 긍정적으로 검토하여야 한다.","a":"4년마다","src":"국제적십자규약 제11조","art":"국제적십자규약:11","alt":["4","4년"]},{"id":"n34a51052","t":27,"q":"【국제적십자규약 제11조 국제적십자회의 - 절차】 2. 예외적인 상황이 발생할 경우, 상치위원회는 국제적십자회의 개최 장소와 일자를 변경할 수 있다. 상치위원회에서 자체적으로 변경할 수 있으며, ICRC, IFRC 또는 각국 적십자사 ( ? )의 요청 시에도 변경할 수 있다.","a":"3분의 1이상","src":"국제적십자규약 제11조","art":"국제적십자규약:11","alt":["1/3","3분의 1"]},{"id":"n4088a14f","t":27,"q":"【국제적십자규약 제11조 국제적십자회의 - 절차】 …의의 모든 참석자들은 기본원칙을 준수하여야 하며, 제출되는 모든 문서들은 이 기본원칙에 부합되어야 한다. 국제적십자회의의 논의가 모두의 신뢰를 얻기 위하여 의장과 회의 진행에 책임이 있는 ( ? )된 모든 담당관들은 항상 어떠한 발언자도 정치적, 인종적, 종교적 또는 이념적 성격을 띤 논쟁에 개입되지 않도록 하여야 한다. 국제적십자회의 사무국은 절차규정에서 정한 바와 같이 문서의 배포를 허가하기 전에 동일한 기준을 …","a":"선출","src":"국제적십자규약 제11조","art":"국제적십자규약:11","alt":[]},{"id":"n37823244","t":27,"q":"【국제적십자규약 제14조 국제적십자운동 대표자회의 - 기능】 b) 국제적십자회의의 임시의제를 채택한다. 4. 일반규정 제10조 제7항에도 불구하고, 대표자회의는 출석하여 투표하는 구성원 ( ? )의 찬성을 얻어 앙리뒤낭 메달 규정을 개정할 수 있다.","a":"3분의 2 이상","src":"국제적십자규약 제14조","art":"국제적십자규약:14","alt":["2/3","3분의 2"]},{"id":"n3b8d9201","t":27,"q":"【국제적십자규약 제15조 국제적십자운동 대표자회의 - 절차】 1. 대표자회의는 국제적십자회의 개최 전에 열리며, 각국 적십자사의 ( ? ), ICRC, IFRC 또는 상치위원회의 요청이 있을 때에도 개최된다. 원칙적으로 대표자회의는 연맹 총회가 열릴 때마다 개최되며, 자체의 발의로도 개최될 수 있다.","a":"3분의 1","src":"국제적십자규약 제15조","art":"국제적십자규약:15","alt":["1/3"]},{"id":"n1ae831f9","t":27,"q":"【국제적십자규약 제15조 국제적십자운동 대표자회의 - 절차】 2. 대표자회의는 의장과 부의장을 ( ? )한다. 대표자회의와 연맹 총회, 국제적십자회의가 모두 열릴 때에는 각기 다른 사람이 그 의장직을 맡아야 한다.","a":"선출","src":"국제적십자규약 제15조","art":"국제적십자규약:15","alt":[]},{"id":"n46c56199","t":27,"q":"【국제적십자규약 제15조 국제적십자운동 대표자회의 - 절차】 6. 대표자회의는 절차규정의 적용을 받는다. 대표자회의는 국제적십자회의가 달리 정하지 않는 한, 필요한 경우 출석하여 투표하는 구성원 ( ? )의 찬성으로 절차규정을 보완할 수 있다.","a":"3분의 2","src":"국제적십자규약 제15조","art":"국제적십자규약:15","alt":["2/3"]},{"id":"n27a75e7c","t":27,"q":"【국제적십자규약 제17조 적십자 상치위원회 - 구성】 1. 상치위원회는 다음과 같이 ( ? )의 위원으로 구성된다.","a":"9명","src":"국제적십자규약 제17조","art":"국제적십자규약:17","alt":["9"]},{"id":"n9a0813a2","t":27,"q":"【국제적십자규약 제17조 적십자 상치위원회 - 구성】 a) 제10조 제4항에 따라 국제적십자회의에서 개인 자격으로 선출된 각기 다른 적십자사 대표 ( ? )으로 차기 국제적십자회의 폐회 시 또는 차기 상치위원회가 공식적으로 구성될 때까지 재임한다.","a":"5명","src":"국제적십자규약 제17조","art":"국제적십자규약:17","alt":["5"]},{"id":"n24c043e6","t":27,"q":"【국제적십자규약 제17조 적십자 상치위원회 - 구성】 b) ICRC 대표 ( ? ), 그 중 1명은 회장이어야 한다.","a":"2명","src":"국제적십자규약 제17조","art":"국제적십자규약:17","alt":["2"]},{"id":"nd46c57fc","t":27,"q":"【국제적십자규약 제19조 적십자 상치위원회 - 절차】 1. 상치위원회는 최소한 연 ( ? )의 통상회의를 개최한다. 위원장의 소집 또는 위원 3명 이상의 요청이 있을 경우 위원장은 특별회의를 소집한다.","a":"2회","src":"국제적십자규약 제19조","art":"국제적십자규약:19","alt":["2"]},{"id":"nfe409752","t":27,"q":"【국제적십자규약 제19조 적십자 상치위원회 - 절차】 2. 상치위원회는 제네바에 본부를 둔다. 위원장이 선택하고 위원 ( ? )가 승인할 경우 다른 장소에서 회의를 개최할 수 있다.","a":"과반수","src":"국제적십자규약 제19조","art":"국제적십자규약:19","alt":[]},{"id":"nf1f70227","t":27,"q":"【국제적십자규약 제20조 개정】 이 규약과 절차규정 개정안은 국제적십자회의 의제에 들어가 있어야 하며, 그 문본은 적어도 ( ? ) 전에 모든 구성원들에게 송부되어야 한다. 개정안이 채택되려면 ICRC와 IFRC의 의견이 국제적십자회의에 제출된 후 국제적십자회의에 출석하여 투표하는 구성원 3분의 2 이상의 찬성이 필요하다.","a":"6개월","src":"국제적십자규약 제20조","art":"국제적십자규약:20","alt":["6"]},{"id":"n2b964a41","t":27,"q":"【국제적십자규약 제21조 효력발생】 1. 이 규약은 ( ? ) 제18차 국제적십자회의에서 채택된 규약을 대체한다. 종전의 규정 중 이 규약과 상충되는 규정은 무효로 한다.","a":"1952년","src":"국제적십자규약 제21조","art":"국제적십자규약:21","alt":["1952"]},{"id":"nfcd55ad3","t":27,"q":"【국제적십자규약 제21조 효력발생】 2. 이 개정된 규약은 ( ? ) 6월 22일부터 효력이 발생된다.","a":"2006년","src":"국제적십자규약 제21조","art":"국제적십자규약:21","alt":["2006"]}],"tableHtml":"\n<h2>대조표 · 숫자 마스터<\/h2>\n<div class=\"row\"><button class=\"b-line\" id=\"hideall\">🙈 정답 모두 가리기<\/button>\n<span class=\"mute small\">빨간 글씨 = 암기 대상. 칸을 누르면 하나씩 보입니다.<\/span><\/div>\n\n<h3>1. 의결기관 3종 한눈에<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th><\/th><th>전국대의원총회<\/th><th>중앙위원회<\/th><th>운영위원회<\/th><\/tr>\n<tr><th>구성<\/th><td>회장 + 대의원: 대통령 [[8명]] · 국회 [[12명]] · 시·도지사 각 [[2명]] · 지사 선출 각 [[6명]]<\/td><td>회장 포함 [[28명]] = 총회 선출 [[19명]] + 장관 [[8명]]<\/td><td>회장 포함 [[7명]] = 중앙위 호선 [[4명]] + [[행정안전부장관]]·[[보건복지부장관]]<\/td><\/tr>\n<tr><th>임기<\/th><td>[[3년]]<\/td><td>선출직 [[3년]]<\/td><td>(별도 임기 없음 · 호선 위원)<\/td><\/tr>\n<tr><th>기능<\/th><td>조직법 [[3호]] / 정관 [[5호]]: 중앙위원 선출, 사업계획·예산 [[승인]], 중요사항 [[심의]], 정책사항 심의, 해산 [[승인]]<\/td><td>조직법 [[9호]] / 정관 [[12호]]: 정관 변경, 임원 선출, 예산·결산, 부동산·차입, 해산·잔여재산 …<br>모두 [[심의·의결]]<\/td><td>중앙위 [[위임]]·[[긴급]]사항, 운영규정 제정·개정, 예산·결산 [[사전 심의]] → 결과는 중앙위에 [[보고]]<\/td><\/tr>\n<tr><th>소집<\/th><td>매년 [[1회]] 이상 회장 / 요구 [[3분의 1]] 이상<\/td><td>매년 [[1회]] 이상 회장 / 요구 [[3분의 1]] 이상 / 통지 [[7일 전]] 문서<\/td><td>필요한 때 [[회장]]이 소집<\/td><\/tr>\n<tr><th>정족수<\/th><td colspan=\"3\">모두 동일: 재적 [[과반수]] 출석 개의, 출석 [[과반수]] 찬성 의결 (조직법 제13조②, 정관 제14조)<\/td><\/tr>\n<\/table><\/div>\n\n<h3>2. 누가 승인·인가·인준하나?<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>용어<\/th><th>대상<\/th><th>주체<\/th><th>근거<\/th><\/tr>\n<tr><td rowspan=\"2\"><b>인가<\/b><\/td><td>정관 변경 / 기본재산 취득·처분 / 잔여재산 처분<\/td><td>[[보건복지부장관]]<\/td><td>조직법 5②·22의2, 정관 43·50③<\/td><\/tr>\n<tr><td>(정관 변경 의결: 중앙위 출석 [[3분의 2]] 찬성)<\/td><td>[[중앙위원회]]<\/td><td>정관 48<\/td><\/tr>\n<tr><td rowspan=\"2\"><b>인준<\/b><\/td><td>회장 (중앙위 선출 후)<\/td><td>[[대통령]]<\/td><td>조직법 15③, 정관 17②<\/td><\/tr>\n<tr><td>지사회장 선출 / 상임위원 선거 결과<\/td><td>[[회장]]<\/td><td>정관 30②·26②<\/td><\/tr>\n<tr><td rowspan=\"8\"><b>승인<\/b><\/td><td>사업계획·예산안<\/td><td>[[전국대의원총회]]<\/td><td>조직법 10·21<\/td><\/tr>\n<tr><td>적십자사 해산<\/td><td>[[전국대의원총회]]<\/td><td>정관 5·50②<\/td><\/tr>\n<tr><td>사무총장 임명<\/td><td>[[중앙위원회]]<\/td><td>조직법 19③, 정관 24③<\/td><\/tr>\n<tr><td>명예고문 위촉<\/td><td>[[중앙위원회]]<\/td><td>정관 16<\/td><\/tr>\n<tr><td>임원 상근(특수업무)<\/td><td>[[운영위원회]]<\/td><td>정관 17④<\/td><\/tr>\n<tr><td>지사명예고문 위촉<\/td><td>[[지사 상임위원회]]<\/td><td>정관 31②<\/td><\/tr>\n<tr><td>국가·지자체 보조 사업계획<\/td><td>[[주무부장관 또는 지방자치단체의 장]]<\/td><td>조직법 21②<\/td><\/tr>\n<tr><td>표장·명칭 사용<\/td><td>[[적십자사]](사용승인)<\/td><td>조직법 25·26<\/td><\/tr>\n<tr><td><b>시정 요구<\/b><\/td><td>집행·의결이 위법하거나 현저히 부당할 때<\/td><td>[[보건복지부장관]]<\/td><td>조직법 27②<\/td><\/tr>\n<\/table><\/div>\n\n<h3>3. 숫자 마스터<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>구분<\/th><th>내용<\/th><th>수치<\/th><\/tr>\n<tr><td rowspan=\"4\">정족수<\/td><td>소집 요구<\/td><td>[[3분의 1]] 이상<\/td><\/tr>\n<tr><td>일반 의결<\/td><td>재적 [[과반수]] 출석 / 출석 [[과반수]] 찬성 ])<\/td><td>임기 [[3년]]·[[중임 1회]]·[[연장 1회]]<\/td><\/tr>\n<tr><td>운영위원회 (7명, 회장+호선 4+장관 2)<\/td><td>지사운영위원회 (7명, 지사회장+호선 [[6명]])<\/td><td>상임위가 위임·긴급 사항 [[심의]] → 결과 [[보고]]<\/td><\/tr>\n<tr><td>회장 (3년, 대통령 인준)<\/td><td>지사회장 (3년, [[회장]] 인준)<\/td><td>선출은 상임위원회<\/td><\/tr>\n<tr><td>명예회장 대통령 · 명예부회장 국무총리<\/td><td>명예지사회장 [[시·도지사]] · 명예지부회장 [[시·군·구 행정청장]]<\/td><td>—<\/td><\/tr>\n<tr><td>명예고문: 중앙위 승인<\/td><td>지사명예고문: [[상임위원회]] 승인<\/td><td>—<\/td><\/tr>\n<\/table><\/div>\n\n<h3>5. 암기 공식 (두문자·덧셈)<\/h3>\n<ul class=\"mn\">\n<li><b>28 = 19 + 8 + 1(회장)<\/b> → 중앙위원회 · <b>7 = 1 + 4 + 2<\/b> → 운영위원회 · <b>지사운영 7 = 1 + 6<\/b> · <b>상임 19 = 1 + 18<\/b><\/li>\n<li>총회 대의원은 <b>팔·십이·이·육<\/b> (대통령 8, 국회 12, 시·도지사 각 2, 지사 각 6)<\/li>\n<li>임기는 <b>3·2·1<\/b>: 회장 3년 / 나머지 2년 / 중임은 한 번<\/li>\n<li>중앙위 장관 8개: <b>재·교·외·통·법·국·행·복<\/b> (재정경제·교육·외교·통일·법무·국방·행정안전·보건복지)<\/li>\n<li>정족수 사다리: <b>1/3(소집 요구) → 과반수(일반) → 2/3(정관 변경) → 3/4(해산 찬성)<\/b><\/li>\n<li>시간 사다리: <b>7일 전(통지) · 14일 이상(공고) · 1개월 전(예산) · 3개월 이내(결산) · 4개월 이내(기부금 공개)<\/b><\/li>\n<li>예산은 <b>운영 → 중앙 → 총회<\/b> 3단계, 결산은 <b>운영 → 중앙<\/b> 2단계 (총회 승인 없음)<\/li>\n<\/ul>\n\n<h2 id=\"reg-tables\" style=\"margin-top:2em;border-top:2px solid var(--red);padding-top:.6em\">직원 운영규정 · 숫자 마스터<\/h2>\n<p class=\"mute small\">위쪽 표와 같은 방식입니다. 빨간 글씨가 암기 대상이고, 위의 '정답 모두 가리기' 버튼이 이 표에도 적용됩니다.<\/p>\n\n<h3>6. 승진·결격·징계 기간 한눈에<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>구분<\/th><th>항목<\/th><th>기간·수치<\/th><\/tr>\n<tr><td rowspan=\"7\">승진소요 최저연수 (제11조의2)<\/td><td>2급<\/td><td>[[3년]] 이상<\/td><\/tr>\n<tr><td>3~4급<\/td><td>[[5년]] 이상<\/td><\/tr>\n<tr><td>5급<\/td><td>[[4년]] 이상<\/td><\/tr>\n<tr><td>6급<\/td><td>[[3년]] 이상<\/td><\/tr>\n<tr><td>7급<\/td><td>[[1년]] 이상<\/td><\/tr>\n<tr><td>기술2급<\/td><td>[[6년]] 이상<\/td><\/tr>\n<tr><td>기술3급<\/td><td>[[1년]] 이상<\/td><\/tr>\n<tr><td rowspan=\"2\">근속·특별승진 (제11조)<\/td><td>5급 → 4급 근속승진<\/td><td>해당 계급 [[15년]] 이상 + 근무성적 우수<\/td><\/tr>\n<tr><td>승진고시 의무 계급<\/td><td>[[4급]] 승진은 승진고시 필수 · 5급 이하는 필요시 병용 · 1~3급은 능력·경력<\/td><\/tr>\n<tr><td rowspan=\"4\" ]<\/td><\/tr>\n<tr><td>특별징계위원장<\/td><td>본사 [[사무총장]] · 혈액관리본부 [[혈액관리본부장]] · 의료원 [[의료원장]]<\/td><\/tr>\n<tr><td>보통징계위원장<\/td><td>본사 [[기획조정실장]] · 지사 [[지사회장이 지명하는 지사부회장]] · 혈액 [[기획관리국장]] · 의료원 [[병원사업본부장]] · 소속기관 [[소속기관장]]<\/td><\/tr>\n<tr><td>보통위 위원 구성<\/td><td>위원장 지명 내부·외부위원 [[6인]] · 외부위원 위원장 제외 [[2분의 1]] 이상<\/td><\/tr>\n<tr><td>성희롱·성폭력 사건<\/td><td>피해자와 같은 성별 위원 위원장 제외 [[3분의 1]] 이상<\/td><\/tr>\n<tr><td>의결 정족수<\/td><td>비공개 · 위원장 외 [[3인]] 이상 출석 · 출석위원 [[과반수]] 찬성 · 위원장도 표결권<\/td><\/tr>\n<tr><td>기피 의결<\/td><td>재적위원 [[과반수]] 출석 · 출석위원 [[과반수]] 찬성 · 신청받은 자 불참<\/td><\/tr>\n<tr><td>기록말소심사위원회<\/td><td>[[5인]] = [[부회장]](위원장) 1 + [[중앙위원]] 2 + [[사무총장]] + [[기관장급]] 1<\/td><\/tr>\n<\/table><\/div>\n\n<h3>12. 기한 사다리 (운영규정)<\/h3>\n<div class=\"tw blankable\"><table>\n<tr><th>기한<\/th><th>무엇<\/th><\/tr>\n<tr><td>[[3일]]<\/td><td>착임 신고 (착임한 지) · 병가 증빙: 3일 이상 10일 미만 진료증빙<\/td><\/tr>\n<tr><td>[[5일]]<\/td><td>출장 결과보고서 (공무국외출장은 [[30일]])<\/td><\/tr>\n<tr><td>[[7일]]<\/td><td>발령 후 부임 기한<\/td><\/tr>\n<tr><td>[[10일]]<\/td><td>유산·사산 휴가 신청 기한<\/td><\/tr>\n<tr><td>[[15일]]<\/td><td>해면직원 계속 근무 한도 · 재심 청구 · 이의신청 · 징계 집행<\/td><\/tr>\n<tr><td>[[30일]]<\/td><td>이의신청 결정·통고 · 직권면직 예고(또는 30일분 통상임금)<\/td><\/tr>\n<tr><td>[[1개월]]<\/td><td>별정직원 재신임 기한 (회장 취임 후)<\/td><\/tr>\n<tr><td>[[3개월]]<\/td><td>수습기간 · 직위해제 대기명령 · 강등 처분기간 · 소재불명 휴직<\/td><\/tr>\n<tr><td>[[9개월]]<\/td><td>신규임용자과정 미수료 시 수료 기한 · 공로연수 범위<\/td><\/tr>\n<\/table><\/div>\n\n<h3>13. 암기 공식 (운영규정)<\/h3>\n<ul class=\"mn\">\n<li>승진 최저연수는 <b>3·5·4·3·1<\/b> (2급 3 · 3~4급 5 · 5급 4 · 6급 3 · 7급 1) + 기술 <b>6·1<\/b><\/li>\n<li>징계 제한 <b>18·18·12·6<\/b> / 기록 말소 <b>9·7·5·3<\/b> (강등→견책 순)<\/li>\n<li>결격 기간: 실형 <b>5<\/b> · 집유 <b>2<\/b> · 파면 <b>5<\/b> · 해임 <b>3<\/b> · 채용비위 <b>5<\/b><\/li>\n<li>출장 보고 <b>5일<\/b>, 부임 <b>7일<\/b> + 착임 신고 <b>3일<\/b>, 재심·이의신청·집행 <b>15일<\/b>, 이의 통고·면직 예고 <b>30일<\/b><\/li>\n<li>출산 <b>90·100·120<\/b> / 유산·사산 <b>10·30·60·90<\/b> / 난임 <b>2·3·4·1<\/b> / 경조 결혼 <b>5·1<\/b>, 사망 <b>5·3<\/b><\/li>\n<li>징계 시효 <b>3·5·10<\/b> / 보통위 위원 <b>6인<\/b> + 외부 <b>1/2<\/b> + 성별 <b>1/3<\/b><\/li>\n<li>누가 정하나: 임용 <b>회장<\/b> → 2~3급 <b>사무총장<\/b> → 4급 이하 <b>기관장<\/b> · 징계처분 <b>설치기관장<\/b> / 파면·해임·강등 <b>임용권자<\/b><\/li>\n<\/ul>\n\n\n<h3>14. 백지 복원<\/h3>\n<p class=\"mute small\">위 표를 가리고 아래에 의결기관 3종의 인원·임기·정족수를 써 보세요. 채점은 표를 열어 직접 하고 점수를 기록합니다. (입력 내용은 저장되지 않습니다)<\/p>\n<textarea class=\"paper\" id=\"paper\" placeholder=\"예) 중앙위원회: 28명 = 19 + 8 + 회장 ...\"><\/textarea>\n<div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" id=\"paper-n\" placeholder=\"맞은 칸/전체 칸 (예: 14/20)\" size=\"22\">\n<input type=\"text\" id=\"paper-note\" class=\"grow\" placeholder=\"메모(선택)\"><button class=\"b-red\" id=\"paper-save\">점수 기록<\/button><\/div>\n","prompts":[["오늘 범위 빈칸 퀴즈 (주관식 대비)","docs/03_규정_마스터/01_조직법_원문_회독용.md의 제11조와 제13조에서 빈칸 문제 5개를 내줘. 빈칸은 원문 단어 그대로 정답이고 칸 수는 글자 수와 같게 해줘. 내가 답하면 동의어는 오답 처리하고, 틀리면 해당 항을 원문 그대로 인용해서 알려줘."],["누가 의결·승인·인가? 함정 훈련","조직법과 정관에서 '의결', '심의', '승인', '인가', '인준'을 구분해야 하는 항목을 하나씩 물어봐 줘. 기관명 바꿔치기(중앙위원회/운영위원회/전국대의원총회/보건복지부장관/회장) 함정을 섞어서, 내가 답하면 근거 조문과 함께 채점해줘."],["기출 한 문항씩 + 조문 근거","기출문제/2026/2026년_4급_승진고시_법규_기출문제.md의 Q01~Q05(조직법·정관)를 한 문제씩 내줘. 내가 풀면 정답 여부와 함께 근거 조문을 원문에서 찾아 인용해주고, 틀린 건 비슷한 변형 문제를 하나 더 내줘."],["두문자·스토리 만들기","조직법 제10조·제11조·제12조의 인원과 임기를 한 번에 외우기 좋은 두문자나 짧은 이야기로 만들어줘. 숫자 하나도 빠지면 안 되고, 공식 단어와 다른 표현은 따로 표시해줘."],["약점 진단 (실험실 결과 붙여넣기)","🔬 실험실의 학습법별 정답률 표와 오늘 약한 주제를 붙여넣을게. 어느 학습법이 나에게 효과적인지 해석해주고, 내일 90분 일정을 약한 주제 중심으로 다시 짜줘."],["백지 복원 채점","아래에 내가 외운 중앙위원회·운영위원회·전국대의원총회의 구성·임기·소집·정족수를 적을게. 원문과 한 글자씩 대조해서 틀린 숫자·단어만 표로 알려줘. 정답을 먼저 보여주지 마."],["2026 개정 포인트 점검","조직법 제11조②2호의 장관 8개 부 이름을 내가 말하면 순서와 이름을 채점하고, 정관 제7조①2호(2026.4.1 개정)와 비교해 달라진 점도 같이 물어봐 줘. 이어서 정관 별표에서 2026.9.1 개정으로 바뀐 지사 명칭도 한 문제 내줘."],["운영규정 빈칸 퀴즈 (주관식 대비)","직원 운영규정 [제45조 / 제20조 / 제65조의2 중 오늘 범위]에서 빈칸 문제 5개를 내줘. 빈칸은 원문 단어 그대로 정답이고 칸 수는 글자 수와 같게 해줘. 내가 답하면 동의어는 오답 처리하고, 틀리면 해당 항을 원문 그대로 인용해서 알려줘."],["운영규정 누가 승인·동의·허가? 함정 훈련","직원 운영규정에서 '회장 / 사무총장 / 기관장 / 소속기관장 / 임용권자 / 징계위원회 / 인사위원회 / 운영위원회' 중 누가 하는지 구분해야 하는 항목을 하나씩 물어봐 줘. 주체를 바꿔치기한 함정을 섞고, 내가 답하면 근거 조문과 함께 채점해줘."],["징계 시나리오 문제","직원 운영규정 제7장(징계)을 근거로 시나리오형 문제를 5개 내줘. 예: '지사 직원 A가 성희롱 징계 대상이다. 어느 위원회가 관할하고 누가 처분하는가?' 내가 답하면 조문을 인용해 채점하고, 틀린 건 변형 문제를 하나 더 내줘."],["숫자 두문자 만들기 (휴가·휴직)","직원 운영규정 제45조 휴가와 제54조 휴직기간의 숫자를 한 번에 외우기 좋은 두문자나 짧은 이야기로 만들어줘. 숫자 하나도 빠지면 안 되고, 공식 단어와 다른 표현은 따로 표시해줘."]],"extra":{"운영규정":"<div class=\"chap\">[별표 제1호] <span class=\"amend\">&lt;개정 1998.4.1, 2002.11.1, 2005.4.1, 2011.12.1, 2015.1.1, 2017.1.1, 2017.6.3, 2020.1.1, 2020.4.1., 2022.1.1., 2023.1.1., 2026.4.1&gt;<\/span><\/div><div class=\"ln\">직원의 분류 및 직급, 계급의 구분표<\/div><div class=\"tw\"><table><tr><td>직     렬<\/td><td>직      종<\/td><td>직     급<\/td><td>계      급<\/td><\/tr><tr><td>1. 별정직원<\/td><td>중앙위원회의<br>승인을 요하는 직<\/td><td>사무총장<\/td><td><\/td><\/tr><tr><td>2. 일반직원<\/td><td>1. 사무직<br>2. 삭제<\/td><td>1. 관리사: 1급내지 4급<br>간사: 5급내지 7급<br>2. 삭제<\/td><td>1급 내지 7급<\/td><\/tr><tr><td>3. 특정직원<\/td><td>1. 의무직<br>2. 연구직<\/td><td>1. 의사<br>2. 연구원<\/td><td>단일호봉제<\/td><\/tr><tr><td>4. 전문직원<\/td><td>1. 약무직<br>2. 간호직<br>3. 보건직<br>4. 이공직<\/td><td>1. 약사<br>2. 간호사<br>3. 의료기사, 영양사,<br>환경기사, 언어재활사<br>사회복지사, 임상심리사<br>4. 이공기사<\/td><td>1급 내지 7급<\/td><\/tr><tr><td>5. 특수경력직원<\/td><td>1. 본사<br>비상계획담당관<br>2. 삭제<\/td><td>사무직과 같음<\/td><td>일반직원<br>2급 내지 3급에<br>상당하는 계급<\/td><\/tr><tr><td>6. 기술직원<\/td><td>1. 기술직<br>2. 운수직<br>3. 생산직<\/td><td>1. 기술원<br>2. 운전원<br>3. 생산원<\/td><td>기술1급 내지 기술3급<\/td><\/tr><tr><td>7. 기능직원<\/td><td>1. 사무보조직<br>2. 생산직<br>3. 기타 기능직<br>4. 간호보조직<\/td><td>1. 사무보조원<br>2. 생산원<br>3. 기능원<br>장례지도사<br>4. 간호조무사<\/td><td>단일호봉제<\/td><\/tr><\/table><\/div><div class=\"ln\">[비고]<\/div><div class=\"ln it\">1. 의료기사는 임상병리사, 방사선사, 치과기공사, 치과위생사, 물리치료사, 작업치료사, 보건의료정보관리사를 말한다.<\/div><div class=\"ln it\">2. 기술원은 국가기능사 <span class=\"b b1\">2급이상<\/span> 자격증 소지자로서 전기원, 기관원, 환경관리원, 통신원, 통화품질관리원, 조리원, 전산원을 말하며, 그 직에 종사하여야 한다.<\/div><div class=\"ln it\">3. 운전원은 1종 대형면허 소지자로, 간호조무사는 간호조무사 자격증 소지자로, 장례지도사는 장례지도사 자격증 소지자로 각각 그 직에 종사하여야 한다.<\/div><div class=\"ln it\">4. 기능원은 이 규정의 시행일 이전부터 기능직원으로서 전기원, 기관원, 운전원, 목공원, 교환원, 조무원으로 근무하고 있는 직원들을 말하며, 이 규정의 시행이후부터는 인력의 수급상황과 기관의 필요에 의해 <span class=\"b b1\">회장<\/span>이 <span class=\"b b2\">승인<\/span>한 자 및 목공원에 한하여 기능원으로 신규 임용할 수 있다.<\/div><div class=\"ln it\">5. <span class=\"b b1\">2017년<\/span> <span class=\"b b1\">1월<\/span> <span class=\"b b1\">1일<\/span>자 시행 개정규정에도 불구하고 <span class=\"b b1\">2016년<\/span> <span class=\"b b1\">12월<\/span> <span class=\"b b1\">31일<\/span> 현재 기술직원으로 재직중인 간호조무사는 종전의 직렬 및 직종을 유지한다.<\/div><div class=\"ln it\">6. 삭제<span class=\"amend\">&lt;2023.1.1&gt;<\/span><\/div><div class=\"chap\">[별표 제3호] <span class=\"amend\">&lt;개정 1994.1.7, 2000.1.18, 2002.1.1, 2002.11.1, 2008.1.1, 2011.12.1, 2013.4.1, 2017.6.3, 2018.1.1, 2021.4.1., 2022.1.1., 2025.4.1&gt;<\/span><\/div><div class=\"tw\"><table><tr><td>구      분<\/td><td>7급<\/td><td>6급<\/td><td>5급<\/td><td>4급<\/td><td>3급<\/td><td>2급<\/td><td>1급<\/td><\/tr><tr><td>임용소요<br>경력연수<\/td><td>-<\/td><td>1<\/td><td>4<\/td><td>8<\/td><td>13<\/td><td>18<\/td><td>21<\/td><\/tr><\/table><\/div><div class=\"ln it\">1. 일반직원 및 전문직원 임용소요경력연수기준표<\/div><div class=\"ln\">① 삭제<span class=\"amend\">&lt;2021.4.1&gt;<\/span><\/div><div class=\"ln\">② 약무직원은 인력수급상황 등을 고려하여 상기 기준표의 임용소요 경력연수에도 불구하고, <span class=\"b b1\">회장<\/span>의 사전 <span class=\"b b2\">승인<\/span>을 득하여 <span class=\"b b1\">5급<\/span> 또는 <span class=\"b b1\">6급<\/span> 직원으로 채용할 수 있다.<\/div><div class=\"ln it\">2. 삭제 <span class=\"amend\">&lt;2002.11.1&gt;<\/span><\/div><div class=\"chap\">[별표 제4호] <span class=\"amend\">&lt;신설 2002.11.1, 개정 2011.12.1, 2013.12.1, 2014.4.1, 2017.1.1, 2017.6.3., 2018.1.1., 2023.1.1., 2024.1.1&gt;<\/span><\/div><div class=\"ln\">기술직원 및 기능직원 임용 기준표<\/div><div class=\"tw\"><table><tr><td>직  렬<\/td><td>직  명<\/td><td>자 격 기 준<\/td><\/tr><tr><td rowspan=\"3\">기술직원<\/td><td>기 술 원<\/td><td>해당업무와 관련된 국가기능사 2급이상 자격증 소지자<\/td><\/tr><tr><td>운 전 원<\/td><td>운전 1종 대형면허 소지자<\/td><\/tr><tr><td>생 산 원<\/td><td>기능직 생산원으로 임용 후 제제생산업무에 8년 이상 종사하여 기술력이 인정되는 자<\/td><\/tr><tr><td rowspan=\"4\">기능직원<\/td><td>사무보조원<\/td><td>국가기술자격법시행규칙 제3조의 규정에 의거 별표 제2호에서 규정하고 있는 중직무분야 중 사무분야 자격증 소지자<\/td><\/tr><tr><td>생 산 원<\/td><td>고용원으로 입사 후 제제생산업무에 2년 이상 종사하고 업무능력이 우수한 자<\/td><\/tr><tr><td>기 능 원,<br>장례지도사<\/td><td>인력의 수급상황과 기관의 필요성에 의해 기능직 임용이 불가피하다고 회장이 인정한 자로 하되, 장례지도사의 경우 자격증 소지한 자<\/td><\/tr><tr><td>간호조무사<\/td><td>간호조무사 자격증 소지자<\/td><\/tr><\/table><\/div><div class=\"ln\">①삭제<span class=\"amend\">&lt;2011.12.1&gt;<\/span><\/div><div class=\"ln\">②혈장분획센터 및 혈액원 고용원 중 제제생산업무에 <span class=\"b b1\">2년 이상<\/span> 종사하고 업무능력이 우수한 자는 전형고시를 거쳐 정원의 범위내에서 기능직으로 임용할 수 있다.<\/div><div class=\"ln\">③기능직 생산원으로 임용 후 제제 생산업무에 <span class=\"b b1\">8년 이상<\/span> 종사하여 기술력이 인정되는 자는 전형고시를 거쳐 정원의 범위내에서 기술직으로 임용할 수 있다.<\/div><div class=\"chap\">[별표 제5호] <span class=\"amend\">&lt;개정 1992.1.1, 2004.4.1, 2005.4.1, 2008.7.1, 2011.12.1&gt;<\/span><\/div><div class=\"ln\">연 구 직 임 용 기 준 표<\/div><div class=\"tw\"><table><tr><td>보    직<\/td><td>자     격     기     준<\/td><\/tr><tr><td>수석연구원<br>(부․실장)<\/td><td>1. 4년제 대학의 부교수 이상인 자<br>2. 박사학위 취득 후 4년 이상 연구경력이 있는 자<br>3. 석사학위 취득 후 9년 이상 연구경력이 있는 자<br>4. 책임연구원으로 4년 이상 근무한 경력이 있는 자<br>5. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>책임연구원<br>(팀․과장)<\/td><td>1. 4년제 대학의 전임강사 이상인 자<br>2. 박사학위 취득자<br>3. 석사학위 취득 후 5년 이상 연구경력이 있는 자<br>4. 선임연구원으로 3년 이상 근무한 경력이 있는 자<br>5. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>선임연구원<\/td><td>1. 전문대학의 전임강사 이상인 자<br>2. 석사학위 취득 후 2년 이상 또는 4년제 대학졸업 후 5년 이상 소정 기술분야에 근무한 경력이 있는 자<br>3. 연구원 경력 5년 이상인 자<br>4. 기타 이와 동등한 자격이 있다고 인정되는 자<\/td><\/tr><tr><td>연  구  원<\/td><td>1. 관련학과를 졸업한 전문학사 이상의 자<\/td><\/tr><\/table><\/div><div class=\"chap\">[별표 제6호] <span class=\"amend\">&lt;개정 1993.1.1, 2002.11.1, 2009.4.1, 2018.1.1, 2021.4.1&gt;<\/span><\/div><div class=\"ln\">직원경력산출기준표<\/div><div class=\"tw\"><table><tr><td colspan=\"2\">직    렬<br>경력종별 및 환산율<\/td><td>일반직원<\/td><td>특수경력직원<\/td><td>특정직원<\/td><td>전문직원<\/td><td>기술직원<\/td><td>기능직원<\/td><td>고용원<\/td><\/tr><tr><td rowspan=\"2\">1. 적십자<br>2. 공무원(군인포함)<br>3. 학교교직원<br>4. 특수법인단체<br>5. 공공기관<br>6. 법인기업 및 은행<br>7. 일반기업 및 단체<\/td><td>유사업무<br>환산율<br>(%)<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><td>100<\/td><\/tr><tr><td>기타업무<br>환산율<br>(%)<\/td><td>50<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>-<\/td><td>50<\/td><\/tr><\/table><\/div><div class=\"ln\">①유사업무란 경력이 해당직렬 중 동일한 직종에 종사한 경우를 말하며, 기타 업무는 그 외의 직종에 종사한 경우를 말한다.<span class=\"amend\">&lt;개정 2025.4.1&gt;<\/span><\/div><div class=\"ln\">②특정, 전문, 기술, 기능직원의 경력은 해당 자격증 취득 이후 해당 직종에 근무한 경력에 한하여 인정한다.<\/div><div class=\"ln\">③군경력 중 의무복무기간은 업무환산율에 관계없이 <span class=\"b b1\">100%<\/span> 인정한다.<\/div><div class=\"ln\">④직원 채용 시 신규임용직원의 초임급은 「직원 보수 운영규정」 제8조에 의거 타기관 경력을 초임급 호봉산정에 반영할 수 있다.<span class=\"amend\">&lt;신설 2021.4.1. 개정 2025.1.1&gt;<\/span><\/div>"},"exams":[{"date":"2026-10-08","label":"조직법·정관","scope":"조직법 전문 · 정관 최신본(2026.9.1)"},{"date":"2026-10-15","label":"운영규정 1~5장","scope":"직원 운영규정 제1~5장 (총칙·전형과 고시·보수·능률·복무)"},{"date":"2026-10-22","label":"운영규정 6~7장","scope":"직원 운영규정 제6~7장 (신분보장·징계) + 별표"}],"exam":[{"id":"2026-01","grp":"2026","no":1,"kind":"mc","area":"","q":"조직법에관한사항이다. 다음중□에들어갈\n단어가다른것은?\n\n① □는개인, 사업자, 법인또는단체등을대상\n으로회원모집및회비모금활동을할수있다.\n\n② 국가와지방자치단체는적십자사의업무수행에\n관하여□의요청이있는경우협조할수있다.\n\n③ 법률고문은□의모든법률문제에관하여조언을\n하거나자문에응한다.\n\n④ □에사무총장1명을두며, 사무총장은회장의\n명을받아적십자사의사무를관장하고소속직원을\n지휘·감독한다.","a":"④","ex":"<b>해설<\/b>:<br>• ①, ②, ③의 □는 모두 '대한적십자사'(또는 '적십자사')임.<br>• ④번: 대한적십자사 조직법 제19조제2항에 따라 '사무처'에 사무총장 1명을 둠."},{"id":"2026-02","grp":"2026","no":2,"kind":"mc","area":"","q":"조직법및정관에관한사항이다. 다음중임원이\n될수있는사람은?\n\n① 김인도: 파산선고를받은지2년이지났으나아직\n복권되지않았다.\n\n② 이공평: 금고이상의형의집행유예를선고받고\n2년째유예기간중에있다.\n\n③ 박중립: 대한적십자사조직법이아닌다른법률에\n따라자격이2년째정지되어있다.\n\n④ 최독립: 금고이상의실형을선고받고그집행이\n종료된날부터2년이지났다.","a":"④","ex":""},{"id":"2026-03","grp":"2026","no":3,"kind":"mc","area":"","q":"조직법및정관에관한사항이다. 다음【보기】의\n설명중옳지않은것은몇개인가?\n【보기】\n가. 보건복지부장관은중앙위원회의의결이현저히\n부당하다고인정할때에는그시정을요구할\n수있다.\n나. 적십자사가사업목적에필요하여, 가액이7억원인\n400평의기본재산토지를담보로제공하고자할\n때에는보건복지부장관의승인을받아야한다.\n다. 지사조직위원회에서상임위원의선거가끝나면\n조직위원장은\n회의록을\n첨부하여\n지사회장의\n인준을받아야한다.\n라. 부회장은중앙위원회에서선출한후대통령의\n인준을받지않아도된다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개","a":"②","ex":""},{"id":"2026-04","grp":"2026","no":4,"kind":"mc","area":"","q":"정관에관한사항이다. 다음중운영규정으로정하도록\n정관에명시되지않은것은?\n\n① 임원및고문의처우에관한사항\n\n② 지사관하\n시·군·구에\n설치할\n수\n있는\n지부의\n운영에관한사항\n\n③ 각종사업을원활히수행하기위한사업분야별\n자문위원회설치에필요한사항\n\n④ 적십자사의재무사무및그에관련되는사항","a":"③","ex":""},{"id":"2026-05","grp":"2026","no":5,"kind":"mc","area":"","q":"조직법에관한사항이다. 다음중사업계획의제출\n등에\n관한\n절차에\n대한\n설명으로\n가장\n적절한\n것은?\n\n① \n국가나\n지방자치단체로부터\n자금이나\n사업비를\n전혀보조받지않는사업계획이라도보건복지부\n장관에게제출하는절차를생략할수없다.\n\n② 의결기관의심의및의결, 승인절차를거친후\n국회및보건복지부장관에게사업계획및예산안을\n제출해야한다.\n\n③ 사업계획의변경이필요한경우에는운영위원회의\n심의와중앙위원회의의결을받아즉시변경하고\n보건복지부장관에게제출한다.\n\n④ 결산보고서는회계연도종료후6개월이내에공인\n회계사의감사를받아회계감사보고서를첨부하여\n제출하여야한다.","a":"①","ex":""},{"id":"2026-06","grp":"2026","no":6,"kind":"mc","area":"","q":"다음은직원운영규정및직원보수운영규정에관한\n사항이다. 다음【보기】를읽고, 가장적절하지않은\n것을고르시오.\n【보기】\n· 김인도직원은2025년4월1일에전일제정규\n직원으로입사하였다.\n· 김인도직원은2025년4월1일부터2025년12월\n31일까지개근하였다.\n· 김인도직원은2025년12월15일부터19일까지\n5일의연차유급휴가를사용하였다.\n· 김인도직원의2026년1월통상임금은209만원\n이다.\n※상기명시된내용외최저임금기준등은고려하지않음\n\n① 2025년12월1일기준으로김인도직원에게부여된\n연차유급휴가일수는8일이다.\n\n② 2026년1월15일에김인도직원에게지급되는\n연가보상비는24만원이다.\n\n③ 김인도직원이3년이상계속근로하는경우매년\n80% 이상출근시15일이상의연차유급휴가를\n받을수있다.\n\n④ 2026년도에김인도직원은최대10일까지는시간\n단위로, 잔여일수는4시간단위로연차유급휴가를\n사용할수있다.","a":"②","ex":""},{"id":"2026-07","grp":"2026","no":7,"kind":"mc","area":"","q":"직원운영규정\n중\n임용권위임에\n관한\n사항이다.\n다음【보기】의발령내역에서㉮∼㉲중옳은것은\n몇개인가? (임용권을전행하지않음을전제로함)\n【보기】\n· A혈액원소속B직원(사무직팀원) 발령내역\n발령일자\n발령명\n소속\n임용권자\n(승급:발령권자)\n2010. 1. 1.\n신규채용\nA혈액원총무팀\n2023. 1. 1.\n전보\nA혈액원\n헌혈지원팀\n㉮A혈액원장\n2025. 4. 1.\n정기승급\n㉯A혈액원장\n2025. 7. 1.\n승진(4급)\n㉰사무총장\n2025.10. 1.\n육아휴직\n㉱A혈액원장\n2025.12. 1.\n복직\n2026. 1. 1.\n파견\nA혈액원\n헌혈지원팀\n(파견소속: 본사\n감사실감사팀)\n㉲사무총장\n2026. 4. 1.\n정기승급\n\n① 2개\n\n② 3개\n\n③ 4개\n\n④ 5개","a":"②","ex":""},{"id":"2026-08","grp":"2026","no":8,"kind":"mc","area":"","q":"직원운영규정, 직원보수운영규정및인사관리시행\n규칙에관한사항이다. 다음【보기】를읽고, 가∼라의\n설명중옳은것은몇개인지고르시오.\n【보기】\n봉급사정표\n(2026. 5. 1.자신규임용정규직의무직신입A직원)\n성명\nA\n임용직급\n의사(의무직)\n최종출신학교\nOO대학교학위\n학사\n경\n력\n평\n정\n경력구분\n재\n직\n기\n간\n환산비율\n○○보훈공단\n2008. 1. 1. -\
